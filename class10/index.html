ner voice.","options":["drown","drowned","drowning"],"answer":0,"rule":"After the modal <b>should not<\/b>, use the base verb: drown out."},{"qid":"c10-09-35","type":"fill","level":4,"topic":"contractions","prompt":"Fill in the gap.","before":"You","after":"waste your time living someone else's life.","options":["needn't to","mustn't","haven't"],"answer":1,"rule":"<b>mustn't<\/b> (must not) forbids something and takes the base verb: mustn't waste."},{"qid":"c10-09-36","type":"build","level":4,"topic":"imperatives_voice","prompt":"Make a passive sentence.","answer":["Let","the","results","be","announced","tomorrow."],"alts":[],"rule":"Passive of 'Announce the results tomorrow': <b>Let the results be announced<\/b> tomorrow."},{"qid":"c10-09-37","type":"chat","level":4,"topic":"tenses","prompt":"Pick the correct reply.","chat":[["Uncle","How long have you been learning the guitar?"]],"options":["I have been learning it for two years.","I have been learning it since two years.","I am learning it for two years."],"answer":0,"rule":"Present perfect continuous with a length of time: <b>have been learning ... for<\/b> two years."},{"qid":"c10-09-38","type":"change","level":4,"topic":"imperatives_voice","prompt":"Change into passive voice.","source":"Please share your wisdom.","options":["You are requested share your wisdom.","You are requested to share your wisdom.","You were request to share your wisdom."],"answer":1,"rule":"A polite order with <b>please<\/b> becomes <b>You are requested to + verb<\/b>."},{"qid":"c10-09-39","type":"change","level":4,"topic":"tenses","prompt":"Change into the present perfect continuous tense.","source":"Life hits you hard.","options":["Life have been hitting you hard.","Life has been hitting you hard.","Life has been hit you hard."],"answer":1,"rule":"Present perfect continuous: <b>has been + -ing<\/b>. Life is singular: has."},{"qid":"c10-09-40","type":"proof","level":4,"topic":"phrasal_verbs","prompt":"Find and fix the 2 errors in this message.","words":["If","you","haven't","found","your","passion","yet,","keep","looking.","Don't","let","others","drowns","out","your","inner","voice,","and","do","not","settles","for","less."],"errors":[{"i":12,"options":["drowned","drowning","drown"],"answer":2},{"i":20,"options":["settle","settled","settling"],"answer":0}],"rule":"let + object + base verb: let others <b>drown<\/b> out. do not + base verb: do not <b>settle<\/b>."},{"qid":"c10-09-41","type":"spot","level":5,"topic":"tenses","prompt":"Pick the sentence with the correct tenses.","options":["By the time Jobs returned to Apple, he has started two companies.","By the time Jobs had returned to Apple, he started two companies.","By the time Jobs returned to Apple, he had started two companies."],"answer":2,"rule":"The earlier action (starting companies) takes the past perfect: <b>had started<\/b>."},{"qid":"c10-09-42","type":"fix","level":5,"topic":"contractions","prompt":"One word is wrong. Find it and fix it.","words":["Neither","Woz","nor","Jobs","weren't","afraid","of","hard","work."],"errors":[{"i":4,"options":["wasn't","been","was"],"answer":2}],"rule":"<b>Neither ... nor<\/b> is already negative (no weren't), and the verb agrees with Jobs: <b>was<\/b>."},{"qid":"c10-09-43","type":"fix","level":5,"topic":"phrasal_verbs","prompt":"One word is wrong. Find it and fix it.","words":["Do","not","let","anyone","talk","you","out","of","follow","your","dreams."],"errors":[{"i":8,"options":["following","followed","to"],"answer":0}],"rule":"<b>talk someone out of<\/b> is followed by the -ing form: out of <b>following<\/b>."},{"qid":"c10-09-44","type":"fill","level":5,"topic":"tenses","prompt":"Fill in the gap.","before":"When the doctor called that evening, I","after":"with the diagnosis all day.","options":["had lived","have lived","am living"],"answer":0,"rule":"An action before another past action (the doctor called) takes the past perfect: <b>had lived<\/b>."},{"qid":"c10-09-45","type":"build","level":5,"topic":"tenses","prompt":"Make a sentence in the future perfect continuous.","answer":["Riya","will","have","been","coding","for","five","years."],"alts":[],"rule":"Future perfect continuous: <b>will have been + -ing<\/b> + for + period."},{"qid":"c10-09-46","type":"chat","level":5,"topic":"imperatives_voice","prompt":"Pick the correct reply.","chat":[["Teacher","Any advice for the new students?"]],"options":["Stay curious, and never stop to learning.","Stay curious, and never stop learning.","Stays curious, and never stop learning."],"answer":1,"rule":"Imperatives use the base verb (<b>Stay<\/b>), and <b>stop<\/b> + -ing means stop doing it."},{"qid":"c10-09-47","type":"chat","level":5,"topic":"contractions","prompt":"Pick the correct reply.","chat":[["Dad","Shall I book the tickets now?"]],"options":["No, you needn't to. I've already booked them.","No, you needn't. I've already booked them.","No, you needn't. I've already book them."],"answer":1,"rule":"<b>needn't<\/b> = no need (no to after it). <b>I've<\/b> = I have + past participle: booked."},{"qid":"c10-09-48","type":"change","level":5,"topic":"imperatives_voice","prompt":"Change into passive voice.","source":"Don't waste your time.","options":["Let not your time is wasted.","Let your time be not waste.","Let not your time be wasted."],"answer":2,"rule":"Negative imperative to passive: <b>Let not + object + be + past participle<\/b>: Let not your time be wasted."},{"qid":"c10-09-49","type":"change","level":5,"topic":"tenses","prompt":"Change into the past perfect continuous tense.","source":"My doctor advised me.","options":["My doctor had been advised me.","My doctor had been advising me.","My doctor has been advising me."],"answer":1,"rule":"Past perfect continuous: <b>had been + -ing<\/b> (advising)."},{"qid":"c10-09-50","type":"proof","level":5,"topic":"tenses","prompt":"Find and fix the 3 errors in this paragraph.","words":["Jobs","was","diagnose","with","cancer","about","a","year","before","his","speech.","His","doctor","advised","him","to","goes","home.","Luckily,","the","cancer","could","be","cure","with","surgery."],"errors":[{"i":2,"options":["diagnosed","diagnosing","diagnosis"],"answer":0},{"i":16,"options":["went","going","go"],"answer":2},{"i":23,"options":["cured","curing","cures"],"answer":0}],"rule":"Passive: was <b>diagnosed<\/b>, could be <b>cured<\/b> (past participles). advised him to + base verb: <b>go<\/b>."}]},{"id":"10","num":"2.4","title":"The Pulley","unit":"Unit Two","topics":[{"tag":"excl_assert","name":"Exclamatory and assertive sentences"},{"tag":"neg_inversion","name":"Inversion after never, seldom, rarely, not only, hardly, no sooner"},{"tag":"wish_if_were","name":"Wishes and 'If I were' (subjunctive)"},{"tag":"let_tags","name":"'Let's' suggestions and question tags"},{"tag":"gerund_prep","name":"Gerund after prepositions (instead of, without)"}],"questions":[{"qid":"c10-10-01","type":"spot","level":1,"topic":"excl_assert","prompt":"Which exclamation is correct?","options":["What heavy bag this is!","What a heavy bag this is!","How a heavy bag this is!"],"answer":1,"rule":"With a singular noun, use <b>What a + adjective + noun<\/b>: What a heavy bag!"},{"qid":"c10-10-02","type":"spot","level":1,"topic":"wish_if_were","prompt":"Which sentence is correct?","options":["I wish I have more time to rest.","I wish I had more time to rest.","I wish I having more time to rest."],"answer":1,"rule":"A wish about the present uses the past form: I wish I <b>had<\/b>."},{"qid":"c10-10-03","type":"spot","level":2,"topic":"neg_inversion","prompt":"Which sentence is correct?","options":["Rarely the twins watch TV on school nights.","Rarely do the twins watches TV on school nights.","Rarely do the twins watch TV on school nights."],"answer":2,"rule":"After <b>Rarely<\/b> at the start, invert: <b>do the twins watch<\/b> (helper + subject + base verb)."},{"qid":"c10-10-04","type":"spot","level":2,"topic":"let_tags","prompt":"Pick the sentence with the correct question tag.","options":["Let's rest for a while, shall we?","Let's rest for a while, will we?","Let's rest for a while, don't we?"],"answer":0,"rule":"A suggestion with <b>Let's<\/b> always takes the tag <b>shall we?<\/b>"},{"qid":"c10-10-05","type":"spot","level":3,"topic":"gerund_prep","prompt":"Which sentence is correct?","options":["Instead of thank the giver, he admired the gifts.","Instead to thank the giver, he admired the gifts.","Instead of thanking the giver, he admired the gifts."],"answer":2,"rule":"A preposition like <b>instead of<\/b> is followed by the -ing form: instead of <b>thanking<\/b>."},{"qid":"c10-10-06","type":"spot","level":3,"topic":"excl_assert","prompt":"Pick the correct exclamatory sentence.","options":["How weary does the traveller look!","How weary the traveller look!","How weary the traveller looks!"],"answer":2,"rule":"Exclamations keep normal word order: <b>How + adjective + subject + verb<\/b>. Singular subject: looks."},{"qid":"c10-10-07","type":"spot","level":4,"topic":"wish_if_were","prompt":"Which sentence is correct?","options":["If I were a bird, I would fly over the hills.","If I were a bird, I will fly over the hills.","If I am a bird, I would fly over the hills."],"answer":0,"rule":"An imaginary situation: <b>If I were ..., I would ...<\/b>"},{"qid":"c10-10-08","type":"spot","level":5,"topic":"neg_inversion","prompt":"Which sentence is correct?","options":["Not only Meera did win the race, but she also broke the school record.","Not only did Meera win the race, but she also broke the school record.","Not only did Meera won the race, but she also broke the school record."],"answer":1,"rule":"<b>Not only<\/b> at the start needs inversion: <b>did Meera win<\/b> (did + subject + base verb)."},{"qid":"c10-10-09","type":"fix","level":1,"topic":"wish_if_were","prompt":"One word is wrong. Find it and fix it.","words":["Aarav","wishes","he","can","fly","like","a","bird."],"errors":[{"i":3,"options":["must","could","shall"],"answer":1}],"rule":"After <b>wish<\/b>, use the past form for the present: wishes he <b>could<\/b> fly."},{"qid":"c10-10-10","type":"fix","level":1,"topic":"excl_assert","prompt":"One word is wrong. Find it and fix it.","words":["How","sweetly","the","two","sisters","sings","together!"],"errors":[{"i":5,"options":["singing","sing","sung"],"answer":1}],"rule":"The subject <b>the two sisters<\/b> is plural, so the verb is <b>sing<\/b>."},{"qid":"c10-10-11","type":"fix","level":2,"topic":"let_tags","prompt":"One word is wrong. Find it and fix it.","words":["Let's","go","to","the","park","after","lunch,","will","we?"],"errors":[{"i":7,"options":["do","shall","are"],"answer":1}],"rule":"The tag for <b>Let's<\/b> is <b>shall we?<\/b>"},{"qid":"c10-10-12","type":"fix","level":2,"topic":"neg_inversion","prompt":"One word is wrong. Find it and fix it.","words":["Seldom","does","Kabir","misses","his","morning","walk."],"errors":[{"i":3,"options":["missed","miss","missing"],"answer":1}],"rule":"After <b>does<\/b>, use the base verb: Seldom does Kabir <b>miss<\/b>."},{"qid":"c10-10-13","type":"fix","level":3,"topic":"gerund_prep","prompt":"One word is wrong. Find it and fix it.","words":["Mr","Kulkarni","left","the","office","without","finish","his","report."],"errors":[{"i":6,"options":["finishing","finished","finishes"],"answer":0}],"rule":"After the preposition <b>without<\/b>, use the -ing form: without <b>finishing<\/b>."},{"qid":"c10-10-14","type":"fix","level":4,"topic":"excl_assert","prompt":"One word is wrong. Find it and fix it.","words":["How","proud","Grandpa","was","when","both","his","grandchildren","was","chosen!"],"errors":[{"i":8,"options":["is","be","were"],"answer":2}],"rule":"<b>Both his grandchildren<\/b> is plural, and the event is past: <b>were<\/b> chosen."},{"qid":"c10-10-15","type":"fix","level":4,"topic":"wish_if_were","prompt":"One word is wrong. Find it and fix it.","words":["If","I","were","you,","I","will","rest","before","the","exam."],"errors":[{"i":5,"options":["would","shall","can"],"answer":0}],"rule":"Giving advice with <b>If I were you<\/b> needs <b>would<\/b> in the main clause."},{"qid":"c10-10-16","type":"fix","level":5,"topic":"neg_inversion","prompt":"One word is wrong. Find it and fix it.","words":["No","sooner","had","the","rain","stopped","yesterday","than","the","children","run","out","to","play."],"errors":[{"i":10,"options":["ran","runs","running"],"answer":0}],"rule":"<b>No sooner had ... than<\/b> + simple past: the children <b>ran<\/b> out."},{"qid":"c10-10-17","type":"fill","level":1,"topic":"let_tags","prompt":"Choose the correct question tag.","before":"Let us all pray together,","after":"we?","options":["will","do","shall"],"answer":2,"rule":"A suggestion with <b>Let us<\/b> (including the speaker) takes <b>shall we?<\/b>"},{"qid":"c10-10-18","type":"fill","level":1,"topic":"excl_assert","prompt":"Fill in the gap.","before":"","after":"a wonderful surprise it was!","options":["How","Which","What"],"answer":2,"rule":"Before <b>a + adjective + noun<\/b>, the exclamation word is <b>What<\/b>."},{"qid":"c10-10-19","type":"fill","level":2,"topic":"neg_inversion","prompt":"Fill in the gap.","before":"Never before","after":"I felt so tired.","options":["had","did","was"],"answer":0,"rule":"Inversion with the past participle <b>felt<\/b>: Never before <b>had<\/b> I felt."},{"qid":"c10-10-20","type":"fill","level":2,"topic":"wish_if_were","prompt":"Fill in the gap.","before":"I wish my exam results","after":"out already.","options":["are","is","were"],"answer":2,"rule":"A wish about now uses the past form: I wish they <b>were<\/b> out."},{"qid":"c10-10-21","type":"fill","level":3,"topic":"gerund_prep","prompt":"Fill in the gap.","before":"Rohan kept scrolling on his phone instead of","after":"his homework.","options":["doing","do","to do"],"answer":0,"rule":"<b>instead of<\/b> is followed by the -ing form: <b>doing<\/b>."},{"qid":"c10-10-22","type":"fill","level":3,"topic":"wish_if_were","prompt":"Fill in the gap.","before":"If I","after":"in your place, I would apologise.","options":["am","were","be"],"answer":1,"rule":"Imagining being someone else: <b>If I were<\/b> ..., I would ..."},{"qid":"c10-10-23","type":"fill","level":4,"topic":"neg_inversion","prompt":"Fill in the gap.","before":"Not only","after":"the rich man lose his peace, but he also lost his sleep.","options":["did","does","had"],"answer":0,"rule":"Past story + base verb <b>lose<\/b>: Not only <b>did<\/b> he lose ..."},{"qid":"c10-10-24","type":"fill","level":5,"topic":"wish_if_were","prompt":"Fill in the gap.","before":"Grandma wishes she","after":"home earlier yesterday; she missed the wedding lunch.","options":["has left","had left","leaves"],"answer":1,"rule":"A regret about the past uses the past perfect after wish: she <b>had left<\/b>."},{"qid":"c10-10-25","type":"build","level":1,"topic":"excl_assert","prompt":"Make an exclamation.","answer":["What","a","clever","idea","that","is!"],"alts":[],"rule":"<b>What a + adjective + noun + subject + verb!<\/b>"},{"qid":"c10-10-26","type":"build","level":2,"topic":"let_tags","prompt":"Make a suggestion with a question tag.","answer":["Let's","take","a","short","break,","shall","we?"],"alts":[],"rule":"<b>Let's<\/b> + base verb ..., <b>shall we?<\/b>"},{"qid":"c10-10-27","type":"build","level":3,"topic":"gerund_prep","prompt":"Make a sentence.","answer":["Sanya","left","the","party","without","saying","goodbye."],"alts":[],"rule":"<b>without<\/b> + -ing form: without <b>saying<\/b> goodbye."},{"qid":"c10-10-28","type":"build","level":4,"topic":"wish_if_were","prompt":"Make a wish sentence.","answer":["Meera","wishes","she","were","not","so","tired."],"alts":[],"rule":"A present wish uses <b>were<\/b> for every subject: she <b>were<\/b> not."},{"qid":"c10-10-29","type":"build","level":5,"topic":"neg_inversion","prompt":"Make a 'No sooner ... than' sentence.","answer":["No","sooner","had","we","reached","the","platform","than","it","rained."],"alts":[],"rule":"<b>No sooner had + subject + past participle ... than + simple past.<\/b>"},{"qid":"c10-10-30","type":"chat","level":1,"topic":"excl_assert","prompt":"Pick the correct reply.","chat":[["Neha","I got full marks in the maths test!"]],"options":["What a great news! Well done!","How wonderfully! Well done!","How wonderful! Well done!"],"answer":2,"rule":"<b>How + adjective!<\/b> is correct. <b>News<\/b> is uncountable, so no 'a'."},{"qid":"c10-10-31","type":"chat","level":1,"topic":"let_tags","prompt":"Pick the correct reply.","chat":[["Dev","It's so hot today."]],"options":["Let's going swimming, shall we?","Let's go swimming, shall we?","Let's go swimming, will us?"],"answer":1,"rule":"<b>Let's<\/b> + base verb (go), and the tag is <b>shall we?<\/b>"},{"qid":"c10-10-32","type":"chat","level":2,"topic":"wish_if_were","prompt":"Pick the correct reply.","chat":[["Mom","Why are you looking so sad?"]],"options":["I wish I could go on the school trip.","I wish I am going on the school trip.","I wish I was go on the school trip."],"answer":0,"rule":"A wish about now uses a past form: I wish I <b>could<\/b> go."},{"qid":"c10-10-33","type":"chat","level":3,"topic":"wish_if_were","prompt":"Pick the correct reply.","chat":[["Ishaan","I lost Dad's umbrella. What should I do?"]],"options":["If I were you, I would told him the truth.","If I am you, I would tell him the truth.","If I were you, I would tell him the truth."],"answer":2,"rule":"Advice: <b>If I were you, I would + base verb<\/b> (tell)."},{"qid":"c10-10-34","type":"chat","level":3,"topic":"neg_inversion","prompt":"Pick the correct reply.","chat":[["Coach","Has Varun ever missed a practice session?"]],"options":["No. Not once he has missed a session.","No. Not once has he missed a session.","No. Not once has he miss a session."],"answer":1,"rule":"<b>Not once<\/b> at the start needs inversion: <b>has he missed<\/b>."},{"qid":"c10-10-35","type":"chat","level":4,"topic":"gerund_prep","prompt":"Pick the correct reply.","chat":[["Aunt","What did you do on Sunday?"]],"options":["Instead of going out, I stayed home and read a book.","Instead of go out, I stayed home and read a book.","Instead of going out, I stays home and read a book."],"answer":0,"rule":"<b>instead of + -ing<\/b> (going), and the past tense <b>stayed<\/b> for Sunday."},{"qid":"c10-10-36","type":"chat","level":4,"topic":"let_tags","prompt":"Pick the correct reply.","chat":[["Tara","We have finished the project at last!"]],"options":["Great! Let's celebrated with ice cream, shall we?","Great! Let's celebrate with ice cream, won't we?","Great! Let's celebrate with ice cream, shall we?"],"answer":2,"rule":"<b>Let's<\/b> + base verb (celebrate) and the tag <b>shall we?<\/b>"},{"qid":"c10-10-37","type":"chat","level":5,"topic":"wish_if_were","prompt":"Pick the correct reply.","chat":[["Arjun","The concert was amazing. Where were you?"],["Arjun","You missed a great show!"]],"options":["I know. I wish I had came with you.","I know. I wish I have come with you.","I know. I wish I had come with you."],"answer":2,"rule":"Regret about the past: wish + <b>had + past participle<\/b> (had come)."},{"qid":"c10-10-38","type":"change","level":1,"topic":"excl_assert","prompt":"Change into an assertive sentence.","source":"What a lovely garden it is!","options":["It is a very lovely garden.","It is very lovely garden.","It a very lovely garden is."],"answer":0,"rule":"<b>What a<\/b> becomes <b>a very<\/b>: It is a very lovely garden."},{"qid":"c10-10-39","type":"change","level":2,"topic":"excl_assert","prompt":"Change into an assertive sentence.","source":"How weary the old farmer looks!","options":["The old farmer looks very weary.","The old farmer look very weary.","The old farmer looks very wearily."],"answer":0,"rule":"<b>How + adjective<\/b> becomes <b>very + adjective<\/b>; after 'looks' keep the adjective."},{"qid":"c10-10-40","type":"change","level":2,"topic":"excl_assert","prompt":"Change into an exclamatory sentence.","source":"It is a very precious jewel.","options":["What a precious jewel it is!","How a precious jewel it is!","What precious jewel it is!"],"answer":0,"rule":"<b>a very + adjective + noun<\/b> becomes <b>What a + adjective + noun ... !<\/b>"},{"qid":"c10-10-41","type":"change","level":3,"topic":"neg_inversion","prompt":"Begin the sentence with 'Never'.","source":"I have never seen such a crowded station.","options":["Never I have seen such a crowded station.","Never have I seen such a crowded station.","Never have I saw such a crowded station."],"answer":1,"rule":"Starting with <b>Never<\/b>, put the helper before the subject: <b>have I seen<\/b>."},{"qid":"c10-10-42","type":"change","level":4,"topic":"wish_if_were","prompt":"Rewrite using 'I wish'.","source":"I am sorry I did not get up sooner.","options":["I wish I had got up sooner.","I wish I have got up sooner.","I wish I had get up sooner."],"answer":0,"rule":"Regret about the past: I wish I <b>had got<\/b> up sooner."},{"qid":"c10-10-43","type":"change","level":4,"topic":"neg_inversion","prompt":"Begin with 'Not only'.","source":"Neha sings well and she also dances well.","options":["Not only does Neha sings well, but she also dances well.","Not only does Neha sing well, but she also dances well.","Not only did Neha sing well, but she also dances well."],"answer":1,"rule":"Present tense: <b>Not only does + subject + base verb<\/b> (sing)."},{"qid":"c10-10-44","type":"change","level":5,"topic":"wish_if_were","prompt":"Rewrite using 'If I were'.","source":"I am not a bird, so I cannot fly to the mountains.","options":["If I were a bird, I can fly to the mountains.","If I were a bird, I could flew to the mountains.","If I were a bird, I could fly to the mountains."],"answer":2,"rule":"Unreal present: <b>If I were ..., I could + base verb<\/b> (fly)."},{"qid":"c10-10-45","type":"change","level":5,"topic":"neg_inversion","prompt":"Rewrite using 'Hardly ... when'.","source":"As soon as the teacher entered, the class became silent.","options":["Hardly the teacher had entered when the class became silent.","Hardly had the teacher entered than the class became silent.","Hardly had the teacher entered when the class became silent."],"answer":2,"rule":"<b>Hardly had + subject + past participle ... when<\/b> (not 'than')."},{"qid":"c10-10-46","type":"proof","level":3,"topic":"wish_if_were","prompt":"Find and fix the 2 errors in this message.","words":["What","a","tiring","day","it","was!","I","wish","I","has","more","free","time.","Instead","of","relax","at","home,","I","have","to","finish","my","science","project","tonight."],"errors":[{"i":9,"options":["have","having","had"],"answer":2},{"i":15,"options":["relaxed","relaxing","relaxes"],"answer":1}],"rule":"I wish I <b>had<\/b> (past form for a present wish); instead of <b>relaxing<\/b> (-ing after a preposition)."},{"qid":"c10-10-47","type":"proof","level":4,"topic":"let_tags","prompt":"Find and fix the 2 errors in this message.","words":["Let's","pack","our","bags","tonight,","will","we?","Never","have","I","be","so","excited","about","a","trip","to","Goa","with","my","cousins."],"errors":[{"i":5,"options":["do","did","shall"],"answer":2},{"i":10,"options":["being","been","was"],"answer":1}],"rule":"Let's ..., <b>shall<\/b> we? Never have I <b>been<\/b> (have + past participle)."},{"qid":"c10-10-48","type":"proof","level":5,"topic":"excl_assert","prompt":"Find and fix the 3 errors in this message.","words":["How","long","I","have","been","wait","at","this","crowded","bus","stop!","If","I","were","the","driver,","I","would","never","kept","people","waiting","like","this.","I","wish","the","buses","comes","on","time."],"errors":[{"i":5,"options":["waited","waits","waiting"],"answer":2},{"i":19,"options":["keeping","keep","keeps"],"answer":1},{"i":28,"options":["come","coming","came"],"answer":2}],"rule":"have been <b>waiting<\/b>; would never <b>keep<\/b> (base verb); I wish the buses <b>came<\/b> (past form after wish)."},{"qid":"c10-10-49","type":"proof","level":5,"topic":"gerund_prep","prompt":"Find and fix the 3 errors in this message.","words":["Instead","of","complain","about","the","heat,","Grandpa","planted","ten","trees","last","year.","Seldom","does","he","talks","about","it,","yet","all","the","neighbours","enjoys","the","cool","shade.","How","kind","he","is!"],"errors":[{"i":2,"options":["complained","complaining","complains"],"answer":1},{"i":15,"options":["talked","talking","talk"],"answer":2},{"i":22,"options":["enjoy","enjoying","enjoyment"],"answer":0}],"rule":"instead of <b>complaining<\/b>; does he <b>talk<\/b> (base verb); 'all the neighbours' is plural: <b>enjoy<\/b>."},{"qid":"c10-10-50","type":"proof","level":5,"topic":"let_tags","prompt":"Find and fix the 3 errors in this message.","words":["Let's","not","waste","time,","will","we?","Not","only","did","Ravi","forgot","his","ticket,","but","he","also","lost","his","phone.","I","wish","he","has","been","more","careful","yesterday."],"errors":[{"i":4,"options":["shall","do","won't"],"answer":0},{"i":10,"options":["forgets","forget","forgetting"],"answer":1},{"i":22,"options":["had","have","is"],"answer":0}],"rule":"Let's ..., <b>shall<\/b> we? Not only did Ravi <b>forget<\/b>; past regret: I wish he <b>had<\/b> been."}]},{"id":"11","num":"2.5","title":"Let's March","unit":"Unit Two","topics":[{"tag":"sentence_types","name":"Kinds of sentences and changing them"},{"tag":"present_perfect","name":"Present perfect tense"},{"tag":"infinitive","name":"Infinitives (to + verb)"},{"tag":"comparison","name":"Degrees of comparison"},{"tag":"passive_modal","name":"Passive voice (incl. modals and perfect tenses)"}],"questions":[{"qid":"c10-11-01","type":"spot","level":1,"topic":"present_perfect","prompt":"Pick the sentence with the correct tense.","options":["We have reduced the number of child labourers.","We have reduce the number of child labourers.","We has reduced the number of child labourers."],"answer":0,"rule":"Present perfect = <b>have/has + past participle<\/b>. With 'We', use <b>have reduced<\/b>."},{"qid":"c10-11-02","type":"spot","level":1,"topic":"infinitive","prompt":"Which sentence is correct?","options":["Every child is free to playing and learn.","Every child is free to plays and learn.","Every child is free to play and learn."],"answer":2,"rule":"An infinitive is <b>to + base verb<\/b>: to <b>play<\/b>."},{"qid":"c10-11-03","type":"spot","level":2,"topic":"comparison","prompt":"Which sentence is correct?","options":["No other challenge is as bigger as fear.","No other challenge is as big as fear.","No other challenge is so big than fear."],"answer":1,"rule":"Positive degree: <b>as + adjective + as<\/b> (as big as)."},{"qid":"c10-11-04","type":"spot","level":2,"topic":"passive_modal","prompt":"Which sentence is correct?","options":["The children should be send to school.","The children should sent to school.","The children should be sent to school."],"answer":2,"rule":"Passive with a modal: <b>should + be + past participle<\/b> (be sent)."},{"qid":"c10-11-05","type":"spot","level":3,"topic":"sentence_types","prompt":"Pick the correct exclamatory sentence.","options":["How brave the little bird fought the fire!","How bravely the little bird fought the fire!","How bravely did the little bird fought the fire!"],"answer":1,"rule":"To describe the action 'fought', use the adverb: <b>How bravely<\/b> + subject + verb!"},{"qid":"c10-11-06","type":"spot","level":3,"topic":"present_perfect","prompt":"Pick the sentence with the correct tense.","options":["Kailash Satyarthi founded his movement in 1980.","Kailash Satyarthi has founded his movement in 1980.","Kailash Satyarthi was founded his movement in 1980."],"answer":0,"rule":"A finished past time (<b>in 1980<\/b>) takes the simple past, not the present perfect."},{"qid":"c10-11-07","type":"spot","level":4,"topic":"infinitive","prompt":"Which sentence is correct?","options":["Governments must invests in education to help poor children.","Governments must invest in education to help poor children.","Governments must invest in education to helping poor children."],"answer":1,"rule":"After <b>must<\/b> use the base verb (invest); purpose is shown by <b>to + base verb<\/b> (to help)."},{"qid":"c10-11-08","type":"spot","level":5,"topic":"comparison","prompt":"Which sentence is correct?","options":["The Nobel Prize is greater than most other honour in the world.","The Nobel Prize is more greater than most other honours in the world.","The Nobel Prize is greater than most other honours in the world."],"answer":2,"rule":"<b>most other<\/b> takes a plural noun (honours); never use 'more' with '-er' (greater)."},{"qid":"c10-11-09","type":"fix","level":1,"topic":"present_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Millions","of","people","have","march","for","children's","rights","since","1998."],"errors":[{"i":4,"options":["marching","marches","marched"],"answer":2}],"rule":"Present perfect: <b>have + past participle<\/b> (have marched)."},{"qid":"c10-11-10","type":"fix","level":1,"topic":"infinitive","prompt":"One word is wrong. Find it and fix it.","words":["Little","Sana","refuses","to","accepts","defeat","in","chess."],"errors":[{"i":4,"options":["accepted","accepting","accept"],"answer":2}],"rule":"After <b>to<\/b> in an infinitive, use the base verb: to <b>accept<\/b>."},{"qid":"c10-11-11","type":"fix","level":2,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["Fear","is","the","bigger","challenge","of","all."],"errors":[{"i":3,"options":["biggest","big","most"],"answer":0}],"rule":"Comparing with <b>all<\/b> needs the superlative: the <b>biggest<\/b>."},{"qid":"c10-11-12","type":"fix","level":2,"topic":"passive_modal","prompt":"One word is wrong. Find it and fix it.","words":["The","child","was","force","to","work","in","a","factory."],"errors":[{"i":3,"options":["forced","forcing","forces"],"answer":0}],"rule":"Passive: <b>was + past participle<\/b> (was forced)."},{"qid":"c10-11-13","type":"fix","level":3,"topic":"sentence_types","prompt":"One word is wrong. Find it and fix it.","words":["Why","did","the","girl","asked","that","angry","question","yesterday?"],"errors":[{"i":4,"options":["asking","ask","asks"],"answer":1}],"rule":"In a question with <b>did<\/b>, the main verb is the base form: did ... <b>ask<\/b>."},{"qid":"c10-11-14","type":"fix","level":4,"topic":"present_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Has","Riya","ever","forgot","to","thank","her","teachers?"],"errors":[{"i":3,"options":["forgets","forgotten","forgetting"],"answer":1}],"rule":"<b>has + past participle<\/b>: Has Riya ever <b>forgotten<\/b>?"},{"qid":"c10-11-15","type":"fix","level":4,"topic":"passive_modal","prompt":"One word is wrong. Find it and fix it.","words":["Child-friendly","policies","must","be","make","by","every","government."],"errors":[{"i":4,"options":["made","making","makes"],"answer":0}],"rule":"Modal passive: <b>must be + past participle<\/b> (must be made)."},{"qid":"c10-11-16","type":"fix","level":5,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["This","is","one","of","the","most","important","speech","ever","given","in","Oslo."],"errors":[{"i":7,"options":["speeches","talk","lecture"],"answer":0}],"rule":"<b>one of the + superlative<\/b> is followed by a plural noun: <b>speeches<\/b>."},{"qid":"c10-11-17","type":"fill","level":1,"topic":"sentence_types","prompt":"Fill in the gap.","before":"","after":"you ever helped a child to read?","options":["Have","Did","Are"],"answer":0,"rule":"With the past participle <b>helped<\/b> + 'ever', the question begins with <b>Have<\/b>."},{"qid":"c10-11-18","type":"fill","level":1,"topic":"present_perfect","prompt":"Fill in the gap.","before":"I","after":"never seen such a brave bird.","options":["has","am","have"],"answer":2,"rule":"With <b>I<\/b>, the present perfect is <b>have + past participle<\/b> roup of volunteers last year.","It was built by a group of volunteers."],"answer":2,"rule":"Past passive: <b>was + past participle<\/b> (was built)."},{"qid":"c10-11-33","type":"chat","level":3,"topic":"comparison","prompt":"Pick the correct reply.","chat":[["Kabir","Which was harder, the science paper or the maths paper?"]],"options":["The maths paper was more harder than the science paper.","The maths paper was much harder than the science paper.","The maths paper was hardest than the science paper."],"answer":1,"rule":"Use <b>much<\/b> (not 'more') to make a comparative stronger: much harder."},{"qid":"c10-11-34","type":"chat","level":3,"topic":"sentence_types","prompt":"Pick the correct reply.","chat":[["Meera","I'm going to volunteer at the night school."],["Meera","Do you want to come?"]],"options":["Yes, I'd love to! What time does it start?","Yes, I'd love to! What time it starts?","Yes, I'd love to! What time does it starts?"],"answer":0,"rule":"Wh-question: <b>What time + does + subject + base verb?<\/b>"},{"qid":"c10-11-35","type":"chat","level":4,"topic":"present_perfect","prompt":"Pick the correct reply.","chat":[["Aunt","How long have you known Shazia?"]],"options":["I know her since Class 3.","I have knew her since Class 3.","I have known her since Class 3."],"answer":2,"rule":"From a past point till now: present perfect <b>have known<\/b> + since."},{"qid":"c10-11-36","type":"chat","level":4,"topic":"passive_modal","prompt":"Pick the correct reply.","chat":[["Principal","Can the old library be used for the night classes?"]],"options":["Yes, ma'am. It can cleaned and painted this week.","Yes, ma'am. It can be cleaned and painted this week.","Yes, ma'am. It can be clean and painted this week."],"answer":1,"rule":"Modal passive: <b>can be + past participle<\/b> (cleaned, painted)."},{"qid":"c10-11-37","type":"chat","level":5,"topic":"infinitive","prompt":"Pick the correct reply.","chat":[["Riya","Why did you start collecting old books?"],["Riya","They are piling up in your room!"]],"options":["I want giving them to children who can't afford them.","I want to gave them to children who can't afford them.","I want to give them to children who can't afford them."],"answer":2,"rule":"<b>want<\/b> + infinitive: want <b>to give<\/b> (to + base verb)."},{"qid":"c10-11-38","type":"change","level":1,"topic":"sentence_types","prompt":"Change into an assertive sentence.","source":"Is the world so poor?","options":["The world is not so poor.","The world are not so poor.","The world is not so poorly."],"answer":0,"rule":"A positive rhetorical question becomes a negative statement: The world <b>is not<\/b> so poor."},{"qid":"c10-11-39","type":"change","level":2,"topic":"sentence_types","prompt":"Change into an assertive sentence.","source":"How frightened their eyes look!","options":["Their eyes looks very frightened.","Their eyes look very frightened.","Their eyes look very frighten."],"answer":1,"rule":"<b>How<\/b> becomes <b>very<\/b>; keep the participle 'frightened' and the plural verb 'look'."},{"qid":"c10-11-40","type":"change","level":2,"topic":"passive_modal","prompt":"Change into passive voice.","source":"We can do it.","options":["It can be did by us.","It could be done by we.","It can be done by us."],"answer":2,"rule":"Modal passive: <b>can be + past participle<\/b>; 'we' becomes <b>by us<\/b>."},{"qid":"c10-11-41","type":"change","level":3,"topic":"passive_modal","prompt":"Change into passive voice.","source":"Her angry question still shakes me.","options":["I am still shaken by her angry question.","I am still shook by her angry question.","I was still shaken by her angry question."],"answer":0,"rule":"Simple present passive: <b>am/is/are + past participle<\/b> (am shaken)."},{"qid":"c10-11-42","type":"change","level":4,"topic":"comparison","prompt":"Change into the comparative degree.","source":"Fear is the biggest challenge facing humankind.","options":["Fear is more bigger than any other challenge facing humankind.","Fear is bigger than any other challenge facing humankind.","Fear is biggest than any other challenge facing humankind."],"answer":1,"rule":"Superlative to comparative: <b>bigger than any other<\/b>; never 'more' with an -er word."},{"qid":"c10-11-43","type":"change","level":4,"topic":"comparison","prompt":"Change into the positive degree.","source":"The Nobel Prize is one of the greatest honours in the world.","options":["Very few honours in the world are greater than the Nobel Prize.","Very few honours in the world is as great as the Nobel Prize.","Very few honours in the world are as great as the Nobel Prize."],"answer":2,"rule":"'one of the + superlative' becomes <b>Very few ... are as + adjective + as<\/b>."},{"qid":"c10-11-44","type":"change","level":5,"topic":"passive_modal","prompt":"Change into passive voice.","source":"We have prevented millions of child deaths.","options":["Millions of child deaths have been prevented by us.","Millions of child deaths has been prevented by us.","Millions of child deaths have been prevent by us."],"answer":0,"rule":"Present perfect passive: <b>have been + past participle<\/b>; plural subject takes 'have'."},{"qid":"c10-11-45","type":"change","level":5,"topic":"sentence_types","prompt":"Change into an assertive sentence.","source":"Why didn't you come earlier?","options":["You should have came earlier.","You should have come earlier.","You should came earlier."],"answer":1,"rule":"The question means 'you ought to have come': <b>should have + past participle<\/b>."},{"qid":"c10-11-46","type":"proof","level":3,"topic":"present_perfect","prompt":"Find and fix the 2 errors in this message.","words":["Our","club","has","collected","two","hundred","books","for","the","night","school.","We","have","also","teach","thirty","children","to","read","since","June.","Last","week,","two","more","volunteers","joins","us."],"errors":[{"i":14,"options":["teaching","teaches","taught"],"answer":2},{"i":26,"options":["join","joining","joined"],"answer":2}],"rule":"have <b>taught<\/b> (past participle); <b>Last week<\/b> is finished past time, so simple past <b>joined<\/b>."},{"qid":"c10-11-47","type":"proof","level":4,"topic":"comparison","prompt":"Find and fix the 2 errors in this message.","words":["Shazia","is","the","braver","girl","in","our","whole","school.","She","wants","to","becomes","a","doctor","and","help","poor","families","in","her","village."],"errors":[{"i":3,"options":["brave","bravest","bravely"],"answer":1},{"i":12,"options":["become","became","becoming"],"answer":0}],"rule":"Comparing with a whole school needs the superlative <b>bravest<\/b>; to + base verb: to <b>become<\/b>."},{"qid":"c10-11-48","type":"proof","level":5,"topic":"sentence_types","prompt":"Find and fix the 3 errors in this message.","words":["How","proud","we","all","felt","when","the","award","was","announce","on","TV!","Why","did","nobody","told","us","earlier?","The","ceremony","will","be","held","in","December,","isn't","it?"],"errors":[{"i":9,"options":["announced","announcing","announces"],"answer":0},{"i":15,"options":["tells","telling","tell"],"answer":2},{"i":25,"options":["wasn't","won't","doesn't"],"answer":1}],"rule":"was <b>announced<\/b> (passive); did ... <b>tell<\/b> (base verb); 'will be held' takes the tag <b>won't it?<\/b>"},{"qid":"c10-11-49","type":"proof","level":5,"topic":"passive_modal","prompt":"Find and fix the 3 errors in this message.","words":["Child","labour","must","be","stop","in","every","corner","of","the","world.","Each","child","should","be","gave","a","book","and","a","toy.","These","dreams","can","be","achieved","only","if","all","of","us","works","together."],"errors":[{"i":4,"options":["stopping","stopped","stops"],"answer":1},{"i":15,"options":["given","giving","gives"],"answer":0},{"i":31,"options":["working","workers","work"],"answer":2}],"rule":"Modal passive needs past participles: be <b>stopped<\/b>, be <b>given<\/b>; 'all of us' is plural: <b>work<\/b>."},{"qid":"c10-11-50","type":"proof","level":5,"topic":"infinitive","prompt":"Find and fix the 3 errors in this message.","words":["Two","weeks","ago,","I","decide","to","teach","at","the","night","school","every","Sunday.","Both","my","parents","has","agreed,","and","my","brother","wants","to","joins","me","too."],"errors":[{"i":4,"options":["decided","deciding","decides"],"answer":0},{"i":16,"options":["have","is","was"],"answer":0},{"i":23,"options":["join","joined","joining"],"answer":0}],"rule":"<b>Two weeks ago<\/b> is past: <b>decided<\/b>; 'Both my parents' is plural: <b>have<\/b> agreed; to + base verb: to <b>join<\/b>."}]},{"id":"12","num":"2.6","title":"Science and Spirituality","unit":"Unit Two","topics":[{"tag":"sentence_patterns","name":"Simple sentence patterns: object, complement, adverbial"},{"tag":"punctuation","name":"Punctuation: apostrophes (possessive 's, it's / its)"},{"tag":"only_inversion","name":"Inversion after 'Only when / Only then / Only after'"},{"tag":"the_more","name":"'The more ..., the more ...' comparatives"},{"tag":"reported_speech","name":"Reported speech"}],"questions":[{"qid":"c10-12-01","type":"spot","level":1,"topic":"sentence_patterns","prompt":"Which sentence is correct?","options":["The dancer danced graceful.","The dancer danced gracefulness.","The dancer danced gracefully."],"answer":2,"rule":"The adverbial tells <b>how<\/b> she danced, so use the adverb <b>gracefully<\/b>."},{"qid":"c10-12-02","type":"spot","level":1,"topic":"punctuation","prompt":"Pick the correctly punctuated sentence.","options":["The childrens' books were kept in the ashram's library.","The children's books were kept in the ashrams library.","The children's books were kept in the ashram's library."],"answer":2,"rule":"Possessive 's: <b>children's<\/b> (plural without s adds 's) and <b>ashram's<\/b> (singular adds 's)."},{"qid":"c10-12-03","type":"spot","level":2,"topic":"only_inversion","prompt":"Which sentence is correct?","options":["Only when Ravi rests his headache goes away.","Only when Ravi rests does his headache go away.","Only when Ravi rests does his headache goes away."],"answer":1,"rule":"After <b>Only when ...<\/b>, invert the main clause: <b>does his headache go<\/b>."},{"qid":"c10-12-04","type":"spot","level":2,"topic":"reported_speech","prompt":"Which sentence is correct?","options":["Dr Kalam said that science and faith musts coexist.","Dr Kalam said that science and faith must coexist.","Dr Kalam said that science and faith must coexisted."],"answer":1,"rule":"<b>must<\/b> stays the same in reported speech and is followed by the base verb."},{"qid":"c10-12-05","type":"spot","level":3,"topic":"the_more","prompt":"Which sentence is correct?","options":["The longer Grandpa walks, fitter he feels.","The long Grandpa walks, the fitter he feels.","The longer Grandpa walks, the fitter he feels."],"answer":2,"rule":"Pattern: <b>The + comparative ..., the + comparative ...<\/b> (The longer ..., the fitter ...)."},{"qid":"c10-12-06","type":"spot","level":3,"topic":"sentence_patterns","prompt":"Which sentence is correct?","options":["The old Swamiji looked steadily and alert.","The old Swamiji looking steady and alert.","The old Swamiji looked steady and alert."],"answer":2,"rule":"After <b>looked<\/b> (meaning 'seemed'), use adjectives as the complement: steady and alert."},{"qid":"c10-12-07","type":"spot","level":4,"topic":"reported_speech","prompt":"Which reported question is correct?","options":["Dr Kalam asked Srijan that what the reverse of that question was.","Dr Kalam asked Srijan what the reverse of that question was.","Dr Kalam asked to Srijan what the reverse of that question was."],"answer":1,"rule":"A reported wh-question joins with the wh-word itself (no 'that') and uses <b>asked + person<\/b> (no 'to')."},{"qid":"c10-12-08","type":"spot","level":5,"topic":"only_inversion","prompt":"Which sentence is correct?","options":["Only after the guests had left Meena started cleaning up.","Only after the guests had left did Meena start cleaning up.","Only after the guests had left did Meena started cleaning up."],"answer":1,"rule":"<b>Only after ...<\/b> needs inversion: <b>did + subject + base verb<\/b> (did Meena start)."},{"qid":"c10-12-09","type":"fix","level":1,"topic":"sentence_patterns","prompt":"One word is wrong. Find it and fix it.","words":["The","boatman","rowed","his","boat","careful","across","the","sea."],"errors":[{"i":5,"options":["carefully","care","carefulness"],"answer":0}],"rule":"To say <b>how<\/b> he rowed, use the adverb <b>carefully<\/b>."},{"qid":"c10-12-10","type":"fix","level":1,"topic":"the_more","prompt":"One word is wrong. Find it and fix it.","words":["The","more","Anu","practises","the","sitar,","the","sweet","her","music","sounds","to","us."],"errors":[{"i":7,"options":["sweeter","sweetest","sweetly"],"answer":0}],"rule":"Both halves need <b>the + comparative<\/b>: The more ..., the <b>sweeter<\/b> ..."},{"qid":"c10-12-11","type":"fix","level":2,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["Last","Sunday,","Father","Pereira","told","the","people","that","he","will","pray","for","them","that","evening."],"errors":[{"i":9,"options":["shall","would","can"],"answer":1}],"rule":"After a past reporting verb (told), <b>will<\/b> changes to <b>would<\/b>: he would pray that evening."},{"qid":"c10-12-12","type":"fix","level":2,"topic":"only_inversion","prompt":"One word is wrong. Find it and fix it.","words":["Only","then","did","the","people","understood","the","scientist's","mission."],"errors":[{"i":5,"options":["understands","understanding","understand"],"answer":2}],"rule":"After <b>did<\/b>, use the base verb: did the people <b>understand<\/b>."},{"qid":"c10-12-13","type":"fix","level":3,"topic":"the_more","prompt":"One word is wrong. Find it and fix it.","words":["The","more","we","take","from","nature,","the","poor","the","planet","becomes."],"errors":[{"i":7,"options":["poorer","poorest","poorly"],"answer":0}],"rule":"Both halves need a comparative: The more ..., the <b>poorer<\/b> ..."},{"qid":"c10-12-14","type":"fix","level":4,"topic":"sentence_patterns","prompt":"One word is wrong. Find it and fix it.","words":["The","children","waited","patient","outside","the","church","on","Sunday."],"errors":[{"i":3,"options":["patiently","patience","patients"],"answer":0}],"rule":"To describe <b>how<\/b> they waited, use the adverb <b>patiently<\/b>."},{"qid":"c10-12-15","type":"fix","level":4,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["Yesterday","the","teacher","asked","us","if","we","can","keep","quiet","for","a","while."],"errors":[{"i":7,"options":["may","will","could"],"answer":2}],"rule":"In a reported question after <b>asked<\/b>, <b>can<\/b> changes to <b>could<\/b>."},{"qid":"c10-12-16","type":"fix","level":5,"topic":"only_inversion","prompt":"One word is wrong. Find it and fix it.","words":["Only","by","serving","humanity","can","we","removes","the","dust","from","our","souls."],"errors":[{"i":6,"options":["removed","remove","removing"],"answer":1}],"rule":"After the modal <b>can<\/b>, use the base verb: can we <b>remove<\/b>."},{"qid":"c10-12-17","type":"fill","level":1,"topic":"sentence_patterns","prompt":"Fill in the gap.","before":"They are very","after":"after the long journey.","options":["tiredly","tired","tire"],"answer":1,"rule":"After <b>are<\/b>, the complement is an adjective: very <b>tired<\/b>."},{"qid":"c10-12-18","type":"fill","level":1,"topic":"punctuation","prompt":"Fill in the gap.","before":"Dr","after":"father was a boatman and an imam.","options":["Kalam's","Kalams","Kalam"],"answer":0,"rule":"Possession by one person: name + <b>'s<\/b> (Kalam's)."},{"qid":"c10-12-19","type":"fill","level":2,"topic":"only_inversion","prompt":"Fill in the gap.","before":"Only when we serve others","after":"we find true peace.","options":["did","do","are"],"answer":1,"rule":"Present tense inversion: Only when ...  subject + base verb<\/b>."},{"qid":"c10-12-27","type":"build","level":3,"topic":"the_more","prompt":"Make a 'The more ..., the ...' sentence.","answer":["The","more","we","share,","the","happier","everyone","feels."],"alts":[],"rule":"<b>The more<\/b> + clause, <b>the + comparative<\/b> + clause."},{"qid":"c10-12-28","type":"build","level":4,"topic":"reported_speech","prompt":"Make a reported question.","answer":["He","asked","me","what","I","could","give."],"alts":[],"rule":"Reported questions use statement order: what <b>I could give<\/b>."},{"qid":"c10-12-29","type":"build","level":5,"topic":"only_inversion","prompt":"Make a sentence starting with 'Only after'.","answer":["Only","after","many","years","of","failure","did","Kalam","succeed."],"alts":[],"rule":"<b>Only after<\/b> + phrase, then <b>did + subject + base verb<\/b>."},{"qid":"c10-12-30","type":"chat","level":1,"topic":"the_more","prompt":"Pick the correct reply.","chat":[["Coach","You've improved so much this season!"]],"options":["Thank you! The more I practise, the best I play.","Thank you! More I practise, better I play.","Thank you! The more I practise, the better I play."],"answer":2,"rule":"Pattern: <b>The more ..., the + comparative<\/b> (the better)."},{"qid":"c10-12-31","type":"chat","level":1,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Mom","What did your teacher say about the trip?"]],"options":["She said that we was going to Thumba on Friday.","She said us that we were going to Thumba on Friday.","She said that we were going to Thumba on Friday."],"answer":2,"rule":"Use <b>said that<\/b> (or 'told us that'), and 'we' takes <b>were<\/b>."},{"qid":"c10-12-32","type":"chat","level":2,"topic":"sentence_patterns","prompt":"Pick the correct reply.","chat":[["Dadi","How was the dance show?"]],"options":["It was wonderful! Priya danced beautiful.","It was wonderful! Priya danced beautifully.","It was wonderfully! Priya danced beautifully."],"answer":1,"rule":"After <b>was<\/b> use an adjective (wonderful); after <b>danced<\/b> use an adverb (beautifully)."},{"qid":"c10-12-33","type":"chat","level":3,"topic":"only_inversion","prompt":"Pick the correct reply.","chat":[["Ishaan","When will you get your new phone?"]],"options":["Only after I pass my exams will Dad buy it.","Only after I pass my exams Dad will buy it.","Only after I will pass my exams will Dad buy it."],"answer":0,"rule":"<b>Only after<\/b> + present tense, then invert: <b>will Dad buy<\/b>."},{"qid":"c10-12-34","type":"chat","level":3,"topic":"punctuation","prompt":"Pick the correct reply.","chat":[["Sara","Is the science kit ready for tomorrow?"]],"options":["Yes, its ready, but its lid is broken.","Yes, it's ready, but its lid is broken.","Yes, it's ready, but it's lid is broken."],"answer":1,"rule":"<b>it's<\/b> = it is (it's ready); <b>its<\/b> = belonging to it (its lid)."},{"qid":"c10-12-35","type":"chat","level":4,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Dad","Did you ask the librarian about Wings of Fire?"]],"options":["Yes. She told me that the book has been return.","Yes. She said me that the book had been returned.","Yes. She told me that the book had been returned."],"answer":2,"rule":"Use <b>told me<\/b> (not 'said me') and backshift: <b>had been returned<\/b>."},{"qid":"c10-12-36","type":"chat","level":4,"topic":"the_more","prompt":"Pick the correct reply.","chat":[["Aditi","Should I take the short road or the long road to the temple?"]],"options":["Take the short road. The sooner you reach, the longer you can stay.","Take the short road. The soon you reach, the longer you can stay.","Take the short road. The sooner you reach, longer you can stay."],"answer":0,"rule":"Both halves need <b>the + comparative<\/b>: The sooner ..., the longer ..."},{"qid":"c10-12-37","type":"chat","level":5,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Teacher","Rohan, what did Mahaswamiji tell the children?"]],"options":["He told them that they should always shared what they had.","He told to them that they should always share what they had.","He told them that they should always share what they had."],"answer":2,"rule":"<b>told + person<\/b> (no 'to'), and <b>should + base verb<\/b> (share)."},{"qid":"c10-12-38","type":"change","level":1,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Dr Kalam said, \"I am a teacher.\"","options":["Dr Kalam said that I was a teacher.","Dr Kalam said that he was a teacher.","Dr Kalam said that he were a teacher."],"answer":1,"rule":"<b>I<\/b> becomes <b>he<\/b>, and <b>am<\/b> becomes <b>was<\/b> after 'said'."},{"qid":"c10-12-39","type":"change","level":2,"topic":"only_inversion","prompt":"Begin the sentence with 'Only when'.","source":"The mirror shines only when the dust is removed.","options":["Only when the dust is removed does the mirror shine.","Only when the dust is removed the mirror shines.","Only when the dust is removed does the mirror shines."],"answer":0,"rule":"Starting with <b>Only when<\/b>, invert the main clause: <b>does the mirror shine<\/b>."},{"qid":"c10-12-40","type":"change","level":2,"topic":"the_more","prompt":"Rewrite using 'The more ..., the ...'.","source":"As we give more, we become happier.","options":["The more we give, happier we become.","More we give, the happier we become.","The more we give, the happier we become."],"answer":2,"rule":"Both halves begin with <b>the<\/b>: The more ..., the happier ..."},{"qid":"c10-12-41","type":"change","level":3,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Father Pereira said to the people, \"Can you give up your homes?\"","options":["Father Pereira asked the people if they could give up their homes.","Father Pereira asked the people if they can give up your homes.","Father Pereira asked the people that could they give up their homes."],"answer":0,"rule":"Yes/no question: <b>asked + if<\/b>, statement order, <b>can<\/b> to <b>could<\/b>, <b>your<\/b> to <b>their<\/b>."},{"qid":"c10-12-42","type":"change","level":4,"topic":"reported_speech","prompt":"Change into direct speech.","source":"Dr Kalam advised me to use my degree to change society.","options":["Dr Kalam said to me, \"Use your degree to change society.\"","Dr Kalam said to me, \"Use my degree to change society.\"","Dr Kalam said to me, \"You used your degree to change society.\""],"answer":0,"rule":"Advice becomes an imperative, and <b>my<\/b> (narrator) becomes <b>your<\/b> when Dr Kalam speaks."},{"qid":"c10-12-43","type":"change","level":4,"topic":"only_inversion","prompt":"Rewrite using 'Only after'.","source":"The work began after the fishermen got new homes.","options":["Only after the fishermen got new homes did the work begin.","Only after the fishermen got new homes the work began.","Only after the fishermen got new homes did the work began."],"answer":0,"rule":"<b>Only after<\/b> + clause, then <b>did + subject + base verb<\/b> (did the work begin)."},{"qid":"c10-12-44","type":"change","level":5,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"\"Sir, do you know how old Swamiji is?\" I asked Dr Kalam.","options":["I respectfully asked Dr Kalam if he knows how old was Swamiji.","I respectfully asked Dr Kalam if he knew how old Swamiji was.","I respectfully asked Dr Kalam did he know how old Swamiji was."],"answer":1,"rule":"'Sir' becomes <b>respectfully<\/b>; use <b>if<\/b>, statement order and backshift (knew, was)."},{"qid":"c10-12-45","type":"change","level":5,"topic":"the_more","prompt":"Rewrite using 'The longer ..., the more ...'.","source":"When Srijan worked longer with Dr Kalam, he learnt more.","options":["The longer Srijan worked with Dr Kalam, the more he learns.","The longer Srijan worked with Dr Kalam, the more he learnt.","The long Srijan worked with Dr Kalam, the more he learnt."],"answer":1,"rule":"<b>The + comparative<\/b> in both halves, and keep both verbs in the past (worked, learnt)."},{"qid":"c10-12-46","type":"proof","level":3,"topic":"sentence_patterns","prompt":"Find and fix the 2 errors in this message.","words":["Dinesh","took","a","bus","that","stopped","at","Nanded","railway","station.","He","got","off","careful","and","reach","his","uncle's","shop","by","noon."],"errors":[{"i":13,"options":["care","careless","carefully"],"answer":2},{"i":15,"options":["reaching","reached","reaches"],"answer":1}],"rule":"How he got off: adverb <b>carefully<\/b>; the story is past: <b>reached<\/b>."},{"qid":"c10-12-47","type":"proof","level":4,"topic":"reported_speech","prompt":"Find and fix the 2 errors in this message.","words":["Yesterday","our","teacher","told","us","that","Dr","Kalam","is","born","in","Rameswaram.","She","also","asked","us","whether","we","has","read","Wings","of","Fire."],"errors":[{"i":8,"options":["were","was","has"],"answer":1},{"i":18,"options":["is","does","had"],"answer":2}],"rule":"A birth is a past event: <b>was born<\/b>; reported question after 'asked': we <b>had<\/b> read."},{"qid":"c10-12-48","type":"proof","level":5,"topic":"only_inversion","prompt":"Find and fix the 3 errors in this message.","words":["Only","when","we","stop","being","selfish","will","our","society","changes","for","the","better.","The","more","we","give,","the","happy","we","become.","Only","then","does","the","world","becomes","a","kinder","place."],"errors":[{"i":9,"options":["changed","changing","change"],"answer":2},{"i":18,"options":["happier","happiest","happily"],"answer":0},{"i":26,"options":["became","becoming","become"],"answer":2}],"rule":"will ... <b>change<\/b> and does ... <b>become<\/b> (base verbs after helpers); The more ..., the <b>happier<\/b>."},{"qid":"c10-12-49","type":"proof","level":5,"topic":"sentence_patterns","prompt":"Find and fix the 2 errors in this message.","words":["The","102-year-old","Swamiji","stood","steady","for","half","an","hour.","He","spoke","wise","and","then","feed","thousands","of","hungry","children.","Everyone","was","amazed","by","his","strength."],"errors":[{"i":11,"options":["wiser","wisdom","wisely"],"answer":2},{"i":14,"options":["feeds","fed","feeding"],"answer":1}],"rule":"How he spoke: adverb <b>wisely<\/b>; past story: <b>fed<\/b>. ('stood steady' is correct: steady describes him.)"},{"qid":"c10-12-50","type":"proof","level":5,"topic":"reported_speech","prompt":"Find and fix the 3 errors in this message.","words":["Father","Pereira","told","the","people","that","the","scientist","want","their","land.","He","asked","them","if","they","can","give","up","their","homes.","Everyone","agreed","and","said","that","they","will","help."],"errors":[{"i":8,"options":["wanting","wishing","wanted"],"answer":2},{"i":16,"options":["will","shall","could"],"answer":2},{"i":27,"options":["would","shall","can"],"answer":0}],"rule":"After past reporting verbs, backshift: <b>wanted<\/b>, <b>could<\/b>, <b>would<\/b>."}]},{"id":"13","num":"3.1","title":"Night of the Scorpion","unit":"Unit Three","topics":[{"tag":"past_perfect","name":"Past perfect and simple past in a story"},{"tag":"reported_speech","name":"Reported speech (statements, questions, commands, exclamations)"},{"tag":"participles","name":"Participle phrases (-ing / -ed forms)"},{"tag":"wishes_exclamations","name":"Wishes with 'May' and exclamatory sentences"}],"questions":[{"qid":"c10-13-01","type":"spot","level":1,"topic":"past_perfect","prompt":"Which sentence is correct?","options":["The scorpion had crawled under a sack of rice.","The scorpion had crawl under a sack of rice.","The scorpion had crawling under a sack of rice."],"answer":0,"rule":"Past perfect = <b>had + past participle<\/b>: had <b>crawled<\/b>."},{"qid":"c10-13-02","type":"spot","level":1,"topic":"wishes_exclamations","prompt":"Which wish is correct?","options":["May God blesses you with good health!","May God bless you with good health!","May God blessed you with good health!"],"answer":1,"rule":"In a wish starting with <b>May<\/b>, use the base verb: May God <b>bless<\/b> you!"},{"qid":"c10-13-03","type":"fix","level":1,"topic":"participles","prompt":"One word is wrong. Find it and fix it.","words":["My","mother","lay","on","a","mat,","groan","with","pain."],"errors":[{"i":6,"options":["groaning","groaned","groans"],"answer":0}],"rule":"The participle phrase <b>groaning with pain<\/b> tells us what she was doing as she lay there."},{"qid":"c10-13-04","type":"fix","level":1,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["By","the","time","the","neighbours","came","last","night,","the","scorpion","has","already","run","away."],"errors":[{"i":10,"options":["have","had","was"],"answer":1}],"rule":"The earlier of two past actions takes the past perfect: the scorpion <b>had<\/b> already run away."},{"qid":"c10-13-05","type":"fill","level":1,"topic":"reported_speech","prompt":"Fill in the gap.","before":"The peasants said that the poison","after":"moving in her blood.","options":["is being","was","were"],"answer":1,"rule":"After <b>said<\/b>, the tense moves back: is moving becomes <b>was<\/b> moving. 'Poison' is singular."},{"qid":"c10-13-06","type":"fill","level":1,"topic":"wishes_exclamations","prompt":"Fill in the gap.","before":"","after":"your pain decrease soon!","options":["May","Must","Should"],"answer":0,"rule":"A wish or prayer for someone begins with <b>May<\/b> + subject + base verb."},{"qid":"c10-13-07","type":"build","level":1,"topic":"participles","prompt":"Make a sentence with a participle phrase.","answer":["Throwing","giant","shadows,","our","lanterns","lit","the","walls."],"alts":[],"rule":"<b>Throwing giant shadows<\/b> describes the lanterns, so it comes just before them."},{"qid":"c10-13-08","type":"chat","level":1,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Asha","What did the doctor tell your grandmother?"]],"options":["He told her that she need rest.","He said her that she needed rest.","He told her that she needed rest."],"answer":2,"rule":"Use <b>told + person<\/b> (said has no object) and move the tense back: needs becomes <b>needed<\/b>."},{"qid":"c10-13-09","type":"change","level":1,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Mother said, \"I am fine.\"","options":["Mother said that she were fine.","Mother said that I was fine.","Mother said that she was fine."],"answer":2,"rule":"<b>I<\/b> becomes <b>she<\/b> and <b>am<\/b> becomes <b>was<\/b> after the past reporting verb said."},{"qid":"c10-13-10","type":"proof","level":1,"topic":"past_perfect","prompt":"Find and fix the 2 errors in this message.","words":["Last","night","a","scorpion","stung","my","aunt.","It","had","hide","under","a","sack","of","rice.","We","called","the","doctor","and","he","come","quickly."],"errors":[{"i":9,"options":["hides","hidden","hiding"],"answer":1},{"i":21,"options":["comes","came","coming"],"answer":1}],"rule":"Past perfect needs the past participle: had <b>hidden<\/b>. The story is in the past, so he <b>came<\/b>."},{"qid":"c10-13-11","type":"spot","level":2,"topic":"reported_speech","prompt":"Pick the correct reported question.","options":["Father asked where the scorpion had gone.","Father asked where had the scorpion gone.","Father asked that where the scorpion had gone."],"answer":0,"rule":"A reported question uses statement order (subject + verb) and no <b>that<\/b>: where the scorpion <b>had gone<\/b>."},{"qid":"c10-13-12","type":"spot","level":2,"topic":"participles","prompt":"Which sentence is correct?","options":["Tiring after the long night, Mother fell asleep.","Tired after the long night, Mother fell asleep.","Tire after the long night, Mother fell asleep."],"answer":1,"rule":"Mother felt the tiredness, so use the <b>-ed<\/b> participle: <b>Tired<\/b> after the long night."},{"qid":"c10-13-13","type":"fix","level":2,"topic":"wishes_exclamations","prompt":"One word is wrong. Find it and fix it.","words":["May","the","poison","leaves","  is correct?","options":["Mother told Smita not to wake her brother.","Mother told Smita not wake her brother.","Mother told Smita don't wake her brother."],"answer":0,"rule":"A negative command is reported as <b>told<\/b> + person + <b>not to<\/b> + verb."},{"qid":"c10-18-12","type":"spot","level":2,"topic":"modals","prompt":"Which sentence is correct?","options":["You must not to bother him with such requests.","You must not bothering him with such requests.","You must not bother him with such requests."],"answer":2,"rule":"<b>must not<\/b> is followed by the base verb, with no 'to': must not <b>bother<\/b>."},{"qid":"c10-18-13","type":"fix","level":2,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["After","the","doctors","had","leave","the","ward,","the","family","sat","together","quietly."],"errors":[{"i":4,"options":["leaving","leaves","left"],"answer":2}],"rule":"Past perfect = <b>had<\/b> + past participle: had <b>left<\/b>."},{"qid":"c10-18-14","type":"fix","level":2,"topic":"adj_adverb","prompt":"One word is wrong. Find it and fix it.","words":["They","tried","hard","to","keep","Anant","happily","every","day."],"errors":[{"i":6,"options":["happiness","happy","happen"],"answer":1}],"rule":"<b>keep<\/b> + person + adjective: keep Anant <b>happy<\/b>."},{"qid":"c10-18-15","type":"fill","level":2,"topic":"reported_speech","prompt":"Fill in the gap.","before":"Anant asked Smita","after":"she had heard the maestro.","options":["if","that","did"],"answer":0,"rule":"A reported yes/no question begins with <b>if<\/b> (or whether)."},{"qid":"c10-18-16","type":"fill","level":2,"topic":"modals","prompt":"Fill in the gap.","before":"Panditji is a busy man; you","after":"not disturb him.","options":["has","must","having"],"answer":1,"rule":"<b>must not<\/b> + base verb shows something is not allowed."},{"qid":"c10-18-17","type":"build","level":2,"topic":"reported_speech","prompt":"Report the request.","answer":["Smita","asked","her","fath e (<b>booked<\/b>)."},{"qid":"c10-18-33","type":"fix","level":4,"topic":"adj_adverb","prompt":"One word is wrong. Find it and fix it.","words":["Anant","played","the","sitar","more","skilful","than","his","sister."],"errors":[{"i":5,"options":["skill","skilled","skilfully"],"answer":2}],"rule":"Comparing how he played needs the adverb: more <b>skilfully<\/b> than ..."},{"qid":"c10-18-34","type":"fill","level":4,"topic":"modals","prompt":"Fill in the gap.","before":"Smita asked her father if they","after":"go to the concert.","options":["could","ought","have"],"answer":0,"rule":"In a reported question, can becomes <b>could<\/b> + base verb."},{"qid":"c10-18-35","type":"build","level":4,"topic":"reported_speech","prompt":"Make a reported question.","answer":["The","guard","asked","Smita","why","she","was","there."],"alts":[],"rule":"Reported wh-question: wh-word + statement order (<b>she was<\/b>), no question mark."},{"qid":"c10-18-36","type":"chat","level":4,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Dad","Why were you so upset yesterday?"]],"options":["I had lose my ticket, so I couldn't enter.","I have lost my ticket, so I couldn't entered.","I had lost my ticket, so I couldn't enter."],"answer":2,"rule":"The earlier past event: <b>had lost<\/b>; after couldn't use the base verb: enter."},{"qid":"c10-18-37","type":"chat","level":4,"topic":"adj_adverb","prompt":"Pick the correct reply.","chat":[["Ritu","How was the concert?"]],"options":["It was wonderfully! Panditji played so beautifully.","It was wonderful! Panditji played so beautifully.","It was wonderful! Panditji played so beautiful."],"answer":1,"rule":"After <b>was<\/b> use an adjective (wonderful); to say how he played use an adverb (<b>beautifully<\/b>)."},{"qid":"c10-18-38","type":"change","level":4,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Smita said to Panditji, \"Please play for my brother.\"","options":["Smita requested Panditji to play for m
