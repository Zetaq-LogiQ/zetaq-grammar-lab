"successful"],"answer":0},{"i":18,"options":["inspiration","inspires","inspiring"],"answer":2}],"rule":"Past story: she <b>succeeded<\/b>. After were so, use an adjective: so <b>inspiring<\/b>."},{"qid":"c10-05-31","type":"spot","level":4,"topic":"reported_speech","prompt":"Which sentence is correct?","options":["Joan told Robert that Polly and Jack had promised to come with her.","Joan said Robert that Polly and Jack had promised to come with her.","Joan told Robert that Polly and Jack has promised to come with her."],"answer":0,"rule":"<b>told<\/b> + person; have promised becomes <b>had promised<\/b> in reported speech."},{"qid":"c10-05-32","type":"fix","level":4,"topic":"word_forms","prompt":"One word is wrong. Find it and fix it.","words":["The","captain","finally","agreed,","and","Joan","smiled","bright","at","him."],"errors":[{"i":7,"options":["brighter","brightness","brightly"],"answer":2}],"rule":"Smiled how? Use the adverb: smiled <b>brightly<\/b>."},{"qid":"c10-05-33","type":"fix","level":4,"topic":"phrasal_verbs","prompt":"One word is wrong. Find it and fix it.","words":["Please","don't","cut","on","before","I","have","finished","speaking."],"errors":[{"i":3,"options":["in","into","by"],"answer":0}],"rule":"<b>cut in<\/b> = interrupt someone who is speaking."},{"qid":"c10-05-34","type":"fill","level":4,"topic":"unless","prompt":"Fill in the gap.","before":"Poulengey will take her to Chinon unless the captain","after":"him.","options":["will stop","stopped","stops"],"answer":2,"rule":"Main clause in the future, <b>unless<\/b> clause in the simple present: unless the captain <b>stops<\/b> him."},{"qid":"c10-05-35","type":"build","level":4,"topic":"phrasal_verbs","prompt":"Put the words in order.","answer":["The","match","has","been","called","off."],"alts":[],"rule":"Present perfect passive of call off: <b>has been called off<\/b>."},{"qid":"c10-05-36","type":"chat","level":4,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Teacher","What did Arjun ask you?"]],"options":["He asked me whether had I finished the project.","He asked me whether I had finished the project.","He asked me whether I have finish the project."],"answer":1,"rule":"Reported yes/no question: <b>whether<\/b> + subject + verb, tense moved back: I <b>had finished<\/b>."},{"qid":"c10-05-37","type":"chat","level":4,"topic":"word_forms","prompt":"Pick the correct reply.","chat":[["Coach","Do you think we can beat them in the final?"]],"options":["Yes, if we play fearless.","Yes, if we play fearlessly.","Yes, if we plays fearlessly."],"answer":1,"rule":"Play how? Adverb: <b>fearlessly<\/b>. With we, use play (not plays)."},{"qid":"c10-05-38","type":"change","level":4,"topic":"affirmative_negative","prompt":"Make it affirmative without changing the meaning.","source":"I shall not want many soldiers.","options":["I shall want only a few soldiers.","I shall want only few soldiers.","I shall wants only a few soldiers."],"answer":0,"rule":"not many = <b>only a few<\/b>. After shall, use the base verb want."},{"qid":"c10-05-39","type":"change","level":4,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Joan said, 'I have arranged it all.'","options":["Joan said that I had arranged it all.","Joan said that she had arrange it all.","Joan said that she had arranged it all."],"answer":2,"rule":"I becomes <b>she<\/b>; have arranged becomes <b>had arranged<\/b>."},{"qid":"c10-05-40","type":"proof","level":4,"topic":"reported_speech","prompt":"Find and fix the 2 errors in this message.","words":["Robert","asked","the","steward","why","he","had","not","throw","the","girl","out.","The","steward","said","that","the","soldiers","was","not","afraid","of","her,","but","she","put","courage","into","them."],"errors":[{"i":8,"options":["thrown","threw","throwing"],"answer":0},{"i":18,"options":["is","be","were"],"answer":2}],"rule":"had not + past participle: <b>thrown<\/b>. Soldiers is plural, past: <b>were<\/b>."},{"qid":"c10-05-41","type":"spot","level":5,"topic":"unless","prompt":"Which sentence is correct?","options":["Unless the soldiers believe in themselves, they will keep running away.","Unless the soldiers will believe in themselves, they will keep running away.","Unless the soldiers believed in themselves, they will keep running away."],"answer":0,"rule":"Future result with will; the <b>unless<\/b> clause takes the simple present: unless they <b>believe<\/b>."},{"qid":"c10-05-42","type":"fix","level":5,"topic":"word_forms","prompt":"One word is wrong. Find it and fix it.","words":["Joan's","determination","and","deep","faith","made","her","successfully","where","others","had","failed."],"errors":[{"i":7,"options":["success","successful","successive"],"answer":1}],"rule":"<b>made her<\/b> + adjective describes her: made her <b>successful<\/b>."},{"qid":"c10-05-43","type":"fill","level":5,"topic":"reported_speech","prompt":"Fill in the gap.","before":"Robert asked Joan whether she","after":"ever seen English soldiers fighting.","options":["has","had","have"],"answer":1,"rule":"Have you ever seen...? becomes whether she <b>had<\/b> ever seen (tense moves back)."},{"qid":"c10-05-44","type":"build","level":5,"topic":"unless","prompt":"Put the words in order.","answer":["Nothing","can","save","France","unless","a","miracle","happens."],"alts":[],"rule":"Main clause + <b>unless<\/b> + simple present: unless a miracle <b>happens<\/b>."},{"qid":"c10-05-45","type":"chat","level":5,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Mother","What did your coach say after the match?"]],"options":["He said that we had played well and that he is proud of we.","He said that we have played good and that he was proud of us.","He said that we had played well and that he was proud of us."],"answer":2,"rule":"Tenses move back: <b>had played<\/b>, <b>was<\/b> proud. After of, use the object pronoun <b>us<\/b>."},{"qid":"c10-05-46","type":"change","level":5,"topic":"affirmative_negative","prompt":"Make it affirmative without changing the meaning.","source":"There is no one who does not admire Joan.","options":["Everyone admire Joan.","Everyone admires Joan.","Everyone does admires Joan."],"answer":1,"rule":"no one who does not = <b>everyone<\/b>. Everyone is singular: <b>admires<\/b>."},{"qid":"c10-05-47","type":"change","level":5,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Robert said to Poulengey, 'Do you take her idea seriously?'","options":["Robert asked Poulengey if he took her idea seriously.","Robert asked Poulengey if did he take her idea seriously.","Robert said Poulengey if he took her idea seriously."],"answer":0,"rule":"Yes/no question: <b>asked<\/b> + <b>if<\/b> + subject + past verb (he took)."},{"qid":"c10-05-48","type":"proof","level":5,"topic":"word_forms","prompt":"Find and fix the 3 errors in this message.","words":["Unless","the","soldiers","stop","running","away,","nothing","will","saves","France.","Joan","was","very","determination","to","teach","them","to","fight,","and","she","looked","forward","to","free","Orleans."],"errors":[{"i":8,"options":["saved","saving","save"],"answer":2},{"i":13,"options":["determine","determining","determined"],"answer":2},{"i":24,"options":["freed","freeing","frees"],"answer":1}],"rule":"will + base verb: <b>save<\/b>. very + adjective: <b>determined<\/b>. looked forward to + -ing: <b>freeing<\/b>."},{"qid":"c10-05-49","type":"proof","level":5,"topic":"reported_speech","prompt":"Find and fix the 3 errors in this message.","words":["The","captain","asked","Joan","what","she","wants","and","where","she","came","from.","She","said","him","that","the","soldiers","called","her","the","Maid","and","that","she","has","come","to","save","France."],"errors":[{"i":6,"options":["want","wanted","wanting"],"answer":1},{"i":13,"options":["told","says","spoke"],"answer":0},{"i":25,"options":["had","have","having"],"answer":0}],"rule":"Tenses move back: she <b>wanted<\/b>, she <b>had<\/b> come. With a person after it, use <b>told<\/b> him, not said him."},{"qid":"c10-05-50","type":"proof","level":5,"topic":"phrasal_verbs","prompt":"Find and fix the 3 errors in this message.","words":["Our","team","was","afraid","from","losing,","but","our","captain","refused","to","gave","in.","Her","words","put","fire","into","us,","and","in","the","end","we","carried","of","the","trophy."],"errors":[{"i":4,"options":["of","for","to"],"answer":0},{"i":11,"options":["given","giving","give"],"answer":2},{"i":25,"options":["at","to","off"],"answer":2}],"rule":"afraid <b>of<\/b>; refused to <b>give<\/b> in (to + base verb); <b>carry off<\/b> a trophy = win it."}]},{"id":"06","num":"1.6","title":"The Alchemy of Nature","unit":"Unit One","topics":[{"tag":"abstract_nouns","name":"Concrete and abstract nouns (noun forms)"},{"tag":"transitive_intransitive","name":"Transitive and intransitive verbs (rise/raise, lie/lay)"},{"tag":"conditionals","name":"Conditionals: if clauses (types 1, 2 and 3)"},{"tag":"however_concession","name":"However / although / despite (contrast)"}],"questions":[{"qid":"c10-06-01","type":"spot","level":1,"topic":"transitive_intransitive","prompt":"Which sentence is correct?","options":["The sun raises in the east.","The sun rises in the east.","The sun rise in the east."],"answer":1,"rule":"<b>rise<\/b> is intransitive (no object): the sun <b>rises<\/b>. Raise needs an object."},{"qid":"c10-06-02","type":"spot","level":1,"topic":"abstract_nouns","prompt":"Which sentence is correct?","options":["The ants showed great persevere.","The ants showed great persevering.","The ants showed great perseverance."],"answer":2,"rule":"After <b>showed great<\/b> we need a noun: the abstract noun <b>perseverance<\/b>."},{"qid":"c10-06-03","type":"fix","level":1,"topic":"transitive_intransitive","prompt":"One word is wrong. Find it and fix it.","words":["Please","lie","the","books","on","the","table."],"errors":[{"i":1,"options":["lay","lain","lying"],"answer":0}],"rule":"<b>lay<\/b> (put down) takes an object: lay the books. <b>lie<\/b> has no object."},{"qid":"c10-06-04","type":"fix","level":1,"topic":"abstract_nouns","prompt":"One word is wrong. Find it and fix it.","words":["The","rainbow","filled","our","hearts","with","joyful","and","wonder."],"errors":[{"i":6,"options":["joyfully","enjoy","joy"],"answer":2}],"rule":"After <b>with<\/b>, and joined to the noun wonder, we need a noun: <b>joy<\/b>."},{"qid":"c10-06-05","type":"fill","level":1,"topic":"conditionals","prompt":"Fill in the gap.","before":"If you water the plant daily, it","after":"bloom.","options":["will","would","is"],"answer":0,"rule":"Type 1: <b>If<\/b> + simple present, <b>will<\/b> + base verb."},{"qid":"c10-06-06","type":"fill","level":1,"topic":"transitive_intransitive","prompt":"Fill in the gap.","before":"The hibiscus flower","after":"to the ground by evening.","options":["fells","falls","fall"],"answer":1,"rule":"<b>fall<\/b> is intransitive: the flower <b>falls<\/b>. Fell (a tree) needs an object."},{"qid":"c10-06-07","type":"build","level":1,"topic":"conditionals","prompt":"Put the words in order.","answer":["If","it","rains,","we","will","stay","indoors."],"alts":[],"rule":"Type 1: <b>If<\/b> + present (it rains), <b>will<\/b> + base verb (we will stay)."},{"qid":"c10-06-08","type":"chat","level":1,"topic":"abstract_nouns","prompt":"Pick the correct reply.","chat":[["Teacher","What do the ants teach us?"]],"options":["They teach us the important of teamwork.","They teach us the importance of teamwork.","They teach us the importantly of teamwork."],"answer":1,"rule":"After <b>the<\/b> and before of, we need a noun: the <b>importance<\/b> of teamwork."},{"qid":"c10-06-09","type":"chat","level":1,"topic":"transitive_intransitive","prompt":"Pick the correct reply.","chat":[["Mom","Where are my glasses?"]],"options":["You lied them on the sofa this morning.","You laid them on the sofa this morning.","You lain them on the sofa this morning."],"answer":1,"rule":"Put something down = <b>lay<\/b>; past tense <b>laid<\/b>. Lied means told a lie."},{"qid":"c10-06-10","type":"change","level":1,"topic":"transitive_intransitive","prompt":"Change into passive voice.","source":"A rainbow colours the entire sky.","options":["The entire sky is coloured by a rainbow.","The entire sky was coloured by a rainbow.","The entire sky is colour by a rainbow."],"answer":0,"rule":"Colours is transitive and present: passive = <b>is coloured<\/b> by."},{"qid":"c10-06-11","type":"spot","level":2,"topic":"however_concession","prompt":"Which sentence is correct?","options":["However hard the rock are, water shapes it.","However hard the rock is, water shapes it.","However the rock is hard, water shapes it."],"answer":1,"rule":"Pattern: <b>However + adjective<\/b> + subject + verb: However <b>hard<\/b> the rock is."},{"qid":"c10-06-12","type":"spot","level":2,"topic":"conditionals","prompt":"Which sentence is correct?","options":["If I was a bird, I will fly over the ocean.","If I were a bird, I will fly over the ocean.","If I were a bird, I would fly over the ocean."],"answer":2,"rule":"Imaginary situation (type 2): <b>If I were<\/b> ..., <b>would<\/b> + base verb."},{"qid":"c10-06-13","type":"fix","level":2,"topic":"transitive_intransitive","prompt":"One word is wrong. Find it and fix it.","words":["Grandpa","raises","early","and","walks","in","the","garden."],"errors":[{"i":1,"options":["raising","raised","rises"],"answer":2}],"rule":"Get up = <b>rise<\/b> (no object). Raise needs an object, like raise your hand."},{"qid":"c10-06-14","type":"fix","level":2,"topic":"abstract_nouns","prompt":"One word is wrong. Find it and fix it.","words":["Nature","gives","us","peace","and","happy","every","single","day."],"errors":[{"i":5,"options":["happiness","happily","happier"],"answer":0}],"rule":"Gives us peace and ... needs a noun like peace: <b>happiness<\/b>."},{"qid":"c10-06-15","type":"fill","level":2,"topic":"conditionals","prompt":"Fill in the gap.","before":"If we","after":"down the trees, the birds will lose their homes.","options":["will cut","would cut","cut"],"answer":2,"rule":"Type 1: no will in the <b>if<\/b> clause. If we <b>cut<\/b> down the trees, ... will ..."},{"qid":"c10-06-16","type":"fill","level":2,"topic":"however_concession","prompt":"Fill in the gap.","before":"","after":"small an ant is, it can carry a heavy load.","options":["However","Although","Despite"],"answer":0,"rule":"<b>However + adjective<\/b> (However small) means no matter how small."},{"qid":"c10-06-17","type":"build","level":2,"topic":"abstract_nouns","prompt":"Put the words in order.","answer":["Their","perseverance","impressed","everyone."],"alts":[],"rule":"The abstract noun <b>perseverance<\/b> is the subject of the verb impressed."},{"qid":"c10-06-18","type":"chat","level":2,"topic":"however_concession","prompt":"Pick the correct reply.","chat":[["Ishaan","Will you finish the project today?"]],"options":["Yes, however long it takes.","Yes, however it takes long.","Yes, however long does it take."],"answer":0,"rule":"<b>however long<\/b> + subject + verb (it takes) = no matter how long."},{"qid":"c10-06-19","type":"change","level":2,"topic":"transitive_intransitive","prompt":"Change into active voice.","source":"The fly was carried by the ants.","options":["The ants carried the fly.","The ants carry the fly.","The ants carried by the fly."],"answer":0,"rule":"Keep the past tense: was carried becomes <b>carried<\/b>; the doer (the ants) becomes the subject."},{"qid":"c10-06-20","type":"change","level":2,"topic":"however_concession","prompt":"Join using 'although'.","source":"The spider's web is delicate. It is very strong.","options":["Although the spider's web is delicate, but it is very strong.","Although the spider's web is delicate, it are very strong.","Although the spider's web is delicate, it is very strong."],"answer":2,"rule":"Use <b>although<\/b> alone; never add but in the other half."},{"qid":"c10-06-21","type":"spot","level":3,"topic":"transitive_intransitive","prompt":"Which sentence is correct?","options":["We discussed the problem with our teacher.","We discussed about the problem with our teacher.","We discussed on the problem with our teacher."],"answer":0,"rule":"<b>discuss<\/b> is transitive: discuss something. No about or on after it."},{"qid":"c10-06-22","type":"spot","level":3,"topic":"conditionals","prompt":"Which sentence is correct?","options":["If we lived like the hibiscus, we will enjoy every day.","If we live like the hibiscus, we would enjoyed every day.","If we lived like the hibiscus, we would enjoy every day."],"answer":2,"rule":"Type 2: If + past (lived), <b>would<\/b> + base verb (would enjoy)."},{"qid":"c10-06-23","type":"fix","level":3,"topic":"transitive_intransitive","prompt":"One word is wrong. Find it and fix it.","words":["The","tired","traveller","laid","under","the","tree","for","an","hour."],"errors":[{"i":3,"options":["lain","laying","lay"],"answer":2}],"rule":"Rest flat = <b>lie<\/b>; its past is <b>lay<\/b>. Laid is the past of lay (put something down)."},{"qid":"c10-06-24","type":"fill","level":3,"topic":"transitive_intransitive","prompt":"Fill in the gap.","before":"We reached","after":"beach before sunset.","options":["at the","the","to the"],"answer":1,"rule":"<b>reach<\/b> is transitive: reach a place. No at or to after it."},{"qid":"c10-06-25","type":"fill","level":3,"topic":"abstract_nouns","prompt":"Fill in the gap.","before":"We were filled with","after":"at the sight of the majestic ocean.","options":["awful","awe","awesome"],"answer":1,"rule":"After <b>filled with<\/b> we need a noun: <b>awe<\/b> (great wonder). The others are adjectives."},{"qid":"c10-06-26","type":"build","level":3,"topic":"however_concession","prompt":"Put the words in order.","answer":["However","tiny","a","seed","is,","it","can","grow."],"alts":[["However","tiny","it","is,","a","seed","can","grow."]],"rule":"<b>However + adjective<\/b> + subject + verb, then the main clause."},{"qid":"c10-06-27","type":"chat","level":3,"topic":"conditionals","prompt":"Pick the correct reply.","chat":[["Papa","What would you do if you had a garden?"]],"options":["I will plant a neem tree in it.","I would plant a neem tree in it.","I would planted a neem tree in it."],"answer":1,"rule":"Answer an imaginary question with <b>would<\/b> + base verb: I would <b>plant<\/b>."},{"qid":"c10-06-28","type":"chat","level":3,"topic":"abstract_nouns","prompt":"Pick the correct reply.","chat":[["Sana","Why do you love the sea so much?"]],"options":["Its vast fills me with wonder.","Its vastness fills me with wonder.","Its vastly fills me with wonder."],"answer":1,"rule":"The subject after <b>Its<\/b> must be a noun: <b>vastness<\/b> (from the adjective vast)."},{"qid":"c10-06-29","type":"change","level":3,"topic":"conditionals","prompt":"Begin the sentence with 'If'.","source":"Water the plant, or it will wither.","options":["If you will not water the plant, it will wither.","If you do not water the plant, it would wither.","If you do not water the plant, it will wither."],"answer":2,"rule":"or = if not. Type 1: <b>If you do not water<\/b> ..., it <b>will<\/b> wither."},{"qid":"c10-06-30","type":"proof","level":3,"topic":"however_concession","prompt":"Find and fix the 2 errors in this message.","words":["The","tree","looked","dead","in","winter.","However,","when","spring","come","again,","it","was","back","to","its","green","majesty","and","full","of","flower","and","birds."],"errors":[{"i":9,"options":["coming","came","comes"],"answer":1},{"i":21,"options":["flowering","flowered","flowers"],"answer":2}],"rule":"Past story: when spring <b>came<\/b>. Full of ... and birds needs a plural noun: <b>flowers<\/b>."},{"qid":"c10-06-31","type":"spot","level":4,"topic":"conditionals","prompt":"Which sentence is correct?","options":["If the trees are cut down, the birds will lose their homes.","If the trees are cut down, the birds would lose their homes.","If the trees will be cut down, the birds will lose their homes."],"answer":0,"rule":"Type 1 with a passive: <b>If<\/b> + present (are cut down), <b>will<\/b> + base verb."},{"qid":"c10-06-32","type":"fix","level":4,"topic":"abstract_nouns","prompt":"One word is wrong. Find it and fix it.","words":["Pearls","are","a","symbol","of","beautiful","and","patience."],"errors":[{"i":5,"options":["beauty","beautifully","beautify"],"answer":0}],"rule":"After <b>of<\/b>, joined to the noun patience, we need a noun: <b>beauty<\/b>."},{"qid":"c10-06-33","type":"fix","level":4,"topic":"transitive_intransitive","prompt":"One word is wrong. Find it and fix it.","words":["The","river","has","rose","above","the","danger","mark."],"errors":[{"i":3,"options":["raised","risen","rising"],"answer":1}],"rule":"Present perfect = has + past participle. rise, rose, <b>risen<\/b>; raise needs an object."},{"qid":"c10-06-34","type":"fill","level":4,"topic":"however_concession","prompt":"Fill in the gap.","before":"","after":"the heavy rain, the farmers kept working.","options":["Although","Despite","However"],"answer":1,"rule":"<b>Despite<\/b> + noun (the heavy rain). Although needs a full clause."},{"qid":"c10-06-35","type":"build","level":4,"topic":"transitive_intransitive","prompt":"Put the words in order.","answer":["Our","garden","was","cleaned","by","the","students."],"alts":[],"rule":"Only a transitive verb (clean) can be passive: <b>was cleaned by<\/b> the students."},{"qid":"c10-06-36","type":"chat","level":4,"topic":"however_concession","prompt":"Pick the correct reply.","chat":[["Coach","We lost the match. Should we stop practising?"]],"options":["No. However it is hard, we must keep going.","No. However hard it is, we must kept going.","No. However hard it is, we must keep going."],"answer":2,"rule":"<b>However + adjective<\/b> + subject + verb; after must, use the base verb keep."},{"qid":"c10-06-37","type":"chat","level":4,"topic":"conditionals","prompt":"Pick the correct reply.","chat":[["Dev","What will you do if the bus doesn't come?"]],"options":["If it doesn't come, I will walk to school.","If it won't come, I will walk to school.","If it doesn't come, I would walked to school."],"answer":0,"rule":"Type 1: simple present in the <b>if<\/b> clause (doesn't come), <b>will<\/b> + base verb."},{"qid":"c10-06-38","type":"change","level":4,"topic":"transitive_intransitive","prompt":"Change into passive voice.","source":"Who planted this neem tree?","options":["By whom this neem tree was planted?","By whom was this neem tree planted?","By whom was this neem tree plant?"],"answer":1,"rule":"Who ...? becomes <b>By whom was<\/b> ... + past participle <b>planted<\/b>?"},{"qid":"c10-06-39","type":"change","level":4,"topic":"conditionals","prompt":"Rewrite using 'If'.","source":"We do not have wings, so we cannot fly like birds.","options":["If we had wings, we could fly like birds.","If we have wings, we could fly like birds.","If we had wings, we can fly like birds."],"answer":0,"rule":"Imaginary present (type 2): If + past (<b>had<\/b>), <b>could<\/b> + base verb."},{"qid":"c10-06-40","type":"proof","level":4,"topic":"transitive_intransitive","prompt":"Find and fix the 2 errors in this message.","words":["Every","fortnight,","a","big","bright","flower","blooms","on","our","hibiscus","plant.","It","rises","its","face","to","the","sun","all","day,","but","by","evening","its","petals","lays","on","the","ground."],"errors":[{"i":12,"options":["rising","risen","raises"],"answer":2},{"i":25,"options":["lie","laid","lain"],"answer":0}],"rule":"With an object (its face) use <b>raise<\/b>: it <b>raises<\/b>. Petals rest with no object: they <b>lie<\/b> on the ground."},{"qid":"c10-06-41","type":"spot","level":5,"topic":"conditionals","prompt":"Which sentence is correct?","options":["If we had protected the forest, the river will not have dried up.","If we would have protected the forest, the river would not have dried up.","If we had protected the forest, the river would not have dried up."],"answer":2,"rule":"Type 3 (past, unreal): If + <b>had<\/b> + past participle, <b>would have<\/b> + past participle."},{"qid":"c10-06-42","type":"fix","level":5,"topic":"however_concession","prompt":"One word is wrong. Find it and fix it.","words":["However","difficult","things","are","right","now,","they","will","not","remains","so","forever."],"errors":[{"i":9,"options":["remained","remain","remaining"],"answer":1}],"rule":"After <b>will not<\/b>, use the base verb: will not <b>remain<\/b>."},{"qid":"c10-06-43","type":"fill","level":5,"topic":"transitive_intransitive","prompt":"Fill in the gap.","before":"The old man","after":"his walking stick on the bench and sat down.","options":["laid","lay","lied","lain"],"answer":0,"rule":"Put something down = <b>lay<\/b> (transitive). Past tense, like sat: <b>laid<\/b>."},{"qid":"c10-06-44","type":"build","level":5,"topic":"conditionals","prompt":"Make a type 3 conditional that begins with Had.","answer":["Had","Ravi","known","about","the","storm,","he","would","have","stayed."],"alts":[],"rule":"<b>Had<\/b> + subject + past participle = If Ravi had known; then <b>would have<\/b> + past participle."},{"qid":"c10-06-45","type":"chat","level":5,"topic":"abstract_nouns","prompt":"Pick the correct reply.","chat":[["Teacher","What does the caterpillar teach us?"]],"options":["Its transformation teaches us that change can be beautiful.","Its transform teaches us that change can be beautiful.","Its transformation teach us that change can be beautifully."],"answer":0,"rule":"Subject noun: <b>transformation<\/b> (singular, so teaches). After can be, use the adjective beautiful."},{"qid":"c10-06-46","type":"change","level":5,"topic":"however_concession","prompt":"Rewrite using 'Despite'.","source":"Although the ants were small, they carried a huge fly.","options":["Despite of being small, the ants carried a huge fly.","Despite the ants were small, they carried a huge fly.","Despite being small, the ants carried a huge fly."],"answer":2,"rule":"<b>Despite<\/b> + noun or -ing (being small). Never despite of, never despite + full clause."},{"qid":"c10-06-47","type":"change","level":5,"topic":"conditionals","prompt":"Rewrite using 'If' (type 3 conditional).","source":"We did not water the plant, so it withered.","options":["If we watered the plant, it would not have withered.","If we had watered the plant, it would not have withered.","If we had watered the plant, it will not have withered."],"answer":1,"rule":"Past regret: If + <b>had watered<\/b>, <b>would not have withered<\/b>."},{"qid":"c10-06-48","type":"proof","level":5,"topic":"abstract_nouns","prompt":"Find and fix the 3 errors in this message.","words":["Spider","webs","looks","delicate,","yet","their","strong","is","amazing.","An","oyster","takes","in","a","grain","of","sand","and","slowly","turns","it","into","a","pearl","of","great","beautiful","and","value."],"errors":[{"i":2,"options":["looking","look","looker"],"answer":1},{"i":6,"options":["strongly","stronger","strength"],"answer":2},{"i":26,"options":["beauty","beautify","beautifully"],"answer":0}],"rule":"webs (plural) <b>look<\/b>; after their we need a noun: <b>strength<\/b>; of great ... and value needs a noun: <b>beauty<\/b>."},{"qid":"c10-06-49","type":"proof","level":5,"topic":"transitive_intransitive","prompt":"Find and fix the 3 errors in this message.","words":["If","we","had","planted","more","trees,","the","city","would","not","have","became","so","hot.","Every","summer,","the","temperature","raises","a","little","more.","We","must","act","before","it","is","too","lately","for","our","children."],"errors":[{"i":11,"options":["becoming","become","becomes"],"answer":1},{"i":18,"options":["rises","rising","raised"],"answer":0},{"i":29,"options":["later","latest","late"],"answer":2}],"rule":"would not have + past participle: <b>become<\/b>. Temperature goes up by itself: <b>rises<\/b>. too + adjective: too <b>late<\/b>."},{"qid":"c10-06-50","type":"proof","level":5,"topic":"abstract_nouns","prompt":"Find and fix the 3 errors in this message.","words":["However","small","an","act","of","kind","may","be,","it","never","dies.","One","hour","of","honest","effort","can","bring","happy","to","much","people."],"errors":[{"i":5,"options":["kindly","kinder","kindness"],"answer":2},{"i":18,"options":["happily","happiness","happier"],"answer":1},{"i":20,"options":["plenty","many","lot"],"answer":1}],"rule":"an act of <b>kindness<\/b> (noun); bring + noun: <b>happiness<\/b>; countable people takes <b>many<\/b>."}]},{"id":"07","num":"2.1","title":"Animals","unit":"Unit Two","topics":[{"tag":"wish_could","name":"'Wish' sentences, 'If only' and 'would rather'"},{"tag":"negative_inversion","name":"Inversion after never, seldom, hardly, not only"},{"tag":"comparison","name":"Degrees of comparison and 'the more ... the more'"},{"tag":"word_forms","name":"Word forms: adjective, adverb and noun"},{"tag":"affirm_negative","name":"Affirmative and negative sentences"}],"questions":[{"qid":"c10-07-01","type":"spot","level":1,"topic":"wish_could","prompt":"Which sentence is correct?","options":["I wish I can fly like an eagle.","I wish I could flew like an eagle.","I wish I could fly like an eagle."],"answer":2,"rule":"A wish about something impossible now takes <b>could + base verb<\/b>: I wish I could fly."},{"qid":"c10-07-02","type":"spot","level":1,"topic":"affirm_negative","prompt":"Which sentence is correct?","options":["Animals does not complain about their condition.","Animals do not complains about their condition.","Animals do not complain about their condition."],"answer":2,"rule":"Plural subject takes <b>do not<\/b>, and after do not the verb stays in the base form: complain."},{"qid":"c10-07-03","type":"fix","level":1,"topic":"affirm_negative","prompt":"One word is wrong. Find it and fix it.","words":["My","dog","does","not","sleeps","on","the","sofa","at","night."],"errors":[{"i":4,"options":["sleep","slept","sleeping"],"answer":0}],"rule":"After <b>does not<\/b>, use the base form of the verb: does not <b>sleep<\/b>."},{"qid":"c10-07-04","type":"fix","level":1,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["The","blue","whale","is","the","bigger","animal","in","the","world."],"errors":[{"i":5,"options":["big","more","biggest"],"answer":2}],"rule":"Comparing one with all others in a group (in the world) needs the superlative: <b>the biggest<\/b>."},{"qid":"c10-07-05","type":"fill","level":1,"topic":"wish_could","prompt":"Fill in the gap.","before":"I wish I","after":"a bird for just one day.","options":["were","am","will be"],"answer":0,"rule":"For an unreal wish about the present, use <b>were<\/b>: I wish I were a bird."},{"qid":"c10-07-06","type":"fill","level":1,"topic":"word_forms","prompt":"Fill in the gap.","before":"The old horse walked","after":"to the river.","options":["slowness","slowly","slows"],"answer":1,"rule":"To describe how someone walked, we need an adverb: <b>slowly<\/b>."},{"qid":"c10-07-07","type":"build","level":1,"topic":"affirm_negative","prompt":"Make a sentence.","answer":["Animals","never","complain","about","their","condition."],"alts":[],"rule":"<b>Never<\/b> goes before the main verb: Animals never complain."},{"qid":"c10-07-08","type":"chat","level":1,"topic":"wish_could","prompt":"Pick the correct reply.","chat":[["Kabir","Do you ever wish you were a bird?"]],"options":["Yes, I wish I could fly over the hills.","Yes, I wish I can flying over the hills.","Yes, I wishing I could fly over the hills."],"answer":0,"rule":"Use <b>I wish I could + base verb<\/b> for something you cannot do now."},{"qid":"c10-07-09","type":"change","level":1,"topic":"affirm_negative","prompt":"Change into a negative sentence without changing the meaning.","source":"Animals are content with what they have.","options":["Animals are not content with what they have.","Animals are not discontented with what they have.","Animals is not discontented with what they have."],"answer":1,"rule":"Add <b>not<\/b> and use the opposite word (content to <b>discontented<\/b>) so the meaning stays the same."},{"qid":"c10-07-10","type":"proof","level":1,"topic":"affirm_negative","prompt":"Find and fix the 2 errors in this paragraph.","words":["Our","dog","Bruno","do","not","lie","awake","at","night.","He","sleep","peacefully","in","his","basket","and","wakes","up","happy","every","morning."],"errors":[{"i":3,"options":["does","doing","done"],"answer":0},{"i":10,"options":["sleeps","sleeping","sleepy"],"answer":0}],"rule":"One dog (Bruno, he) takes singular forms: <b>does not lie<\/b> and <b>sleeps<\/b>."},{"qid":"c10-07-11","type":"spot","level":2,"topic":"negative_inversion","prompt":"Which sentence is correct?","options":["Seldom our cat leaves the garden.","Seldom does our cat leaves the garden.","Seldom does our cat leave the garden."],"answer":2,"rule":"After <b>Seldom<\/b> at the start, use question order: <b>does + subject + base verb<\/b>."},{"qid":"c10-07-12","type":"spot","level":2,"topic":"comparison","prompt":"Which sentence is correct?","options":["The more you feed the cat, the lazier it gets.","The more you feed the cat, the lazy it gets.","More you feed the cat, the lazier it gets."],"answer":0,"rule":"The pattern is <b>the + comparative ..., the + comparative<\/b>: the more ..., the lazier."},{"qid":"c10-07-13","type":"fix","level":2,"topic":"word_forms","prompt":"One word is wrong. Find it and fix it.","words":["Meera","watched","the","deer","very","careful","from","behind","the","bushes."],"errors":[{"i":5,"options":["care","carefully","carefulness"],"answer":1}],"rule":"To say <b>how<\/b> she watched, use an adverb: very <b>carefully<\/b>."},{"qid":"c10-07-14","type":"fix","level":2,"topic":"wish_could","prompt":"One word is wrong. Find it and fix it.","words":["Neha","wishes","she","has","seen","the","tigers","yesterday."],"errors":[{"i":3,"options":["have","having","had"],"answer":2}],"rule":"A wish about the past takes the past perfect: wishes she <b>had seen<\/b>."},{"qid":"c10-07-15","type":"fill","level":2,"topic":"negative_inversion","prompt":"Fill in the gap.","before":"Not only","after":"the dog guard the house, but it also plays with the children.","options":["does","do","is"],"answer":0,"rule":"After <b>Not only<\/b> at the start, use question order; the dog is singular, so <b>does<\/b>."},{"qid":"c10-07-16","type":"build","level":2,"topic":"wish_could","prompt":"Make a wish sentence.","answer":["Kabir","wishes","he","could","swim","like","a","fish."],"alts":[],"rule":"<b>wishes + he could + base verb<\/b> expresses a wish about the present."},{"qid":"c10-07-17","type":"chat","level":2,"topic":"comparison","prompt":"Pick the correct reply.","chat":[["Dad","Which is faster, the cheetah or the horse?"]],"options":["The cheetah is more faster than the horse.","The cheetah is fastest than the horse.","The cheetah is faster than the horse."],"answer":2,"rule":"Comparing two things: <b>faster than<\/b>. Never use more with -er."},{"qid":"c10-07-18","type":"chat","level":2,"topic":"affirm_negative","prompt":"Pick the correct reply.","chat":[["Teacher","Do cats complain about their food?"]],"options":["No, they doesn't complain about it.","No, they don't complain about it.","No, they don't complains about it."],"answer":1,"rule":"<b>They<\/b> takes don't, and after don't use the base verb: don't <b>complain<\/b>."},{"qid":"c10-07-19","type":"change","level":2,"topic":"comparison","prompt":"Change into the comparative degree.","source":"The cheetah is the fastest land animal.","options":["The cheetah is faster than any land animal.","The cheetah is fast than any other land animal.","The cheetah is faster than any other land animal."],"answer":2,"rule":"Superlative to comparative: <b>faster than any other<\/b>. 'Other' is needed because the cheetah is itself a land animal."},{"qid":"c10-07-20","type":"proof","level":2,"topic":"affirm_negative","prompt":"Find and fix the 2 errors in this paragraph.","words":["The","animals","in","the","forest","are","very","placid.","Not","one","of","them","are","unhappy.","They","never","whines","about","their","condition."],"errors":[{"i":12,"options":["were","is","be"],"answer":1},{"i":16,"options":["whine","whiny","whining"],"answer":0}],"rule":"<b>Not one of them<\/b> is singular: is. <b>They<\/b> takes the plain verb: never whine."},{"qid":"c10-07-21","type":"spot","level":3,"topic":"word_forms","prompt":"Which sentence is correct?","options":["Their simple is a lesson for all of us.","Their simplicity is a lesson for all of us.","Their simply is a lesson for all of us."],"answer":1,"rule":"After <b>their<\/b>, as the subject, we need a noun: <b>simplicity<\/b>."},{"qid":"c10-07-22","type":"fix","level":3,"topic":"negative_inversion","prompt":"One word is wrong. Find it and fix it.","words":["Seldom","do","a","cat","sleep","out","in","the","rain."],"errors":[{"i":1,"options":["doing","does","is"],"answer":1}],"rule":"After <b>Seldom<\/b>, use question order. <b>A cat<\/b> is singular, so: Seldom <b>does<\/b> a cat sleep."},{"qid":"c10-07-23","type":"fill","level":3,"topic":"comparison","prompt":"Fill in the gap.","before":"The more we own, the","after":"we worry.","options":["more","most","much"],"answer":0,"rule":"Both halves need a comparative: <b>the more ..., the more<\/b>."},{"qid":"c10-07-24","type":"fill","level":3,"topic":"wish_could","prompt":"Fill in the gap.","before":"If only I","after":"as placid as my cat!","options":["am","were","be"],"answer":1,"rule":"<b>If only<\/b> works like wish: for an unreal present, use <b>were<\/b>."},{"qid":"c10-07-25","type":"build","level":3,"topic":"negative_inversion","prompt":"Make a sentence that begins with 'Not once'.","answer":["Not","once","did","the","old","horse","complain."],"alts":[],"rule":"After <b>Not once<\/b>, use question order: <b>did + subject + base verb<\/b>."},{"qid":"c10-07-26","type":"chat","level":3,"topic":"negative_inversion","prompt":"Pick the correct reply.","chat":[["Anaya","Have you ever seen a white tiger?"]],"options":["No, never I have seen one.","No, never have I saw one.","No, never have I seen one."],"answer":2,"rule":"With <b>never<\/b> first, the helper comes before the subject: <b>never have I seen<\/b>."},{"qid":"c10-07-27","type":"chat","level":3,"topic":"word_forms","prompt":"Pick the correct reply.","chat":[["Mom","How did the puppy behave at the vet's?"]],"options":["He behaved very calmly.","He behaved very calm.","He behaved very calmness."],"answer":0,"rule":"<b>Behaved<\/b> is an action verb, so describe it with an adverb: <b>calmly<\/b>."},{"qid":"c10-07-28","type":"change","level":3,"topic":"affirm_negative","prompt":"Change into an affirmative sentence without changing the meaning.","source":"Not one animal is dissatisfied.","options":["Every animal are satisfied.","Every animals is satisfied.","Every animal is satisfied."],"answer":2,"rule":"<b>Not one ... dissatisfied<\/b> = <b>Every ... satisfied<\/b>. Every takes a singular noun and verb."},{"qid":"c10-07-29","type":"change","level":3,"topic":"negative_inversion","prompt":"Begin the sentence with 'Never'.","source":"I have never seen such a peaceful horse.","options":["Never I have seen such a peaceful horse.","Never had I seen such a peaceful horse.","Never have I seen such a peaceful horse."],"answer":2,"rule":"Move <b>never<\/b> to the front and invert: <b>Never have I seen<\/b>. Keep the tense (have, not had)."},{"qid":"c10-07-30","type":"proof","level":3,"topic":"wish_could","prompt":"Find and fix the 3 errors in this paragraph.","words":["Dev","wishes","he","has","visited","the","farm","last","summer.","The","cows","there","are","calm","and","never","complains","about","their","food.","Not","one","of","them","lie","awake","at","night."],"errors":[{"i":3,"options":["had","have","having"],"answer":0},{"i":16,"options":["complain","complaining","complaint"],"answer":0},{"i":24,"options":["lying","lain","lies"],"answer":2}],"rule":"Past wish: <b>had visited<\/b>. The cows (plural): <b>complain<\/b>. Not one of them (singular): <b>lies<\/b>."},{"qid":"c10-07-31","type":"spot","level":4,"topic":"affirm_negative","prompt":"Pick the sentence with the correct question tag.","options":["Animals do not lie awake at night, don't they?","Animals do not lie awake at night, do they?","Animals do not lie awake at night, does they?"],"answer":1,"rule":"A negative sentence takes a positive tag. Animals = they, so: <b>do they?<\/b>"},{"qid":"c10-07-32","type":"spot","level":4,"topic":"comparison","prompt":"Which sentence is correct?","options":["No other animal is loved as more as the dog.","No other animal is loved as much as the dog.","No other animal are loved as much as the dog."],"answer":1,"rule":"Positive degree: <b>as much as<\/b>. No other animal is singular, so <b>is loved<\/b>."},{"qid":"c10-07-33","type":"fix","level":4,"topic":"negative_inversion","prompt":"One word is wrong. Find it and fix it.","words":["Hardly","had","the","cat","seen","the","mouse","when","it","jump","off","the","wall."],"errors":[{"i":9,"options":["jumped","jumps","jumping"],"answer":0}],"rule":"<b>Hardly had ... when<\/b> is followed by the simple past: when it <b>jumped<\/b>."},{"qid":"c10-07-34","type":"fill","level":4,"topic":"word_forms","prompt":"Fill in the gap.","before":"The farmer's horses are","after":"looked after by his sons.","options":["careful","care","carefully"],"answer":2,"rule":"The passive verb <b>are looked after<\/b> is described by an adverb: are <b>carefully<\/b> looked after."},{"qid":"c10-07-35","type":"fill","level":4,"topic":"wish_could","prompt":"Fill in the gap.","before":"Grandpa wishes he","after":"kept a dog when he was young.","options":["has","have","had"],"answer":2,"rule":"A wish about the past (when he was young) uses the past perfect: <b>had kept<\/b>."},{"qid":"c10-07-36","type":"build","level":4,"topic":"affirm_negative","prompt":"Make a sentence with a question tag.","answer":["Your","cat","doesn't","like","milk,","does","it?"],"alts":[],"rule":"Negative statement + positive tag: <b>doesn't like ..., does it?<\/b>"},{"qid":"c10-07-37","type":"chat","level":4,"topic":"comparison","prompt":"Pick the correct reply.","chat":[["Teacher","Is a tortoise as fast as a rabbit?"]],"options":["No, a tortoise is not as fast as a rabbit.","No, a tortoise is not as faster as a rabbit.","No, a tortoise is not so fast than a rabbit."],"answer":0,"rule":"Positive degree uses the plain adjective: <b>not as fast as<\/b>. Never as ... than."},{"qid":"c10-07-38","type":"change","level":4,"topic":"comparison","prompt":"Change into the positive degree.","source":"The elephant is stronger than the horse.","options":["The horse is not as strong as the elephant.","The horse is not as stronger as the elephant.","The elephant is not as strong as the horse."],"answer":0,"rule":"Start with the weaker one: <b>The horse is not as strong as<\/b> the elephant. The meaning stays the same."},{"qid":"c10-07-39","type":"change","level":4,"topic":"affirm_negative","prompt":"Change into passive voice.","source":"Our dog does not bite strangers.","options":["Strangers are not bit by our dog.","Strangers are not bitten by our dog.","Strangers is not bitten by our dog."],"answer":1,"rule":"Simple present passive: <b>are not + past participle<\/b> (bitten). Strangers is plural: are."},{"qid":"c10-07-40","type":"proof","level":4,"topic":"comparison","prompt":"Find and fix the 3 errors in this paragraph.","words":["The","more","time","Leena","spends","with","her","rabbits,","the","most","she","loves","them.","She","wishes","she","could","keeps","one","in","her","school","bag!","Not","one","of","her","rabbits","have","ever","bitten","her."],"errors":[{"i":9,"options":["much","more","mostly"],"answer":1},{"i":17,"options":["keep","kept","keeping"],"answer":0},{"i":28,"options":["having","are","has"],"answer":2}],"rule":"The more ..., the <b>more<\/b>. After could, base verb: <b>keep<\/b>. Not one of her rabbits is singular: <b>has<\/b>."},{"qid":"c10-07-41","type":"spot","level":5,"topic":"negative_inversion","prompt":"Which sentence is correct?","options":["Not only the dog guards the house, but it also brings in the newspaper.","Not only does the dog guards the house, but it also brings in the newspaper.","Not only does the dog guard the house, but it also brings in the newspaper."],"answer":2,"rule":"<b>Not only<\/b> at the start needs inversion: <b>does the dog guard<\/b> (base verb after does)."},{"qid":"c10-07-42","type":"fix","level":5,"topic":"word_forms","prompt":"One word is wrong. Find it and fix it.","words":["Her","patience","and","gentle","with","the","injured","deer","impressed","the","forest","officer."],"errors":[{"i":3,"options":["gently","gentleness","gentler"],"answer":1}],"rule":"<b>and<\/b> joins two nouns of the same kind: patience and <b>gentleness<\/b>."},{"qid":"c10-07-43","type":"fix","level":5,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["This","is","one","of","the","most","loyal","dog","I","have","ever","owned."],"errors":[{"i":7,"options":["dog's","dogs","doggie"],"answer":1}],"rule":"<b>One of the most ...<\/b> is always followed by a plural noun: dogs."},{"qid":"c10-07-44","type":"fill","level":5,"topic":"negative_inversion","prompt":"Fill in the gap.","before":"No sooner had the cat seen the dog","after":"it climbed the tree.","options":["when","then","than"],"answer":2,"rule":"<b>No sooner<\/b> is always paired with <b>than<\/b> (hardly goes with when)."},{"qid":"c10-07-45","type":"build","level":5,"topic":"negative_inversion","prompt":"Make a sentence that begins with 'Seldom'.","answer":["Seldom","have","I","met","a","more","contented","creature."],"alts":[],"rule":"After <b>Seldom<\/b>, invert: <b>have I met<\/b>. A more + adjective comes before the noun."},{"qid":"c10-07-46","type":"chat","level":5,"topic":"wish_could","prompt":"Pick the correct reply.","chat":[["Nikhil","Would you rather be a bird or a fish?"]],"options":["I would rather to be a bird than a fish.","I would rather being a bird than a fish.","I would rather be a bird than a fish."],"answer":2,"rule":"<b>Would rather<\/b> is followed by the base verb without to: would rather <b>be<\/b>."},{"qid":"c10-07-47","type":"chat","level":5,"topic":"affirm_negative","prompt":"Pick the correct reply.","chat":[["Asha","Didn't the dog bark at the postman today?"]],"options":["No, it didn't barked at him at all.","No, it doesn't barked at him at all.","No, it didn't bark at him at all."],"answer":2,"rule":"Past negative: <b>didn't + base verb<\/b> (bark), never didn't barked."},{"qid":"c10-07-48","type":"change","level":5,"topic":"affirm_negative","prompt":"Rewrite using 'None but'.","source":"Only a patient person can tame a horse.","options":["None but a patient person cannot tame a horse.","None but a patient person can tame a horse.","None but a patient person can tames a horse."],"answer":1,"rule":"<b>Only<\/b> becomes <b>None but<\/b>; the verb stays positive: can tame."},{"qid":"c10-07-49","type":"change","level":5,"topic":"comparison","prompt":"Change into the superlative degree.","source":"Very few animals are as loyal as the dog.","options":["The dog is the most loyal animal.","The dog is one of the most loyal animals.","The dog is one of the most loyal animal."],"answer":1,"rule":"<b>Very few ... as ... as<\/b> becomes <b>one of the most ... + plural noun<\/b>, not simply the most."},{"qid":"c10-07-50","type":"proof","level":5,"topic":"negative_inversion","prompt":"Find and fix the 3 errors in this paragraph.","words":["Not","only","does","animals","stay","placid,","but","they","also","never","complains","about","their","condition.","The","longer","I","watch","them,","the","most","peaceful","I","feel."],"errors":[{"i":2,"options":["doing","are","do"],"answer":2},{"i":10,"options":["complaining","complain","complaint"],"answer":1},{"i":20,"options":["more","much","mostly"],"answer":0}],"rule":"Animals is plural: Not only <b>do<\/b> animals. They <b>complain<\/b>. The longer ..., the <b>more<\/b> peaceful."}]},{"id":"08","num":"2.2","title":"Three Questions","unit":"Unit Two","topics":[{"tag":"polite_requests","name":"Polite requests, offers and responses"},{"tag":"non_finite","name":"Finite and non-finite verbs (infinitive, gerund, participle)"},{"tag":"conditional_3","name":"Third conditional and 'Had ...' inversion"},{"tag":"reported_questions","name":"Reported questions and requests"},{"tag":"modals","name":"Modal meanings (ability, permission, obligation, advice)"}],"questions":[{"qid":"c10-08-01","type":"spot","level":1,"topic":"polite_requests","prompt":"Which request is correct?","options":["Would you mind to close the window?","Would you mind closing the window?","Would you mind close the window?"],"answer":1,"rule":"<b>Would you mind<\/b> is followed by the -ing form: mind <b>closing<\/b>."},{"qid":"c10-08-02","type":"spot","level":1,"topic":"non_finite","prompt":"Which sentence is correct?","options":["The sun began to sink behind the trees.","The sun began to sank behind the trees.","The sun began sink behind the trees."],"answer":0,"rule":"<b>began<\/b> is followed by the infinitive: <b>to sink<\/b> (to + base verb)."},{"qid":"c10-08-03","type":"fix","level":1,"topic":"conditional_3","prompt":"One word is wrong. Find it and fix it.","words":["If","the","king","had","left","early,","his","enemy","would","have","kill","him."],"errors":[{"i":10,"options":["killed","kills","killing"],"answer":0}],"rule":"Third conditional: <b>would have + past participle<\/b> (killed)."},{"qid":"c10-08-04","type":"fix","level":1,"topic":"reported_questions","prompt":"One word is wrong. Find it and fix it.","words":["The","hermit","asked","the","king","to","give","he","the","spade."],"errors":[{"i":7,"options":["him","his","they"],"answer":0}],"rule":"After the verb <b>give<\ e hut, he would have been killed on his way back.","If the king had not stayed at the hut, he would had been killed on his way back."],"answer":0,"rule":"<b>Had + subject + not + past participle<\/b>, then <b>would have been + past participle<\/b>."},{"qid":"c10-08-42","type":"fix","level":5,"topic":"non_finite","prompt":"One word is wrong. Find it and fix it.","words":["The","wounded","man","lay","in","the","hut","with","his","eyes","close","for","hours."],"errors":[{"i":10,"options":["closes","closed","closure"],"answer":1}],"rule":"<b>with + noun + past participle<\/b> describes a state: with his eyes <b>closed<\/b>."},{"qid":"c10-08-43","type":"fix","level":5,"topic":"modals","prompt":"One word is wrong. Find it and fix it.","words":["You","had","better","rests","before","you","dig","the","next","bed."],"errors":[{"i":3,"options":["rested","resting","rest"],"answer":2}],"rule":"<b>had better<\/b> (strong advice) is followed by the base verb: had better <b>rest<\/b>."},{"qid":"c10-08-44","type":"fill","level":5,"topic":"reported_questions","prompt":"Fill in the gap.","before":"The hermit asked the king whether he","after":"seen the bearded man before.","options":["had","has","have"],"answer":0,"rule":"After a past reporting verb, have seen moves back to <b>had seen<\/b>."},{"qid":"c10-08-45","type":"build","level":5,"topic":"non_finite","prompt":"Make a sentence that begins with a participle.","answer":["Having","forgiven","his","enemy,","King","Arjun","felt","peaceful."],"alts":[],"rule":"<b>Having + past participle<\/b> shows the first action; its doer (King Arjun) comes right after the comma."},{"qid":"c10-08-46","type":"chat","level":5,"topic":"polite_requests","prompt":"Pick the correct reply.","chat":[["Vikram","Is it all right if I use your bike this evening?"]],"options":["I'm sorry, but I needs it myself this evening.","I'm sorry, but I need it myself this evening.","I'm sorry, but I am need it myself this evening."],"answer":1,"rule":"A polite refusal: f I had <b>known<\/b> (past participle)."}]},{"id":"09","num":"2.3","title":"Connecting the Dots","unit":"Unit Two","topics":[{"tag":"contractions","name":"Contractions (didn't, won't, I'd, needn't)"},{"tag":"tenses","name":"Tenses: naming and changing (time and aspect)"},{"tag":"phrasal_verbs","name":"Phrasal verbs and idioms (drop out, let down, drown out)"},{"tag":"imperatives_voice","name":"Imperatives and their passive voice"}],"questions":[{"qid":"c10-09-01","type":"spot","level":1,"topic":"contractions","prompt":"Which sentence is correct?","options":["Jobs didn't have a dorm room.","Jobs didn't had a dorm room.","Jobs don't had a dorm room."],"answer":0,"rule":"<b>didn't<\/b> = did not, and it is followed by the base verb: didn't <b>have<\/b>."},{"qid":"c10-09-02","type":"spot","level":1,"topic":"tenses","prompt":"Pick the sentence with the correct tense.","options":["Steve Jobs starts Apple when he was twenty.","Steve Jobs started Apple when he is twenty.","Steve Jobs started Apple when he was twenty."],"answer":2,"rule":"Both actions are finished in the past: <b>started<\/b> ... when he <b>was<\/b> twenty."},{"qid":"c10-09-03","type":"fix","level":1,"topic":"phrasal_verbs","prompt":"One word is wrong. Find it and fix it.","words":["Please","don't","lets","me","down","this","time,","Rohan."],"errors":[{"i":2,"options":["let","letting","to"],"answer":0}],"rule":"After <b>don't<\/b>, use the base verb: don't <b>let<\/b> me down (let someone down = disappoint)."},{"qid":"c10-09-04","type":"fix","level":1,"topic":"contractions","prompt":"One word is wrong. Find it and fix it.","words":["Jobs","and","Woz","doesn't","have","much","money","in","1976."],"errors":[{"i":3,"options":["don't","didn't","wasn't"],"answer":1}],"rule":"Two people (plural) and a past year (in 1976): <b>didn't<\/b> have."},{"qid":"c10-09-05","type":"fill","level":1,"topic":"tenses","prompt":"Fill in the gap.","before":"As a student, Jobs","after":"seven miles every Sunday for a good meal.","options":["walk","walked","walking"],"answer":1,"rule":"A past habit (as a student) in the simple past: Jobs <b>walked<\/b>."},{"qid":"c10-09-06","type":"fill","level":1,"topic":"contractions","prompt":"Fill in the gap.","before":"I","after":"go to the party; I have an exam tomorrow.","options":["can't","doesn't","isn't"],"answer":0,"rule":"<b>can't<\/b> = cannot, and it is followed by the base verb go."},{"qid":"c10-09-07","type":"build","level":1,"topic":"imperatives_voice","prompt":"Make a piece of advice.","answer":["Don't","lose","faith","in","yourself."],"alts":[],"rule":"A negative imperative: <b>Don't + base verb<\/b>."},{"qid":"c10-09-08","type":"chat","level":1,"topic":"contractions","prompt":"Pick the correct reply.","chat":[["Kiran","Are you coming to the computer club?"]],"options":["Yes, I'm come after lunch.","Yes, I'm coming after lunch.","Yes, I'll coming after lunch."],"answer":1,"rule":"<b>I'm<\/b> = I am, so add the -ing form: I'm <b>coming<\/b>."},{"qid":"c10-09-09","type":"change","level":1,"topic":"imperatives_voice","prompt":"Change into passive voice.","source":"Close the door.","options":["Let the door be closed.","Let the door is closed.","Let the door be close."],"answer":0,"rule":"Imperative to passive: <b>Let + object + be + past participle<\/b>."},{"qid":"c10-09-10","type":"proof","level":1,"topic":"tenses","prompt":"Find and fix the 2 errors in this paragraph.","words":["Jobs","didn't","have","a","room,","so","he","had","to","sleeps","on","the","floor.","Every","Sunday,","he","walked","seven","miles","to","gets","one","good","meal."],"errors":[{"i":9,"options":["slept","sleeping","sleep"],"answer":2},{"i":20,"options":["got","get","getting"],"answer":1}],"rule":"After <b>to<\/b>, always use the base verb: had to <b>sleep<\/b>, to <b>get<\/b>."},{"qid":"c10-09-11","type":"spot","level":2,"topic":"tenses","prompt":"Pick the sentence with the correct tense.","options":["I have never be so close to death.","I has never been so close to death.","I have never been so close to death."],"answer":2,"rule":"Present perfect: <b>have + past participle<\/b> (been). With I, use have."},{"qid":"c10-09-12","type":"spot","level":2,"topic":"imperatives_voice","prompt":"Which passive sentence is correct?","options":["Let the work is done at once.","Let the work be done at once.","Let the work be did at once."],"answer":1,"rule":"Passive imperative: <b>Let + object + be + past participle<\/b> (done)."},{"qid":"c10-09-13","type":"fix","level":2,"topic":"tenses","prompt":"One word is wrong. Find it and fix it.","words":["Woz","and","Jobs","was","building","computers","in","a","garage."],"errors":[{"i":3,"options":["is","were","be"],"answer":1}],"rule":"Two people joined by <b>and<\/b> make a plural subject: Woz and Jobs <b>were<\/b> building."},{"qid":"c10-09-14","type":"fix","level":2,"topic":"phrasal_verbs","prompt":"One word is wrong. Find it and fix it.","words":["I","look","forward","to","hear","from","you","soon."],"errors":[{"i":4,"options":["heard","hears","hearing"],"answer":2}],"rule":"In <b>look forward to<\/b>, 'to' is a preposition, so use the -ing form: to <b>hearing<\/b>."},{"qid":"c10-09-15","type":"fill","level":2,"topic":"phrasal_verbs","prompt":"Fill in the gap.","before":"Jobs dropped","after":"of college after six months.","options":["off","down","out"],"answer":2,"rule":"<b>drop out of<\/b> means to leave a school or course before finishing."},{"qid":"c10-09-16","type":"build","level":2,"topic":"tenses","prompt":"Make a sentence in the past perfect.","answer":["I","had","finished","my","homework","before","dinner."],"alts":[],"rule":"Past perfect: <b>had + past participle<\/b> for an action done before a past time."},{"qid":"c10-09-17","type":"chat","level":2,"topic":"imperatives_voice","prompt":"Pick the correct reply.","chat":[["Grandpa","I failed my first driving test."]],"options":["Don't give up, Grandpa. Try again!","Don't gives up, Grandpa. Try again!","Don't giving up, Grandpa. Try again!"],"answer":0,"rule":"Negative imperative: <b>Don't + base verb<\/b>: Don't <b>give<\/b> up."},{"qid":"c10-09-18","type":"chat","level":2,"topic":"tenses","prompt":"Pick the correct reply.","chat":[["Sara","What were you doing at six yesterday?"]],"options":["I was practising calligraphy.","I am practising calligraphy.","I were practising calligraphy."],"answer":0,"rule":"A past continuous question needs a past continuous answer: I <b>was practising<\/b>."},{"qid":"c10-09-19","type":"change","level":2,"topic":"tenses","prompt":"Change into the present perfect tense.","source":"I lost my phone.","options":["I have lose my phone.","I had lost my phone.","I have lost my phone."],"answer":2,"rule":"Present perfect: <b>have + past participle<\/b> (lost). Had lost is the past perfect."},{"qid":"c10-09-20","type":"proof","level":2,"topic":"contractions","prompt":"Find and fix the 2 errors in this message.","words":["Neha","can't","comes","today","because","she","isn't","feeling","well.","She","won't","be","able","to","finishes","her","project","either."],"errors":[{"i":2,"options":["come","came","coming"],"answer":0},{"i":14,"options":["finished","finish","finishing"],"answer":1}],"rule":"<b>can't<\/b> (cannot) takes the base verb: come. After <b>to<\/b>, use the base verb: finish."},{"qid":"c10-09-21","type":"spot","level":3,"topic":"contractions","prompt":"Which sentence is correct?","options":["I'd better to leave now.","I'd better leaving now.","I'd better leave now."],"answer":2,"rule":"<b>I'd better<\/b> = I had better, followed by the base verb without to: leave."},{"qid":"c10-09-22","type":"fix","level":3,"topic":"tenses","prompt":"One word is wrong. Find it and fix it.","words":["She","has","been","learn","calligraphy","for","two","years."],"errors":[{"i":3,"options":["learnt","learning","learns"],"answer":1}],"rule":"Present perfect continuous: <b>has been + -ing<\/b>: has been <b>learning<\/b>."},{"qid":"c10-09-23","type":"fill","level":3,"topic":"tenses","prompt":"Fill in the gap.","before":"By next June, Arjun","after":"his engineering course.","options":["will have finished","will finished","has finish"],"answer":0,"rule":"<b>By<\/b> + a future time takes the future perfect: <b>will have finished<\/b>."},{"qid":"c10-09-24","type":"fill","level":3,"topic":"imperatives_voice","prompt":"Fill in the gap.","before":"","after":"the instructions be followed carefully.","options":["Let","Do","Please"],"answer":0,"rule":"The passive of an order begins with <b>Let<\/b>: Let + object + be + past participle."},{"qid":"c10-09-25","type":"build","level":3,"topic":"phrasal_verbs","prompt":"Make a piece of advice.","answer":["Never","let","your","friends","down."],"alts":[],"rule":"<b>let someone down<\/b> = disappoint them; the object goes between let and down."},{"qid":"c10-09-26","type":"chat","level":3,"topic":"contractions","prompt":"Pick the correct reply.","chat":[["Mom","Will you be home for dinner?"]],"options":["No, I don't. I'm staying at Asha's.","No, I won't. I'm stayed at Asha's.","No, I won't. I'm staying at Asha's."],"answer":2,"rule":"Answer a <b>will<\/b> question with <b>won't<\/b> (will not). I'm + -ing: I'm staying."},{"qid":"c10-09-27","type":"chat","level":3,"topic":"phrasal_verbs","prompt":"Pick the correct reply.","chat":[["Coach","Why did Aman leave the team?"]],"options":["He drops out because of his exams.","He dropped out because of his exams.","He dropped out because his exams."],"answer":1,"rule":"Past question, past answer: <b>dropped out<\/b>. Before a noun, use <b>because of<\/b>."},{"qid":"c10-09-28","type":"change","level":3,"topic":"imperatives_voice","prompt":"Change into passive voice.","source":"Follow your heart.","options":["Let your heart is followed.","Let your heart be followed.","Let your heart be follow."],"answer":1,"rule":"Imperative to passive: <b>Let your heart be followed.<\/b>"},{"qid":"c10-09-29","type":"change","level":3,"topic":"tenses","prompt":"Change into the past perfect tens
