perfect","prompt":"Fill in the gap.","before":"Smita","after":"her plan by the time the concert ended.","options":["has already made","had already made","already had make"],"answer":1,"rule":"<b>by the time<\/b> + past: the earlier action takes the past perfect: <b>had already made<\/b>."},{"qid":"c10-18-44","type":"build","level":5,"topic":"modals","prompt":"Put the words in order.","answer":["You","needn't","have","bought","the","tickets","so","early."],"alts":[],"rule":"<b>needn't have<\/b> + past participle = you did it, but it was not necessary."},{"qid":"c10-18-45","type":"chat","level":5,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Mother","What did Smita say to Panditji?"]],"options":["She asked him if he would come and play for her brother.","She asked him if he will come and play for my brother.","She asked him would he come and play for her brother."],"answer":0,"rule":"Reported question: <b>if<\/b> + statement order; will -> <b>would<\/b>; my -> her."},{"qid":"c10-18-46","type":"change","level":5,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Smita said, \"I spoke to him and he will come tomorrow morning.\"","options":["Smita said that she had spoken to him and he will come the next morning.","Smita said that I had spoken to him and he would come the next morning.","Smita said that she had spoken to him and he would come the next morning."],"answer":2,"rule":"spoke -> <b>had spoken<\/b>, will -> <b>would<\/b>, I -> <b>she<\/b>, tomorrow -> <b>the next<\/b> morning."},{"qid":"c10-18-47","type":"change","level":5,"topic":"past_perfect","prompt":"Use 'No sooner ... than'.","source":"As soon as the concert ended, the audience stood up.","options":["No sooner did the concert ended than the audience stood up.","No sooner had the concert ended when the audience stood up.","No sooner had the concert ended than the audience stood up."],"answer":2,"rule":"<b>No sooner had<\/b> + subject + past participle ... <b>than<\/b> + simple past."},{"qid":"c10-18-48","type":"proof","level":5,"topic":"reported_speech","prompt":"Find and fix the 3 errors in this message.","words":["Mother","said","that","Smita","must","go","to","the","concert.","Smita","refused","because","she","had","always","did","things","with","Anant,","and","she","told","that","she","would","not","enjoyed","it","alone."],"errors":[{"i":15,"options":["done","doing","does"],"answer":0},{"i":21,"options":["talked","spoke","said"],"answer":2},{"i":26,"options":["enjoying","enjoy","enjoys"],"answer":1}],"rule":"had + past participle: had <b>done<\/b>; 'told' needs a person, so <b>said<\/b> that; would + base verb: <b>enjoy<\/b>."},{"qid":"c10-18-49","type":"proof","level":5,"topic":"adj_adverb","prompt":"Find and fix the 3 errors in this message.","words":["Panditji","smiled","kind","at","the","girl.","'We","must","plays","for","the","boy","tomorrow,'","he","said,","and","Ustad","Sahib","nodded","happy","in","reply."],"errors":[{"i":2,"options":["kindly","kindness","kindest"],"answer":0},{"i":8,"options":["played","play","playing"],"answer":1},{"i":19,"options":["happiness","happiest","happily"],"answer":2}],"rule":"How he smiled / nodded -> adverbs <b>kindly<\/b>, <b>happily<\/b>; must + base verb: must <b>play<\/b>."},{"qid":"c10-18-50","type":"proof","level":5,"topic":"reported_speech","prompt":"Find and fix the 3 errors in this message.","words":["Anant","asked","his","sister","whether","she","had","hear","the","maestro.","Smita","replied","that","she","has","met","him","and","that","he","would","came","the","next","morning."],"errors":[{"i":7,"options":["hearing","hears","heard"],"answer":2},{"i":14,"options":["have","had","was"],"answer":1},{"i":21,"options":["come","coming","comes"],"answer":0}],"rule":"had <b>heard<\/b>; after replied (past), has met -> <b>had<\/b> met; would + base verb: <b>come<\/b>."}]},{"id":"19","num":"4.1","title":"A Thing of Beauty is a Joy For Ever","unit":"Unit Four","topics":[{"tag":"exclamatory","name":"Exclamatory and assertive sentences"},{"tag":"inversion","name":"Inversion after never, seldom, rarely, not only, hardly"},{"tag":"contrast","name":"Although / in spite of / despite"},{"tag":"relative","name":"Relative clauses (who, which, that, whose)"},{"tag":"comparison","name":"Degrees of comparison"}],"questions":[{"qid":"c10-19-01","type":"spot","level":1,"topic":"comparison","prompt":"Which sentence is correct?","options":["The sunset was more lovelier than the sunrise.","The sunset was lovelier than the sunrise.","The sunset was loveliest than the sunrise."],"answer":1,"rule":"Comparing two things: use the comparative <b>lovelier<\/b> + <b>than<\/b>. Never add <b>more<\/b> to an -er word."},{"qid":"c10-19-02","type":"spot","level":1,"topic":"relative","prompt":"Which sentence is correct?","options":["The daffodils which grow by the stream are yellow.","The daffodils who grow by the stream are yellow.","The daffodils which grows by the stream are yellow."],"answer":0,"rule":"Use <b>which<\/b> for things, and the verb agrees with <b>daffodils<\/b> (plural): which <b>grow<\/b>."},{"qid":"c10-19-03","type":"fix","level":1,"topic":"contrast","prompt":"One word is wrong. Find it and fix it.","words":["Although","the","heavy","rain,","we","enjoyed","our","walk","by","the","river."],"errors":[{"i":0,"options":["Because","Unless","Despite"],"answer":2}],"rule":"<b>Although<\/b> needs a full clause. Before a noun phrase (the heavy rain) use <b>Despite<\/b>."},{"qid":"c10-19-04","type":"fix","level":1,"topic":"exclamatory","prompt":"One word is wrong. Find it and fix it.","words":["What","lovely","the","moon","looks","tonight!"],"errors":[{"i":0,"options":["How","Which","Very"],"answer":0}],"rule":"<b>How<\/b> + adjective + subject + verb: <b>How lovely<\/b> the moon looks! (<b>What<\/b> needs a noun: What a lovely moon!)"},{"qid":"c10-19-05","type":"fill","level":1,"topic":"inversion","prompt":"Fill in the gap.","before":"Never","after":"I seen such a bright full moon.","options":["has","am","have"],"answer":2,"rule":"After <b>Never<\/b> at the start, the helping verb comes before the subject: Never <b>have I<\/b> seen."},{"qid":"c10-19-06","type":"fill","level":1,"topic":"relative","prompt":"Fill in the gap.","before":"Keats was a poet","after":"poems are full of nature.","options":["whose","who","which"],"answer":0,"rule":"<b>whose<\/b> shows possession: the poet's poems = the poet <b>whose<\/b> poems."},{"qid":"c10-19-07","type":"build","level":1,"topic":"comparison","prompt":"Make the sentence.","answer":["This","is","the","most","beautiful","valley","we","have","ever","visited."],"alts":[],"rule":"Superlative: <b>the most beautiful<\/b> + noun, often with <b>ever<\/b> + present perfect."},{"qid":"c10-19-08","type":"chat","level":1,"topic":"exclamatory","prompt":"Pick the correct reply.","chat":[["Kabir","Look at the sunrise over the hills!"]],"options":["What a beautiful sight it is!","What beautiful sight it is!","How a beautiful sight it is!"],"answer":0,"rule":"<b>What a<\/b> + adjective + singular noun + subject + verb: <b>What a beautiful sight it is!<\/b>"},{"qid":"c10-19-09","type":"change","level":1,"topic":"exclamatory","prompt":"Change into an assertive sentence.","source":"How sweet the song of the birds is!","options":["The song of the birds was very sweet.","The song of the birds are very sweet.","The song of the birds is very sweet."],"answer":2,"rule":"Replace <b>How<\/b> with <b>very<\/b>, keep the same tense (is) and end with a full stop."},{"qid":"c10-19-10","type":"proof","level":1,"topic":"relative","prompt":"Find and fix the 2 errors in this paragraph.","words":["Daffodils","are","flowers","which","grows","beside","cool","streams.","Keats,","who","love","nature,","saw","beauty","in","the","sun,","the","moon","and","the","shady","trees."],"errors":[{"i":4,"options":["growing","grown","grow"],"answer":2},{"i":10,"options":["loved","loving","lovely"],"answer":0}],"rule":"<b>which<\/b> refers to plural <b>flowers<\/b>, so <b>grow<\/b>; the story is in the past (saw), so <b>who loved<\/b>."},{"qid":"c10-19-11","type":"spot","level":2,"topic":"inversion","prompt":"Which sentence is correct?","options":["Seldom we do see such a clear night sky in the city.","Seldom do we see such a clear night sky in the city.","Seldom do we saw such a clear night sky in the city."],"answer":1,"rule":"After <b>Seldom<\/b> at the start: helping verb + subject + base verb: <b>do we see<\/b>."},{"qid":"c10-19-12","type":"spot","level":2,"topic":"contrast","prompt":"Which sentence is correct?","options":["Although it was cloudy, we enjoyed the trek.","Although it was cloudy, but we enjoyed the trek.","Despite it was cloudy, we enjoyed the trek."],"answer":0,"rule":"<b>Although<\/b> takes a clause and does not need <b>but<\/b>. <b>Despite<\/b> cannot take a full clause."},{"qid":"c10-19-13","type":"fix","level":2,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["Venna","Lake","is","as","calmer","as","a","sleeping","baby","this","morning."],"errors":[{"i":4,"options":["calmest","calm","calmly"],"answer":1}],"rule":"<b>as ... as<\/b> takes the positive degree: <b>as calm as<\/b>."},{"qid":"c10-19-14","type":"fix","level":2,"topic":"relative","prompt":"One word is wrong. Find it and fix it.","words":["Keats","is","the","poet","which","wrote","this","famous","line."],"errors":[{"i":4,"options":["whom","who","whose"],"answer":1}],"rule":"For a person who does the action, use <b>who<\/b>: the poet <b>who<\/b> wrote."},{"qid":"c10-19-15","type":"fill","level":2,"topic":"exclamatory","prompt":"Fill in the gap.","before":"","after":"peaceful the forest is at dawn!","options":["What","Which","How"],"answer":2,"rule":"<b>How<\/b> + adjective (peaceful) + subject + verb makes an exclamation."},{"qid":"c10-19-16","type":"build","level":2,"topic":"inversion","prompt":"Make the sentence.","answer":["Never","have","I","seen","such","a","lovely","sunrise."],"alts":[],"rule":"<b>Never<\/b> first, then helping verb before subject: <b>Never have I seen<\/b> ..."},{"qid":"c10-19-17","type":"chat","level":2,"topic":"contrast","prompt":"Pick the correct reply.","chat":[["Aai","Did you enjoy the trip to Matheran?"],["Aai","I heard it rained all day."]],"options":["Yes, despite of the rain, we enjoyed it a lot.","Yes, although the rain, we enjoyed it a lot.","Yes, despite the rain, we enjoyed it a lot."],"answer":2,"rule":"<b>despite<\/b> + noun, with no <b>of<\/b>. <b>although<\/b> needs a full clause."},{"qid":"c10-19-18","type":"chat","level":2,"topic":"relative","prompt":"Pick the correct reply.","chat":[["Sahil","Who is the man near the gate?"]],"options":["He is the gardener which looks after our school garden.","He is the gardener who looks after our school garden.","He is the gardener who look after our school garden."],"answer":1,"rule":"Use <b>who<\/b> for a person; it refers to <b>the gardener<\/b> (singular), so <b>looks<\/b>."},{"qid":"c10-19-19","type":"change","level":2,"topic":"comparison","prompt":"Change into the comparative degree.","source":"Kaas is the most colourful plateau in Maharashtra.","options":["Kaas is more colourful than any other plateaus in Maharashtra.","Kaas is more colourful than any other plateau in Maharashtra.","Kaas is most colourful than any other plateau in Maharashtra."],"answer":1,"rule":"Superlative to comparative: <b>more colourful than any other<\/b> + singular noun."},{"qid":"c10-19-20","type":"proof","level":2,"topic":"relative","prompt":"Find and fix the 2 errors in this paragraph.","words":["Despite","the","gloomy","weather,","we","walked","to","the","temple","and","sat","under","a","old","banyan","tree.","The","trees","which","stands","around","the","temple","whisper","softly","in","the","breeze."],"errors":[{"i":12,"options":["many","an","much"],"answer":1},{"i":19,"options":["stand","standing","stance"],"answer":0}],"rule":"<b>an<\/b> before a vowel sound (an old tree); <b>which<\/b> refers to plural <b>trees<\/b>, so <b>stand<\/b>."},{"qid":"c10-19-21","type":"spot","level":3,"topic":"exclamatory","prompt":"Which exclamatory sentence is correct?","options":["How a sweet dream it was!","What a sweet dream was it!","What a sweet dream it was!"],"answer":2,"rule":"<b>What a<\/b> + adjective + noun, then subject before verb: <b>it was<\/b>, not <b>was it<\/b>."},{"qid":"c10-19-22","type":"spot","level":3,"topic":"inversion","prompt":"Which sentence is correct?","options":["Not only does nature heal us, but it also brings us joy.","Not only nature heals us, but it also brings us joy.","Not only does nature heals us, but it also brings us joy."],"answer":0,"rule":"<b>Not only<\/b> at the start needs inversion with a base verb: <b>does nature heal<\/b>."},{"qid":"c10-19-23","type":"fix","level":3,"topic":"contrast","prompt":"One word is wrong. Find it and fix it.","words":["In","spite","for","the","hot","sun,","Kabir","finished","the","trek."],"errors":[{"i":2,"options":["of","from","with"],"answer":0}],"rule":"The fixed phrase is <b>in spite of<\/b> + noun."},{"qid":"c10-19-24","type":"fill","level":3,"topic":"relative","prompt":"Fill in the gap.","before":"The village,","after":"streams stay cool even in May, lies in the Sahyadris.","options":["whose","which","who"],"answer":0,"rule":"The streams belong to the village, so use <b>whose<\/b> + noun."},{"qid":"c10-19-25","type":"fill","level":3,"topic":"comparison","prompt":"Fill in the gap.","before":"The more we read Keats,","after":"we enjoy his poems.","options":["more","the more","most"],"answer":1,"rule":"Double comparative: <b>The more<\/b> ..., <b>the more<\/b> ... Both parts need <b>the<\/b>."},{"qid":"c10-19-26","type":"build","level":3,"topic":"relative","prompt":"Make the sentence.","answer":["Keats","wrote","poems","that","give","readers","so","much","joy."],"alts":[],"rule":"The relative clause <b>that give readers so much joy<\/b> comes right after <b>poems<\/b>."},{"qid":"c10-19-27","type":"chat","level":3,"topic":"inversion","prompt":"Pick the correct reply.","chat":[["Ananya","How was the view from Sinhagad?"]],"options":["Rarely I have enjoyed a view so much!","Rarely have I enjoy a view so much!","Rarely have I enjoyed a view so much!"],"answer":2,"rule":"After <b>Rarely<\/b>: helping verb + subject + past participle: <b>have I enjoyed<\/b>."},{"qid":"c10-19-28","type":"chat","level":3,"topic":"comparison","prompt":"Pick the correct reply.","chat":[["Dev","Which is cooler, Lonavala or Mumbai?"]],"options":["Lonavala is much more cooler than Mumbai.","Lonavala is much coolest than Mumbai.","Lonavala is much cooler than Mumbai."],"answer":2,"rule":"Two places compared: <b>cooler than<\/b>. <b>much<\/b> can strengthen it, but never add <b>more<\/b>."},{"qid":"c10-19-29","type":"change","level":3,"topic":"contrast","prompt":"Rewrite using 'in spite of'.","source":"Although the sky was dark, the children kept playing.","options":["In spite of the sky was dark, the children kept playing.","In spite of the dark sky, the children kept playing.","In spite the dark sky, the children kept playing."],"answer":1,"rule":"<b>In spite of<\/b> is followed by a noun phrase (the dark sky), not a clause."},{"qid":"c10-19-30","type":"proof","level":3,"topic":"comparison","prompt":"Find and fix the 2 errors in this paragraph.","words":["Of","all","the","seasons,","spring","is","the","more","beautiful.","The","flowers","which","bloom","in","March","makes","our","garden","look","like","a","painting."],"errors":[{"i":7,"options":["much","many","most"],"answer":2},{"i":15,"options":["making","make","maker"],"answer":1}],"rule":"<b>Of all<\/b> needs the superlative <b>the most<\/b>; the subject is <b>flowers<\/b> (plural), so <b>make<\/b>."},{"qid":"c10-19-31","type":"spot","level":4,"topic":"inversion","prompt":"Which sentence is correct?","options":["No sooner had we reached the beach when the sun set.","No sooner did we reached the beach than the sun set.","No sooner had we reached the beach than the sun set."],"answer":2,"rule":"<b>No sooner<\/b> + helping verb + subject ... <b>than<\/b> (not <b>when<\/b>)."},{"qid":"c10-19-32","type":"fix","level":4,"topic":"relative","prompt":"One word is wrong. Find it and fix it.","words":["The","temple,","which","was","build","long","ago,","stands","among","tall","trees."],"errors":[{"i":4,"options":["built","building","builds"],"answer":0}],"rule":"Passive voice = <b>was<\/b> + past participle: <b>was built<\/b>."},{"qid":"c10-19-33","type":"fix","level":4,"topic":"exclamatory","prompt":"One word is wrong. Find it and fix it.","words":["How","much","more","peaceful","a","village","is","then","a","city!"],"errors":[{"i":7,"options":["as","from","than"],"answer":2}],"rule":"A comparative (<b>more peaceful<\/b>) is followed by <b>than<\/b>; <b>then<\/b> means 'after that'."},{"qid":"c10-19-34","type":"fill","level":4,"topic":"contrast","prompt":"Fill in the gap.","before":"Despite","after":"tired, Riya finished painting the sunset.","options":["been","being","was"],"answer":1,"rule":"<b>Despite<\/b> is a preposition, so a verb after it takes the -ing form: <b>despite being<\/b>."},{"qid":"c10-19-35","type":"build","level":4,"topic":"inversion","prompt":"Make the sentence.","answer":["No","sooner","had","the","rain","stopped","than","Kabir","ran","outside."],"alts":[],"rule":"<b>No sooner had<\/b> + subject + past participle ... <b>than<\/b> + simple past."},{"qid":"c10-19-36","type":"chat","level":4,"topic":"comparison","prompt":"Pick the correct reply.","chat":[["Neha","Did you like the poem by Keats?"]],"options":["Yes, I did. It is one of the most beautiful poems I have ever read.","Yes, I do. It is one of the most beautiful poems I have ever read.","Yes, I did. It is one of the most beautiful poem I have ever read."],"answer":0,"rule":"<b>Did you ...?<\/b> is answered with <b>I did<\/b>; <b>one of the<\/b> + superlative + plural noun (poems)."},{"qid":"c10-19-37","type":"change","level":4,"topic":"comparison","prompt":"Change into the positive degree.","source":"The moon is brighter than the stars.","options":["The stars are not as brighter as the moon.","The stars are not as bright as the moon.","The stars are not as bright than the moon."],"answer":1,"rule":"Comparative to positive: <b>not as<\/b> + positive adjective + <b>as<\/b>."},{"qid":"c10-19-38","type":"change","level":4,"topic":"inversion","prompt":"Begin the sentence with 'Never'.","source":"I have never felt so peaceful.","options":["Never I have felt so peaceful.","Never had I felt so peaceful.","Never have I felt so peaceful."],"answer":2,"rule":"Keep the tense (have felt) and invert: <b>Never have I felt<\/b>."},{"qid":"c10-19-39","type":"proof","level":4,"topic":"comparison","prompt":"Find and fix the 3 errors in this paragraph.","words":["We","visited","Kaas","Plateau","last","Sunday.","The","flowers","which","covered","the","hills","were","brightest","than","a","rainbow.","In","spite","for","the","drizzle,","we","stayed","there","for","a","hour."],"errors":[{"i":13,"options":["brighter","bright","brightly"],"answer":0},{"i":19,"options":["of","from","with"],"answer":0},{"i":26,"options":["many","much","an"],"answer":2}],"rule":"<b>than<\/b> needs the comparative <b>brighter<\/b>; <b>in spite of<\/b>; <b>an<\/b> before the vowel sound in <b>hour<\/b>."},{"qid":"c10-19-40","type":"proof","level":4,"topic":"contrast","prompt":"Find and fix the 3 errors in this paragraph.","words":["John","Keats,","who","wrote","about","daffodils","and","rills,","were","a","Romantic","poet.","Despite","his","illness,","he","continue","to","write","until","he","died","on","the","age","of","twenty-five."],"errors":[{"i":8,"options":["are","was","be"],"answer":1},{"i":16,"options":["continuing","continues","continued"],"answer":2},{"i":22,"options":["in","at","by"],"answer":1}],"rule":"Subject <b>John Keats<\/b> is singular: <b>was<\/b>; past story: <b>continued<\/b>; fixed phrase: <b>at the age of<\/b>."},{"qid":"c10-19-41","type":"spot","level":5,"topic":"inversion","prompt":"Which sentence is correct?","options":["Hardly had the clouds parted than the moon appeared.","Hardly the clouds had parted when the moon appeared.","Hardly had the clouds parted when the moon appeared."],"answer":2,"rule":"<b>Hardly had<\/b> + subject + past participle ... <b>when<\/b> (not <b>than<\/b>)."},{"qid":"c10-19-42","type":"fix","level":5,"topic":"relative","prompt":"One word is wrong. Find it and fix it.","words":["The","trees,","under","whom","we","sat","for","hours,","were","older","than","the","temple."],"errors":[{"i":3,"options":["which","whose","who"],"answer":0}],"rule":"Trees are things, so after a preposition use <b>which<\/b>: under <b>which<\/b>. <b>whom<\/b> is only for people."},{"qid":"c10-19-43","type":"fill","level":5,"topic":"contrast","prompt":"Fill in the gap.","before":"","after":"how gloomy the day is, a walk in the garden always lifts my spirits.","options":["No matter","Even","Unless"],"answer":0,"rule":"<b>No matter how<\/b> + adjective + clause shows contrast: whatever the situation, the result stays the same."},{"qid":"c10-19-44","type":"fill","level":5,"topic":"comparison","prompt":"Fill in the gap.","before":"Of the two paths, the river path is","after":"one.","options":["more shadier","the shadier","most shady"],"answer":1,"rule":"Choosing between <b>two<\/b> things: <b>the<\/b> + comparative (<b>the shadier<\/b>)."},{"qid":"c10-19-45","type":"build","level":5,"topic":"exclamatory","prompt":"Make an exclamatory sentence.","answer":["How","gracefully","those","old","trees","sway","in","the","evening","breeze!"],"alts":[],"rule":"<b>How<\/b> + adverb (gracefully) + subject + verb ... + <b>!<\/b>"},{"qid":"c10-19-46","type":"chat","level":5,"topic":"exclamatory","prompt":"Pick the correct reply.","chat":[["Riya","Look! The sky is full of stars tonight."],["Riya","Let's stay on the terrace a little longer."]],"options":["Yes, let's. How bright they are!","Yes, let's. How bright are they!","Yes, let's. How bright it are!"],"answer":0,"rule":"In an exclamation the subject comes before the verb: <b>How bright they are!<\/b>"},{"qid":"c10-19-47","type":"chat","level":5,"topic":"relative","prompt":"Pick the correct reply.","chat":[["Kabir","Is this the cafe you told me about?"]],"options":["Yes, this is the cafe which we celebrated Riya's birthday.","Yes, this is the cafe where we celebrated Riya's birthday.","Yes, this is the cafe where we celebrate Riya's birthday last year."],"answer":1,"rule":"For a place where something happened, use <b>where<\/b>; a past event needs the past tense: <b>celebrated<\/b>."},{"qid":"c10-19-48","type":"change","level":5,"topic":"exclamatory","prompt":"Change into an exclamatory sentence.","source":"It is a great joy to watch the sun rise over the sea.","options":["What a great joy is it to watch the sun rise over the sea!","What a great joy it is to watch the sun rise over the sea!","How a great joy it is to watch the sun rise over the sea!"],"answer":1,"rule":"<b>What a<\/b> + adjective + noun + subject + verb: <b>What a great joy it is<\/b> ...!"},{"qid":"c10-19-49","type":"change","level":5,"topic":"contrast","prompt":"Rewrite using 'Although'.","source":"In spite of the gloomy days, beauty still brings us hope.","options":["Although the days are gloomy, beauty still brings us hope.","Although the days are gloomy, but beauty still brings us hope.","Although the gloomy days, beauty still brings us hope."],"answer":0,"rule":"<b>Although<\/b> needs a clause (the days are gloomy) and never takes <b>but<\/b> in the other half."},{"qid":"c10-19-50","type":"change","level":5,"topic":"relative","prompt":"Combine using 'whose'.","source":"Keats was a Romantic poet. His poems are full of nature.","options":["Keats was a Romantic poet whose his poems are full of nature.","Keats was a Romantic poet whom poems are full of nature.","Keats was a Romantic poet whose poems are full of nature."],"answer":2,"rule":"<b>whose<\/b> replaces <b>His<\/b>: do not keep both. <b>whom<\/b> cannot show possession."}]},{"id":"20","num":"4.2","title":"The Luncheon","unit":"Unit Four","topics":[{"tag":"articles","name":"Articles a, an, the"},{"tag":"modals_could","name":"Uses of could and other modals"},{"tag":"prepositions","name":"Prepositions of time, place and movement"},{"tag":"word_forms","name":"Word forms (noun, verb, adjective, adverb)"},{"tag":"reported","name":"Reported speech"}],"questions":[{"qid":"c10-20-01","type":"spot","level":1,"topic":"articles","prompt":"Which sentence is correct?","options":["Aryan ordered a ice cream after lunch.","Aryan ordered an ice creams after lunch.","Aryan ordered an ice cream after lunch."],"answer":2,"rule":"<b>an<\/b> comes before a vowel sound (an ice cream), and <b>an<\/b> is used only with a singular noun."},{"qid":"c10-20-02","type":"spot","level":1,"topic":"word_forms","prompt":"Which sentence is correct?","options":["She greeted the students bright.","She greeted the students brightly.","She greeted the students brightness."],"answer":1,"rule":"An adverb (<b>brightly<\/b>) tells us how she greeted them."},{"qid":"c10-20-03","type":"fix","level":1,"topic":"prepositions","prompt":"One word is wrong. Find it and fix it.","words":["The","play","started","on","half","past","six."],"errors":[{"i":3,"options":["at","in","for"],"answer":0}],"rule":"Use <b>at<\/b> with clock times: <b>at<\/b> half past six."},{"qid":"c10-20-04","type":"fix","level":1,"topic":"word_forms","prompt":"One word is wrong. Find it and fix it.","words":["The","waiter","careful","placed","the","salmon","on","the","table."],"errors":[{"i":2,"options":["carefulness","care","carefully"],"answer":2}],"rule":"A verb (placed) is described by an adverb: <b>carefully<\/b>."},{"qid":"c10-20-05","type":"fill","level":1,"topic":"articles","prompt":"Fill in the gap.","before":"Foyot's was","after":"expensive restaurant in Paris.","options":["a","an","much"],"answer":1,"rule":"<b>expensive<\/b> begins with a vowel sound, so use <b>an<\/b>."},{"qid":"c10-20-06","type":"fill","level":1,"topic":"modals_could","prompt":"Fill in the gap.","before":"When she was young, Grandma","after":"swim across the river.","options":["could","can","must"],"answer":0,"rule":"<b>could<\/b> shows ability in the past (when she was young)."},{"qid":"c10-20-07","type":"build","level":1,"topic":"reported","prompt":"Make the sentence.","answer":["The","waiter","said","that","the","salmon","was","fresh."],"alts":[],"rule":"Reported statement: <b>said that<\/b> + subject + past tense verb (was)."},{"qid":"c10-20-08","type":"chat","level":1,"topic":"modals_could","prompt":"Pick the correct reply.","chat":[["Om","I can't open this jar."]],"options":["Could I helped you with it?","Could I help you with it?","Could I helping you with it?"],"answer":1,"rule":"A modal like <b>could<\/b> is always followed by the base verb: <b>could I help<\/b>."},{"qid":"c10-20-09","type":"change","level":1,"topic":"reported","prompt":"Change into indirect speech.","source":"She said, \"I never eat anything for luncheon.\"","options":["She told that she never ate anything for luncheon.","She said that I never ate anything for luncheon.","She said that she never ate anything for luncheon."],"answer":2,"rule":"<b>said that<\/b>; <b>I<\/b> becomes <b>she<\/b>; present <b>eat<\/b> moves back to <b>ate<\/b>. <b>told<\/b> needs an object."},{"qid":"c10-20-10","type":"proof","level":1,"topic":"prepositions","prompt":"Find and fix the 2 errors in this paragraph.","words":["Twenty","years","ago,","the","young","writer","lived","on","Paris","in","a","tiny","apartment.","He","earned","bare","enough","money","to","pay","the","rent."],"errors":[{"i":7,"options":["into","by","in"],"answer":2},{"i":15,"options":["bareness","barely","bared"],"answer":1}],"rule":"Live <b>in<\/b> a city; an adverb (<b>barely<\/b>) describes the adjective <b>enough<\/b>."},{"qid":"c10-20-11","type":"spot","level":2,"topic":"modals_could","prompt":"Which request is correct?","options":["Could you pass me the menu, please?","Could you passed me the menu, please?","Could you to pass me the menu, please?"],"answer":0,"rule":"<b>Could you<\/b> + base verb (<b>pass<\/b>) makes a polite request."},{"qid":"c10-20-12","type":"spot","level":2,"topic":"prepositions","prompt":"Which sentence is correct?","options":["The waiter came up to our table with a basket of peaches.","The waiter came up at our table with a basket of peaches.","The waiter came up to our table by a basket of peaches."],"answer":0,"rule":"Movement towards a place: <b>came up to<\/b>; carrying something: <b>with<\/b> a basket."},{"qid":"c10-20-13","type":"fix","level":2,"topic":"word_forms","prompt":"One word is wrong. Find it and fix it.","words":["The","prices","on","the","menu","were","horrible","expensive."],"errors":[{"i":6,"options":["horror","horrify","horribly"],"answer":2}],"rule":"An adjective (expensive) is described by an adverb: <b>horribly<\/b> expensive."},{"qid":"c10-20-14","type":"fix","level":2,"topic":"reported","prompt":"One word is wrong. Find it and fix it.","words":["The","lady","spoke","me","that","she","was","not","hungry."],"errors":[{"i":2,"options":["said","talked","told"],"answer":2}],"rule":"<b>told<\/b> takes a person straight after it: <b>told me<\/b>. We say <b>said to me<\/b> or <b>spoke to me<\/b>, never 'spoke me'."},{"qid":"c10-20-15","type":"fill","level":2,"topic":"prepositions","prompt":"Fill in the gap.","before":"The author caught sight","after":"the lady at the play.","options":["of","at","for"],"answer":0,"rule":"The fixed phrase is <b>catch sight of<\/b> someone."},{"qid":"c10-20-16","type":"build","level":2,"topic":"modals_could","prompt":"Make a polite request.","answer":["Could","you","bring","us","the","bill,","please?"],"alts":[],"rule":"<b>Could you<\/b> + base verb + object + <b>please?<\/b>"},{"qid":"c10-20-17","type":"chat","level":2,"topic":"articles","prompt":"Pick the correct reply.","chat":[["Waiter","What would you like, madam?"]],"options":["I would like an cup of coffee and an ice cream.","I would like a cup of coffee and an ice cream.","I would like a cup of coffee and a ice cream."],"answer":1,"rule":"<b>a<\/b> before a consonant sound (a cup), <b>an<\/b> before a vowel sound (an ice cream)."},{"qid":"c10-20-18","type":"chat","level":2,"topic":"reported","prompt":"Pick the correct reply.","chat":[["Aai","What did the doctor tell you?"]],"options":["He told me drink more water.","He told to me drink more water.","He told me to drink more water."],"answer":2,"rule":"Reported advice or order: <b>told<\/b> + person + <b>to<\/b> + base verb."},{"qid":"c10-20-19","type":"change","level":2,"topic":"reported","prompt":"Change into indirect speech.","source":"The waiter said to me, \"The salmon has just come in.\"","options":["The waiter told me that the salmon had just came in.","The waiter said me that the salmon had just come in.","The waiter told me that the salmon had just come in."],"answer":2,"rule":"<b>said to me<\/b> becomes <b>told me<\/b>; <b>has come<\/b> moves back to <b>had come<\/b>."},{"qid":"c10-20-20","type":"proof","level":2,"topic":"modals_could","prompt":"Find and fix the 2 errors in this paragraph.","words":["When","Grandpa","was","young,","he","can","walk","ten","kilometres","without","rest.","Now","he","walks","slowly,","but","he","still","goes","at","the","market","every","morning."],"errors":[{"i":5,"options":["may","could","must"],"answer":1},{"i":19,"options":["to","in","on"],"answer":0}],"rule":"Past ability: <b>could<\/b> walk; movement towards a place: goes <b>to<\/b> the market."},{"qid":"c10-20-21","type":"spot","level":3,"topic":"reported","prompt":"Which sentence is correct?","options":["She asked me whether was I still hungry.","She asked me whether I was still hungry.","She asked me that whether I was still hungry."],"answer":1,"rule":"Reported question: <b>whether<\/b> + subject + verb (I was), no <b>that<\/b>, no question order."},{"qid":"c10-20-22","type":"spot","level":3,"topic":"word_forms","prompt":"Which sentence is correct?","options":["The narrator replied generously.","The narrator replied generous.","The narrator replied generosity."],"answer":0,"rule":"The verb <b>replied<\/b> needs an adverb to tell how: <b>generously<\/b>."},{"qid":"c10-20-23","type":"fix","level":3,"topic":"modals_could","prompt":"One word is wrong. Find it and fix it.","words":["Even","as","a","child,","Abhi","can","play","the","flute","beautifully."],"errors":[{"i":5,"options":["could","may","shall"],"answer":0}],"rule":"<b>as a child<\/b> points to the past, so past ability is <b>could<\/b>."},{"qid":"c10-20-24","type":"fill","level":3,"topic":"reported","prompt":"Fill in the gap.","before":"The lady asked the waiter","after":"there was any salmon.","options":["that","what","if"],"answer":2,"rule":"A reported yes/no question uses <b>if<\/b> or <b>whether<\/b>."},{"qid":"c10-20-25","type":"fill","level":3,"topic":"articles","prompt":"Fill in the gap.","before":"It was","after":"first salmon of the season.","options":["a","the","an"],"answer":1,"rule":"Ordinal words like <b>first<\/b> take <b>the<\/b>: <b>the first<\/b> salmon."},{"qid":"c10-20-26","type":"build","level":3,"topic":"reported","prompt":"Make the reported question.","answer":["The","author","asked","his","guest","if","she","was","still","hungry."],"alts":[],"rule":"Reported question: <b>asked<\/b> + person + <b>if<\/b> + subject + verb."},{"qid":"c10-20-27","type":"chat","level":3,"topic":"modals_could","prompt":"Pick the correct reply.","chat":[["Kabir","We could go to the beach on Sunday."],["Kabir","What do you think?"]],"options":["That's a great idea! We could took a picnic too.","That's a great idea! We could take a picnic too.","That's a great idea! We could taking a picnic too."],"answer":1,"rule":"<b>could<\/b> for a suggestion, followed by the base verb: <b>could take<\/b>."},{"qid":"c10-20-28","type":"chat","level":3,"topic":"prepositions","prompt":"Pick the correct reply.","chat":[["Neha","When did your cousin arrive from Mumbai?"]],"options":["She arrived in 21st March, on the evening.","She arrived at 21st March, in the evening.","She arrived on 21st March, in the evening."],"answer":2,"rule":"<b>on<\/b> a date (on 21st March); <b>in<\/b> the evening."},{"qid":"c10-20-29","type":"change","level":3,"topic":"reported","prompt":"Change into indirect speech.","source":"The lady said to the author, \"Follow my example.\"","options":["The lady advised the author to follow my example.","The lady advised the author that follow her example.","The lady advised the author to follow her example."],"answer":2,"rule":"Advice: <b>advised<\/b> + person + <b>to<\/b> + verb; <b>my<\/b> becomes <b>her<\/b>."},{"qid":"c10-20-30","type":"proof","level":3,"topic":"word_forms","prompt":"Find and fix the 2 errors in this paragraph.","words":["The","guest","talked","cheerful","about","art","and","music.","Meanwhile,","the","author","sat","silent,","wondering","anxious","whether","he","had","enough","money","for","the","bill."],"errors":[{"i":3,"options":["cheer","cheerfulness","cheerfully"],"answer":2},{"i":14,"options":["anxiety","anxiously","anxiousness"],"answer":1}],"rule":"Verbs (talked, wondering) are described by adverbs: <b>cheerfully<\/b>, <b>anxiously<\/b>."},{"qid":"c10-20-31","type":"spot","level":4,"topic":"reported","prompt":"Which sentence is correct?","options":["The guest said that she had read his book.","The guest said me that she had read his book.","The guest said that she had reading his book."],"answer":0,"rule":"<b>said that<\/b> (no object); past perfect = <b>had<\/b> + past participle (<b>read<\/b>)."},{"qid":"c10-20-32","type":"fix","level":4,"topic":"word_forms","prompt":"One word is wrong. Find it and fix it.","words":["The","author","felt","embarrass","when","he","left","a","small","tip."],"errors":[{"i":3,"options":["embarrassed","embarrassing","embarrassingly"],"answer":0}],"rule":"After <b>felt<\/b> we need an adjective for the feeling: <b>embarrassed<\/b>."},{"qid":"c10-20-33","type":"fix","level":4,"topic":"prepositions","prompt":"One word is wrong. Find it and fix it.","words":["Ananya","has","been","living","in","Pune","since","five","years","now."],"errors":[{"i":6,"options":["from","for","during"],"answer":1}],"rule":"Use <b>for<\/b> with a length of time (five years) and <b>since<\/b> with a starting point (2020)."},{"qid":"c10-20-34","type":"fill","level":4,"topic":"modals_could","prompt":"Fill in the gap.","before":"If I had known the prices, I","after":"have chosen a cheaper restaurant.","options":["would","will","can"],"answer":0,"rule":"Third conditional: <b>If<\/b> + had known, ... <b>would have<\/b> + past participle."},{"qid":"c10-20-35","type":"build","level":4,"topic":"reported","prompt":"Make the reported command.","answer":["She","told","the","waiter","not","to","bring","any","coffee."],"alts":[],"rule":"Negative command in reported speech: <b>told<\/b> + person + <b>not to<\/b> + base verb."},{"qid":"c10-20-36","type":"chat","level":4,"topic":"prepositions","prompt":"Pick the correct reply.","chat":[["Riya","Can you come to my birthday lunch on Sunday?"]],"options":["I'd love to, but I can't. I am going in Nashik with my family.","I'd love to, but I can't. I am going at Nashik with my family.","I'd love to, but I can't. I am going to Nashik with my family."],"answer":2,"rule":"Movement towards a place takes <b>to<\/b>: going <b>to<\/b> Nashik."},{"qid":"c10-20-37","type":"change","level":4,"topic":"reported","prompt":"Change into indirect speech.","source":"The author asked the lady, \"Are you still hungry?\"","options":["The author asked the lady if she was still hungry.","The author asked the lady if was she still hungry.","The author asked the lady that was she still hungry."],"answer":0,"rule":"Yes/no question: <b>asked if<\/b> + subject + verb (she was); no question order."},{"qid":"c10-20-38","type":"change","level":4,"topic":"modals_could","prompt":"Rewrite using 'could' to show past ability.","source":"Abhi was able to perform well in his school days.","options":["Abhi could performed well in his school days.","Abhi could perform well in his school days.","Abhi could be perform well in his school days."],"answer":1,"rule":"<b>was able to<\/b> = <b>could<\/b>, followed by the base verb <b>perform<\/b>."},{"qid":"c10-20-39","type":"proof","level":4,"topic":"reported","prompt":"Find and fix the 3 errors in this message.","words":["Yesterday","my","friend","Sara","invited","me","to","lunch.","She","said","that","she","will","pay","the","bill,","but","when","the","waiter","came","at","our","table,","she","found","that","she","had","left","her","purse","in","home."],"errors":[{"i":12,"options":["shall","does","would"],"answer":2},{"i":21,"options":["for","to","since"],"answer":1},{"i":32,"options":["on","at","for"],"answer":1}],"rule":"After <b>said<\/b>, <b>will<\/b> becomes <b>would<\/b>; came <b>to<\/b> our table; left it <b>at<\/b> home."},{"qid":"c10-20-40","type":"proof","level":4,"topic":"word_forms","prompt":"Find and fix the 2 errors in this paragraph.","words":["When","the","bill","came,","the","author","was","so","nervous","that","he","could","hard","breathe.","He","paid","it,","left","a","small","tip","and","walked","out","of","the","restaurant","complete","penniless."],"errors":[{"i":12,"options":["harder","hardly","hardness"],"answer":1},{"i":27,"options":["completion","completes","completely"],"answer":2}],"rule":"<b>hardly<\/b> means 'almost not'; the adjective <b>penniless<\/b> needs the adverb <b>completely<\/b>."},{"qid":"c10-20-41","type":"spot","level":5,"topic":"reported","prompt":"Which sentence is correct?","options":["The lady told to the author that she would like to have a chat with him the following Thursday.","The lady told the author that she will like to have a chat with him the following Thursday.","The lady told the author that she would like to have a chat with him the following Thursday."],"answer":2,"rule":"<b>told<\/b> + person (no <b>to<\/b>); <b>will<\/b> moves back to <b>would<\/b> after a past reporting verb."},{"qid":"c10-20-42","type":"fix","level":5,"topic":"prepositions","prompt":"One word is wrong. Find it and fix it.","words":["The","author","was","startled","at","the","sight","to","the","prices","on","the","menu."],"errors":[{"i":7,"options":["of","for","with"],"answer":0}],"rule":"The phrase is <b>at the sight of<\/b> something."},{"qid":"c10-20-43","type":"fill","level":5,"topic":"modals_could","prompt":"Fill in the gap.","before":"Lack of rain","after":"cause a drought in the region this year.","options":["could","could have","ought"],"answer":0,"rule":"<b>could<\/b> + base verb shows a possibility. <b>could have<\/b> needs a past participle; <b>ought<\/b> needs <b>to<\/b>."},{"qid":"c10-20-44","type":"fill","level":5,"topic":"articles","prompt":"Fill in the gap.","before":"","after":"Seine flows through the heart of Paris.","options":["The","A","An"],"answer":0,"rule":"Names of rivers take <b>the<\/b>: <b>the<\/b> Seine, <b>the<\/b> Godavari."},{"qid":"c10-20-45","type":"build","level":5,"topic":"reported","prompt":"Make the reported question.","answer":["She","asked","me","why","I","did","not","eat","asparagus."],"alts":[],"rule":"Reported wh-question: <b>why<\/b> + subject + verb (I did not eat), ending with a full stop."},{"qid":"c10-20-46","type":"chat","level":5,"topic":"reported","prompt":"Pick the correct reply.","chat":[["Dad","What did your teacher say about the trip?"]],"options":["She said that we would leave at six and asked us to carry water.","She said that we would leave at six and asked us carry water.","She said that we would leave at six and asked us that carry water."],"answer":0,"rule":"Reported request: <b>asked<\/b> + person + <b>to<\/b> + base verb (asked us <b>to carry<\/b>)."},{"qid":"c10-20-47","type":"chat","level":5,"topic":"modals_could","prompt":"Pick the correct reply.","chat":[["Isha","Could I use your laptop for my project this evening?"]],"options":["Of course you can. I won't needed it until tomorrow.","Of course you can. I won't need it until tomorrow.","Of course you can to. I won't need it until tomorrow."],"answer":1,"rule":"Give permission with <b>you can<\/b>; after <b>won't<\/b> use the base verb <b>need<\/b>."},{"qid":"c10-20-48","type":"change","level":5,"topic":"reported","prompt":"Change into indirect speech.","source":"The lady said to me, \"I shall enjoy a peach now.\"","options":["The lady told me that she will enjoy a peach now.","The lady told me that I would enjoy a peach then.","The lady told me that she would enjoy a peach then."],"answer":2,"rule":"<b>shall<\/b> becomes <b>would<\/b>, <b>now<\/b> becomes <b>then<\/b>, and <b>I<\/b> becomes <b>she<\/b>."},{"qid":"c10-20-49","type":"change","level":5,"topic":"reported","prompt":"Change into indirect speech.","source":"The author said to the waiter, \"Please bring the bill.\"","options":["The author requested the waiter to bring the bill.","The author requested the waiter to brought the bill.","The author requested to the waiter that bring the bill."],"answer":0,"rule":"<b>Please<\/b> + command becomes <b>requested<\/b> + person + <b>to<\/b> + base verb."},{"qid":"c10-20-50","type":"change","level":5,"topic":"word_forms","prompt":"Rewrite using the verb 'believe' and the adverb form of 'thorough'.","source":"She had a thorough belief in eating little.","options":["She thoroughly believe in eating little.","She thorough believed in eating little.","She thoroughly believed in eating little."],"answer":2,"rule":"The noun <b>belief<\/b> becomes the verb <b>believed<\/b> (past), and <b>thorough<\/b> becomes the adverb <b>thoroughly<\/b>."}]},{"id":"21","num":"4.3","title":"World Heritage","unit":"Unit Four","topics":[{"tag":"not_only","name":"Not only ... but also"},{"tag":"no_sooner","name":"No sooner ... ,"prompt":"One word is wrong. Find it and fix it.","words":["Ravi","was","so","tired","to","walk","to","the","printer's","shop."],"errors":[{"i":2,"options":["such","too","much"],"answer":1}],"rule":"Use <b>too + adjective + to<\/b> to say something could not be done: <b>too tired to walk<\/b>."},{"qid":"c10-22-05","type":"fill","level":1,"topic":"no_sooner_hardly","prompt":"Fill in the gap.","before":"No sooner had he read the first line","after":"he began to grin.","options":["when","then","than"],"answer":2,"rule":"<b>No sooner<\/b> always pairs with <b>than<\/b>."},{"qid":"c10-22-06","type":"fill","level":1,"topic":"exclamatory_assertive","prompt":"Fill in the gap.","before":"","after":"funny lines they were!","options":["What","How","So"],"answer":0,"rule":"Use <b>What<\/b> before a noun phrase (funny lines). <b>How<\/b> goes before an adjective alone: How funny they were!"},{"qid":"c10-22-07","type":"build","level":1,"topic":"exclamatory_assertive","prompt":"Make an exclamatory sentence.","answer":["How","queer","the","lines","were!"],"alts":[],"rule":"Exclamation pattern: <b>How + adjective + subject + verb!<\/b>"},{"qid":"c10-22-08","type":"chat","level":1,"topic":"past_tenses","prompt":"Pick the correct reply.","chat":[["Meera","Did you finish the funny poem last night?"]],"options":["Yes, I did. I finished it at ten o'clock.","Yes, I was. I finished it at ten o'clock.","Yes, I done. I finish it at ten o'clock."],"answer":0,"rule":"A <b>Did ...?<\/b> question takes the short answer <b>Yes, I did<\/b>, and the past needs <b>finished<\/b>."},{"qid":"c10-22-09","type":"change","level":1,"topic":"exclamatory_assertive","prompt":"Change into an assertive sentence.","source":"What a loud roar the servant gave!","options":["The servant gave very a loud roar.","The servant gives a very loud roar.","The servant gave a very loud roar."],"answer":2,"rule":"<b>What a ...!<\/b> becomes a statement with <b>a very ...<\/b>; keep the past tense <b>gave<\/b>."},{"qid":"c10-22-10","type":"change","level":1,"topic":"too_so_that","prompt":"Remove 'too'.","source":"The joke was too silly to print.","options":["The joke was so silly that it could not be printed.","The joke was so silly that it could not printed.","The joke was very silly that it could not be printed."],"answer":0,"rule":"<b>too ... to<\/b> becomes <b>so ... that ... not<\/b>; 'was' is past, so use <b>could not<\/b>."},{"qid":"c10-22-11","type":"spot","level":2,"topic":"no_sooner_hardly","prompt":"Which sentence is correct?","options":["Hardly he had read the line when he grinned.","Hardly had he read the line when he grinned.","Hardly had he read the line than he grinned."],"answer":1,"rule":"<b>Hardly<\/b> takes inversion (<b>had he<\/b>) and pairs with <b>when<\/b>, not 'than'."},{"qid":"c10-22-12","type":"spot","level":2,"topic":"exclamatory_assertive","prompt":"Pick the correct exclamatory sentence.","options":["What funny poem it is!","How a funny poem it is!","What a funny poem it is!"],"answer":2,"rule":"With a singular noun use <b>What a + adjective + noun!<\/b>"},{"qid":"c10-22-13","type":"fix","level":2,"topic":"no_sooner_hardly","prompt":"One word is wrong. Find it and fix it.","words":["No","sooner","did","the","servant","read","the","line","when","he","laughed."],"errors":[{"i":8,"options":["then","than","that"],"answer":1}],"rule":"<b>No sooner<\/b> is always followed by <b>than<\/b>, never 'when'."},{"qid":"c10-22-14","type":"fix","level":2,"topic":"exclamatory_assertive","prompt":"One word is wrong. Find it and fix it.","words":["What","a","merry","mood","Holmes","were","in","that","day!"],"errors":[{"i":5,"options":["is","be","was"],"answer":2}],"rule":"Holmes is one person and 'that day' is past, so use <b>was<\/b>."},{"qid":"c10-22-15","type":"fill","level":2,"topic":"too_so_that","prompt":"Fill in the gap.","before":"The servant laughed so hard","after":"five buttons burst off.","options":["than","that","to"],"answer":1,"rule":"<b>so + adverb + that<\/b> shows the result: so hard <b>that<\/b> buttons burst."},{"qid":"c10-22-16","type":"fill","level":2,"topic":"past_tenses","prompt":"Fill in the gap.","before":"While the servant","after":"the poem, I watched his face.","options":["was reading","is reading","has read"],"answer":0,"rule":"An action going on in the past when another happened takes the past continuous: <b>was reading<\/b>."},{"qid":"c10-22-17","type":"build","level":2,"topic":"no_sooner_hardly","prompt":"Make a sentence with 'No sooner'.","answer":["No","sooner","had","Kabir","sat","down","than","the","bell","rang."],"alts":[],"rule":"<b>No sooner + had + subject + past participle ... than + simple past<\/b>."},{"qid":"c10-22-18","type":"chat","level":2,"topic":"too_so_that","prompt":"Pick the correct reply.","chat":[["Arjun","Why didn't you read your poem aloud?"]],"options":["It was too funny that I can't read it.","It was too funny for me to read without laughing.","It was so funny to read without laughing."],"answer":1,"rule":"<b>too + adjective + for me + to-verb<\/b> is correct. 'Too' never goes with 'that'."},{"qid":"c10-22-19","type":"chat","level":2,"topic":"no_sooner_hardly","prompt":"Pick the correct reply.","chat":[["Teacher","When did the class start laughing?"]],"options":["As soon as Rohan read the first line, everyone laughed.","As soon as Rohan had read the first line, everyone laughs.","No sooner Rohan read the first line than everyone laughed."],"answer":0,"rule":"<b>As soon as<\/b> + simple past, then simple past. 'No sooner' needs inversion: No sooner had Rohan read."},{"qid":"c10-22-20","type":"change","level":2,"topic":"no_sooner_hardly","prompt":"Begin the sentence with 'No sooner'.","source":"As soon as the servant read the fourth line, he broke into a roar.","options":["No sooner the servant read the fourth line than he broke into a roar.","No sooner had the servant read the fourth line when he broke into a roar.","No sooner had the servant read the fourth line than he broke into a roar."],"answer":2,"rule":"<b>No sooner had + subject + past participle ... than ...<\/b>"},{"qid":"c10-22-21","type":"spot","level":3,"topic":"past_tenses","prompt":"Pick the sentence with the correct tenses.","options":["By the time the doctor came, the servant had laughed for an hour.","By the time the doctor came, the servant has laughed for an hour.","By the time the doctor had come, the servant laughs for an hour."],"answer":0,"rule":"The earlier of two past actions takes the past perfect: <b>had laughed<\/b> before the doctor <b>came<\/b>."},{"qid":"c10-22-22","type":"fix","level":3,"topic":"past_tenses","prompt":"One word is wrong. Find it and fix it.","words":["I","had","already","post","the","poem","before","the","servant","came","back."],"errors":[{"i":3,"options":["posting","posts","posted"],"answer":2}],"rule":"Past perfect = <b>had + past participle<\/b>: had already <b>posted<\/b>."},{"qid":"c10-22-23","type":"fix","level":3,"topic":"too_so_that","prompt":"One word is wrong. Find it and fix it.","words":["The","lines","were","so","queer","that","nobody","was","able","to","kept","a","straight","face."],"errors":[{"i":10,"options":["keeping","keep","keeps"],"answer":1}],"rule":"After <b>to<\/b> use the base form of the verb: able to <b>keep<\/b>."},{"qid":"c10-22-24","type":"fill","level":3,"topic":"no_sooner_hardly","prompt":"Fill in the gap.","before":"Hardly had the poem reached the press","after":"the workers started laughing.","options":["when","than","then"],"answer":0,"rule":"<b>Hardly<\/b> pairs with <b>when<\/b>; <b>No sooner<\/b> pairs with than."},{"qid":"c10-22-25","type":"fill","level":3,"topic":"too_so_that","prompt":"Fill in the gap.","before":"The poem was","after":"funny for anyone to read with a straight face.","options":["so","such","too"],"answer":2,"rule":"<b>too + adjective + for someone + to-verb<\/b> means it could not be done."},{"qid":"c10-22-26","type":"build","level":3,"topic":"too_so_that","prompt":"Make a sentence with 'too ... to'.","answer":["The","servant","was","too","weak","to","stand."],"alts":[],"rule":"<b>too + adjective + to + verb<\/b>: too weak to stand."},{"qid":"c10-22-27","type":"chat","level":3,"topic":"past_tenses","prompt":"Pick the correct reply.","chat":[["Kiran","What were you doing when the lights went out?"]],"options":["I was reading a funny poem to my grandmother.","I am reading a funny poem to my grandmother.","I was read a funny poem to my grandmother."],"answer":0,"rule":"<b>What were you doing ...?<\/b> asks about an action in progress in the past: <b>I was reading<\/b>."},{"qid":"c10-22-28","type":"chat","level":3,"topic":"exclamatory_assertive","prompt":"Pick the correct reply.","chat":[["Anu","My uncle laughed so much that his shirt button flew off!"]],"options":["What funny sight that must have been!","What a funny sight that must have been!","How a funny sight that must have been!"],"answer":1,"rule":"A singular noun after <b>What<\/b> needs <b>a<\/b>: What <b>a<\/b> funny sight!"},{"qid":"c10-22-29","type":"change","level":3,"topic":"past_tenses","prompt":"Join the sentences using 'After'.","source":"The servant read the sixth line. Then he tumbled in a fit.","options":["After the servant has read the sixth line, he tumbled in a fit.","After the servant had read the sixth line, he tumbled in a fit.","After the servant had read the sixth line, he tumbles in a fit."],"answer":1,"rule":"The first action takes the past perfect <b>had read<\/b>; the later one stays simple past <b>tumbled<\/b>."},{"qid":"c10-22-30","type":"proof","level":3,"topic":"no_sooner_hardly","prompt":"Find and fix the 3 errors in this message.","words":["Yesterday","I","write","a","funny","poem","for","my","sister.","No","sooner","had","she","read","it","when","she","started","laughing.","She","laughed","so","hard","that","she","fall","off","the","sofa."],"errors":[{"i":2,"options":["wrote","writes","written"],"answer":0},{"i":15,"options":["then","while","than"],"answer":2},{"i":25,"options":["falls","fell","fallen"],"answer":1}],"rule":"<b>Yesterday<\/b> needs <b>wrote<\/b>; <b>No sooner<\/b> pairs with <b>than<\/b>; the result is past too: <b>fell<\/b>."},{"qid":"c10-22-31","type":"spot","level":4,"topic":"too_so_that","prompt":"Which sentence is correct?","options":["The lines were so funny that neither of us could stopped laughing.","The lines were such funny that neither of us could stop laughing.","The lines were so funny that neither of us could stop laughing."],"answer":2,"rule":"<b>so + adjective + that<\/b>; after <b>could<\/b> use the base verb <b>stop<\/b>. 'Such' needs a noun."},{"qid":"c10-22-32","type":"spot","level":4,"topic":"past_tenses","prompt":"Which sentence is correct?","options":["The poem was send to the printer last week.","The poem has been sent to the printer last week.","The poem was sent to the printer last week."],"answer":2,"rule":"<b>Last week<\/b> needs the simple past; the passive is <b>was + past participle (sent)<\/b>."},{"qid":"c10-22-33","type":"fix","level":4,"topic":"exclamatory_assertive","prompt":"One word is wrong. Find it and fix it.","words":["How","loudly","Mr","Bose","were","laughing","at","my","silly","poem","last","night!"],"errors":[{"i":4,"options":["was","is","be"],"answer":0}],"rule":"Mr Bose is one person and <b>last night<\/b> is past, so use <b>was laughing<\/b>."},{"qid":"c10-22-34","type":"fill","level":4,"topic":"past_tenses","prompt":"Fill in the gap.","before":"The poet","after":"not written a funny line since that day.","options":["have","has","is"],"answer":1,"rule":"<b>Since<\/b> + a point in time takes the present perfect; 'the poet' is singular, so <b>has<\/b>."},{"qid":"c10-22-35","type":"build","level":4,"topic":"exclamatory_assertive","prompt":"Make an exclamatory sentence.","answer":["What","a","terrible","mistake","I","made","by","sending","it!"],"alts":[],"rule":"<b>What a + adjective + noun + subject + verb!<\/b> After 'by' use the -ing form: by <b>sending<\/b>."},{"qid":"c10-22-36","type":"chat","level":4,"topic":"no_sooner_hardly","prompt":"Pick the correct reply.","chat":[["Dad","Did you catch the school bus on time?"]],"options":["No. Hardly had I reached the stop when the bus left.","No. Hardly I had reached the stop when the bus left.","No. Hardly had I reach the stop when the bus left."],"answer":0,"rule":"<b>Hardly had + subject + past participle ... when<\/b>: Hardly had I <b>reached<\/b>."},{"qid":"c10-22-37","type":"chat","level":4,"topic":"too_so_that","prompt":"Pick the correct reply.","chat":[["Sneha","Can you lift this box of books for me?"]],"options":["Sorry, it's so heavy for me to lift.","Sorry, it's too heavy that I can lift.","Sorry, it's too heavy for me to lift."],"answer":2,"rule":"<b>too heavy for me to lift<\/b> = I cannot lift it. 'So' needs 'that', and 'too' needs 'to'."},{"qid":"c10-22-38","type":"change","level":4,"topic":"too_so_that","prompt":"Rewrite using 'too ... to'.","source":"The man was so weak that he could not get out of bed.","options":["The man was too weak to get out of bed.","The man was too weak to got out of bed.","The man was too weak that he could get out of bed."],"answer":0,"rule":"<b>so ... that ... could not<\/b> becomes <b>too ... to<\/b>; 'too' already carries the 'not'."},{"qid":"c10-22-39","type":"proof","level":4,"topic":"no_sooner_hardly","prompt":"Find and fix the 3 errors in this message.","words":["My","grandfather","is","so","funny","that","my","friend","Raju","love","his","jokes.","Last","Sunday","he","tells","us","a","story","about","a","lazy","cat.","Hardly","had","he","finished","it","than","we","all","burst","out","laughing."],"errors":[{"i":9,"options":["loving","lover","loves"],"answer":2},{"i":15,"options":["tell","told","telling"],"answer":1},{"i":28,"options":["then","when","that"],"answer":1}],"rule":"Raju (he) <b>loves<\/b>; <b>Last Sunday<\/b> needs <b>told<\/b>; <b>Hardly<\/b> pairs with <b>when<\/b>."},{"qid":"c10-22-40","type":"proof","level":4,"topic":"too_so_that","prompt":"Find and fix the 2 errors in this message.","words":["What","a","queer","poem","my","brother","wrote","yesterday!","Last","night","he","laughed","so","hard","that","he","can","not","speak.","Then","he","sended","it","to","his","class","teacher."],"errors":[{"i":16,"options":["could","will","may"],"answer":0},{"i":21,"options":["sends","sent","send"],"answer":1}],"rule":"The story is past, so <b>could not<\/b>; the past of send is <b>sent<\/b>, not 'sended'."},{"qid":"c10-22-41","type":"spot","level":5,"topic":"no_sooner_hardly","prompt":"Which sentence is correct?","options":["Scarcely the servant had read the fifth line when his waistband split.","Scarcely had the servant read the fifth line than his waistband split.","Scarcely had the servant read the fifth line when his waistband split."],"answer":2,"rule":"<b>Scarcely<\/b>, like hardly, needs inversion (<b>had the servant read<\/b>) and pairs with <b>when<\/b>."},{"qid":"c10-22-42","type":"fix","level":5,"topic":"past_tenses","prompt":"One word is wrong. Find it and fix it.","words":["When","the","doctor","arrive","at","noon,","Holmes","had","been","watching","his","servant","for","days."],"errors":[{"i":3,"options":["arrives","arriving","arrived"],"answer":2}],"rule":"The main clause is past perfect continuous, so the time clause takes the simple past: <b>arrived<\/b>."},{"qid":"c10-22-43","type":"fill","level":5,"topic":"too_so_that","prompt":"Fill in the gap.","before":"It was","after":"a silly joke that even the serious printer laughed.","options":["so","too","such"],"answer":2,"rule":"Before <b>a + adjective + noun<\/b> use <b>such<\/b>: such a silly joke that ..."},{"qid":"c10-22-44","type":"build","level":5,"topic":"no_sooner_hardly","prompt":"Make a sentence with 'Hardly'.","answer":["Hardly","had","the","poem","reached","him","when","he","roared."],"alts":[],"rule":"<b>Hardly + had + subject + past participle ... when + simple past<\/b>."},{"qid":"c10-22-45","type":"chat","level":5,"topic":"no_sooner_hardly","prompt":"Pick the correct reply.","chat":[["Ravi","Did the guests enjoy your funny speech?"]],"options":["Yes! No sooner I had begun than they started clapping.","Yes! No sooner had I begun than they started clapping.","Yes! No sooner had I began than they started clapping."],"answer":1,"rule":"<b>No sooner had I + past participle<\/b>: the participle of begin is <b>begun<\/b>, not 'began'."},{"qid":"c10-22-46","type":"change","level":5,"topic":"exclamatory_assertive","prompt":"Change into an exclamatory sentence.","source":"The servant was a very mighty man.","options":["What mighty man the servant was!","What a mighty man the servant was!","How a mighty man the servant was!"],"answer":1,"rule":"<b>a very + adjective + noun<\/b> becomes <b>What a + adjective + noun + subject + verb!<\/b>"},{"qid":"c10-22-47","type":"change","level":5,"topic":"no_sooner_hardly","prompt":"Begin the sentence with 'Hardly'.","source":"As soon as the poet saw the servant's face, he regretted the joke.","options":["Hardly had the poet seen the servant's face when he regretted the joke.","Hardly had the poet saw the servant's face when he regretted the joke.","Hardly the poet had seen the servant's face when he regretted the joke."],"answer":0,"rule":"<b>Hardly had + subject + past participle (seen) ... when ...<\/b>"},{"qid":"c10-22-48","type":"change","level":5,"topic":"past_tenses","prompt":"Change into passive voice.","source":"The servant had read all six lines.","options":["All six lines have been read by the servant.","All six lines had read by the servant.","All six lines had been read by the servant."],"answer":2,"rule":"Past perfect passive = <b>had been + past participle<\/b>."},{"qid":"c10-22-49","type":"proof","level":5,"topic":"past_tenses","prompt":"Find and fix the 3 errors in this message.","words":["When","I","reached","home,","Tara","were","already","laughing","at","a","comic","book.","It","was","so","funny","that","tears","was","rolling","down","her","cheeks.","No","sooner","had","she","shown","it","to","me","when","I","too","started","laughing."],"errors":[{"i":5,"options":["was","is","are"],"answer":0},{"i":18,"options":["is","were","be"],"answer":1},{"i":31,"options":["then","than","that"],"answer":1}],"rule":"Tara (she) <b>was<\/b>; plural <b>tears were<\/b>; <b>No sooner<\/b> pairs with <b>than<\/b>."},{"qid":"c10-22-50","type":"proof","level":5,"topic":"too_so_that","prompt":"Find and fix the 3 errors in this message.","words":["Dear","Anu,","what","a","funny","evening","we","had!","Grandpa","told","a","joke","that","was","too","silly","that","we","all","groaned.","Then","he","laugh","so","loudly","that","Mr","Rao","from","next","door","knocks","on","the","wall."],"errors":[{"i":14,"options":["so","very","much"],"answer":0},{"i":22,"options":["laughs","laughing","laughed"],"answer":2},{"i":31,"options":["knocked","knocking","knock"],"answer":0}],"rule":"<b>so ... that<\/b>, not 'too ... that'; the story is past, so <b>laughed<\/b> and <b>knocked<\/b>."}]},{"id":"23","num":"4.5","title":"The Old Man and The Sea : Book Review","unit":"Unit Four","topics":[{"tag":"relative_clauses","name":"Adjectival (relative) clauses: who, which, whose, that"},{"tag":"although_despite","name":"Although / though / in spite of / despite"},{"tag":"compound_complex","name":"Joining and rewriting sentences (and, but, On -ing)"},{"tag":"word_forms","name":"Word forms: noun, adjective, adverb, verb"},{"tag":"passive_voice","name":"Passive voice"}],"questions":[{"qid":"c10-23-01","type":"spot","level":1,"topic":"relative_clauses","prompt":"Which sentence is correct?","options":["Manolin is the boy which helps the old fisherman.","Manolin is the boy who helps the old fisherman.","Manolin is the boy whose helps the old fisherman."],"answer":1,"rule":"For a person who does the action, use <b>who<\/b>."},{"qid":"c10-23-02","type":"spot","level":1,"topic":"passive_voice","prompt":"Pick the sentence in the correct passive form.","options":["The novel was publish in 1952.","The novel was published in 1952.","The novel is published in 1952."],"answer":1,"rule":"A past year needs the past passive: <b>was + past participle (published)<\/b>."},{"qid":"c10-23-03","type":"fix","level":1,"topic":"word_forms","prompt":"One word is wrong. Find it and fix it.","words":["Hemingway","writes","in","a","very","simply","style."],"errors":[{"i":5,"options":["simple","simplicity","simplify"],"answer":0}],"rule":"A noun (style) is described by an adjective: a very <b>simple<\/b> style. 'Simply' is an adverb."},{"qid":"c10-23-04","type":"fix","level":1,"topic":"although_despite","prompt":"One word is wrong. Find it and fix it.","words":["Despite","he","was","old,","he","sailed","far","out","to","sea."],"errors":[{"i":0,"options":["Although","However","Yet"],"answer":0}],"rule":"<b>Although<\/b> is followed by a clause (he was old). <b>Despite<\/b> needs a noun or -ing form."},{"qid":"c10-23-05","type":"fill","level":1,"topic":"relative_clauses","prompt":"Fill in the gap.","before":"The marlin,","after":"was very strong, pulled the boat.","options":["which","who","whose"],"answer":0,"rule":"For an animal or a thing, use <b>which<\/b>."},{"qid":"c10-23-06","type":"fill","level":1,"topic":"passive_voice","prompt":"Fill in the gap.","before":"Hemingway was","after":"by shrapnel in Italy.","options":["injure","injuring","injured"],"answer":2,"rule":"Passive = <b>was + past participle<\/b>: was <b>injured<\/b>."},{"qid":"c10-23-07","type":"build","level":1,"topic":"relative_clauses","prompt":"Make a sentence with a relative clause.","answer":["Manolin","is","a","boy","who","loves","the","sea."],"alts":[],"rule":"The clause <b>who loves the sea<\/b> describes the noun 'boy'."},{"qid":"c10-23-08","type":"chat","level":1,"topic":"passive_voice","prompt":"Pick the correct reply.","chat":[["Riya","When was 'The Old Man and the Sea' published?"]],"options":["It was published in 1952.","It published in 1952.","It was publish in 1952."],"answer":0,"rule":"A book does not publish itself, so use the passive: <b>was published<\/b>."},{"qid":"c10-23-09","type":"change","level":1,"topic":"although_despite","prompt":"Rewrite beginning with 'Although'.","source":"He hooks a marlin but the marlin is too strong for him.","options":["Although he hooks a marlin, but the marlin is too strong for him.","Although he hooks a marlin, the marlin is too strong for him.","Although he hooked a marlin, the marlin is too strong for him."],"answer":1,"rule":"<b>Although<\/b> replaces 'but', so drop 'but'. Keep the same tense in both parts."},{"qid":"c10-23-10","type":"change","level":1,"topic":"word_forms","prompt":"Rewrite using 'progress' as a noun.","source":"As the novel progresses, the old man and the marlin are inseparably linked.","options":["With the progress of the novel, the old man and the marlin is inseparably linked.","With the progresses the novel, the old man and the marlin are inseparably linked.","With the progress of the novel, the old man and the marlin are inseparably linked."],"answer":2,"rule":"Use the noun phrase <b>the progress of the novel<\/b>; two subjects (man and marlin) take <b>are<\/b>."},{"qid":"c10-23-11","type":"spot","level":2,"topic":"although_despite","prompt":"Which sentence is correct?","options":["In spite his bad luck, the old man did not give up.","In spite of his bad luck, the old man did not give up.","Although his bad luck, the old man did not give up."],"answer":1,"rule":"<b>In spite of<\/b> + noun (his bad luck). 'Although' needs a full clause."},{"qid":"c10-23-12","type":"spot","level":2,"topic":"word_forms","prompt":"Which sentence is correct?","options":["Manolin was deep devoted to the old man.","Manolin was deeply devotion to the old man.","Manolin was deeply devoted to the old man."],"answer":2,"rule":"An adverb (<b>deeply<\/b>) describes the adjective <b>devoted<\/b>."},{"qid":"c10-23-13","type":"fix","level":2,"topic":"relative_clauses","prom
