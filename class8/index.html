<script>
(function(){
"use strict";
const CLS = DATA.class, KEY = "zq_grammar_c" + CLS;
const STOPS = [
  {k:"spot",  name:"Spot it",  icon:"🔍", color:"#1e9bf0", types:["spot"],  n:8},
  {k:"fix",   name:"Fix it",   icon:"🖍️", color:"#ee3b4b", types:["fix"],   n:8},
  {k:"fill",  name:"Fill it",  icon:"🧩", color:"#ff8a3d", types:["fill"],  n:8},
  {k:"build", name:"Build it", icon:"🧱", color:"#1fb47a", types:["build"], n:6},
  {k:"talk",  name:"Talk it",  icon:"💬", color:"#5b3cc4", types:["chat"],  n:8},
  {k:"change",name:"Change it",icon:"🔄", color:"#0ca5a5", types:["change"],n:8},
  {k:"boss",  name:"Boss round",icon:"👑",color:"#e9a800", types:null,      n:10}
];
const TYPE = {spot:["Spot it","#1e9bf0"],fix:["Fix it","#ee3b4b"],proof:["Proofread","#d6336c"],fill:["Fill it","#ff8a3d"],build:["Build it","#1fb47a"],chat:["Talk it","#5b3cc4"],change:["Change it","#0ca5a5"]};
const UNIT_COLORS = ["#5b3cc4","#1e9bf0","#ff8a3d","#1fb47a","#ee3b4b","#0ca5a5","#e9a800","#d6336c"];
const CHEERS = ["Brilliant!","Super!","Spot on!","Well done!","Excellent!","Perfect!","Shabash!","Great job!"];
const OOPS = ["Not quite","Oops!","Almost!","Let's learn this one"];

/* ---------- storage ---------- */
let S;
function blank(){return {xp:0,streak:0,last:"",stops:{},seen:{},wrong:{},topic:{},sound:true,daily:""}}
function load(){try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ---------- data helpers ---------- */
const CH = DATA.chapters, Q = {};
CH.forEach(c=>{c.questions.forEach(q=>{q.ch=c.id;Q[q.qid]=q})});
const hasType = t=>CH.some(c=>c.questions.some(q=>q.type===t));
const stopsFor = c=>STOPS.filter(s=>!s.types||c.questions.some(q=>s.types.includes(q.type)));
const esc = s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const today = ()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function chapterStars(c){return stopsFor(c).reduce((a,s)=>a+(S.stops[c.id+"|"+s.k]||0),0)}
function totalStars(){return CH.reduce((a,c)=>a+chapterStars(c),0)}
function correctSentence(q){
  if(q.type==="spot"||q.type==="chat"||q.type==="change")return q.options[q.answer];
  if(q.type==="fill")return (q.before+" "+q.options[q.answer]+" "+q.after).trim();
  if(q.type==="build")return q.answer.join(" ");
  const w=q.words.slice();q.errors.forEach(e=>w[e.i]=e.options[e.answer]);return w.join(" ");
}

/* ---------- sound / speech ---------- */
let AC;
function tone(seq){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
  seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8})}catch(e){}}
const sfx={ok:()=>tone([[660,.12],[880,.12],[1320,.22]]),bad:()=>tone([[220,.18,"triangle"],[180,.25,"triangle"]]),tap:()=>tone([[520,.05]]),part:()=>tone([[520,.12],[660,.18]]),win:()=>tone([[523,.14],[659,.14],[784,.14],[1046,.35]])};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function speak(text){try{const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,""));const v=speechSynthesis.getVoices();
  u.voice=v.find(x=>/en[-_]IN/i.test(x.lang))||v.find(x=>/^en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)}

/* ---------- mascot (Penny the pencil) ---------- */
function penny(mood){
  const mouth=mood==="sad"?'<path d="M34 62 q8 -7 16 0" stroke="#1f1b3a" stroke-width="3" fill="none" stroke-linecap="round"/>':mood==="wow"?'<ellipse cx="42" cy="61" rx="5" ry="6" fill="#1f1b3a"/>':'<path d="M33 57 q9 10 18 0" stroke="#1f1b3a" stroke-width="3" fill="#fff" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 84 100" class="pen" aria-hidden="true"><g transform="rotate(${mood==="sad"?-6:8} 42 50)">
  <rect x="20" y="14" width="44" height="66" rx="10" fill="#ffc531" stroke="#1f1b3a" stroke-width="3"/>
  <rect x="20" y="14" width="44" height="12" rx="6" fill="#ee3b4b" stroke="#1f1b3a" stroke-width="3"/>
  <path d="M22 78 L42 98 L62 78 Z" fill="#ffe0b8" stroke="#1f1b3a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M37 93 L42 98 L47 93 Z" fill="#1f1b3a"/>
  <circle cx="34" cy="45" r="5" fill="#fff" stroke="#1f1b3a" stroke-width="2.5"/><circle cx="50" cy="45" r="5" fill="#fff" stroke="#1f1b3a" stroke-width="2.5"/>
  <circle cx="35" cy="46" r="2.3" fill="#1f1b3a"/><circle cx="51" cy="46" r="2.3" fill="#1f1b3a"/>
  <circle cx="28" cy="55" r="3.5" fill="#ff9aa5" opacity=".7"/><circle cx="56" cy="55" r="3.5" fill="#ff9aa5" opacity=".7"/>${mouth}</g></svg>`;
}

/* ---------- confetti ---------- */
function confetti(){const cv=document.getElementById("confetti"),cx=cv.getContext("2d");cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  const cols=["#5b3cc4","#ffc531","#ee3b4b","#1fb47a","#1e9bf0","#ff8a3d"];const P=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height*.5,r:(4+Math.random()*6)*devicePixelRatio,c:cols[Math.random()*6|0],vy:(2+Math.random()*4)*devicePixelRatio,vx:(Math.random()-.5)*3*devicePixelRatio,a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function step(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
    if(++f<170)requestAnimationFrame(step);else cx.clearRect(0,0,cv.width,cv.height)})()}

/* ---------- router ---------- */
const app=document.getElementById("app");
function go(view,...a){hideSheet();window.scrollTo(0,0);view(...a)}

/* ---------- HOME ---------- */
function home(){
  const units=[];CH.forEach(c=>{let u=units.find(x=>x.name===c.unit);if(!u){u={name:c.unit,list:[]};units.push(u)}u.list.push(c)});
  const pocketN=Object.keys(S.wrong).length;
  const ui0=Math.min(+S.unit||0,units.length-1);
  app.innerHTML=`
  <header class="hero">
    <img class="logo" src="${LOGO}" alt="ZetaQ">
    <div style="position:relative;z-index:1"><h1>Grammar Lab</h1><p>Class ${CLS} · English · LogiQ</p>
      <button class="toggle" id="snd" style="margin-top:8px">${S.sound?"🔊 Sound on":"🔈 Sound off"}</button></div>
    <div class="mascot">${penny("happy")}</div>
  </header>
  <div class="stats">
    <div class="stat"><div class="ic" style="background:var(--sun-soft)">⭐</div><div><b>${totalStars()}</b><small>stars</small></div></div>
    <div class="stat"><div class="ic" style="background:var(--pen-soft)">🔥</div><div><b>${S.streak}</b><small>day streak</small></div></div>
    <div class="stat"><div class="ic" style="background:var(--sea-soft)">⚡</div><div><b>${S.xp}</b><small>XP</small></div></div>
  </div>
  <div class="quick">
    <button class="qbtn" style="background:var(--peach)" id="daily">☀️ Daily 5<small>${S.daily===today()?"Done today":"5 quick questions"}</small></button>
    <button class="qbtn" style="background:var(--pen)" id="pocket">🎒 My Mistakes<small>${pocketN} to practise</small></button>
    <button class="qbtn" style="background:var(--sea)" id="skills">📊 My Skills<small>see strong & weak</small></button>
  </div>
  <label class="unitpick" for="unitSel"><span>Choose a unit</span>
    <select id="unitSel">${units.map((u,ui)=>{const st=u.list.reduce((a,c)=>a+chapterStars(c),0),mx=u.list.reduce((a,c)=>a+stopsFor(c).length*3,0);
      return `<option value="${ui}" ${ui===ui0?"selected":""}>${esc(u.name)} · ${u.list.length} lessons · ⭐ ${st}/${mx}</option>`}).join("")}</select></label>
  <div class="chapters" id="chList"></div>`;
  const list=app.querySelector("#chList"),sel=app.querySelector("#unitSel");
  function drawUnit(ui){const u=units[ui],col=UNIT_COLORS[ui%8];sel.style.borderColor=col;
    list.innerHTML=u.list.map(c=>{const st=chapterStars(c),mx=stopsFor(c).length*3;return `
      <button class="chap" data-ch="${esc(c.id)}"><div class="num" style="background:${col}">${esc(c.num||c.id)}${st===mx?'<span class="crown">👑</span>':""}</div>
      <div><h3>${esc(c.title)}</h3><div class="bar"><i style="width:${st/mx*100}%;background:${col}"></i></div><small>⭐ ${st} / ${mx}</small></div></button>`}).join("");
    list.querySelectorAll(".chap").forEach(b=>b.onclick=()=>{sfx.tap();go(trail,CH.find(c=>c.id===b.dataset.ch))})}
  sel.onchange=()=>{S.unit=+sel.value;save();sfx.tap();drawUnit(+sel.value)};
  drawUnit(ui0);
  app.querySelector("#snd").onclick=()=>{S.sound=!S.sound;save();home()};
  app.querySelector("#daily").onclick=()=>startDaily();
  app.querySelector("#pocket").onclick=()=>go(pocket);
  app.querySelector("#skills").onclick=()=>go(skills);
}
function topnav(title,sub,back){return `<div class="topnav"><button class="iconbtn" id="back" aria-label="Back">⬅️</button><div><h2>${title}</h2>${sub?`<small>${sub}</small>`:""}</div></div>`}

/* ---------- TRAIL ---------- */
function trail(c){
  const stops=stopsFor(c),n=stops.length,H=150*n+40,W=520;
  const pts=stops.map((s,i)=>({x:i%2?W*.72:W*.28,y:80+i*150}));
  let d=`M${pts[0].x} ${pts[0].y}`;for(let i=1;i<n;i++){const a=pts[i-1],b=pts[i];d+=` C${a.x} ${a.y+90}, ${b.x} ${b.y-90}, ${b.x} ${b.y}`}
  const nextI=stops.findIndex(s=>!(S.stops[c.id+"|"+s.k]>=1));
  app.innerHTML=`${topnav(esc(c.title),"Lesson "+esc(c.num||c.id)+" · ⭐ "+chapterStars(c)+" / "+n*3)}
   <div class="topics">${c.topics.map(t=>`<span class="topic">${esc(t.name)}</span>`).join("")}</div>
   <div class="trailwrap"><div class="trail" style="aspect-ratio:${W}/${H}">
   <svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="#e3e1f3" stroke-width="22" stroke-linecap="round"/>
   <path d="${d}" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round"/></svg>
   ${stops.map((s,i)=>{const st=S.stops[c.id+"|"+s.k]||0;return `<button class="stop ${i===nextI?"next":""}" data-k="${s.k}" style="left:${pts[i].x/W*100}%;top:${pts[i].y/H*100}%">
     <span class="node" style="background:${s.color}">${s.icon}</span><span class="lbl">${s.name}</span><span class="st">${"★".repeat(st)}${'<span style="color:#d9d5ef">'+"★".repeat(3-st)+"</span>"}</span></button>`}).join("")}
   </div></div>`;
  app.querySelector("#back").onclick=()=>go(home);
  app.querySelectorAll(".stop").forEach(b=>b.onclick=()=>{sfx.tap();startStop(c,stops.find(s=>s.k===b.dataset.k))});
}
function pickRound(pool,n,sortLevel){
  const unseen=shuffle(pool.filter(q=>!S.seen[q.qid])),wrong=shuffle(pool.filter(q=>S.seen[q.qid]&&S.wrong[q.qid])),rest=shuffle(pool.filter(q=>S.seen[q.qid]&&!S.wrong[q.qid]));
  let r=unseen.concat(wrong,rest).slice(0,n);
  if(sortLevel)r.sort((a,b)=>a.level-b.level);
  return r;
}
function startStop(c,s){
  let pool;
  if(s.types)pool=c.questions.filter(q=>s.types.includes(q.type));
  else{pool=c.questions.filter(q=>q.level>=4);if(pool.length<s.n)pool=c.questions}
  const qs=pickRound(pool,s.n,true);
  play({qs,title:s.name,color:s.color,onEnd:(score)=>{const k=c.id+"|"+s.k,st=stars(score,qs.length);if(st>(S.stops[k]||0))S.stops[k]=st;save()},back:()=>go(trail,c),next:()=>{const st=stopsFor(c);const i=st.findIndex(x=>x.k===s.k);return i<st.length-1?()=>startStop(c,st[i+1]):null}});
}
function startDaily(){
  const played=CH.filter(c=>chapterStars(c)>0);const src=(played.length?played:CH.slice(0,3));
  const pool=[].concat(...src.map(c=>c.questions));
  play({qs:pickRound(pool,5,false),title:"Daily 5",color:"#ff8a3d",onEnd:()=>{S.daily=today();save()},back:()=>go(home)});
}
const stars=(score,n)=>{const p=score/n;return p>=.9?3:p>=.7?2:p>=.4?1:0};

/* ---------- PLAY ---------- */
let R;
function play(cfg){
  R=Object.assign({i:0,score:0,combo:0,xp:0,log:[]},cfg);
  renderQ();
}
function renderQ(){
  hideSheet();window.scrollTo(0,0);
  const q=R.qs[R.i],[tname,tcol]=TYPE[q.type];
  app.innerHTML=`<div class="play">
    <div class="playtop"><button class="iconbtn" id="quit" aria-label="Quit round">✖️</button>
      <div class="pbar"><i id="pb" style="width:${R.i/R.qs.length*100}%"></i></div>
      <div class="combo" id="combo">${R.combo>=2?"🔥×"+R.combo:""}</div></div>
    <div class="card" id="card">
      <div><span class="badge" style="background:${tcol}">${tname}</span><span class="lv">${"●".repeat(q.level)}${"○".repeat(5-q.level)} · ${R.i+1} of ${R.qs.length}</span></div>
      <div class="prompt">${esc(q.prompt)}</div>
      <div id="body" style="display:grid;gap:16px"></div>
      <div class="spacer" id="sp" hidden></div>
    </div></div>`;
  app.querySelector("#quit").onclick=()=>R.back();
  const body=app.querySelector("#body");
  ({spot:qChoice,chat:qChoice,change:qChoice,fill:qFill,build:qBuild,fix:qFix,proof:qFix})[q.type](q,body);
}
function finish(q,score,you,detail){
  const ok=score===1;
  R.score+=score;
  if(ok){R.combo++;const gain=10+(R.combo>=3?5:0);R.xp+=gain}else{R.combo=0;R.xp+=Math.round(10*score)}
  S.seen[q.qid]=1;
  if(ok)delete S.wrong[q.qid];else S.wrong[q.qid]=1;
  const t=S.topic[q.topic]||(S.topic[q.topic]=[0,0]);t[0]+=score;t[1]+=1;
  save();
  R.log.push({q,score,you,right:correctSentence(q)});
  try{window.parent!==window&&window.parent.postMessage({type:"zq-grammar-attempt",class:CLS,chapter:q.ch,qid:q.qid,score,answer:you},"*");window.ZQ_onAttempt&&window.ZQ_onAttempt({class:CLS,chapter:q.ch,qid:q.qid,score,answer:you})}catch(e){}
  const pb=document.getElementById("pb");if(pb)pb.style.width=((R.i+1)/R.qs.length*100)+"%";
  const cb=document.getElementById("combo");if(cb){cb.textContent=R.combo>=2?"🔥×"+R.combo:"";if(R.combo>=2){cb.classList.add("pop");setTimeout(()=>cb.classList.remove("pop"),220)}}
  if(ok){sfx.ok();buzz(20)}else if(score>0)sfx.part();else{sfx.bad();buzz([40,40,40])}
  const cls=ok?"good":score>0?"part":"bad";
  const title=ok?CHEERS[Math.random()*CHEERS.length|0]:score>0?"Half marks, nearly there!":OOPS[Math.random()*OOPS.length|0];
  const right=correctSentence(q);
  const sheet=document.getElementById("sheet"),inn=document.getElementById("sheetIn");
  sheet.className="sheet "+cls;
  inn.innerHTML=`<div class="head"><div class="face">${penny(ok?"happy":score>0?"wow":"sad")}</div><h3>${title}${ok&&R.combo>=3?" 🔥 +5 combo":""}</h3></div>
    ${ok?`<div class="ans"><span class="ok">✔ <b>${esc(right)}</b></span></div>`:`<div class="ans">${detail?`<span class="you">✖ Yours: <b>${esc(you)}</b></span>`:""}<span class="ok">✔ Right: <b>${esc(right)}</b></span></div>`}
    <div class="rule">💡 ${q.rule}</div>
    <button class="speak" id="say">🔊 Hear it</button>
    <button class="go" id="cont">${R.i===R.qs.length-1?"See my stars":"Continue"}</button>`;
  requestAnimationFrame(()=>sheet.classList.add("show"));
  document.getElementById("sp").hidden=false;
  inn.querySelector("#say").onclick=()=>speak(right);
  const c=inn.querySelector("#cont");c.focus({preventScroll:true});
  c.onclick=()=>{R.i++;if(R.i<R.qs.length)renderQ();else results()};
}
function hideSheet(){const s=document.getElementById("sheet");if(s)s.className="sheet"}

/* choice: spot / chat / change */
function qChoice(q,body){
  if(q.type==="chat")body.insertAdjacentHTML("beforeend",`<div class="chat">${q.chat.map(m=>`<div class="msg"><b>${esc(m[0])}</b>${esc(m[1])}</div>`).join("")}</div>`);
  if(q.type==="change")body.insertAdjacentHTML("beforeend",`<div class="source">${esc(q.source)}</div>`);
  const order=shuffle(q.options.map((o,i)=>i));
  const box=document.createElement("div");box.className="opts";
  let sel=-1;
  order.forEach(i=>{const b=document.createElement("button");b.className="opt"+(q.type==="chat"?" bubble":"");b.textContent=q.options[i];b.dataset.i=i;
    b.onclick=()=>{sfx.tap();sel=i;box.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));chk.disabled=false};box.appendChild(b)});
  const chk=document.createElement("button");chk.className="go";chk.textContent="Check";chk.disabled=true;
  chk.onclick=()=>{box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;x.classList.remove("sel");if(+x.dataset.i===q.answer)x.classList.add("right");else if(+x.dataset.i===sel)x.classList.add("wrong")});
    chk.remove();finish(q,sel===q.answer?1:0,q.options[sel],sel!==q.answer)};
  body.append(box,chk);
}
/* fill */
function qFill(q,body){
  const line=document.createElement("div");line.className="gapline";
  line.innerHTML=`${esc(q.before)} <span class="gap" id="gap">&nbsp;?&nbsp;</span> ${esc(q.after)}`;
  const chips=document.createElement("div");chips.className="chips";let sel=-1;
  const chk=document.createElement("button");chk.className="go";chk.textContent="Check";chk.disabled=true;
  shuffle(q.options.map((o,i)=>i)).forEach(i=>{const b=document.createElement("button");b.className="chip";b.textContent=q.options[i];b.dataset.i=i;
    b.onclick=()=>{sfx.tap();sel=i;line.querySelector("#gap").textContent=q.options[i];chips.querySelectorAll(".chip").forEach(x=>x.style.outline=x===b?"3px solid var(--sea)":"");chk.disabled=false};chips.appendChild(b)});
  chk.onclick=()=>{const ok=sel===q.answer,g=line.querySelector("#gap");g.classList.add(ok?"right":"wrong");
    chips.querySelectorAll(".chip").forEach(x=>{x.disabled=true;x.style.outline="";if(+x.dataset.i===q.answer)x.classList.add("right");else if(+x.dataset.i===sel)x.classList.add("wrong")});
    chk.remove();finish(q,ok?1:0,q.options[sel],!ok)};
  body.append(line,chips,chk);
}
/* build */
function qBuild(q,body){
  const line=document.createElement("div");line.className="buildline";
  const pool=document.createElement("div");pool.className="chips";
  const hint=document.createElement("p");hint.className="hint";hint.textContent="Tap the tiles in order. Tap a word in the line to send it back.";
  const chk=document.createElement("button");chk.className="go";chk.textContent="Check";chk.disabled=true;
  let tiles=shuffle(q.answer.map((w,i)=>i));
  if(tiles.every((v,i)=>v===i))tiles.reverse();
  const placed=[];
  function draw(){line.innerHTML="";placed.forEach((ti,k)=>{const b=document.createElement("button");b.className="chip";b.textContent=q.answer[ti];b.onclick=()=>{sfx.tap();placed.splice(k,1);draw()};line.appendChild(b)});
    pool.querySelectorAll(".chip").forEach(b=>b.classList.toggle("ghost",placed.includes(+b.dataset.t)));chk.disabled=placed.length!==q.answer.length}
  tiles.forEach(ti=>{const b=document.createElement("button");b.className="chip";b.textContent=q.answer[ti];b.dataset.t=ti;b.onclick=()=>{if(placed.includes(ti))return;sfx.tap();placed.push(ti);draw()};pool.appendChild(b)});
  chk.onclick=()=>{const words=placed.map(t=>q.answer[t]);const orders=[q.answer].concat(q.alts||[]);
    let best=0,bestOrd=q.answer;orders.forEach(o=>{const n=words.filter((w,k)=>w===o[k]).length;if(n>best){best=n;bestOrd=o}});
    const full=best===q.answer.length,score=full?1:best>=q.answer.length/2?.5:0;
    line.querySelectorAll(".chip").forEach((b,k)=>{b.disabled=true;b.classList.add(words[k]===bestOrd[k]?"right":"wrong")});
    pool.remove();hint.remove();chk.remove();finish(q,score,words.join(" "),!full)};
  body.append(line,pool,hint,chk);draw();
}
/* fix + proof */
function qFix(q,body){
  const paper=document.createElement("div");paper.className="paper";
  const words=document.createElement("div");words.className="words";paper.appendChild(words);
  const errIdx=q.errors.map(e=>e.i);
  const st={misses:0,done:{},open:null};
  const info=document.createElement("p");info.className="hint";
  const fixbox=document.createElement("div");fixbox.className="fixbox";fixbox.hidden=true;
  const N=q.errors.length;
  function setInfo(t){info.innerHTML=(N>1?`<span class="counter">Fixed ${Object.keys(st.done).length} / ${N}</span> · `:"")+t}
  setInfo(N>1?"Tap a wrong word with your red pen 🖍️":"Tap the wrong word with your red pen 🖍️");
  const btns=q.words.map((w,i)=>{const b=document.createElement("button");b.className="w";b.textContent=w;
    b.onclick=()=>tapWord(i,b);words.appendChild(b);return b});
  function tapWord(i,b){
    if(st.open!==null||st.done[i]!==undefined)return;
    if(!errIdx.includes(i)){st.misses++;sfx.bad();buzz(30);b.classList.remove("miss");void b.offsetWidth;b.classList.add("miss");
      if(st.misses>=3){setInfo("Here they are! Now choose the fixes.");errIdx.forEach(k=>{if(st.done[k]===undefined)btns[k].classList.add("reveal")})}
      else setInfo(`“${esc(q.words[i])}” is fine. Look again 👀`);return}
    sfx.tap();b.classList.remove("reveal");b.classList.add("found","struck");st.open=i;
    const e=q.errors.find(x=>x.i===i);
    fixbox.hidden=false;fixbox.innerHTML=`<p>Replace “${esc(q.words[i])}” with:</p>`;
    const chips=document.createElement("div");chips.className="chips";
    shuffle(e.options.map((o,k)=>k)).forEach(k=>{const c=document.createElement("button");c.className="chip";c.textContent=e.options[k];
      c.onclick=()=>{const ok=k===e.answer;st.done[i]={ok,pick:e.options[k]};
        b.insertAdjacentHTML("beforeend",`<span class="fx ${ok?"ok":""}">${esc(e.options[e.answer])}</span>`);
        if(ok)sfx.tap();else sfx.bad();
        st.open=null;fixbox.hidden=true;
        if(Object.keys(st.done).length===N)done();else setInfo(st.misses>=3?"Fix the next highlighted word.":"Good! Find the next one.")};
      chips.appendChild(c)});
    fixbox.appendChild(chips);setInfo("Now pick the right word.");
  }
  function done(){
    btns.forEach(b=>b.disabled=true);
    const findCredit=st.misses===0?1:st.misses===1?.5:0;
    const fixCredit=q.errors.filter(e=>st.done[e.i].ok).length/N;
    const score=Math.round((findCredit*.5+fixCredit*.5)*100)/100;
    const yw=q.words.slice();q.errors.forEach(e=>yw[e.i]=st.done[e.i].pick);
    info.textContent=st.misses?`You tapped ${st.misses} correct word${st.misses>1?"s":""} by mistake.`:"";
    finish(q,score,(st.misses?"(found after "+st.misses+" miss"+(st.misses>1?"es":"")+") ":"")+yw.join(" "),score<1);
  }
  body.append(paper,info,fixbox);
}

/* ---------- RESULTS ---------- */
function results(){
  hideSheet();
  const n=R.qs.length,st=stars(R.score,n);
  R.onEnd&&R.onEnd(R.score);
  const d=today();if(S.last!==d){const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();S.streak=S.last===ys?S.streak+1:1;S.last=d}
  S.xp+=R.xp;save();
  const nxt=R.next&&R.next();
  app.innerHTML=`<div class="result">
    <div class="mascot" style="width:110px;height:110px">${penny(st>=2?"happy":st===1?"wow":"sad")}</div>
    <div class="bigstars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <h2>${st===3?"Superstar!":st===2?"Great work!":st===1?"Good try!":"Keep practising!"}</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><span class="pill">✅ ${+R.score.toFixed(2)} / ${n}</span><span class="pill">⚡ +${R.xp} XP</span><span class="pill">🔥 ${S.streak} day streak</span></div>
    <div class="btnrow"><button class="go white" id="again">↻ Play again</button><button class="go purple" id="nextb">${nxt?"Next stop ➜":"Done ➜"}</button></div>
    <div class="review">${R.log.map((r,k)=>`<div class="rv"><div class="t"><span>${k+1}. ${TYPE[r.q.type][0]}</span><span>${r.score===1?"✅":r.score>0?"🌗 ½":"❌"}</span></div>
      ${r.score===1?`<span class="ok">${esc(r.right)}</span>`:`<span class="you">Yours: ${esc(r.you)}</span><span class="ok">Right: ${esc(r.right)}</span><span style="color:var(--muted);font-size:.88rem">💡 ${r.q.rule}</span>`}</div>`).join("")}</div>
  </div>`;
  const ss=app.querySelectorAll(".bigstars span");for(let i=0;i<st;i++)setTimeout(()=>{ss[i].classList.add("on");tone([[600+i*200,.15]])},350+i*380);
  if(st===3)setTimeout(()=>{confetti();sfx.win()},1400);
  const cfg=R;
  app.querySelector("#again").onclick=()=>{const pool=cfg.qs;play(Object.assign({},cfg,{qs:shuffle(pool)}))};
  app.querySelector("#nextb").onclick=()=>nxt?nxt():cfg.back();
}

/* ---------- POCKET ---------- */
function pocket(){
  const ids=Object.keys(S.wrong).filter(id=>Q[id]);
  app.innerHTML=`${topnav("My Mistakes","Every question you missed waits here until you get it right")}
   ${ids.length?`<button class="go" id="prac" style="margin-bottom:14px">🎯 Practise ${Math.min(ids.length,10)} mistakes</button>
   <div class="list">${ids.slice(0,60).map(id=>{const q=Q[id],c=CH.find(x=>x.id===q.ch);return `<div class="rv"><div class="t"><span>${TYPE[q.type][0]}</span><small style="color:var(--muted)">${esc(c.title)}</small></div><span class="ok">${esc(correctSentence(q))}</span><span style="color:var(--muted);font-size:.9rem">💡 ${q.rule}</span></div>`}).join("")}</div>`
   :`<div class="empty"><div style="width:90px">${penny("happy")}</div><b>No mistakes saved.</b>Play a lesson. Anything you miss shows up here to practise again.</div>`}`;
  app.querySelector("#back").onclick=()=>go(home);
  const p=app.querySelector("#prac");if(p)p.onclick=()=>play({qs:shuffle(ids.map(i=>Q[i])).slice(0,10),title:"My Mistakes",onEnd:()=>{},back:()=>go(pocket)});
}
/* ---------- SKILLS ---------- */
function skills(){
  const names={};CH.forEach(c=>c.topics.forEach(t=>names[t.tag]=t.name));
  const rows=Object.entries(S.topic).filter(([t,v])=>v[1]>0).map(([t,v])=>({t,name:names[t]||t,p:v[0]/v[1],n:v[1]})).sort((a,b)=>a.p-b.p);
  app.innerHTML=`${topnav("My Skills","Weakest first, so you know what to practise")}
   ${rows.length?`<div class="list">${rows.map(r=>{const col=r.p>=.8?"var(--mint)":r.p>=.5?"var(--sun)":"var(--pen)";return `<div class="skill"><div class="row"><span>${esc(r.name)}</span><span>${Math.round(r.p*100)}%</span></div><div class="bar"><i style="width:${r.p*100}%;background:${col}"></i></div><small style="color:var(--muted)">${r.n} question${r.n>1?"s":""} · ${r.p>=.8?"🏅 Strong":r.p>=.5?"Getting there":"Practise this"}</small></div>`}).join("")}</div>`
   :`<div class="empty"><div style="width:90px">${penny("wow")}</div><b>No skills yet.</b>Finish a round and your grammar skills appear here.</div>`}`;
  app.querySelector("#back").onclick=()=>go(home);
}

window.ZQ_TEST={Q,run:ids=>play({qs:ids.map(i=>Q[i]),title:"test",onEnd:()=>{},back:()=>go(home)})};
home();
})();
</script>
