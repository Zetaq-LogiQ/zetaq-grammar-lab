ase_clause","name":"Phrases and clauses"},{"tag":"perfect","name":"Present perfect and present perfect continuous"},{"tag":"conditional","name":"Conditionals (type 1 and 2)"},{"tag":"not_only","name":"Not only ... but also"}],"questions":[{"qid":"c8-08-01","type":"spot","level":1,"topic":"finite_nonfinite","prompt":"Which sentence is correct?","options":["We want to build a strong India.","We want to builds a strong India.","We want to building a strong India."],"answer":0,"rule":"After <b>to<\/b>, use the base form (the infinitive): <b>to build<\/b>. It never takes -s or -ing."},{"qid":"c8-08-02","type":"spot","level":1,"topic":"perfect","prompt":"Pick the sentence with the correct tense.","options":["India has been a free country for 1947.","India has been a free country since 1947.","India is a free country since 1947."],"answer":1,"rule":"From a point in the past till now, use the present perfect with <b>since<\/b> + point of time: <b>has been ... since 1947<\/b>."},{"qid":"c8-08-03","type":"spot","level":2,"topic":"conditional","prompt":"Which sentence is correct?","options":["If we work hard, India will become a developed nation.","If we will work hard, India will become a developed nation.","If we work hard, India become a developed nation."],"answer":0,"rule":"Type 1 conditional: <b>If<\/b> + simple present, <b>will<\/b> + base verb. No <b>will<\/b> in the if-part."},{"qid":"c8-08-04","type":"spot","level":2,"topic":"not_only","prompt":"Which sentence is correct?","options":["The new metro is not only fast but also cheaply.","The new metro is not only fast but also cheap.","The new metro is not only fast and also cheap."],"answer":1,"rule":"<b>not only<\/b> pairs with <b>but also<\/b>, and both parts must match: two adjectives, <b>fast<\/b> and <b>cheap<\/b>."},{"qid":"c8-08-05","type":"spot","level":3,"topic":"phrase_clause","prompt":"Which sentence is correct?","options":["Can you tell me where the ISRO office is?","Can you tell me where is the ISRO office?","Can you tell me where the ISRO office?"],"answer":0,"rule":"Inside a sentence, a wh-clause keeps statement order: <b>where the ISRO office is<\/b>."},{"qid":"c8-08-06","type":"spot","level":3,"topic":"finite_nonfinite","prompt":"Which sentence is correct?","options":["Manish like to play football every evening.","Manish likes to play football every evening.","Manish likes to plays football every evening."],"answer":1,"rule":"The finite verb agrees with Manish (<b>likes<\/b>); the non-finite <b>to play<\/b> never changes."},{"qid":"c8-08-07","type":"spot","level":4,"topic":"perfect","prompt":"Pick the sentence with the correct tense.","options":["Our scientists has been working on this satellite for three years.","Our scientists have been worked on this satellite for three years.","Our scientists have been working on this satellite for three years."],"answer":2,"rule":"Present perfect continuous = <b>have/has been<\/b> + -ing. Plural <b>scientists<\/b> take <b>have<\/b>."},{"qid":"c8-08-08","type":"spot","level":5,"topic":"conditional","prompt":"Which sentence is correct?","options":["If we were more self-reliant, we will not depend on imported goods.","If we were more self-reliant, we would not depend on imported goods.","If we are more self-reliant, we would not depend on imported goods."],"answer":1,"rule":"Type 2 conditional (imagined): <b>If<\/b> + simple past, <b>would<\/b> + base verb."},{"qid":"c8-08-09","type":"fix","level":1,"topic":"finite_nonfinite","prompt":"One word is wrong. Find it and fix it.","words":["Riya","hopes","to","becomes","a","scientist","like","Dr","Kalam."],"errors":[{"i":3,"options":["became","becoming","become"],"answer":2}],"rule":"After <b>to<\/b>, the verb stays in the base form: <b>to become<\/b>."},{"qid":"c8-08-10","type":"fix","level":1,"topic":"perfect","prompt":"One word is wrong. Find it and fix it.","words":["We","have","lived","in","Hyderabad","since","five","years."],"errors":[{"i":5,"options":["for","from","during"],"a ix it.","words":["If","India","produced","more","of","its","own","technology,","we","would","not","needed","so","many","imported","phones."],"errors":[{"i":11,"options":["needs","needing","need"],"answer":2}],"rule":"After <b>would<\/b> (and <b>would not<\/b>), use the base verb: <b>would not need<\/b>."},{"qid":"c8-08-17","type":"fill","level":1,"topic":"finite_nonfinite","prompt":"Fill in the gap.","before":"Dr Kalam loved","after":"children.","options":["meets","to meet","met"],"answer":1,"rule":"After <b>loved<\/b>, use a non-finite form such as the infinitive <b>to meet<\/b>."},{"qid":"c8-08-18","type":"fill","level":1,"topic":"perfect","prompt":"Fill in the gap.","before":"We","after":"in this town since 2015.","options":["have lived","live","are living"],"answer":0,"rule":"<b>since 2015<\/b> means from then till now, so use the present perfect: <b>have lived<\/b>."},{"qid":"c8-08-19","type":"fill","level":2,"topic":"conditional","prompt":"Fill in the gap.","before":"If we protect our freedom, no one","after":"us.","options":["ruled","will rule","ruling"],"answer":1,"rule":"Type 1: <b>If<\/b> + simple present, then <b>will<\/b> + base verb."},{"qid":"c8-08-20","type":"fill","level":2,"topic":"not_only","prompt":"Fill in the gap.","before":"Ananya not only sings","after":"dances beautifully.","options":["and","or","but also"],"answer":2,"rule":"<b>not only<\/b> ... <b>but also<\/b> always go together."},{"qid":"c8-08-21","type":"fill","level":3,"topic":"phrase_clause","prompt":"Fill in the gap.","before":"This is the place","after":"Dr Kalam was born.","options":["where","which","what"],"answer":0,"rule":"For a place, the clause begins with <b>where<\/b>: the place <b>where<\/b> he was born."},{"qid":"c8-08-22","type":"fill","level":3,"topic":"finite_nonfinite","prompt":"Fill in the gap.","before":"","after":"his work, the scientist went home.","options":["Has finished","Having finished","Finished having"],"answer":1,"rule":"<b>Having finished<\/b> is a non-finite (participle) phrase showing the first of two actions."},{"qid":"c8-08-23","type":"fill","level":4,"topic":"perfect","prompt":"Fill in the gap.","before":"Arjun is tired because he","after":"for the exam since morning.","options":["studies","has been studying","was study"],"answer":1,"rule":"An action that began in the past and is still going on: <b>has been<\/b> + -ing."},{"qid":"c8-08-24","type":"fill","level":5,"topic":"conditional","prompt":"Fill in the gap.","before":"If we were not only strong but also self-reliant, the world","after":"us more.","options":["would respect","will respect","respected"],"answer":0,"rule":"<b>If<\/b> + simple past (<b>were<\/b>) is type 2, so the result takes <b>would<\/b> + base verb."},{"qid":"c8-08-25","type":"build","level":1,"topic":"finite_nonfinite","prompt":"Make a correct sentence.","answer":["We","like","to","play","cricket."],"alts":[],"rule":"Finite verb <b>like<\/b>, then the infinitive <b>to play<\/b>."},{"qid":"c8-08-26","type":"build","level":2,"topic":"perfect","prompt":"Make a correct sentence.","answer":["She","has","been","reading","since","morning."],"alts":[],"rule":"Present perfect continuous: <b>has been<\/b> + -ing + <b>since<\/b> + starting point."},{"qid":"c8-08-27","type":"build","level":3,"topic":"phrase_clause","prompt":"Make a sentence with a clause.","answer":["I","know","where","he","was","born."],"alts":[],"rule":"The clause <b>where he was born<\/b> keeps statement order: subject before verb."},{"qid":"c8-08-28","type":"build","level":4,"topic":"conditional","prompt":"Make a conditional sentence.","answer":["If","we","work","hard,","India","will","grow."],"alts":[],"rule":"Type 1: <b>If<\/b> + simple present, <b>will<\/b> + base verb."},{"qid":"c8-08-29","type":"build","level":5,"topic":"not_only","prompt":"Make a correct sentence.","answer":["India","is","not","only","large","but","also","strong."],"alts":[],"rule":"<b>not only<\/b> X <b>but also<\/b> Y, with X and Y of the same kind (two adjectives)."},{"qid":"c8-08-30","type":"chat","level":1,"topic":"finite_nonfinite","prompt":"Pick the correct reply.","chat":[["Karan","What do you want to be when you grow up?"]],"options":["I want to becomes a scientist.","I want become a scientist.","I want to become a scientist."],"answer":2,"rule":"<b>want<\/b> + <b>to<\/b> + base verb: <b>want to become<\/b>."},{"qid":"c8-08-31","type":"chat","level":1,"topic":"perfect","prompt":"Pick the correct reply.","chat":[["Mom","How long have you been waiting here?"]],"options":["I am waiting for twenty minutes.","I have been wait for twenty minutes.","I have been waiting for twenty minutes."],"answer":2,"rule":"Waiting from the past till now: <b>have been<\/b> + -ing + <b>for<\/b> + length of time."},{"qid":"c8-08-32","type":"chat","level":2,"topic":"conditional","prompt":"Pick the correct reply.","chat":[["Sana","Will you come to the science exhibition tomorrow?"]],"options":["Yes, if I finish my homework, I will come.","Yes, if I will finish my homework, I come.","Yes, if I finished my homework, I will come."],"answer":0,"rule":"Type 1: <b>if<\/b> + simple present (<b>finish<\/b>), then <b>will<\/b> + base verb (<b>will come<\/b>)."},{"qid":"c8-08-33","type":"chat","level":3,"topic":"phrase_clause","prompt":"Pick the correct reply.","chat":[["Teacher","Do you know why Dr Kalam is called the Missile Man?"]],"options":["Yes, ma'am. It is because of he led India's missile programme.","Yes, ma'am. It is because led India's missile programme.","Yes, ma'am. It is because he led India's missile programme."],"answer":2,"rule":"<b>because<\/b> begins a clause (subject + verb). <b>because of<\/b> is followed by a noun phrase, not a clause."},{"qid":"c8-08-34","type":"chat","level":3,"topic":"not_only","prompt":"Pick the correct reply.","chat":[["Ishaan","Is your new school bag good?"]],"options":["Yes, it is not only light but also strong.","Yes, it not only light but also strong.","Yes, it is not only light and also strong."],"answer":0,"rule":"Keep the verb <b>is<\/b>, and pair <b>not only<\/b> with <b>but also<\/b>."},{"qid":"c8-08-35","type":"chat","level":4,"topic":"perfect","prompt":"Pick the correct reply.","chat":[["Dad","Have you finished your project on Dr Kalam?"]],"options":["Not yet. I am working on it since Monday.","Not yet. I have been worked on it since Monday.","Not yet. I have been working on it since Monday."],"answer":2,"rule":"Still working, starting Monday: present perfect continuous <b>have been working ... since<\/b>."},{"qid":"c8-08-36","type":"chat","level":4,"topic":"finite_nonfinite","prompt":"Pick the correct reply.","chat":[["Priya","Why did you go to the library?"]],"options":["I went there to borrow a book on satellites.","I went there to borrowed a book on satellites.","I went there for borrow a book on satellites."],"answer":0,"rule":"Purpose is shown by the infinitive <b>to<\/b> + base verb: <b>to borrow<\/b>."},{"qid":"c8-08-37","type":"chat","level":5,"topic":"conditional","prompt":"Pick the correct reply.","chat":[["Rohan","What would you do if you were the Prime Minister?"]],"options":["If I was the Prime Minister, I will build more schools.","If I were the Prime Minister, I build more schools.","If I were the Prime Minister, I would build more schools."],"answer":2,"rule":"Imagined situation (type 2): <b>If I were<\/b> ..., <b>I would<\/b> + base verb."},{"qid":"c8-08-38","type":"change","level":1,"topic":"phrase_clause","prompt":"Replace the phrase 'his place of birth' with a clause.","source":"Do you know his place of birth?","options":["Do you know where was he born?","Do you know where he was born?","Do you know where he is born?"],"answer":1,"rule":"The clause <b>where he was born<\/b> has a subject and verb in statement order."},{"qid":"c8-08-39","type":"change","level":2,"topic":"conditional","prompt":"Rewrite using 'unless'.","source":"If you do not practise, you will not improve.","options":["Unless you do not practise, you will not improve.","Unless you practise, you will improve.","Unless you practise, you will not improve."],"answer":2,"rule":"<b>Unless<\/b> means <b>if not<\/b>, so drop the <b>not<\/b> from the if-part only."},{"qid":"c8-08-40","type":"change","level":2,"topic":"not_only","prompt":"Join using 'not only ... but also'.","source":"Dr Kalam was a scientist. He was also a poet.","options":["Dr Kalam was not only a scientist and also a poet.","Dr Kalam was not only a scientist but also a poet.","Dr Kalam were not only a scientist but also a poet."],"answer":1,"rule":"Place <b>not only<\/b> and <b>but also<\/b> just before the two matching parts: <b>a scientist<\/b> / <b>a poet<\/b>."},{"qid":"c8-08-41","type":"change","level":3,"topic":"finite_nonfinite","prompt":"Combine into one sentence beginning with 'Having'.","source":"Kabir finished his homework. He went out to play.","options":["Having finish his homework, Kabir went out to play.","Having finished his homework, Kabir went out to play.","Having finished his homework, went out to play."],"answer":1,"rule":"<b>Having<\/b> + past participle shows the first action; the main clause still needs its subject, <b>Kabir<\/b>."},{"qid":"c8-08-42","type":"change","level":4,"topic":"perfect","prompt":"Rewrite using 'since'.","source":"Neha started learning the violin in 2022, and she is still learning it.","options":["Neha has been learning the violin since 2022.","Neha is learning the violin since 2022.","Neha has been learnt the violin since 2022."],"answer":0,"rule":"Started in the past and still going on: <b>has been<\/b> + -ing + <b>since<\/b> + starting point."},{"qid":"c8-08-43","type":"change","level":4,"topic":"phrase_clause","prompt":"Replace the phrase 'In his absence' with a clause.","source":"In his absence, the thieves looted his house.","options":["While he away, the thieves looted his house.","While he was away, the thieves looted his house.","While was he away, the thieves looted his house."],"answer":1,"rule":"A clause needs a subject and a verb in statement order: <b>While he was away<\/b>."},{"qid":"c8-08-44","type":"change","level":5,"topic":"conditional","prompt":"Rewrite using 'If'.","source":"We do not have enough satellites, so we cannot forecast every storm.","options":["If we had enough satellites, we could forecast every storm.","If we have enough satellites, we could forecast every storm.","If we had enough satellites, we can forecast every storm."],"answer":0,"rule":"An imagined present (type 2): <b>If<\/b> + simple past (<b>had<\/b>), then <b>could<\/b> + base verb."},{"qid":"c8-08-45","type":"change","level":5,"topic":"not_only","prompt":"Rewrite using 'not only ... but also'.","source":"We must be strong as a military power and as an economic power.","options":["We must be strong not only as a military power and also as an economic power.","We must not only be strong as a military power but also an economic power.","We must be strong not only as a military power but also as an economic power."],"answer":2,"rule":"Pair <b>not only<\/b> with <b>but also<\/b> and keep both parts alike: <b>as a military power<\/b> / <b>as an economic power<\/b>."},{"qid":"c8-08-46","type":"proof","level":3,"topic":"perfect","prompt":"Find and fix the 2 errors in this message.","words":["Hi","Meera!","I","have","been","live","in","Pune","since","last","year.","My","neighbour,","Dr","Rao,","have","been","writing","a","book","on","satellites","for","two","years."],"errors":[{"i":5,"options":["living","lived","lives"],"answer":0},{"i":15,"options":["is","having","has"],"answer":2}],"rule":"Present perfect continuous: <b>have been living<\/b>. <b>Dr Rao<\/b> is one person: <b>has been writing<\/b>."},{"qid":"c8-08-47","type":"proof","level":4,"topic":"finite_nonfinite","prompt":"Find and fix the 3 errors in this paragraph.","words":["Dr","Kalam","wanted","to","makes","India","strong.","He","believed","what","every","child","could","dream","big.","He","enjoyed","meet","students","and","answered","their","questions","happily."],"errors":[{"i":4,"options":["made","making","make"],"answer":2},{"i":9,"options":["that","which","whom"],"answer":0},{"i":17,"options":["meeting","met","meets"],"answer":0}],"rule":"<b>to make<\/b> (infinitive); <b>believed that<\/b> + clause; <b>enjoy<\/b> is followed by -ing: <b>enjoyed meeting<\/b>."},{"qid":"c8-08-48","type":"proof","level":5,"topic":"conditional","prompt":"Find and fix the 3 errors in this paragraph.","words":["If","we","buying","only","imported","goods,","our","own","factories","will","suffer.","If","every","Indian","chose","local","products,","our","economy","would","grows","faster.","Self-respect","comes","with","self-reliance,","isn't","it?"],"errors":[{"i":2,"options":["bought","buy","buys"],"answer":1},{"i":20,"options":["grew","growing","grow"],"answer":2},{"i":26,"options":["doesn't","wasn't","don't"],"answer":0}],"rule":"Type 1: <b>If we buy<\/b> ... <b>will<\/b>. Type 2: <b>would grow<\/b>. <b>comes<\/b> (simple present) takes the tag <b>doesn't it?<\/b>"},{"qid":"c8-08-49","type":"proof","level":5,"topic":"not_only","prompt":"Find and fix the 2 errors in this paragraph.","words":["Our","village","has","changed","a","lot","since","the","last","ten","years.","It","now","has","not","only","a","new","school","and","also","a","small","health","centre,","and","everyone","is","proud","of","it."],"errors":[{"i":6,"options":["from","in","at"],"answer":1},{"i":19,"options":["or","but","so"],"answer":1}],"rule":"Say <b>in the last ten years<\/b> (since needs a starting point). <b>not only<\/b> pairs with <b>but also<\/b>."},{"qid":"c8-08-50","type":"proof","level":5,"topic":"phrase_clause","prompt":"Find and fix the 3 errors in this paragraph.","words":["He","helped","a","tribal","village","to","became","self-sustaining.","People","from","many","states","come","to","learned","from","him.","I","hope","what","I","can","meet","him","one","day."],"errors":[{"i":6,"options":["becomes","become","becoming"],"answer":1},{"i":14,"options":["learn","learning","learnt"],"answer":0},{"i":19,"options":["which","that","whom"],"answer":1}],"rule":"After <b>to<\/b>, use the base verb: <b>to become<\/b>, <b>to learn<\/b>. A clause after <b>hope<\/b> begins with <b>that<\/b>."}]},{"id":"09","num":"2.5","title":"The Happy Prince","unit":"Unit Two","topics":[{"tag":"reported","name":"Reported (indirect) speech"},{"tag":"nonfinite","name":"Infinitives, participles and gerunds"},{"tag":"past_perfect","name":"Past perfect tense"},{"tag":"too_so","name":"Too ... to / so ... that"}],"questions":[{"qid":"c8-09-01","type":"spot","level":1,"topic":"nonfinite","prompt":"Which sentence is correct?","options":["Swim is good exercise.","Swimming is good exercise.","Swims is good exercise."],"answer":1,"rule":"A verb used as the subject takes the -ing form (a gerund): <b>Swimming<\/b> is good exercise."},{"qid":"c8-09-02","type":"spot","level":1,"topic":"past_perfect","prompt":"Pick the sentence with the correct tense.","options":["His friends had went to Egypt before the snow came.","His friends has gone to Egypt before the snow came.","His friends had gone to Egypt before the snow came."],"answer":2,"rule":"Past perfect = <b>had<\/b> + past participle: <b>had gone<\/b> (not went) for the earlier past action."},{"qid":"c8-09-03","type":"spot","level":2,"topic":"reported","prompt":"Which reported sentence is correct?","options":["The Swallow said that he will stays for one more night.","The Swallow said that he would stayed for one more night.","The Swallow said that he would stay for one more night."],"answer":2,"rule":"In reported speech, <b>will<\/b> becomes <b>would<\/b>, followed by the base verb: <b>would stay<\/b>."},{"qid":"c8-09-04","type":"spot","level":2,"topic":"too_so","prompt":"Which sentence is correct?","options":["The boy was too ill that he could not get out of bed.","The boy was so ill to get out of bed.","The boy was too ill to get out of bed."],"answer":2,"rule":"Use <b>too<\/b> + adjective + <b>to<\/b> + verb, or <b>so<\/b> + adjective + <b>that<\/b> + clause. Don't mix them."},{"qid":"c8-09-05","type":"spot","level":3,"topic":"nonfinite","prompt":"Which sentence uses the past participle correctly?","options":["Ravi wore a tore shirt to the match.","Ravi wore a torn shirt to the match.","Ravi wore a tear shirt to the match."],"answer":1,"rule":"A past participle can work as an adjective: a <b>torn<\/b> shirt, a <b>broken<\/b> heart."},{"qid":"c8-09-06","type":"spot","level":3,"topic":"reported","prompt":"Which reported question is correct?","options":["The prince asked the Swallow would he stay one more night.","The prince asked the Swallow if will he stay one more night.","The prince asked the Swallow if he would stay one more night."],"answer":2,"rule":"A reported yes/no question uses <b>if<\/b> + statement order: <b>if he would stay<\/b>."},{"qid":"c8-09-07","type":"spot","level":4,"topic":"past_perfect","prompt":"Pick the sentence with the correct tense.","options":["When the guard arrived, the boys have already left the bridge.","When the guard arrived, the boys had already left the bridge.","When the guard arrived, the boys had already leave the bridge."],"answer":1,"rule":"The earlier of two past actions takes the past perfect: <b>had already left<\/b>."},{"qid":"c8-09-08","type":"spot","level":5,"topic":"reported","prompt":"Which reported command is correct?","options":["The prince told the Swallow not to forget his poor people.","The prince told the Swallow to not forgetting his poor people.","The prince told to the Swallow not to forget his poor people."],"answer":0,"rule":"A reported negative command: <b>told<\/b> + person (no <b>to<\/b>) + <b>not to<\/b> + base verb."},{"qid":"c8-09-09","type":"fix","level":1,"topic":"nonfinite","prompt":"One word is wrong. Find it and fix it.","words":["The","Swallow","could","not","took","out","the","other","eye."],"errors":[{"i":4,"options":["take","taking","taken"],"answer":0}],"rule":"After a modal like <b>could<\/b>, use the base form (infinitive without to): <b>could not take<\/b>."},{"qid":"c8-09-10","type":"fix","level":1,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["The","guard","has","shouted","at","the","boys","before","the","Swallow","arrived."],"errors":[{"i":2,"options":["had","have","was"],"answer":0}],"rule":"An action before another past action takes the past perfect: <b>had shouted<\/b> ... before ... arrived."},{"qid":"c8-09-11","type":"fix","level":2,"topic":"reported","prompt":"One word is wrong. Find it and fix it.","words":["The","prince","said","the","Swallow","that","he","must","go","to","Egypt."],"errors":[{"i":2,"options":["told","spoke","talked"],"answer":0}],"rule":"<b>told<\/b> takes a person directly (told the Swallow); <b>said<\/b> needs <b>to<\/b> before the person."},{"qid":"c8-09-12","type":"fix","level":2,"topic":"too_so","prompt":"One word is wrong. Find it and fix it.","words":["The","snow","was","too","heavy","that","the","Swallow","could","not","fly."],"errors":[{"i":3,"options":["very","much","so"],"answer":2}],"rule":"Before a <b>that<\/b>-clause of result, use <b>so<\/b>: <b>so heavy that<\/b> ..."},{"qid":"c8-09-13","type":"fix","level":3,"topic":"nonfinite","prompt":"One word is wrong. Find it and fix it.","words":["The","young","writer","was","tired","of","write","stories","in","the","cold."],"errors":[{"i":6,"options":["wrote","writing","written"],"answer":1}],"rule":"After a preposition such as <b>of<\/b>, a verb takes the -ing form (gerund): <b>tired of writing<\/b>."},{"qid":"c8-09-14","type":"fix","level":4,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["The","gold","had","been","pull","off","piece","by","piece","before","the","snow","came."],"errors":[{"i":4,"options":["pulling","pulled","pulls"],"answer":1}],"rule":"Past perfect passive = <b>had been<\/b> + past participle: <b>had been pulled<\/b>."},{"qid":"c8-09-15","type":"fix","level":4,"topic":"reported","prompt":"One word is wrong. Find it and fix it.","words":["The","Swallow","asked","the","prince","whom","he","was."],"errors":[{"i":5,"options":["which","whose","who"],"answer":2}],"rule":"<b>Who are you?<\/b> becomes <b>who he was<\/b>; <b>whom<\/b> is only for an object."},{"qid":"c8-09-16","type":"fix","level":5,"topic":"too_so","prompt":"One word is wrong. Find it and fix it.","words":["The","Swallow","loved","the","prince","so","much","than","he","refused","to","leave","for","Egypt."],"errors":[{"i":7,"options":["that","then","as"],"answer":0}],"rule":"The result pattern is <b>so<\/b> ... <b>that<\/b>: so much <b>that<\/b> he refused."},{"qid":"c8-09-17","type":"fill","level":1,"topic":"nonfinite","prompt":"Fill in the gap.","before":"The Swallow wanted","after":"to Egypt.","options":["go","to go","going"],"answer":1,"rule":"<b>want<\/b> is followed by the infinitive: <b>wanted to go<\/b>."},{"qid":"c8-09-18","type":"fill","level":1,"topic":"reported","prompt":"Fill in the gap.","before":"The prince","after":"the Swallow to take the red jewel.","options":["asked","said","spoke"],"answer":0,"rule":"A reported request: <b>asked<\/b> + person + <b>to<\/b> + verb."},{"qid":"c8-09-19","type":"fill","level":2,"topic":"past_perfect","prompt":"Fill in the gap.","before":"The boy's fever","after":"when his mother woke up.","options":["has gone down","had gone down","have gone down"],"answer":1,"rule":"It happened before she woke up (past), so use the past perfect: <b>had gone down<\/b>."},{"qid":"c8-09-20","type":"fill","level":2,"topic":"too_so","prompt":"Fill in the gap.","before":"The prince was","after":"kind to ignore the poor.","options":["so","such","too"],"answer":2,"rule":"<b>too<\/b> + adjective + <b>to<\/b> + verb shows that something does not happen: too kind to ignore."},{"qid":"c8-09-21","type":"fill","level":3,"topic":"nonfinite","prompt":"Fill in the gap.","before":"We could hear the","after":"children outside the palace gate.","options":["crying","cried","cry"],"answer":0,"rule":"The present participle (-ing) works as an adjective: the <b>crying<\/b> children."},{"qid":"c8-09-22","type":"fill","level":3,"topic":"reported","prompt":"Fill in the gap.","before":"The boys said that they","after":"very hungry.","options":["are being","was","were"],"answer":2,"rule":"After <b>said<\/b>, the present <b>are<\/b> moves back to <b>were<\/b>; <b>they<\/b> needs <b>were<\/b>, not was."},{"qid":"c8-09-23","type":"fill","level":4,"topic":"past_perfect","prompt":"Fill in the gap.","before":"The writer saw that someone","after":"a blue jewel on his table.","options":["has left","had left","leaving"],"answer":1,"rule":"The leaving happened before he saw it, so use the past perfect: <b>had left<\/b>."},{"qid":"c8-09-24","type":"fill","level":5,"topic":"too_so","prompt":"Fill in the gap.","before":"The Swallow was","after":"tired that he fell asleep at the prince's feet.","options":["such","too","so"],"answer":2,"rule":"<b>so<\/b> + adjective + <b>that<\/b>. <b>such<\/b> needs a noun (such a tired bird)."},{"qid":"c8-09-25","type":"build","level":1,"topic":"nonfinite","prompt":"Make a correct sentence.","answer":["I","love","reading","stories."],"alts":[],"rule":"The gerund <b>reading<\/b> is the object of <b>love<\/b>."},{"qid":"c8-09-26","type":"build","level":2,"topic":"too_so","prompt":"Make a correct sentence.","answer":["The","box","is","too","heavy","to","lift."],"alts":[],"rule":"<b>too<\/b> + adjective + <b>to<\/b> + verb."},{"qid":"c8-09-27","type":"build","level":3,"topic":"past_perfect","prompt":"Make a correct sentence.","answer":["The","train","had","left","before","we","arrived."],"alts":[],"rule":"The earlier action takes the past perfect (<b>had left<\/b>); the later one the simple past (<b>arrived<\/b>)."},{"qid":"c8-09-28","type":"build","level":4,"topic":"reported","prompt":"Make a reported question.","answer":["She","asked","me","where","I","lived."],"alts":[],"rule":"A reported question keeps statement order: <b>where I lived<\/b>."},{"qid":"c8-09-29","type":"build","level":5,"topic":"reported","prompt":"Make a reported command.","answer":["The","teacher","told","us","not","to","waste","paper."],"alts":[["The","teacher","told","us","to","not","waste","paper."]],"rule":"Reported negative command: <b>told<\/b> + person + <b>not to<\/b> + base verb."},{"qid":"c8-09-30","type":"chat","level":1,"topic":"nonfinite","prompt":"Pick the correct reply.","chat":[["Aditi","What is your hobby?"]],"options":["My hobby is painting birds.","My hobby is paint birds.","My hobby is to painting birds."],"answer":0,"rule":"After <b>is<\/b>, use a gerund as the complement: <b>painting<\/b> birds."},{"qid":"c8-09-31","type":"chat","level":1,"topic":"too_so","prompt":"Pick the correct reply.","chat":[["Dad","Can you carry this bag?"]],"options":["No, Dad. It is too heavy that I carry.","No, Dad. It is too heavy for me to carry.","No, Dad. It is very heavy to carry it."],"answer":1,"rule":"<b>too<\/b> + adjective + <b>for me to<\/b> + verb."},{"qid":"c8-09-32","type":"chat","level":2,"topic":"reported","prompt":"Pick the correct reply.","chat":[["Riya","What did the teacher say about the trip?"]],"options":["She said me that the trip was cancelled.","She said that the trip has been cancel.","She said that the trip had been cancelled."],"answer":2,"rule":"<b>said that<\/b> (no person after said), and <b>has been<\/b> moves back to <b>had been cancelled<\/b>."},{"qid":"c8-09-33","type":"chat","level":3,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Kabir","Did you see the start of the match?"]],"options":["No, the match had already started when I got there.","No, the match has already started when I got there.","No, the match had already start when I got there."],"answer":0,"rule":"It started before you reached: past perfect <b>had already started<\/b>."},{"qid":"c8-09-34","type":"chat","level":3,"topic":"nonfinite","prompt":"Pick the correct reply.","chat":[["Teacher","Why are you late, Sameer?"]],"options":["Sorry, ma'am. I stopped for help an injured dog.","Sorry, ma'am. I stopped to helping an injured dog.","Sorry, ma'am. I stopped to help an injured dog."],"answer":2,"rule":"<b>stopped to help<\/b> = stopped in order to help (infinitive of purpose)."},{"qid":"c8-09-35","type":"chat","level":4,"topic":"reported","prompt":"Pick the correct reply.","chat":[["Mom","What did Grandpa say on the phone?"]],"options":["He said that he would visit us on Sunday.","He said that he will visited us on Sunday.","He told that he would visit us on Sunday."],"answer":0,"rule":"<b>said that<\/b> + <b>would<\/b> + base verb. <b>told<\/b> must have a person after it."},{"qid":"c8-09-36","type":"chat","level":4,"topic":"too_so","prompt":"Pick the correct reply.","chat":[["Neel","Why didn't you finish your ice cream?"]],"options":["It was too cold that my teeth hurt.","It was so cold than my teeth hurt.","It was so cold that my teeth hurt."],"answer":2,"rule":"A result clause follows <b>so<\/b> + adjective + <b>that<\/b>."},{"qid":"c8-09-37","type":"chat","level":5,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Priya","Why were you so upset yesterday?"]],"options":["I had lost my bus pass, and I had to walk home.","I had losed my bus pass, and I had to walk home.","I had lose my bus pass, and I had to walk home."],"answer":0,"rule":"Losing the pass came before being upset (past), so use the past perfect: <b>had lost<\/b>."},{"qid":"c8-09-38","type":"change","level":1,"topic":"reported","prompt":"Change into indirect speech.","source":"The boy said, \"I feel better.\"","options":["The boy said that I felt better.","The boy said that he felt better.","The boy said that he feel better."],"answer":1,"rule":"<b>I<\/b> becomes <b>he<\/b>, and the present <b>feel<\/b> moves back to <b>felt<\/b>."},{"qid":"c8-09-39","type":"change","level":2,"topic":"reported","prompt":"Change into indirect speech.","source":"The Swallow asked the prince, \"Why are you crying?\"","options":["The Swallow asked the prince why was he crying.","The Swallow asked the prince why he was crying.","The Swallow asked the prince why he were crying."],"answer":1,"rule":"A reported wh-question uses statement order and moves the tense back: <b>why he was crying<\/b>."},{"qid":"c8-09-40","type":"change","level":2,"topic":"too_so","prompt":"Rewrite using 'too ... to'.","source":"The girl was so poor that she could not buy new matches.","options":["The girl was too poor that she could not buy new matches.","The girl was too poor not to buy new matches.","The girl was too poor to buy new matches."],"answer":2,"rule":"<b>so ... that ... could not<\/b> becomes <b>too<\/b> + adjective + <b>to<\/b> + verb (no <b>not<\/b>)."},{"qid":"c8-09-41","type":"change","level":3,"topic":"past_perfect","prompt":"Join using 'after'.","source":"The Swallow took the jewel. Then he flew over the roofs.","options":["After the Swallow had taken the jewel, he flew over the roofs.","After the Swallow has taken the jewel, he flew over the roofs.","After the Swallow had took the jewel, he flew over the roofs."],"answer":0,"rule":"The first action takes the past perfect: <b>had taken<\/b> (past participle of take)."},{"qid":"c8-09-42","type":"change","level":4,"topic":"reported","prompt":"Change into indirect speech.","source":"The guard said to the boys, \"Don't lie here.\"","options":["The guard told the boys to not lying there.","The guard told the boys don't lie there.","The guard told the boys not to lie there."],"answer":2,"rule":"Negative command: <b>told<\/b> + person + <b>not to<\/b> + verb, and <b>here<\/b> changes to <b>there<\/b>."},{"qid":"c8-09-43","type":"change","level":4,"topic":"nonfinite","prompt":"Combine using an infinitive.","source":"The young man sold the jewel. He wanted to buy food.","options":["The young man sold the jewel for buy food.","The young man sold the jewel to bought food.","The young man sold the jewel to buy food."],"answer":2,"rule":"Purpose is shown by the infinitive <b>to<\/b> + base verb: <b>to buy<\/b>."},{"qid":"c8-09-44","type":"change","level":5,"topic":"reported","prompt":"Change into indirect speech.","source":"The prince said, \"Will you stay with me tonight, little bird?\"","options":["The prince asked the little bird if he would stay with him that night.","The prince asked the little bird if would he stay with him that night.","The prince asked the little bird if he would stay with me that night."],"answer":0,"rule":"Yes/no question: <b>asked if<\/b>; <b>will<\/b> becomes <b>would<\/b>, <b>me<\/b> becomes <b>him<\/b>, <b>tonight<\/b> becomes <b>that night<\/b>."},{"qid":"c8-09-45","type":"change","level":5,"topic":"too_so","prompt":"Rewrite using 'so ... that'.","source":"The Swallow was too weak to fly to Egypt.","options":["The Swallow was so weak that he could fly to Egypt.","The Swallow was so weak that he cannot fly to Egypt.","The Swallow was so weak that he could not fly to Egypt."],"answer":2,"rule":"<b>too ... to<\/b> has a negative meaning, so add <b>could not<\/b> in the past: so weak that he <b>could not<\/b> fly."},{"qid":"c8-09-46","type":"proof","level":3,"topic":"nonfinite","prompt":"Find and fix the 2 errors in this paragraph.","words":["The","Swallow","was","fond","of","tell","stories","about","strange","lands.","The","prince","listened","carefully","and","wanted","to","knowing","more","about","the","people","of","his","city."],"errors":[{"i":5,"options":["telling","told","tells"],"answer":0},{"i":17,"options":["known","know","knew"],"answer":1}],"rule":"After <b>of<\/b>, use the gerund: <b>fond of telling<\/b>. After <b>to<\/b>, use the base verb: <b>to know<\/b>."},{"qid":"c8-09-47","type":"proof","level":4,"topic":"past_perfect","prompt":"Find and fix the 3 errors in this paragraph.","words":["When","the","officer","saw","the","statue,","he","said","that","it","look","like","a","beggar.","The","red","jewel","had","been","remove","from","its","waist,","and","somebody","has","taken","both","its","eyes."],"errors":[{"i":10,"options":["looking","looked","seen"],"answer":1},{"i":19,"options":["removed","removing","removes"],"answer":0},{"i":25,"options":["have","had","is"],"answer":1}],"rule":"After <b>said<\/b>, use the past: <b>looked<\/b>. <b>had been removed<\/b> (passive). Earlier past action: <b>had taken<\/b>."},{"qid":"c8-09-48","type":"proof","level":5,"topic":"reported","prompt":"Find and fix the 3 errors in this paragraph.","words":["The","Happy","Prince","asked","the","Swallow","if","he","can","stay","one","more","night.","The","Swallow","said","that","his","friends","were","waiting","for","he","in","Egypt","and","that","he","will","leave","the","next","day."],"errors":[{"i":8,"options":["will","could","may"],"answer":1},{"i":22,"options":["his","him","himself"],"answer":1},{"i":28,"options":["shall","is","would"],"answer":2}],"rule":"In reported speech <b>can<\/b> becomes <b>could<\/b> and <b>will<\/b> becomes <b>would<\/b>. After <b>for<\/b>, use the object pronoun <b>him<\/b>."},{"qid":"c8-09-49","type":"proof","level":5,"topic":"too_so","prompt":"Find and fix the 3 errors in this paragraph.","words":["The","winter","was","too","cold","for","the","little","bird","to","surviving","in","the","city.","The","prince","was","such","kind","that","he","gave","away","all","his","gold,","and","his","heart","was","so","heavy","than","it","broke."],"errors":[{"i":10,"options":["survive","survived","survives"],"answer":0},{"i":17,"options":["too","very","so"],"answer":2},{"i":32,"options":["then","that","as"],"answer":1}],"rule":"<b>too cold ... to survive<\/b> (base verb). <b>so<\/b> + adjective + <b>that<\/b>: <b>so kind that<\/b>, <b>so heavy that<\/b>."},{"qid":"c8-09-50","type":"proof","level":5,"topic":"nonfinite","prompt":"Find and fix the 2 errors in this paragraph.","words":["Surprisingly,","the","broken","heart","had","not","been","melt","by","the","fire.","The","workmen","had","no","choice","but","to","threw","it","away","with","the","dead","Swallow."],"errors":[{"i":7,"options":["melted","melting","melts"],"answer":0},{"i":18,"options":["thrown","throwing","throw"],"answer":2}],"rule":"Passive needs the past participle: <b>had not been melted<\/b>. After <b>to<\/b>, use the base verb: <b>to throw<\/b>."}]},{"id":"10","num":"3.1","title":"The Plate of Gold","unit":"Unit Three","topics":[{"tag":"passive_voice","name":"Passive voice (simple, perfect, continuous, modal)"},{"tag":"reported_speech","name":"Reported speech (statements, questions, commands, requests)"},{"tag":"relative_clauses","name":"Relative clauses (who, whom, whose, which)"},{"tag":"dependent_prepositions","name":"Prepositions after adjectives and verbs"}],"questions":[{"qid":"c8-10-01","type":"spot","level":1,"topic":"passive_voice","prompt":"Which sentence is in the correct passive form?","options":["The plate was given to the peasant.","The plate was give to the peasant.","The plate were given to the peasant."],"answer":0,"rule":"Passive = <b>was/were + past participle<\/b>. <b>The plate<\/b> is singular, so: <b>was given<\/b>."},{"qid":"c8-10-02","type":"spot","level":1,"topic":"dependent_prepositions","prompt":"Which sentence is correct?","options":["The peasant was not aware about the contest.","The peasant was not aware of the contest.","The peasant was not aware for the contest."],"answer":1,"rule":"We say <b>aware of<\/b> something."},{"qid":"c8-10-03","type":"fix","level":1,"topic":"relative_clauses","prompt":"One word is wrong. Find it and fix it.","words":["The","beggar","which","sat","by","the","gate","was","blind."],"errors":[{"i":2,"options":["whom","whose","who"],"answer":2}],"rule":"Use <b>who<\/b> for a person who does the action; <b>which<\/b> is for things and animals."},{"qid":"c8-10-04","type":"fix","level":1,"topic":"passive_voice","prompt":"One word is wrong. Find it and fix it.","words":["The","golden","plate","was","find","in","the","temple","court."],"errors":[{"i":4,"options":["found","finding","finds"],"answer":0}],"rule":"In the passive, <b>was<\/b> is followed by the past participle: <b>was found<\/b>."},{"qid":"c8-10-05","type":"fill","level":1,"topic":"dependent_prepositions","prompt":"Fill in the gap.","before":"The blind beggar was afraid","after":"the cold night.","options":["from","of","with"],"answer":1,"rule":"We are <b>afraid of<\/b> something."},{"qid":"c8-10-06","type":"fill","level":1,"topic":"passive_voice","prompt":"Fill in the gap.","before":"At last, the plate of gold","after":"on a kind man.","options":["was bestowed","bestowed","was bestowing"],"answer":0,"rule":"The plate does not bestow; it receives the action, so use the passive: <b>was bestowed<\/b>."},{"qid":"c8-10-07","type":"build","level":1,"topic":"relative_clauses","prompt":"Make a sentence with a relative clause.","answer":["Leigh","Hunt","wrote","the","poem","which","tells","this","story."],"alts":[],"rule":"<b>which tells this story<\/b> describes the noun <b>the poem<\/b>, so it comes right after it."},{"qid":"c8-10-08","type":"chat","level":1,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Mom","What did your teacher say about the test?"]],"options":["She said that it would be on Monday.","She said that it will being on Monday.","She said that it would is on Monday."],"answer":0,"rule":"After <b>said<\/b>, <b>will be<\/b> changes to <b>would be<\/b>. After would, use the base form <b>be<\/b>."},{"qid":"c8-10-09","type":"change","level":1,"topic":"passive_voice","prompt":"Change into passive voice.","source":"The priests made a proclamation.","options":["A proclamation is made by the priests.","A proclamation was make by the priests.","A proclamation was made by the priests."],"answer":2,"rule":"Simple past active <b>made<\/b> becomes <b>was made<\/b> in the passive."},{"qid":"c8-10-10","type":"change","level":1,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"The peasant said, \"I am happy.\"","options":["The peasant said that I was happy.","The peasant said that he were happy.","The peasant said that he was happy."],"answer":2,"rule":"<b>I<\/b> becomes <b>he<\/b> and <b>am<\/b> moves back to <b>was<\/b>."},{"qid":"c8-10-11","type":"spot","level":2,"topic":"relative_clauses","prompt":"Which sentence is correct?","options":["The man who estate went to the poor was kind.","The man whom estate went to the poor was kind.","The man whose estate went to the poor was kind."],"answer":2,"rule":"<b>whose<\/b> shows belonging: the man's estate = the man <b>whose<\/b> estate."},{"qid":"c8-10-12","type":"spot","level":2,"topic":"passive_voice","prompt":"Pick the correct passive sentence.","options":["The beggars were ignored by most pilgrims.","The beggars was ignored by most pilgrims.","The beggars were ignore by most pilgrims."],"answer":0,"rule":"<b>The beggars<\/b> is plural, so <b>were<\/b>, followed by the past participle <b>ignored<\/b>."},{"qid":"c8-10-13","type":"fix","level":2,"topic":"dependent_prepositions","prompt":"One word is wrong. Find it and fix it.","words":["Our","cricket","match","tomorrow","depends","in","the","weather."],"errors":[{"i":5,"options":["at","on","from"],"answer":1}],"rule":"The verb <b>depend<\/b> is always followed by <b>on<\/b>."},{"qid":"c8-10-14","type":"fix","level":2,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["Aditi","said","that","she","will","visit","Benares","the","following","week."],"errors":[{"i":4,"options":["shall","is","would"],"answer":2}],"rule":"After a past reporting verb like <b>said<\/b>, <b>will<\/b> changes to <b>would<\/b>."},{"qid":"c8-10-15","type":"fill","level":2,"topic":"reported_speech","prompt":"Fill in the gap.","before":"Meera told me that she","after":"the poem the day before.","options":["has read","had read","reads"],"answer":1,"rule":"<b>the day before<\/b> is earlier than the telling, so use the past perfect: <b>had read<\/b>."},{"qid":"c n who does the action, use <b>who<\/b>."},{"qid":"c8-10-28","type":"chat","level":3,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Sister","What did Grandma ask you on the phone?"]],"options":["She asked me whether I had eaten lunch.","She asked me whether had I eaten lunch.","She asked me that whether I have eaten lunch."],"answer":0,"rule":"Reported yes/no question: <b>whether<\/b> + subject + verb (<b>I had eaten<\/b>), with no <b>that<\/b>."},{"qid":"c8-10-29","type":"change","level":3,"topic":"passive_voice","prompt":"Change into passive voice.","source":"The pilgrims have given many coins.","options":["Many coins have been given by the pilgrims.","Many coins has been given by the pilgrims.","Many coins have given by the pilgrims."],"answer":0,"rule":"Present perfect passive = <b>have/has been<\/b> + past participle. <b>Many coins<\/b> is plural: <b>have been given<\/b>."},{"qid":"c8-10-30","type":"proof","level":3,"topic":"relative_clauses","prompt":"Find and fix the 2 errors in this message.","words":["A","plate","of","gold","was","find","in","the","temple","court.","The","priests,","which","were","wise","men,","said","it","would","go","to","the","one","who","loved","best."],"errors":[{"i":5,"options":["finding","finds","found"],"answer":2},{"i":12,"options":["whose","who","whom"],"answer":1}],"rule":"Passive needs <b>was found<\/b>; the priests are people, so use <b>who<\/b>."},{"qid":"c8-10-31","type":"spot","level":4,"topic":"passive_voice","prompt":"Which sentence is correct?","options":["The coins were being thrown when the peasant arrived.","The coins were been thrown when the peasant arrived.","The coins was being thrown when the peasant arrived."],"answer":0,"rule":"Past continuous passive = <b>was/were being<\/b> + past participle. <b>Coins<\/b> is plural: <b>were being thrown<\/b>."},{"qid":"c8-10-32","type":"spot","level":4,"topic":"dependent_prepositions","prompt":"Which sentence is correct?","options":["Kiran has been interested in poetry since childhood.","Kiran has been interested on poetry since childhood.","Kiran have been interested in poetry since childhood."],"answer":0,"rule":"We say <b>interested in<\/b>. <b>Kiran<\/b> is singular, so use <b>has been<\/b>."},{"qid":"c8-10-33","type":"fix","level":4,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["Last","Sunday,","Mr","Rao","told","us","that","he","has","visited","Benares","the","week","before."],"errors":[{"i":8,"options":["have","was","had"],"answer":2}],"rule":"After the past verb <b>told<\/b>, the present perfect <b>has visited<\/b> moves back to <b>had visited<\/b>."},{"qid":"c8-10-34","type":"fill","level":4,"topic":"relative_clauses","prompt":"Fill in the gap.","before":"He was the kindest man","after":"the priests had ever met.","options":["whom","whose","which"],"answer":0,"rule":"The man is the object of <b>met<\/b>, so use the object form <b>whom<\/b>."},{"qid":"c8-10-35","type":"build","level":4,"topic":"passive_voice","prompt":"Make a sentence in the future passive.","answer":["The","plate","will","be","given","to","the","winner."],"alts":[],"rule":"Future passive = <b>will be<\/b> + past participle: <b>will be given<\/b>."},{"qid":"c8-10-36","type":"chat","level":4,"topic":"passive_voice","prompt":"Pick the correct reply.","chat":[["Coach","Can the match be played in this heavy rain?"]],"options":["No, it should postponed.","No, it should be postpone.","No, it should be postponed."],"answer":2,"rule":"Modal passive = <b>should be<\/b> + past participle: <b>should be postponed<\/b>."},{"qid":"c8-10-37","type":"chat","level":4,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Friend","What did the doctor tell you?"]],"options":["He told me rest for two days.","He told me to rest for two days.","He told me that rest for two days."],"answer":1,"rule":"A reported command uses <b>told + person + to + verb<\/b>: <b>told me to rest<\/b>."},{"qid":"c8-10-38","type":"change","level":4,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"The priest asked, \"Who loves best?\"","options":["The priest asked who loves best?","The priest asked who loved best.","The priest asked that who loved best."],"answer":1,"rule":"<b>loves<\/b> moves back to <b>loved<\/b>; no <b>that<\/b> and no question mark in a reported question."},{"qid":"c8-10-39","type":"proof","level":4,"topic":"dependent_prepositions","prompt":"Find and fix the 2 errors in this message.","words":["Last","year","our","school","collected","old","clothes","for","poor","families.","The","clothes","were","pack","by","the","students","and","sent","to","a","village","which","had","no","shop.","The","success","of","the","drive","depended","at","their","hard","work."],"errors":[{"i":13,"options":["packed","packing","packs"],"answer":0},{"i":32,"options":["in","on","for"],"answer":1}],"rule":"Passive: <b>were packed<\/b>. The verb <b>depend<\/b> takes <b>on<\/b>."},{"qid":"c8-10-40","type":"proof","level":4,"topic":"reported_speech","prompt":"Find and fix the 3 errors in this message.","words":["Yesterday","Grandpa","told","me","the","story","of","a","peasant","who","comforted","a","blind","beggar.","He","said","that","the","beggar","has","been","shunned","by","everyone.","Later","a","golden","plate","was","give","to","the","peasant","whom","loved","best."],"errors":[{"i":19,"options":["have","had","was"],"answer":1},{"i":29,"options":["given","gave","giving"],"answer":0},{"i":33,"options":["whose","which","who"],"answer":2}],"rule":"After <b>said<\/b>: <b>had been<\/b>. Passive: <b>was given<\/b>. The peasant does the loving, so <b>who<\/b>."},{"qid":"c8-10-41","type":"spot","level":5,"topic":"passive_voice","prompt":"Which sentence is correct?","options":["Neither the nobles nor the hermit were given the plate.","Neither the nobles or the hermit was given the plate.","Neither the nobles nor the hermit was given the plate."],"answer":2,"rule":"With <b>nei ":"c8-10-47","type":"change","level":5,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"The peasant said to the beggar, \"Please bear your troubles bravely.\"","options":["The peasant requested the beggar to bear his troubles bravely.","The peasant requested the beggar to bear your troubles bravely.","The peasant requested the beggar that bear his troubles bravely."],"answer":0,"rule":"A request becomes <b>requested + person + to + verb<\/b>, and <b>your<\/b> becomes <b>his<\/b>."},{"qid":"c8-10-48","type":"change","level":5,"topic":"relative_clauses","prompt":"Join using 'whose'.","source":"The beggar was blind. His hands were trembling.","options":["The beggar whose hands were trembling was blind.","The beggar who's hands were trembling was blind.","The beggar whose his hands were trembling was blind."],"answer":0,"rule":"<b>whose<\/b> replaces <b>his<\/b>, so do not repeat <b>his<\/b>. <b>who's<\/b> means <b>who is<\/b>."},{"qid":"c8-10-49","type":"proof","level":5,"topic":"passive_voice","prompt":"Find and fix the 3 errors in this message.","words":["Last","Monday","our","class","visit","an","old-age","home.","Fruit","and","books","were","gave","to","the","residents,","who","were","delighted","with","the","gifts.","One","lady,","which","had","been","a","teacher,","sang","an","old","song","for","us."],"errors":[{"i":4,"options":["visits","visiting","visited"],"answer":2},{"i":12,"options":["giving","given","give"],"answer":1},{"i":24,"options":["whose","whom","who"],"answer":2}],"rule":"<b>Last Monday<\/b>: <b>visited<\/b>. Passive: <b>were given<\/b>. A lady is a person: <b>who<\/b>."},{"qid":"c8-10-50","type":"proof","level":5,"topic":"reported_speech","prompt":"Find and fix the 3 errors in this message.","words":["Last","month","our","principal","said","that","the","annual","day","will","be","held","the","following","Friday.","She","asked","us","whether","we","have","finished","all","the","posters.","Every","poster","was","make","by","hand."],"errors":[{"i":9,"options":["would","shall","is"],"answer":0},{"i":20,"options":["has","having","had"],"answer":2},{"i":28,"options":["making","makes","made"],"answer":2}],"rule":"After <b>said/asked<\/b>: <b>will<\/b> becomes <b>would<\/b>, <b>have<\/b> becomes <b>had<\/b>. Passive: <b>was made<\/b>."}]},{"id":"11","num":"3.2","title":"The Kite Festival","unit":"Unit Three","topics":[{"tag":"tense_aspect","name":"Tense and aspect (progressive, perfect, perfect progressive)"},{"tag":"word_class","name":"Word forms: noun, verb, adjective, adverb"},{"tag":"passive_voice","name":"Passive voice in reports"},{"tag":"so_that_too_to","name":"so ... that / too ... to"}],"questions":[{"qid":"c8-11-01","type":"spot","level":1,"topic":"tense_aspect","prompt":"Pick the sentence with the correct verb form.","options":["Rohan are waiting for the right wind.","Rohan is wait for the right wind.","Rohan is waiting for the right wind."],"answer":2,"rule":"Present progressive = <b>is/am/are + verb-ing<\/b>. <b>Rohan<\/b> is singular: <b>is waiting<\/b>."},{"qid":"c8-11-02","type":"spot","level":1,"topic":"word_class","prompt":"Which sentence uses the correct word form?","options":["Our family celebrates Diwali with great joy.","Our family celebration Diwali with great joy.","Our family celebrity Diwali with great joy."],"answer":0,"rule":"The sentence needs a verb: <b>celebrates<\/b>. <b>Celebration<\/b> and <b>celebrity<\/b> are nouns."},{"qid":"c8-11-03","type":"fix","level":1,"topic":"tense_aspect","prompt":"One word is wrong. Find it and fix it.","words":["Look!","Many","people","is","flying","kites","on","the","terrace."],"errors":[{"i":3,"options":["was","has","are"],"answer":2}],"rule":"<b>People<\/b> is plural, so use <b>are flying<\/b>."},{"qid":"c8-11-04","type":"fix","level":1,"topic":"word_class","prompt":"One word is wrong. Find it and fix it.","words":["The","kite","festival","is","a","joyful","celebrate","in","Gujarat."],"errors":[{"i":6,"options":["celebratio "had","a","helper,","she","would","finishes","her","rounds","early.","If","it","rain","tonight,","the","deer","will","need","shelter.","If","I","were","older,","I","would","gladly","worked","with","her."],"errors":[{"i":8,"options":["finish","finished","finishing"],"answer":0},{"i":14,"options":["raining","rained","rains"],"answer":2},{"i":28,"options":["working","work","works"],"answer":1}],"rule":"would + base verb (<b>finish<\/b>, <b>work<\/b>). Type 1 if-part: If it <b>rains<\/b> tonight."}]},{"id":"15","num":"4.2","title":"Revolutionary Steps in Surgery","unit":"Unit Four","topics":[{"tag":"coordinators","name":"Co-ordinate clauses: and, but, or, so, yet"},{"tag":"correlatives","name":"not only ... but also / either ... or / neither ... nor"},{"tag":"comparison","name":"Degrees of comparison"},{"tag":"passive","name":"Passive voice (present and past)"},{"tag":"past_perfect","name":"Past perfect tense"}],"questions":[{"qid":"c8-15-01","type":"spot","level":1,"topic":"comparison","prompt":"Which sentence is correct?","options":["Sushruta Samhita is one of the most oldest books on surgery.","Sushruta Samhita is one of the oldest books on surgery.","Sushruta Samhita is one of the oldest book on surgery."],"answer":1,"rule":"<b>one of the<\/b> + superlative + <b>plural noun<\/b>: one of the oldest books. Never 'most oldest'."},{"qid":"c8-15-02","type":"spot","level":1,"topic":"coordinators","prompt":"Which sentence is correct?","options":["Seema had a fever, but so she stayed at home.","Seema had a fever, so she stay at home.","Seema had a fever, so she stayed at home."],"answer":2,"rule":"Use one co-ordinator (<b>so<\/b> shows result) and keep both clauses in the past: stayed."},{"qid":"c8-15-03","type":"fix","level":1,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["The","new","hospital","is","big","than","the","old","one."],"errors":[{"i":4,"options":["biggest","large","bigger"],"answer":2}],"rule":"Comparing two things with <b>than<\/b> needs the comparative: <b>bigger<\/b> than."},{"qid":"c8-15-04","type":"fix","level":1,"topic":"passive","prompt":"One word is wrong. Find it and fix it.","words":["The","patient","was","take","to","the","operation","theatre."],"errors":[{"i":3,"options":["taken","took","takes"],"answer":0}],"rule":"Passive: was + past participle: was <b>taken<\/b>."},{"qid":"c8-15-05","type":"fill","level":1,"topic":"correlatives","prompt":"Fill in the gap.","before":"You can","after":"take the bus or walk to the clinic.","options":["neither","either","both"],"answer":1,"rule":"<b>either ... or<\/b> gives a choice. 'neither' pairs with 'nor'; 'both' with 'and'."},{"qid":"c8-15-06","type":"fill","level":1,"topic":"past_perfect","prompt":"Fill in the gap.","before":"When the doctor arrived, the nurse","after":"already cleaned the wound.","options":["has","had","have"],"answer":1,"rule":"The earlier of two past actions takes the past perfect: <b>had<\/b> cleaned."},{"qid":"c8-15-07","type":"build","level":1,"topic":"coordinators","prompt":"Join the two clauses.","answer":["Riya","was","nervous,","but","she","smiled."],"alts":[],"rule":"Two independent clauses joined by the co-ordinator <b>but<\/b> to show contrast."},{"qid":"c8-15-08","type":"chat","level":1,"topic":"passive","prompt":"Pick the correct reply.","chat":[["Kavya","Did your grandfather have an operation?"]],"options":["Yes, he was operate on last month.","Yes, he is operated on last month.","Yes, he was operated on last month."],"answer":2,"rule":"Past passive: <b>was<\/b> + past participle: he was <b>operated<\/b> on last month."},{"qid":"c8-15-09","type":"change","level":1,"topic":"coordinators","prompt":"Join using 'so'.","source":"There was a lack of technology. Major surgery could not develop.","options":["There was a lack of technology, so major surgery can not develop.","So there was a lack of technology, major surgery could not develop.","There was a lack of technology, so major surgery could not develop."],"answer":2,"rule":"<b>so<\/b> comes before the result clause, and the tense stays the same: could not develop."},{"qid":"c8-15-10","type":"change","level":1,"topic":"comparison","prompt":"Change into the comparative degree.","source":"Neurosurgery is the most difficult branch of surgery.","options":["Neurosurgery is more difficult than any branch of surgery.","Neurosurgery is more difficult than any other branch of surgery.","Neurosurgery is most difficult than any other branch of surgery."],"answer":1,"rule":"Superlative → comparative: <b>more ... than any other<\/b> + singular noun."},{"qid":"c8-15-11","type":"spot","level":2,"topic":"correlatives","prompt":"Which sentence is correct?","options":["Neither the doctor nor the nurses were tired.","Neither the doctor or the nurses were tired.","Neither the doctor nor the nurses was tired."],"answer":0,"rule":"<b>neither ... nor<\/b>; the verb agrees with the nearer subject (nurses → <b>were<\/b>)."},{"qid":"c8-15-12","type":"spot","level":2,"topic":"past_perfect","prompt":"Pick the sentence with the correct tense.","options":["The surgery had began before I reached the hospital.","The surgery has begun before I reached the hospital.","The surgery had begun before I reached the hospital."],"answer":2,"rule":"Earlier past action: had + past participle: had <b>begun<\/b> (begin - began - begun)."},{"qid":"c8-15-13","type":"fix","level":2,"topic":"coordinators","prompt":"One word is wrong. Find it and fix it.","words":["You","can","rest","at","home","or","you","can","walks","in","the","park."],"errors":[{"i":8,"options":["walk","walked","walking"],"answer":0}],"rule":"Each co-ordinate clause is complete: can + base verb, so you can <b>walk<\/b>."},{"qid":"c8-15-14","type":"fill","level":2,"topic":"comparison","prompt":"Fill in the gap.","before":"For many patients, robotic surgery is","after":"than open surgery.","options":["safest","safer","safe"],"answer":1,"rule":"<b>than<\/b> needs the comparative degree: <b>safer<\/ d fix it.","words":["Ravi","runs","as","fastest","as","a","deer."],"errors":[{"i":3,"options":["faster","fast","quickest"],"answer":1}],"rule":"Between <b>as ... as<\/b> we use the plain form: <b>as fast as<\/b>."},{"qid":"c8-16-04","type":"fill","level":1,"topic":"as_as","prompt":"Fill in the gap.","before":"The old tortoise moved as","after":"as a snail.","options":["slow","slower","slowest"],"answer":0,"rule":"<b>as + plain adjective + as<\/b>: as slow as a snail."},{"qid":"c8-16-05","type":"fill","level":1,"topic":"relative","prompt":"Fill in the gap.","before":"Bees are insects","after":"live in large groups.","options":["which","whom","whose"],"answer":0,"rule":"For animals and things the subject relative pronoun is <b>which<\/b> (or that)."},{"qid":"c8-16-06","type":"build","level":1,"topic":"passive","prompt":"Make a sentence in the passive voice.","answer":["The","hive","was","built","by","the","bees."],"alts":[],"rule":"Passive: object first, then <b>was + past participle<\/b>, then <b>by<\/b> + the doer."},{"qid":"c8-16-07","type":"chat","level":1,"topic":"as_as","prompt":"Pick the correct reply.","chat":[["Kabir","How was your new cousin at the party?"]],"options":["He was as quietly as a mouse all evening.","He was as quiet as a mouse all evening.","He were as quiet as a mouse all evening."],"answer":1,"rule":"After <b>was<\/b> we need an adjective: <b>as quiet as<\/b>. With <b>he<\/b> use <b>was<\/b>."},{"qid":"c8-16-08","type":"chat","level":1,"topic":"passive","prompt":"Pick the correct reply.","chat":[["Mrs Joshi","Who painted this lovely poster of bees?"]],"options":["It was paint by Sana and me.","It were painted by Sana and me.","It was painted by Sana and me."],"answer":2,"rule":"Past passive with a singular subject: <b>it was painted<\/b>."},{"qid":"c8-16-09","type":"change","level":1,"topic":"passive","prompt":"Change into passive voice.","source":"Bees collect nectar.","options":["Nectar was collected by bees.","Nectar is collect by bees.","Nectar is collected by bees."],"answer":2,"rule":"Simple present active becomes <b>is/are + past participle<\/b>: nectar <b>is collected<\/b>."},{"qid":"c8-16-10","type":"change","level":1,"topic":"as_as","prompt":"Rewrite using 'not as ... as'.","source":"A giraffe is taller than a horse.","options":["A horse is not as tall as a giraffe.","A horse is as tall as a giraffe.","A horse is not as taller as a giraffe."],"answer":0,"rule":"Swap the two and use <b>not as + plain adjective + as<\/b>: a horse is <b>not as tall as<\/b> a giraffe."},{"qid":"c8-16-11","type":"spot","level":2,"topic":"relative","prompt":"Pick the sentence with the correct relative pronoun.","options":["The boy which keeps bees lives next door.","The boy who keeps bees lives next door.","The boy whose keeps bees lives next door."],"answer":1,"rule":"For a person use <b>who<\/b> as the subject of the clause."},{"qid":"c8-16-12","type":"spot","level":2,"topic":"adj_adv","prompt":"Which sentence is correct?","options":["The porter bees carried their heavy burdens carefully.","The porter bees carried their heavy burdens careful.","The porter bees carried their heavily burdens carefully."],"answer":0,"rule":"An adjective describes a noun (<b>heavy<\/b> burdens); an adverb describes a verb (carried <b>carefully<\/b>)."},{"qid":"c8-16-13","type":"fix","level":2,"topic":"agreement","prompt":"One word is wrong. Find it and fix it.","words":["Hundreds","of","bees","buzzes","around","our","mango","tree","every","morning."],"errors":[{"i":3,"options":["buzzing","buzz","buzzer"],"answer":1}],"rule":"<b>Hundreds of bees<\/b> is plural, so the verb is <b>buzz<\/b>, not buzzes."},{"qid":"c8-16-14","type":"fix","level":2,"topic":"passive","prompt":"One word is wrong. Find it and fix it.","words":["The","honey","was","collect","by","the","farmer","yesterday."],"errors":[{"i":3,"options":["collecting","collected","collects"],"answer":1}],"rule":"Passive needs the past participle: <b>was collected<\/b>."},{"qid":"c8- ural (three beehives). Passive: honey <b>is sold<\/b>."},{"qid":"c8-16-21","type":"spot","level":3,"topic":"as_as","prompt":"Which sentence is correct?","options":["The elephant is not as bigger as the blue whale.","The elephant is not as big than the blue whale.","The elephant is not as big as the blue whale."],"answer":2,"rule":"The pattern is <b>not as + plain adjective + as<\/b>, never 'than' and never -er."},{"qid":"c8-16-22","type":"fix","level":3,"topic":"relative","prompt":"One word is wrong. Find it and fix it.","words":["The","girl","whom","won","the","quiz","is","my","cousin."],"errors":[{"i":2,"options":["which","whose","who"],"answer":2}],"rule":"The girl did the winning, so the relative pronoun is the subject: <b>who<\/b>, not whom."},{"qid":"c8-16-23","type":"fix","level":3,"topic":"adj_adv","prompt":"One word is wrong. Find it and fix it.","words":["The","soldier","bees","marched","merry","back","to","the","hive."],"errors":[{"i":4,"options":["merrier","merrily","merriment"],"answer":1}],"rule":"<b>merrily<\/b> (adverb) tells us how they marched."},{"qid":"c8-16-24","type":"fill","level":3,"topic":"relative","prompt":"Fill in the gap.","before":"Sunita is the girl","after":"bees won a prize at the fair.","options":["who","whose","which"],"answer":1,"rule":"<b>whose<\/b> shows possession: the bees belong to the girl."},{"qid":"c8-16-25","type":"build","level":3,"topic":"as_as","prompt":"Put the words in order.","answer":["Our","coach","is","not","so","strict","as","yours."],"alts":[],"rule":"After <b>not<\/b> we can use <b>so ... as<\/b>: not so strict as."},{"qid":"c8-16-26","type":"chat","level":3,"topic":"as_as","prompt":"Pick the correct reply.","chat":[["Anil","Is the new bus as fast as the old one?"]],"options":["No, it is not as fast as the old one.","No, it is not as faster as the old one.","No, it does not as fast as the old one."],"answer":0,"rule":"Answer an <b>is<\/b> question with <b>is not as fast as<\/b>; keep the plain adjective."},{"q omplex and compound sentences"},{"tag":"noun_verb","name":"Words used as nouns and verbs"},{"tag":"conditionals","name":"Conditionals (type 1 and type 2)"},{"tag":"not_only","name":"Not only ... but also"}],"questions":[{"qid":"c8-17-01","type":"spot","level":1,"topic":"voice","prompt":"Which sentence is correct?","options":["The letter was sent by Ramanujan.","The letter was send by Ramanujan.","The letter were sent by Ramanujan."],"answer":0,"rule":"Passive = <b>was/were + past participle<\/b>. One letter: <b>was sent<\/b>."},{"qid":"c8-17-02","type":"spot","level":1,"topic":"noun_verb","prompt":"Which sentence is correct?","options":["Our class paid a visiting to the science museum.","Our class paid a visits to the science museum.","Our class paid a visit to the science museum."],"answer":2,"rule":"Here <b>visit<\/b> is a noun: <b>a visit<\/b> (singular after 'a')."},{"qid":"c8-17-03","type":"fix","level":1,"topic":"voice","prompt":"One word is wrong. Find it and fix it.","words":["The","envelope","was","decorate","with","Indian","stamps."],"errors":[{"i":3,"options":["decorated","decorating","decorates"],"answer":0}],"rule":"Passive needs the past participle: <b>was decorated<\/b>."},{"qid":"c8-17-04","type":"fill","level":1,"topic":"not_only","prompt":"Fill in the gap.","before":"Hardy was not only bored","after":"irritated.","options":["and also","but also","or else"],"answer":1,"rule":"<b>not only<\/b> always pairs with <b>but also<\/b>."},{"qid":"c8-17-05","type":"fill","level":1,"topic":"conditionals","prompt":"Fill in the gap.","before":"If you practise every day, you","after":"improve at maths.","options":["would","would have","will"],"answer":2,"rule":"Type 1: <b>if + present, will + verb<\/b>: If you practise, you <b>will<\/b> improve."},{"qid":"c8-17-06","type":"build","level":1,"topic":"sentence_types","prompt":"Make a compound sentence.","answer":["Ravi","was","tired,","but","he","finished","his","homework."],"alts":[],"rule":"A compound sentence joins two main clauses with a coordinator like <b>but<\/b>."},{"qid":"c8-17-07","type":"chat","level":1,"topic":"voice","prompt":"Pick the correct reply.","chat":[["Meera","Who wrote this letter to Hardy?"]],"options":["It was wrote by Ramanujan.","It written by Ramanujan.","It was written by Ramanujan."],"answer":2,"rule":"Passive: <b>was + past participle<\/b>. The participle of write is <b>written<\/b>."},{"qid":"c8-17-08","type":"chat","level":1,"topic":"conditionals","prompt":"Pick the correct reply.","chat":[["Kabir","Can you help me with the maths puzzle this evening?"]],"options":["Sure, if Mum will let me go out, I help you.","Sure, if Mum lets me go out, I helped you.","Sure, if Mum lets me go out, I will help you."],"answer":2,"rule":"Type 1: present tense after <b>if<\/b>, <b>will<\/b> in the main clause."},{"qid":"c8-17-09","type":"change","level":1,"topic":"voice","prompt":"Change into passive voice.","source":"Hardy taught Ramanujan.","options":["Ramanujan is taught by Hardy.","Ramanujan was taught by Hardy.","Ramanujan was teach by Hardy."],"answer":1,"rule":"Simple past active becomes <b>was/were + past participle<\/b>: was taught."},{"qid":"c8-17-10","type":"change","level":1,"topic":"voice","prompt":"Change into active voice.","source":"Hardy was bored by that manuscript.","options":["That manuscript bores Hardy.","That manuscript was bored Hardy.","That manuscript bored Hardy."],"answer":2,"rule":"The doer (the manuscript) becomes the subject; keep the past tense: <b>bored<\/b>."},{"qid":"c8-17-11","type":"spot","level":2,"topic":"sentence_types","prompt":"Which compound sentence is correct?","options":["Asha likes maths, but her brother like music.","Asha likes maths, but her brother liking music.","Asha likes maths, but her brother likes music."],"answer":2,"rule":"Each clause of a compound sentence needs its own correct verb: her brother <b>likes<\/b>."},{"qid":"c8-17-12","type":"spot","level":2,"topic":"noun_verb","prompt":"Which sentence is correct?","options":["Hardy wrote a report on the new theorems.","Hardy wrote a reported on the new theorems.","Hardy wrote report on the new theorems."],"answer":0,"rule":"Here <b>report<\/b> is a noun, so it needs an article: <b>a report<\/b>."},{"qid":"c8-17-13","type":"fix","level":2,"topic":"noun_verb","prompt":"One word is wrong. Find it and fix it.","words":["Grandpa","likes","to","watched","cricket","on","Sundays."],"errors":[{"i":3,"options":["watch","watching","watches"],"answer":0}],"rule":"After <b>to<\/b> use the base form of the verb: to <b>watch<\/b>."},{"qid":"c8-17-14","type":"fix","level":2,"topic":"conditionals","prompt":"One word is wrong. Find it and fix it.","words":["If","it","rains","tomorrow,","we","will","stayed","at","home."],"errors":[{"i":6,"options":["staying","stay","stays"],"answer":1}],"rule":"After <b>will<\/b> use the base form: will <b>stay<\/b>."},{"qid":"c8-17-15","type":"fill","level":2,"topic":"voice","prompt":"Fill in the gap.","before":"Ramanujan","after":"a Fellow of the Royal Society at thirty.","options":["elected","was elected","was elect"],"answer":1,"rule":"The Society elected him, so he <b>was elected<\/b> (passive)."},{"qid":"c8-17-16","type":"fill","level":2,"topic":"noun_verb","prompt":"Fill in the gap.","before":"The party was a big","after":"for Grandma.","options":["surprise","surprised","surprising"],"answer":0,"rule":"After <b>a big<\/b> we need a noun: <b>a big surprise<\/b>."},{"qid":"c8-17-17","type":"build","level":2,"topic":"voice","prompt":"Make a sentence in the passive voice.","answer":["The","theorems","were","checked","by","Littlewood."],"alts":[],"rule":"Plural subject: <b>were checked<\/b>, then <b>by<\/b> + the doer."},{"qid":"c8-17-18","type":"chat","level":2,"topic":"not_only","prompt":"Pick the correct reply.","chat":[["Ms Iyer","How did the team do in the maths quiz?"]],"options":["They not only won but also set a record.","They not only won but also sets a record.","They not only won but set als ":"Hardy opened the envelope and found sheets of symbols.","options":["When Hardy opened the envelope, he finds sheets of symbols.","When Hardy opened the envelope, he found sheets of symbols.","When Hardy opened the envelope, and he found sheets of symbols."],"answer":1,"rule":"<b>When<\/b> makes one clause dependent, so drop 'and' and keep the past tense."},{"qid":"c8-17-30","type":"proof","level":3,"topic":"not_only","prompt":"Find and fix the 2 errors in this message.","words":["Hi","Sana!","If","both","Aman","and","Divya","comes","early","tomorrow,","we","can","practise","for","the","quiz.","Our","team","must","not","only","answer","fast","and","also","answer","correctly."],"errors":[{"i":7,"options":["coming","come","came"],"answer":1},{"i":23,"options":["or","so","but"],"answer":2}],"rule":"<b>Both<\/b> Aman and Divya are two people, so <b>come<\/b>; <b>not only<\/b> pairs with <b>but also<\/b>."},{"qid":"c8-17-31","type":"spot","level":4,"topic":"voice","prompt":"Which sentence is correct?","options":["Ramanujan's notebooks has been studied by many mathematicians.","Ramanujan's notebooks have been studied by many mathematicians.","Ramanujan's notebooks have been study by many mathematicians."],"answer":1,"rule":"Plural subject + present perfect passive: <b>have been studied<\/b>."},{"qid":"c8-17-32","type":"spot","level":4,"topic":"conditionals","prompt":"Which sentence is correct?","options":["If our school had a telescope, we will watch the stars every night.","If our school has a telescope, we would watch the stars every night.","If our school had a telescope, we would watch the stars every night."],"answer":2,"rule":"Type 2: <b>if + past, would + verb<\/b>. Do not mix had with will, or has with would."},{"qid":"c8-17-33","type":"fix","level":4,"topic":"noun_verb","prompt":"One word is wrong. Find it and fix it.","words":["Ramanujan's","mother","had","a","dream","which","surprise","everyone","in","the","family."],"errors":[{"i":6,"options":["surprising","
