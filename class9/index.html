","level":1,"topic":"adj_preposition","prompt":"Which sentence is correct?","options":["The Greeks were tired of the long war.","The Greeks were tired on the long war.","The Greeks were tired at the long war."],"answer":0,"rule":"When you have had enough of something, you are <b>tired of<\/b> it."},{"qid":"c9-09-03","type":"fix","level":1,"topic":"too_enough_so_that","prompt":"One word is wrong. Find it and fix it.","words":["The","walls","were","so","high","than","no","enemy","could","climb","them."],"errors":[{"i":5,"options":["as","then","that"],"answer":2}],"rule":"The pair is <b>so<\/b> ... <b>that<\/b>: so high that no enemy could climb them."},{"qid":"c9-09-04","type":"fix","level":1,"topic":"adj_preposition","prompt":"One word is wrong. Find it and fix it.","words":["Arjun","is","very","fond","of","read","old","Greek","myths."],"errors":[{"i":5,"options":["reads","reading","reader"],"answer":1}],"rule":"After a preposition (<b>fond of<\/b>), a verb takes the -ing form: <b>fond of reading<\/b>."},{"qid":"c9-09-05","type":"fill","level":1,"topic":"adj_preposition","prompt":"Fill in the gap.","before":"Odysseus was famous","after":"his clever tricks.","options":["of","for","with"],"answer":1,"rule":"We are <b>famous for<\/b> something we are known for."},{"qid":"c9-09-06","type":"fill","level":1,"topic":"too_enough_so_that","prompt":"Fill in the gap.","before":"The horse was big","after":"to hold many soldiers.","options":["too","enough","so"],"answer":1,"rule":"<b>enough<\/b> comes after the adjective: big enough to hold."},{"qid":"c9-09-07","type":"build","level":1,"topic":"too_enough_so_that","prompt":"Make a sentence with 'too'.","answer":["The","gates","were","too","narrow","for","the","horse."],"alts":[],"rule":"<b>too narrow for<\/b> + noun shows that something is more than the limit."},{"qid":"c9-09-08","type":"chat","level":1,"topic":"adj_preposition","prompt":"Pick the correct reply.","chat":[["Tara","Why did the Trojans open their gates?"]],"options":["They were tired of staying inside the walls.","They were tired of stay inside the walls.","They were tired on staying inside the walls."],"answer":0,"rule":"<b>tired of<\/b> + -ing form: tired of staying."},{"qid":"c9-09-09","type":"chat","level":1,"topic":"conditional_3","prompt":"Pick the correct reply.","chat":[["Om","Could the Trojans have saved their city?"]],"options":["Yes, if they listen to the priest, they would have saved it.","Yes, if they had listened to the priest, they will save it.","Yes, if they had listened to the priest, they would have saved it."],"answer":2,"rule":"Third conditional: <b>if + had + past participle<\/b>, <b>would have + past participle<\/b>."},{"qid":"c9-09-10","type":"change","level":1,"topic":"too_enough_so_that","prompt":"Rewrite using 'too ... to'.","source":"The horse was so big that it could not go through the gate.","options":["The horse was too big to not go through the gate.","The horse was too big to go through the gate.","The horse was too big that it go through the gate."],"answer":1,"rule":"<b>too ... to<\/b> already has a negative meaning, so drop 'not': too big to go."},{"qid":"c9-09-11","type":"spot","level":2,"topic":"clauses","prompt":"Which sentence is correct?","options":["Homer was a blind poet which wandered from city to city.","Homer was a blind poet who he wandered from city to city.","Homer was a blind poet who wandered from city to city."],"answer":2,"rule":"For a person, the adjective clause starts with <b>who<\/b>, and 'who' is its subject (no extra 'he')."},{"qid":"c9-09-12","type":"spot","level":2,"topic":"conditional_3","prompt":"Which sentence is correct?","options":["If the Trojans had burnt the horse, the Greeks would have fail.","If the Trojans would have burnt the horse, the Greeks would have failed.","If the Trojans had burnt the horse, the Greeks would have failed."],"answer":2,"rule":"No 'would' in the if-clause. Use <b>had burnt<\/b> ... <b>would have failed<\/b>."},{"qid":"c9-09-13","type":"fix","level":2,"topic":"too_enough_so_that","prompt":"One word is wrong. Find it and fix it.","words":["That","day","the","Trojans","were","so","excited","that","they","pay","no","attention","to","the","priest."],"errors":[{"i":9,"options":["paid","pays","paying"],"answer":0}],"rule":"'That day' and 'were' are past, so the 'that' clause is also past: <b>paid<\/b>."},{"qid":"c9-09-14","type":"fix","level":2,"topic":"clauses","prompt":"One word is wrong. Find it and fix it.","words":["Achilles","was","a","hero","which","nobody","could","defeat."],"errors":[{"i":4,"options":["whose","whom","where"],"answer":1}],"rule":"A hero is a person, and here he is the object of 'defeat', so use <b>whom<\/b> (or who/that)."},{"qid":"c9-09-15","type":"fill","level":2,"topic":"adj_preposition","prompt":"Fill in the gap.","before":"The Trojans were delighted","after":"the news of peace.","options":["at","to","on"],"answer":0,"rule":"We say <b>delighted at<\/b> (or with) the news, not 'to' or 'on'."},{"qid":"c9-09-16","type":"fill","level":2,"topic":"conditional_3","prompt":"Fill in the gap.","before":"If the Greeks had not used a trick, they","after":"Troy.","options":["might never take","might never have taken","had never taken"],"answer":1,"rule":"The result of an unreal past is <b>might/would have + past participle<\/b>."},{"qid":"c9-09-17","type":"build","level":2,"topic":"clauses","prompt":"Make a sentence with an adjective clause.","answer":["Homer","was","a","poet","who","could","not","see."],"alts":[],"rule":"<b>who could not see<\/b> is an adjective clause describing 'a poet'."},{"qid":"c9-09-18","type":"chat","level":2,"topic":"too_enough_so_that","prompt":"Pick the correct reply.","chat":[["Mitali","Can your little brother read The Iliad?"]],"options":["No, he is too young to understand it.","No, he is too young that he understands it.","No, he is not enough old to understand it."],"answer":0,"rule":"Use <b>too young to<\/b>, or 'not old enough to'. 'enough' goes after the adjective."},{"qid":"c9-09-19","type":"change","level":2,"topic":"too_enough_so_that","prompt":"Rewrite using 'enough'.","source":"The wall was so broad that people could walk on it.","options":["The wall was broad enough for people to walk on.","The wall was enough broad for people to walk on.","The wall was broad enough that people to walk on."],"answer":0,"rule":"Adjective + <b>enough<\/b> + <b>for<\/b> someone + <b>to<\/b> + verb: broad enough for people to walk on."},{"qid":"c9-09-20","type":"change","level":2,"topic":"clauses","prompt":"Join using 'which'.","source":"Troy was a rich city. It stood near the sea.","options":["Troy was a rich city which it stood near the sea.","Troy was a rich city who stood near the sea.","Troy was a rich city which stood near the sea."],"answer":2,"rule":"<b>which<\/b> replaces 'It', so 'it' is dropped. Use 'which' for a place or thing."},{"qid":"c9-09-21","type":"spot","level":3,"topic":"adj_preposition","prompt":"Which sentence is correct?","options":["Menelaus was angry on Paris for taking Helen away.","Menelaus was angry with Paris for take Helen away.","Menelaus was angry with Paris for taking Helen away."],"answer":2,"rule":"We are <b>angry with<\/b> a person, and after 'for' we use the -ing form: <b>for taking<\/b>."},{"qid":"c9-09-22","type":"spot","level":3,"topic":"clauses","prompt":"Which sentence has the correct noun clause?","options":["The Trojans wondered how had the horse been built.","The Trojans wondered how the horse had been built.","The Trojans wondered how the horse had been build."],"answer":1,"rule":"A noun clause uses statement order (subject before helper): <b>how the horse had been built<\/b>."},{"qid":"c9-09-23","type":"fix","level":3,"topic":"conditional_3","prompt":"One word is wrong. Find it and fix it.","words":["If","the","priest","had","been","heard,","the","city","would","not","have","burn","down."],"errors":[{"i":11,"options":["burning","burns","burnt"],"answer":2}],"rule":"After <b>would not have<\/b>, use the past participle: <b>burnt<\/b> down (or burned)."},{"qid":"c9-09-24","type":"fix","level":3,"topic":"too_enough_so_that","prompt":"One word is wrong. Find it and fix it.","words":["The","horse","was","too","heavy","for","ten","men","to","lifted","without","ropes."],"errors":[{"i":9,"options":["lifting","lifts","lift"],"answer":2}],"rule":"After <b>to<\/b> in 'too ... to', use the base form: <b>to lift<\/b>."},{"qid":"c9-09-25","type":"fill","level":3,"topic":"too_enough_so_that","prompt":"Fill in the gap.","before":"The Greek ships were","after":"far away that nobody could see them.","options":["so","too","such"],"answer":0,"rule":"Adjective/adverb + 'that' clause: <b>so far away that<\/b>. 'such' needs a noun; 'too' takes 'to'."},{"qid":"c9-09-26","type":"build","level":3,"topic":"conditional_3","prompt":"Make a third conditional sentence.","answer":["If","they","had","listened,","Troy","would","have","survived."],"alts":[],"rule":"<b>If + had + past participle<\/b>, <b>would have + past participle<\/b>."},{"qid":"c9-09-27","type":"chat","level":3,"topic":"clauses","prompt":"Pick the correct reply.","chat":[["Isha","Do you know who built the wooden horse?"]],"options":["Yes, a skilful engineer, which knew its secret door.","Yes, a skilful engineer who knew its secret door.","Yes, a skilful engineer who he knew its secret door."],"answer":1,"rule":"An engineer is a person, so use <b>who<\/b>; 'who' is the subject, so no extra 'he'."},{"qid":"c9-09-28","type":"chat","level":3,"topic":"adj_preposition","prompt":"Pick the correct reply.","chat":[["Coach","Why didn't Kunal play today?"]],"options":["He was afraid of hurting his ankle again.","He was afraid for hurt his ankle again.","He was afraid of hurt his ankle again."],"answer":0,"rule":"<b>afraid of<\/b> + -ing form: afraid of hurting."},{"qid":"c9-09-29","type":"change","level":3,"topic":"conditional_3","prompt":"Combine using 'If' (third conditional).","source":"The Trojans broke the wall. So the Greeks got inside.","options":["If the Trojans did not break the wall, the Greeks would not have got inside.","If the Trojans had not broke the wall, the Greeks would not have got inside.","If the Trojans had not broken the wall, the Greeks would not have got inside."],"answer":2,"rule":"Turn the past fact into its opposite: <b>had not broken<\/b> ..., <b>would not have got<\/b> ..."},{"qid":"c9-09-30","type":"proof","level":3,"topic":"too_enough_so_that","prompt":"Find and fix the 2 errors in this message.","words":["That","morning,","the","Trojans","were","so","happy","that","they","open","the","gates.","They","were","surprised","to","seen","a","huge","wooden","horse","on","the","shore."],"errors":[{"i":9,"options":["opens","opened","opening"],"answer":1},{"i":16,"options":["saw","see","seeing"],"answer":1}],"rule":"The story is past, so <b>they opened<\/b>. After 'to', use the base form: <b>to see<\/b>."},{"qid":"c9-09-31","type":"spot","level":4,"topic":"too_enough_so_that","prompt":"Which sentence is correct?","options":["The priest was too wise to be fooled by the trick.","The priest was too wise to be fool by the trick.","The priest was too wise for be fooled by the trick."],"answer":0,"rule":"too ... <b>to<\/b> + passive infinitive: <b>to be fooled<\/b> (be + past participle)."},{"qid":"c9-09-32","type":"fix","level":4,"topic":"clauses","prompt":"One word is wrong. Find it and fix it.","words":["The","Greek","who","was","left","behind","pretend","to","be","very","frightened."],"errors":[{"i":6,"options":["pretended","pretending","pretender"],"answer":0}],"rule":"The main verb of 'The Greek' must be past like the clause: <b>pretended<\/b>."},{"qid":"c9-09-33","type":"fill","level":4,"topic":"adj_preposition","prompt":"Fill in the gap.","before":"Hector was not only brave but also capable","after":"leading an army.","options":["to","for","of"],"answer":2,"rule":"We say <b>capable of<\/b> + -ing form."},{"qid":"c9-09-34","type":"fill","level":4,"topic":"clauses","prompt":"Fill in the gap.","before":"The Trojans did not know","after":"the Greeks had really gone.","options":["unless","whether","what"],"answer":1,"rule":"A yes/no doubt becomes a noun clause with <b>whether<\/b> (or if)."},{"qid":"c9-09-35","type":"build","level":4,"topic":"too_enough_so_that","prompt":"Make a sentence with 'so ... that'.","answer":["They","were","so","excited","that","they","forgot","everything."],"alts":[],"rule":"<b>so<\/b> + adjective + <b>that<\/b> + result clause."},{"qid":"c9-09-36","type":"chat","level":4,"topic":"conditional_3","prompt":"Pick the correct reply.","chat":[["Aai","You missed the school bus again!"]],"options":["Sorry, if I had woken up early, I would have caught it.","Sorry, if I wake up early, I would have caught it.","Sorry, if I had woken up early, I will catch it."],"answer":0,"rule":"Regret about the past: <b>if I had woken<\/b> ..., <b>I would have caught<\/b> ..."},{"qid":"c9-09-37","type":"chat","level":4,"topic":"adj_preposition","prompt":"Pick the correct reply.","chat":[["Rina","Are you ready for the history quiz on Troy?"]],"options":["Yes, I'm quite good at remembering names and dates.","Yes, I'm quite good on remembering names and dates.","Yes, I'm quite good at remember names and dates."],"answer":0,"rule":"<b>good at<\/b> + -ing form: good at remembering."},{"qid":"c9-09-38","type":"change","level":4,"topic":"too_enough_so_that","prompt":"Remove 'too'.","source":"The gates were too narrow for the horse to pass through.","options":["The gates were so narrow that the horse can not pass through them.","The gates were so narrow that the horse could not pass through them.","The gates were so narrow that the horse could pass through them."],"answer":1,"rule":"<b>too ... to<\/b> becomes <b>so ... that ... could not<\/b> (past, negative)."},{"qid":"c9-09-39","type":"proof","level":4,"topic":"adj_preposition","prompt":"Find and fix the 2 errors in this message.","words":["Odysseus","was","famous","for","plan","clever","tricks.","He","knew","that","the","Trojans","would","never","open","the","gates","unless","they","believed","that","the","Greeks","has","left."],"errors":[{"i":4,"options":["plans","planning","planned"],"answer":1},{"i":23,"options":["have","having","had"],"answer":2}],"rule":"<b>famous for<\/b> + -ing form: <b>planning<\/b>. An earlier past action after 'believed': <b>had left<\/b>."},{"qid":"c9-09-40","type":"spot","level":5,"topic":"clauses","prompt":"Which sentence is correct?","options":["It is believed that Homer, who lived long ago, have composed both epics.","It is believed that Homer, which lived long ago, composed both epics.","It is believed that Homer, who lived long ago, composed both epics."],"answer":2,"rule":"The subject of the noun clause is <b>Homer<\/b> (one person, past): <b>composed<\/b>. A person takes <b>who<\/b>."},{"qid":"c9-09-41","type":"fix","level":5,"topic":"too_enough_so_that","prompt":"One word is wrong. Find it and fix it.","words":["The","Trojan","wall","was","such","strong","that","no","army","could","break","it."],"errors":[{"i":4,"options":["too","very","so"],"answer":2}],"rule":"Before an adjective alone, use <b>so<\/b> ... that. 'such' needs a noun (such a strong wall)."},{"qid":"c9-09-42","type":"fill","level":5,"topic":"conditional_3","prompt":"Fill in the gap.","before":"Had Achilles' heel been protected, the arrow","after":"him.","options":["would not kill","would not have killed","had not killed"],"answer":1,"rule":"'Had ... been protected' = 'If ... had been protected', so the result is <b>would not have killed<\/b>."},{"qid":"c9-09-43","type":"build","level":5,"topic":"clauses","prompt":"Make a sentence with a noun clause.","answer":["The","Trojans","wondered","why","their","enemies","had","left","a","horse."],"alts":[],"rule":"<b>why their enemies had left a horse<\/b> is a noun clause (object of 'wondered') in statement order."},{"qid":"c9-09-44","type":"chat","level":5,"topic":"too_enough_so_that","prompt":"Pick the correct reply.","chat":[["Neha","Did you finish the Troy project?"],["Neha","It was huge!"]],"options":["No, it was too long that I couldn't finish it in one day.","No, it was so long that I couldn't finish it in one day.","No, it was such long that I couldn't finish it in one day."],"answer":1,"rule":"Adjective + result clause: <b>so long that<\/b>. 'too' pairs with 'to'; 'such' needs a noun."},{"qid":"c9-09-45","type":"change","level":5,"topic":"conditional_3","prompt":"Rewrite beginning with 'Had'.","source":"If the Trojans had listened to the priest, Troy would have survived.","options":["Had the Trojans listened to the priest, Troy would survived.","Had the Trojans had listened to the priest, Troy would have survived.","Had the Trojans listened to the priest, Troy would have survived."],"answer":2,"rule":"Drop 'If' and put <b>Had<\/b> before the subject: Had the Trojans listened ..., ... would have survived."},{"qid":"c9-09-46","type":"change","level":5,"topic":"too_enough_so_that","prompt":"Rewrite using 'not ... enough'.","source":"The Trojans were too careless to notice the trick.","options":["The Trojans were not careful enough to notice the trick.","The Trojans were not enough careful to notice the trick.","The Trojans were not careful enough that noticed the trick."],"answer":0,"rule":"Use the opposite adjective + <b>enough<\/b>: too careless = <b>not careful enough<\/b> to notice."},{"qid":"c9-09-47","type":"change","level":5,"topic":"clauses","prompt":"Make one complex sentence using 'when'.","source":"The fleet returned. The Greek gave the signal.","options":["When the fleet returned, the Greek gave the signal.","When the fleet returned, then the Greek gave the signal.","When the fleet had returned, so the Greek gave the signal."],"answer":0,"rule":"<b>When<\/b> starts the subordinate clause; the main clause needs no 'then' or 'so'."},{"qid":"c9-09-48","type":"proof","level":5,"topic":"too_enough_so_that","prompt":"Find and fix the 3 errors in this message.","words":["Odysseus,","who","were","famous","for","tricks,","planned","a","huge","wooden","horse.","It","was","so","big","that","the","Trojans","has","to","break","part","of","their","wall,","but","they","were","too","happy","to","noticed","the","danger."],"errors":[{"i":2,"options":["was","is","are"],"answer":0},{"i":18,"options":["had","have","having"],"answer":0},{"i":31,"options":["noticing","notice","notices"],"answer":1}],"rule":"'who' refers to Odysseus (one man, past): <b>was<\/b>. Plural past: <b>had to<\/b>. 'too happy to' + base verb: <b>notice<\/b>."},{"qid":"c9-09-49","type":"proof","level":5,"topic":"conditional_3","prompt":"Find and fix the 3 errors in this message.","words":["The","Trojans","were","tired","of","wait","inside","their","walls.","If","they","had","been","more","careful,","they","would","have","checked","the","horse","before","they","drag","it","into","the","city,","where","they","celebrate","all","night."],"errors":[{"i":5,"options":["waiting","waited","waits"],"answer":0},{"i":23,"options":["drags","dragging","dragged"],"answer":2},{"i":30,"options":["celebrates","celebrated","celebrating"],"answer":1}],"rule":"<b>tired of waiting<\/b> (-ing after a preposition). The past story needs <b>dragged<\/b> and <b>celebrated<\/b>."},{"qid":"c9-09-50","type":"proof","level":4,"topic":"clauses","prompt":"Find and fix the 2 errors in this message.","words":["Homer","was","a","poet","whom","wandered","from","village","to","village.","The","people","who","heard","his","songs","gives","him","food","and","shelter."],"errors":[{"i":4,"options":["whose","who","which"],"answer":1},{"i":16,"options":["gave","giving","given"],"answer":0}],"rule":"The subject of 'wandered' needs <b>who<\/b>, not 'whom'. The story is past: <b>gave<\/b>."}]},{"id":"10","num":"2.5","title":"Autumn","unit":"Unit Two","topics":[{"tag":"verb_agreement","name":"Tense and subject-verb agreement"},{"tag":"comparison","name":"Degrees of comparison"},{"tag":"adjective_order","name":"Adjectives and their order"},{"tag":"linking_words","name":"Linking words (although, despite, however)"}],"questions":[{"qid":"c9-10-01","type":"spot","level":1,"topic":"verb_agreement","prompt":"Which sentence is correct?","options":["New grass sprout after the first rain.","New grass sprouting after the first rain.","New grass sprouts after the first rain."],"answer":2,"rule":"<b>Grass<\/b> is singular, so the simple present verb takes <b>-s<\/b>: <b>sprouts<\/b>."},{"qid":"c9-10-02","type":"spot","level":1,"topic":"comparison","prompt":"Pick the sentence with the correct comparison.","options":["The moon looks more brighter tonight than last night.","The moon looks brightest tonight than last night.","The moon looks brighter tonight than last night."],"answer":2,"rule":"Comparing two things with <b>than<\/b> needs the comparative <b>brighter<\/b>. Never add <b>more<\/b> to an -er word."},{"qid":"c9-10-03","type":"fix","level":1,"topic":"verb_agreement","prompt":"One word is wrong. Find it and fix it.","words":["Many","migratory","birds","returns","to","the","lake","every","October."],"errors":[{"i":3,"options":["returning","return","has"],"answer":1}],"rule":"<b>Many migratory birds<\/b> is plural, so the verb has no <b>-s<\/b>: birds <b>return<\/b>."},{"qid":"c9-10-04","type":"fix","level":1,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["The","autumn","sky","is","clear","than","the","monsoon","sky."],"errors":[{"i":4,"options":["clearest","clearly","clearer"],"answer":2}],"rule":"<b>Than<\/b> compares two things, so use the comparative: <b>clearer<\/b> than."},{"qid":"c9-10-05","type":"fill","level":1,"topic":"verb_agreement","prompt":"Fill in the gap.","before":"Every morning, a thin mist","after":"over the rice fields.","options":["hang","hangs","hanging"],"answer":1,"rule":"<b>A thin mist<\/b> is singular and this happens every morning, so use <b>hangs<\/b>."},{"qid":"c9-10-06","type":"fill","level":1,"topic":"comparison","prompt":"Fill in the gap.","before":"October is","after":"than the rainy months of July and August.","options":["drier","dry","driest"],"answer":0,"rule":"Two things are compared with <b>than<\/b>, so use the comparative <b>drier<\/b> (dry - drier - driest)."},{"qid":"c9-10-07","type":"build","level":1,"topic":"adjective_order","prompt":"Put the words in order. Watch the order of the adjectives.","answer":["She","wore","a","beautiful","white","silk","sari."],"alts":[],"rule":"Opinion comes first, then colour, then material: a <b>beautiful white silk<\/b> sari."},{"qid":"c9-10-08","type":"chat","level":1,"topic":"verb_agreement","prompt":"Pick the correct reply.","chat":[["Kabir","What does your grandmother do on Kojagiri night?"]],"options":["She makes kheer and keeps it in the moonlight.","She make kheer and keeps it in the moonlight.","She making kheer and keep it in the moonlight."],"answer":0,"rule":"With <b>she<\/b> in the simple present, both verbs take <b>-s<\/b>: she <b>makes<\/b> ... and <b>keeps<\/b>."},{"qid":"c9-10-09","type":"chat","level":1,"topic":"comparison","prompt":"Pick the correct reply.","chat":[["Sana","Which is the hottest month in Pune?"]],"options":["April is the hotter month of all.","April is the hottest month, I think.","April is the most hottest month."],"answer":1,"rule":"Comparing one month with all others needs the superlative <b>the hottest<\/b>, without <b>most<\/b>."},{"qid":"c9-10-10","type":"change","level":1,"topic":"comparison","prompt":"Change into the comparative degree.","source":"Autumn is the most pleasant season of all.","options":["Autumn is more pleasant than all season.","Autumn is most pleasant than any other season.","Autumn is more pleasant than any other season."],"answer":2,"rule":"Superlative to comparative: <b>more pleasant than any other<\/b> + singular noun."},{"qid":"c9-10-11","type":"spot","level":2,"topic":"adjective_order","prompt":"Which sentence has the adjectives in the correct order?","options":["Riya bought a lovely little brass lamp for Diwali.","Riya bought a brass little lovely lamp for Diwali.","Riya bought a little brass lovely lamp for Diwali."],"answer":0,"rule":"Order: opinion, size, then material - a <b>lovely little brass<\/b> lamp."},{"qid":"c9-10-12","type":"spot","level":2,"topic":"linking_words","prompt":"Which sentence uses the linking word correctly?","options":["Although it was cloudy, the children flew kites.","Despite it was cloudy, the children flew kites.","Although it was cloudy, but the children flew kites."],"answer":0,"rule":"<b>Although<\/b> takes a full clause and is not followed by <b>but<\/b>. <b>Despite<\/b> needs a noun, not a clause."},{"qid":"c9-10-13","type":"fix","level":2,"topic":"linking_words","prompt":"One word is wrong. Find it and fix it.","words":["Although","the","cold","wind,","Meera","went","for","an","evening","walk."],"errors":[{"i":0,"options":["Because","Despite","However"],"answer":1}],"rule":"<b>The cold wind<\/b> is a noun phrase, not a clause, so use <b>Despite<\/b>. <b>Although<\/b> needs a subject and verb."},{"qid":"c9-10-14","type":"fix","level":2,"topic":"verb_agreement","prompt":"One word is wrong. Find it and fix it.","words":["Every","girl","in","the","dance","wear","a","garland","of","lilies."],"errors":[{"i":5,"options":["wearing","wears","worn"],"answer":1}],"rule":"<b>Every<\/b> + singular noun takes a singular verb: every girl <b>wears<\/b>."},{"qid":"c9-10-15","type":"fill","level":2,"topic":"linking_words","prompt":"Fill in the gap.","before":"The days are getting shorter;","after":", the weather is pleasant.","options":["although","despite","however"],"answer":2,"rule":"After a semicolon, the linking adverb <b>however<\/b> joins two full sentences that contrast."},{"qid":"c9-10-16","type":"fill","level":2,"topic":"comparison","prompt":"Fill in the gap.","before":"This is the","after":"night of the year; the moon is full and the sky is clear.","options":["brighter","more bright","brightest"],"answer":2,"rule":"<b>The ... of the year<\/b> compares one night with all others, so use the superlative <b>brightest<\/b>."},{"qid":"c9-10-17","type":"build","level":2,"topic":"linking_words","prompt":"Put the words in order.","answer":["Despite","the","mist,","farmers","went","to","their","fields."],"alts":[],"rule":"<b>Despite<\/b> + noun (<b>the mist<\/b>), then a comma and the main clause."},{"qid":"c9-10-18","type":"chat","level":2,"topic":"adjective_order","prompt":"Pick the correct reply.","chat":[["Aai","What kind of lantern did you buy for Diwali?"]],"options":["I bought a paper round big lantern.","I bought a round paper big lantern.","I bought a big round paper lantern."],"answer":2,"rule":"Size comes before shape, and material comes last: a <b>big round paper<\/b> lantern."},{"qid":"c9-10-19","type":"change","level":2,"topic":"linking_words","prompt":"Combine the sentences using 'although'.","source":"The wind was cold. We sat outside to watch the stars.","options":["Although the wind was cold, but we sat outside to watch the stars.","Although the wind is cold, we sat outside to watch the stars.","Although the wind was cold, we sat outside to watch the stars."],"answer":2,"rule":"Use <b>although<\/b> alone - never <b>although ... but<\/b> - and keep the tense: <b>was<\/b>."},{"qid":"c9-10-20","type":"proof","level":2,"topic":"verb_agreement","prompt":"Find and fix the 2 errors in this message.","words":["Last","October,","my","grandmother","make","kheer","for","Kojagiri.","She","kept","it","in","the","moonlight","and","the","whole","family","drunk","it","at","midnight."],"errors":[{"i":4,"options":["made","makes","making"],"answer":0},{"i":18,"options":["drinks","drank","drinking"],"answer":1}],"rule":"<b>Last October<\/b> is past, so use the simple past: <b>made<\/b>. The past of drink is <b>drank<\/b>; <b>drunk<\/b> is the past participle."},{"qid":"c9-10-21","type":"spot","level":3,"topic":"verb_agreement","prompt":"Pick the sentence with correct agreement.","options":["One of the lilies in the pond are white.","One of the lilies in the pond is white.","One of the lily in the pond is white."],"answer":1,"rule":"<b>One of<\/b> + plural noun takes a singular verb: one of the lilies <b>is<\/b>."},{"qid":"c9-10-22","type":"spot","level":3,"topic":"comparison","prompt":"Which sentence is correct?","options":["Our new classroom is much brighter than the old one.","Our new classroom is much more brighter than the old one.","Our new classroom is very brighter than the old one."],"answer":0,"rule":"Use <b>much<\/b> (not <b>very<\/b>) to make a comparative stronger, and never use <b>more<\/b> with an -er word."},{"qid":"c9-10-23","type":"fix","level":3,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["Between","Tara","and","Meena,","Tara","is","the","tallest","garba","dancer."],"errors":[{"i":7,"options":["taller","tall","highest"],"answer":0}],"rule":"Only two girls are compared, so use the comparative: the <b>taller<\/b> dancer."},{"qid":"c9-10-24","type":"fill","level":3,"topic":"linking_words","prompt":"Fill in the gap.","before":"","after":"the heavy rain in September, the paddy crop was good.","options":["Despite","Although","However"],"answer":0,"rule":"<b>The heavy rain<\/b> is a noun phrase, so use <b>Despite<\/b>. <b>Although<\/b> needs a clause."},{"qid":"c9-10-25","type":"fill","level":3,"topic":"verb_agreement","prompt":"Fill in the gap.","before":"Neither the farmers nor their son","after":"worried about the late rains.","options":["are","is","were"],"answer":1,"rule":"With <b>neither ... nor<\/b>, the verb agrees with the nearer subject: <b>son<\/b> is singular, so <b>is<\/b>."},{"qid":"c9-10-26","type":"build","level":3,"topic":"adjective_order","prompt":"Put the words in order. Watch the order of the adjectives.","answer":["The","bride","wore","a","lovely","red","Banarasi","sari."],"alts":[],"rule":"Opinion, then colour, then origin: a <b>lovely red Banarasi<\/b> sari."},{"qid":"c9-10-27","type":"chat","level":3,"topic":"linking_words","prompt":"Pick the correct reply.","chat":[["Om","Did you go to the lake yesterday?"],["Om","It was so foggy!"]],"options":["Yes, despite of the fog, we saw many migratory birds.","Yes, despite the fog, we saw many migratory birds.","Yes, although the fog, we saw many migratory birds."],"answer":1,"rule":"<b>Despite<\/b> is followed directly by a noun - no <b>of<\/b>. <b>Although<\/b> would need a clause."},{"qid":"c9-10-28","type":"chat","level":3,"topic":"verb_agreement","prompt":"Pick the correct reply.","chat":[["Ms Rao","Has everyone finished the poem on autumn?"]],"options":["Yes, ma'am. Everyone have finished it.","Yes, ma'am. Everyone have finish it.","Yes, ma'am. Everyone has finished it."],"answer":2,"rule":"<b>Everyone<\/b> is singular, so use <b>has<\/b> + past participle: everyone <b>has finished<\/b>."},{"qid":"c9-10-29","type":"change","level":3,"topic":"comparison","prompt":"Change into the positive degree.","source":"Autumn is more pleasant than summer.","options":["Summer is not as pleasanter as autumn.","Summer is not so pleasant than autumn.","Summer is not as pleasant as autumn."],"answer":2,"rule":"Comparative to positive: <b>not as + adjective + as<\/b>, with the other noun as the subject."},{"qid":"c9-10-30","type":"proof","level":3,"topic":"verb_agreement","prompt":"Find and fix the 2 errors in this message.","words":["Hi","Anu!","Pashan","Lake","look","lovely","these","days.","Hundreds","of","birds","has","arrived","from","the","north.","Come","and","see","them","with","me","on","Sunday."],"errors":[{"i":4,"options":["looking","have","looks"],"answer":2},{"i":11,"options":["having","have","is"],"answer":1}],"rule":"<b>Pashan Lake<\/b> is singular: <b>looks<\/b>. <b>Hundreds of birds<\/b> is plural: <b>have arrived<\/b>."},{"qid":"c9-10-31","type":"spot","level":4,"topic":"verb_agreement","prompt":"Which sentence is correct?","options":["The rice has been harvested and the fields looks empty now.","The rice have been harvested and the fields look empty now.","The rice has been harvested and the fields look empty now."],"answer":2,"rule":"<b>Rice<\/b> is uncountable, so <b>has been<\/b>; <b>fields<\/b> is plural, so <b>look<\/b>."},{"qid":"c9-10-32","type":"fix","level":4,"topic":"verb_agreement","prompt":"One word is wrong. Find it and fix it.","words":["Although","she","was","tired,","Leela","danced","until","the","moon","rise","over","the","hills."],"errors":[{"i":9,"options":["rose","rises","risen"],"answer":0}],"rule":"The story is in the past (<b>was<\/b>, <b>danced<\/b>), so use the simple past: the moon <b>rose<\/b>."},{"qid":"c9-10-33","type":"fix","level":4,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["Kalidas","is","one","of","the","greatest","poet","of","ancient","India."],"errors":[{"i":6,"options":["poets","poetry","poet's"],"answer":0}],"rule":"<b>One of the<\/b> + superlative is followed by a plural noun: one of the greatest <b>poets<\/b>."},{"qid":"c9-10-34","type":"fill","level":4,"topic":"comparison","prompt":"Fill in the gap.","before":"This is the most beautiful poem that has ever","after":"written about autumn.","options":["be","been","being"],"answer":1,"rule":"The present perfect passive is <b>has been<\/b> + past participle: has ever <b>been<\/b> written."},{"qid":"c9-10-35","type":"build","level":4,"topic":"verb_agreement","prompt":"Make a statement with a question tag.","answer":["The","mist","has","cleared,","hasn't","it?"],"alts":[],"rule":"A positive statement with <b>has<\/b> takes a negative tag with <b>hasn't<\/b>: has cleared, <b>hasn't it?<\/b>"},{"qid":"c9-10-36","type":"chat","level":4,"topic":"linking_words","prompt":"Pick the correct reply.","chat":[["Dev","What did the weather report say?"]],"options":["It said that the rain would stop soon; however, the nights would be cold.","It said that the rain will stopped soon; however, the nights would be cold.","It said that the rain would stop soon; however the nights will been cold."],"answer":0,"rule":"In reported speech <b>will<\/b> becomes <b>would<\/b> + base verb. <b>However<\/b> after a semicolon takes a comma."},{"qid":"c9-10-37","type":"chat","level":4,"topic":"adjective_order","prompt":"Pick the correct reply.","chat":[["Nani","Which shawl should I wear tonight?"]],"options":["Wear the woollen old soft one, Nani.","Wear the old woollen soft one, Nani.","Wear the soft old woollen one, Nani."],"answer":2,"rule":"Quality comes first, then age, then material: the <b>soft old woollen<\/b> one."},{"qid":"c9-10-38","type":"change","level":4,"topic":"linking_words","prompt":"Rewrite using 'despite'.","source":"Although the night was dark, the stars shone brightly.","options":["Despite the night was dark, the stars shone brightly.","Despite of the dark night, the stars shone brightly.","Despite the darkness of the night, the stars shone brightly."],"answer":2,"rule":"<b>Despite<\/b> needs a noun phrase (<b>the darkness of the night<\/b>), not a clause, and never takes <b>of<\/b>."},{"qid":"c9-10-39","type":"change","level":4,"topic":"verb_agreement","prompt":"Change into passive voice.","source":"Farmers harvest the rice in autumn.","options":["The rice is harvested by farmers in autumn.","The rice was harvested by farmers in autumn.","The rice is harvest by farmers in autumn."],"answer":0,"rule":"Simple present passive: <b>is<\/b> + past participle - the rice <b>is harvested<\/b>."},{"qid":"c9-10-40","type":"proof","level":4,"topic":"verb_agreement","prompt":"Find and fix the 3 errors in this message.","words":["Dear","Ravi,","autumn","has","came","to","our","village.","The","paddy","is","golden","and","the","nights","are","cool","than","before.","Last","night,","Grandpa","told","we","a","story","under","the","full","moon."],"errors":[{"i":4,"options":["coming","come","comes"],"answer":1},{"i":16,"options":["coolest","cooler","coolly"],"answer":1},{"i":23,"options":["our","ours","us"],"answer":2}],"rule":"<b>has come<\/b> (past participle); <b>cooler than<\/b> (comparative); <b>told us<\/b> (object pronoun)."},{"qid":"c9-10-41","type":"spot","level":5,"topic":"linking_words","prompt":"Which sentence is correct?","options":["The mornings are misty; however, the afternoons are warm and sunny.","Although the mornings are misty, but the afternoons are warm and sunny.","The mornings are misty, despite the afternoons are warm and sunny."],"answer":0,"rule":"<b>However<\/b> links two full sentences after a semicolon. <b>Although ... but<\/b> is wrong; <b>despite<\/b> cannot take a clause."},{"qid":"c9-10-42","type":"fix","level":5,"topic":"verb_agreement","prompt":"One word is wrong. Find it and fix it.","words":["Every","season","in","these","poems","bring","its","own","colours","and","sounds."],"errors":[{"i":5,"options":["brings","bringing","have"],"answer":0}],"rule":"The subject is <b>every season<\/b> (singular), not <b>poems<\/b>, so the verb is <b>brings<\/b>."},{"qid":"c9-10-43","type":"fill","level":5,"topic":"adjective_order","prompt":"Fill in the gap.","before":"She looked like a slender maid in a","after":"silk robe.","options":["white long","long white","long whiter"],"answer":1,"rule":"Size/length comes before colour, and material is closest to the noun: a <b>long white silk<\/b> robe."},{"qid":"c9-10-44","type":"build","level":5,"topic":"linking_words","prompt":"Put the words in order.","answer":["Clouds","hid","the","moon;","however,","its","light","still","shone."],"alts":[],"rule":"Two full sentences joined by a semicolon, then <b>however,<\/b> to show contrast."},{"qid":"c9-10-45","type":"chat","level":5,"topic":"verb_agreement","prompt":"Pick the correct reply.","chat":[["Ira","Have you finished your project on the six Indian seasons?"],["Ira","It's due tomorrow."]],"options":["Almost! The section on Sharad and Hemant still needs pictures.","Almost! The section on Sharad and Hemant still need pictures.","Almost! The section on Sharad and Hemant still needing pictures."],"answer":0,"rule":"The subject is <b>the section<\/b> (singular), not Sharad and Hemant, so use <b>needs<\/b>."},{"qid":"c9-10-46","type":"change","level":5,"topic":"comparison","prompt":"Change into the superlative degree.","source":"No other season is as colourful as autumn.","options":["Autumn is the more colourful of all seasons.","Autumn is the most colourful of all seasons.","Autumn is most colourful than all seasons."],"answer":1,"rule":"<b>No other ... as ... as<\/b> becomes the superlative: <b>the most colourful of all<\/b> seasons."},{"qid":"c9-10-47","type":"change","level":5,"topic":"linking_words","prompt":"Rewrite using 'however'.","source":"Although the days are warm, the nights are chilly.","options":["However the days are warm, the nights are chilly.","The days are warm; however, the nights were chilly.","The days are warm; however, the nights are chilly."],"answer":2,"rule":"<b>However<\/b> joins two full sentences: first sentence, semicolon, <b>however,<\/b> second sentence. Keep the tense."},{"qid":"c9-10-48","type":"change","level":5,"topic":"verb_agreement","prompt":"Change into indirect speech.","source":"Grandpa said, \"I have seen many autumns in this village.\"","options":["Grandpa said that he had saw many autumns in that village.","Grandpa said that he had seen many autumns in that village.","Grandpa said that I had seen many autumns in that village."],"answer":1,"rule":"After <b>said<\/b>, <b>I have seen<\/b> becomes <b>he had seen<\/b>, and <b>this<\/b> becomes <b>that<\/b>."},{"qid":"c9-10-49","type":"proof","level":5,"topic":"linking_words","prompt":"Find and fix the 3 errors in this message.","words":["Hi","Zoya!","Everyone","in","our","building","were","on","the","terrace","until","midnight.","Although","the","cold","breeze,","nobody","went","home","early.","Aai","made","the","tastier","masala","milk","I","have","ever","had."],"errors":[{"i":6,"options":["was","are","be"],"answer":0},{"i":12,"options":["Because","Unless","Despite"],"answer":2},{"i":23,"options":["tasty","tastily","tastiest"],"answer":2}],"rule":"<b>Everyone ... was<\/b>; <b>Despite<\/b> + noun; <b>the tastiest ... I have ever had<\/b> needs the superlative."},{"qid":"c9-10-50","type":"proof","level":5,"topic":"verb_agreement","prompt":"Find and fix the 3 errors in this paragraph.","words":["Autumn","is","like","a","slender","maiden","who","wear","rice","stems","in","her","hair.","At","night,","the","moonlight","become","her","silken","robe","and","countless","stars","forms","her","crown."],"errors":[{"i":7,"options":["wearing","worn","wears"],"answer":2},{"i":17,"options":["becoming","becomes","being"],"answer":1},{"i":24,"options":["form","forming","formal"],"answer":0}],"rule":"<b>who<\/b> refers to the singular maiden: <b>wears<\/b>; the moonlight <b>becomes<\/b>; plural <b>stars form<\/b>."}]},{"id":"11","num":"2.6","title":"The Past in the Present","unit":"Unit Two","topics":[{"tag":"passive_voice","name":"Active and passive voice"},{"tag":"present_perfect","name":"Present perfect and simple past"},{"tag":"reported_speech","name":"Reported speech (commands, questions, statements)"},{"tag":"unless_conditionals","name":"Unless and conditionals"}],"questions":[{"qid":"c9-11-01","type":"spot","level":1,"topic":"present_perfect","prompt":"Pick the sentence with the correct tense.","options":["Neel has cleaned his room yesterday.","Neel have cleaned his room yesterday.","Neel cleaned his room yesterday."],"answer":2,"rule":"<b>Yesterday<\/b> is a finished past time, so use the simple past <b>cleaned<\/b>, not the present perfect."},{"qid":"c9-11-02","type":"spot","level":1,"topic":"passive_voice","prompt":"Which sentence is in the correct passive form?","options":["The garden has been watered.","The garden has been water.","The garden have been watered."],"answer":0,"rule":"Present perfect passive: <b>has/have been<\/b> + past participle. <b>Garden<\/b> is singular: <b>has been watered<\/b>."},{"qid":"c9-11-03","type":"fix","level":1,"topic":"present_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Has","Neel","wrote","his","skit","for","the","annual","day","yet?"],"errors":[{"i":2,"options":["writing","writes","written"],"answer":2}],"rule":"The present perfect uses <b>has<\/b> + past participle: has Neel <b>written<\/b>. <b>Wrote<\/b> is the simple past."},{"qid":"c9-11-04","type":"fix","level":1,"topic":"passive_voice","prompt":"One word is wrong. Find it and fix it.","words":["The","beds","were","make","by","the","boy","before","breakfast."],"errors":[{"i":3,"options":["making","makes","made"],"answer":2}],"rule":"The passive is <b>be<\/b> + past participle: the beds were <b>made<\/b>."},{"qid":"c9-11-05","type":"fill","level":1,"topic":"passive_voice","prompt":"Fill in the gap.","before":"The dishes","after":"put in the dishwasher.","options":["having","have been","has been"],"answer":1,"rule":"Dishes cannot put themselves, so use the passive. <b>Dishes<\/b> is plural: <b>have been<\/b> put."},{"qid":"c9-11-06","type":"fill","level":1,"topic":"present_perfect","prompt":"Fill in the gap.","before":"I","after":"my bed already, Mom!","options":["have made","has made","having made"],"answer":0,"rule":"<b>Already<\/b> goes with the present perfect. With <b>I<\/b>, use <b>have made<\/b>."},{"qid":"c9-11-07","type":"build","level":1,"topic":"unless_conditionals","prompt":"Put the words in order.","answer":["You","can't","go","out","unless","you","make","your","bed."],"alts":[],"rule":"<b>Unless<\/b> means 'if ... not'. The unless-clause uses the simple present: unless you <b>make<\/b> your bed."},{"qid":"c9-11-08","type":"chat","level":1,"topic":"present_perfect","prompt":"Pick the correct reply.","chat":[["Mom","Have you watered the plants?"]],"options":["Yes, Mom. I have watered them.","Yes, Mom. I have water them.","Yes, Mom. I has watered them."],"answer":0,"rule":"Answer a present perfect question with <b>I have<\/b> + past participle: <b>I have watered<\/b>."},{"qid":"c9-11-09","type":"chat","level":1,"topic":"unless_conditionals","prompt":"Pick the correct reply.","chat":[["Aai","Hurry up! The bus leaves at eight."]],"options":["I will miss it unless I will leave now.","I will miss it unless I leave now.","I will missed it unless I leave now."],"answer":1,"rule":"Main clause: <b>will<\/b> + base verb. The unless-clause uses the simple present: unless I <b>leave<\/b>."},{"qid":"c9-11-10","type":"change","level":1,"topic":"passive_voice","prompt":"Change into passive voice.","source":"Neel put the dishes in the dishwasher.","options":["The dishes was put in the dishwasher by Neel.","The dishes were put in the dishwasher by Neel.","The dishes were putted in the dishwasher by Neel."],"answer":1,"rule":"Simple past passive: <b>were<\/b> (plural dishes) + past participle <b>put<\/b> (put - put - put)."},{"qid":"c9-11-11","type":"spot","level":2,"topic":"reported_speech","prompt":"Which sentence is correct?","options":["Neel's mother told him cleaning his room.","Neel's mother said him to clean his room.","Neel's mother told him to clean his room."],"answer":2,"rule":"A reported command is <b>told<\/b> + person + <b>to<\/b> + verb. We say <b>told him<\/b>, not <b>said him<\/b>."},{"qid":"c9-11-12","type":"spot","level":2,"topic":"present_perfect","prompt":"Which sentence is correct?","options":["Neel has lived in Pune since five years.","Neel has lived in Pune for five years.","Neel is living in Pune since five years."],"answer":1,"rule":"Use <b>for<\/b> with a length of time (five years) and <b>since<\/b> with a starting point (2020)."},{"qid":"c9-11-13","type":"fix","level":2,"topic":"passive_voice","prompt":"One word is wrong. Find it and fix it.","words":["Both","cows","is","milked","before","sunrise","every","day."],"errors":[{"i":2,"options":["was","be","are"],"answer":2}],"rule":"<b>Both cows<\/b> is plural and this happens every day, so the passive is <b>are milked<\/b>."},{"qid":"c9-11-14","type":"fix","level":2,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["The","mother","ordered","her","son","to","makes","his","bed."],"errors":[{"i":6,"options":["make","making","made"],"answer":0}],"rule":"In a reported command, <b>to<\/b> is followed by the base verb: ordered her son <b>to make<\/b>."},{"qid":"c9-11-15","type":"fill","level":2,"topic":"unless_conditionals","prompt":"Fill in the gap.","before":"You can't play Chaupar unless you","after":"your chores.","options":["will finish","finish","finished"],"answer":1,"rule":"After <b>unless<\/b>, use the simple present for a present or future idea: unless you <b>finish<\/b>."},{"qid":"c9-11-16","type":"fill","level":2,"topic":"reported_speech","prompt":"Fill in the gap.","before":"Mom asked Neel whether he","after":"cleaned his room.","options":["has he","did","had"],"answer":2,"rule":"A reported yes/no question uses <b>whether<\/b> + statement order, and the tense moves back: <b>he had cleaned<\/b>."},{"qid":"c9-11-17","type":"build","level":2,"topic":"passive_voice","prompt":"Put the words in order to make a passive sentence.","answer":["The","goats","were","taken","up","the","hill."],"alts":[],"rule":"Simple past passive: <b>were<\/b> + past participle <b>taken<\/b>."},{"qid":"c9-11-18","type":"chat","level":2,"topic":"unless_conditionals","prompt":"Pick the correct reply.","chat":[["Riya","Shall we play cricket after lunch?"]],"options":["Sure, unless it rains.","Sure, unless it will rain.","Sure, unless it rain."],"answer":0,"rule":"After <b>unless<\/b>, use the simple present, and <b>it<\/b> takes <b>-s<\/b>: unless it <b>rains<\/b>."},{"qid":"c9-11-19","type":"change","level":2,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Mom said to Neel, \"Make your bed.\"","options":["Mom told Neel to make your bed.","Mom told Neel to make his bed.","Mom told Neel that make his bed."],"answer":1,"rule":"A command becomes <b>told<\/b> + person + <b>to<\/b> + verb, and <b>your<\/b> changes to <b>his<\/b>."},{"qid":"c9-11-20","type":"proof","level":2,"topic":"present_perfect","prompt":"Find and fix the 2 errors in this message.","words":["Mom,","I","have","wash","the","dishes","and","fed","the","dog.","Can","I","go","out","now?","Both","my","friends","is","waiting","for","me."],"errors":[{"i":3,"options":["washed","washing","washes"],"answer":0},{"i":18,"options":["be","are","was"],"answer":1}],"rule":"Present perfect: <b>have washed<\/b>. <b>Both my friends<\/b> is plural: <b>are waiting<\/b>."},{"qid":"c9-11-21","type":"spot","level":3,"topic":"passive_voice","prompt":"Which sentence is correct?","options":["The groceries have been bring home.","The groceries has been brought home.","The groceries have been brought home."],"answer":2,"rule":"<b>Groceries<\/b> is plural: <b>have been<\/b> + past participle <b>brought<\/b>."},{"qid":"c9-11-22","type":"spot","level":3,"topic":"unless_conditionals","prompt":"Which sentence is correct?","options":["Unless you hurry, you will miss the puppet show.","Unless you don't hurry, you will miss the puppet show.","Unless you will hurry, you will miss the puppet show."],"answer":0,"rule":"<b>Unless<\/b> already means 'if not', so never add <b>don't<\/b>; and use the simple present after it."},{"qid":"c9-11-23","type":"fix","level":3,"topic":"present_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Neel","has","known","Kabir","for","Class","1."],"errors":[{"i":4,"options":["during","by","since"],"answer":2}],"rule":"<b>Class 1<\/b> is a starting point, so use <b>since<\/b>. <b>For<\/b> goes with a length of time (for five years)."},{"qid":"c9-11-24","type":"fill","level":3,"topic":"passive_voice","prompt":"Fill in the gap.","before":"The mud walls","after":"patched before the rains came.","options":["have been","had been","has been"],"answer":1,"rule":"One past action happened before another (<b>the rains came<\/b>), so use the past perfect passive: <b>had been<\/b> patched."},{"qid":"c9-11-25","type":"fill","level":3,"topic":"reported_speech","prompt":"Fill in the gap.","before":"The boy asked his mother why he","after":"to make his bed.","options":["had","did he have","does he have"],"answer":0,"rule":"A reported question uses statement order and moves the tense back: why <b>he had<\/b> to make his bed."},{"qid":"c9-11-26","type":"build","level":3,"topic":"reported_speech","prompt":"Make a reported question.","answer":["Neel","asked","what","grinding","stones","were."],"alts":[],"rule":"In a reported question the verb comes after the subject: what grinding stones <b>were<\/b>."},{"qid":"c9-11-27","type":"chat","level":3,"topic":"present_perfect","prompt":"Pick the correct reply.","chat":[["Grandpa","Have you ever seen a grinding stone?"]],"options":["Yes, I have seen one at Nani's house last year.","Yes, I saw one at Nani's house last year.","Yes, I have saw one at Nani's house last year."],"answer":1,"rule":"<b>Last year<\/b> is a finished time, so the reply needs the simple past: I <b>saw<\/b> one."},{"qid":"c9-11-28","type":"chat","level":3,"topic":"unless_conditionals","prompt":"Pick the correct reply.","chat":[["Kabir","Will you come to the puppet show tonight?"]],"options":["I will come if Aai will let me.","I will come if Aai lets me.","I came if Aai lets me."],"answer":1,"rule":"First conditional: <b>if<\/b> + simple present, main clause <b>will<\/b> + verb: I will come if Aai <b>lets<\/b> me."},{"qid":"c9-11-29","type":"change","level":3,"topic":"unless_conditionals","prompt":"Rewrite using 'unless'.","source":"If you do not try, you cannot build a robot.","options":["Unless you do not try, you cannot build a robot.","Unless you try, you cannot build a robot.","Unless you try, you can build a robot."],"answer":1,"rule":"<b>If ... not<\/b> becomes <b>unless<\/b>; drop the <b>not<\/b> from that clause only. The main clause stays the same."},{"qid":"c9-11-30","type":"proof","level":3,"topic":"reported_speech","prompt":"Find and fix the 2 errors in this message.","words":["Grandpa,","Mom","told","me","that","you","has","many","chores","as","a","boy.","Did","you","really","carries","water","from","the","well","every","day?"],"errors":[{"i":6,"options":["having","is","had"],"answer":2},{"i":15,"options":["carried","carrying","carry"],"answer":2}],"rule":"Reported past fact: <b>you had<\/b> many chores. After <b>did<\/b>, use the base verb: did you <b>carry<\/b>."},{"qid":"c9-11-31","type":"spot","level":4,"topic":"passive_voice","prompt":"Which sentence is correct?","options":["Your bed must be made before you go out.","Your bed must made before you go out.","Your bed must be make before you go out."],"answer":0,"rule":"Modal passive: modal + <b>be<\/b> + past participle: must <b>be made<\/b>."},{"qid":"c9-11-32","type":"fix","level":4,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["The","boy","said","Matadevi","that","he","had","fed","the","poultry."],"errors":[{"i":2,"options":["told","spoke","talked"],"answer":0}],"rule":"<b>Told<\/b> takes a person directly (told Matadevi). <b>Said<\/b> needs <b>to<\/b> before the person."},{"qid":"c9-11-33","type":"fix","level":4,"topic":"passive_voice","prompt":"One word is wrong. Find it and fix it.","words":["The","new","house","was","built","with","stone","bricks","that","were","carve","by","hand."],"errors":[{"i":10,"options":["carving","carves","carved"],"answer":2}],"rule":"Passive: <b>were<\/b> + past participle: bricks that were <b>carved<\/b> by hand."},{"qid":"c9-11-34","type":"fill","level":4,"topic":"unless_conditionals","prompt":"Fill in the gap.","before":"If I had a robot, it","after":"my bed every morning.","options":["would make","will make","would made"],"answer":0,"rule":"Second conditional (imaginary): <b>if<\/b> + past, then <b>would<\/b> + base verb: it <b>would make<\/b>."},{"qid":"c9-11-35","type":"build","level":4,"topic":"present_perfect","prompt":"Make a question.","answer":["Have","you","ever","played","Bagh-chal","with","your","friends?"],"alts":[],"rule":"Present perfect question: <b>Have<\/b> + subject + <b>ever<\/b> + past participle."},{"qid":"c9-11-36","type":"chat","level":4,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Kabir","What did your mom say when you came home late?"]],"options":["She asked me where had I been all evening.","She asked me where I had been all evening.","She asked me where I have been all evening."],"answer":1,"rule":"Reported question: statement order (<b>I had been<\/b>) and the tense moves back after <b>asked<\/b>."},{"qid":"c9-11-37","type":"chat","level":4,"topic":"passive_voice","prompt":"Pick the correct reply.","chat":[["Ms Iyer","Who painted the backdrop for our skit?"]],"options":["It was painted by Riya and I.","It was paint by Riya and me.","It was painted by Riya and me."],"answer":2,"rule":"Passive: <b>was painted<\/b>. After <b>by<\/b>, use the object pronoun: by Riya and <b>me<\/b>."},{"qid":"c9-11-38","type":"change","level":4,"topic":"passive_voice","prompt":"Change into passive voice.","source":"I have watered the garden.","options":["The garden have been watered by me.","The garden has been watered by me.","The garden had been watered by me."],"answer":1,"rule":"Present perfect passive: <b>has been<\/b> + past participle. Keep the same tense as the active."},{"qid":"c9-11-39","type":"change","level":4,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"The 1910 boy said, \"I promised to go to the riverside with my friends.\"","options":["The 1910 boy said that he had promised to go to the riverside with his friends.","The 1910 boy said that I had promised to go to the riverside with my friends.","The 1910 boy said that he has promised to go to the riverside with his friends."],"answer":0,"rule":"<b>I ... my<\/b> become <b>he ... his<\/b>, and the simple past <b>promised<\/b> moves back to <b>had promised<\/b>."},{"qid":"c9-11-40","type":"proof","level":4,"topic":"passive_voice","prompt":"Find and fix the 3 errors in this diary entry.","words":["Dear","Diary,","today","Mom","told","me","about","my","ancestors.","Every","boy","in","those","days","were","busy","with","chores.","Water","was","fetch","from","rivers","by","hand.","I","will","never","complains","about","my","chores","again!"],"errors":[{"i":14,"options":["be","are","was"],"answer":2},{"i":20,"options":["fetches","fetching","fetched"],"answer":2},{"i":28,"options":["complain","complained","complaining"],"answer":0}],"rule":"<b>Every boy ... was<\/b>; passive <b>was fetched<\/b>; after <b>will<\/b>, the base verb <b>complain<\/b>."},{"qid":"c9-11-41","type":"spot","level":5,"topic":"unless_conditionals","prompt":"Pick the correct conditional sentence.","options":["If Neel would have made his bed earlier, he would have reached the park on time.","If Neel had made his bed earlier, he would reached the park on time.","If Neel had made his bed earlier, he would have reached the park on time."],"answer":2,"rule":"Third conditional: <b>if<\/b> + <b>had<\/b> + past participle, then <b>would have<\/b> + past participle."},{"qid":"c9-11-42","type":"fix","level":5,"topic":"passive_voice","prompt":"One word is wrong. Find it and fix it.","words":["Now","that","every","chore","on","Mom's","list","has","been","finish","properly,","may","I","go","out?"],"errors":[{"i":9,"options":["finishing","finishes","finished"],"answer":2}],"rule":"Present perfect passive: <b>has been<\/b> + past participle: has been <b>finished<\/b>."},{"qid":"c9-11-43","type":"fill","level":5,"topic":"reported_speech","prompt":"Fill in the gap.","before":"Neel wondered whether a robot","after":"ever make his bed for him.","options":["would","would it","does it"],"answer":0,"rule":"Reported questions use statement order: whether a robot <b>would<\/b> ever make... - no question order inside."},{"qid":"c9-11-44","type":"build","level":5,"topic":"passive_voice","prompt":"Put the words in order to make a passive sentence.","answer":["The","farm","channels","had","been","cleared","before","sunrise."],"alts":[],"rule":"Past perfect passive: <b>had been<\/b> + past participle: had been <b>cleared<\/b>."},{"qid":"c9-11-45","type":"chat","level":5,"topic":"unless_conditionals","prompt":"Pick the correct reply.","chat":[["Mom","You were late for the match. What happened?"]],"options":["If I left on time, I wouldn't have missed the bus.","If I had left on time, I wouldn't have missed the bus.","If I had left on time, I won't have missed the bus."],"answer":1,"rule":"For a past regret, use the third conditional: <b>if I had left<\/b> ..., <b>I wouldn't have missed<\/b>."},{"qid":"c9-11-46","type":"change","level":5,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"The 1800 boy said, \"Mother, why do I have to make the beds?\"","options":["The 1800 boy asked his mother why he had to make the beds.","The 1800 boy asked his mother why did he have to make the beds.","The 1800 boy asked his mother why he has to make the beds."],"answer":0,"rule":"A wh-question becomes <b>asked<\/b> + wh-word + statement order, with the tense moved back: why <b>he had to<\/b>."},{"qid":"c9-11-47","type":"change","level":5,"topic":"passive_voice","prompt":"Change into passive voice.","source":"Who cleaned the grinding stones?","options":["By whom was the grinding stones cleaned?","By whom were the grinding stones cleaned?","By whom were the grinding stones clean?"],"answer":1,"rule":"<b>Who<\/b> becomes <b>By whom<\/b>; plural stones take <b>were<\/b> + past participle <b>cleaned<\/b>."},{"qid":"c9-11-48","type":"change","level":5,"topic":"unless_conditionals","prompt":"Rewrite using 'unless'.","source":"You will not get a robot if you do not work hard.","options":["You will not get a robot unless you do not work hard.","You will not get a robot unless you work hard.","You will get a robot unless you work hard."],"answer":1,"rule":"<b>If ... not<\/b> becomes <b>unless<\/b> + positive verb. The main clause keeps its <b>not<\/b>."},{"qid":"c9-11-49","type":"proof","level":5,"topic":"passive_voice","prompt":"Find and fix the 3 errors in this message.","words":["Hi","Kabir!","Our","class","skit","was","a","big","hit.","The","two","nine-yard","sarees","was","borrowed","from","Nani.","You","would","have","love","it","if","you","had","came","to","watch."],"errors":[{"i":13,"options":["be","is","were"],"answer":2},{"i":20,"options":["loving","loved","loves"],"answer":1},{"i":25,"options":["come","coming","comes"],"answer":0}],"rule":"Plural sarees: <b>were borrowed<\/b>. Third conditional: <b>would have loved<\/b> ... <b>had come<\/b>."},{"qid":"c9-11-50","type":"proof","level":5,"topic":"passive_voice","prompt":"Find and fix the 3 errors in this paragraph.","words":["Neel's","ancestors","did","not","had","machines.","The","cows","were","milked","by","hand,","the","goats","were","took","up","the","hill","and","the","crops","were","watered","every","day.","Now","Neel","wishes","he","have","a","robot","to","do","his","chores!"],"errors":[{"i":4,"options":["having","have","has"],"answer":1},{"i":15,"options":["taken","taking","take"],"answer":0},{"i":30,"options":["having","had","has"],"answer":1}],"rule":"<b>Did not<\/b> + base verb <b>have<\/b>; passive <b>were taken<\/b>; <b>wishes<\/b> + past for an unreal wish: he <b>had<\/b>."}]},{"id":"12","num":"3.1","title":"Silver","unit":"Unit Three","topics":[{"tag":"adverbs","name":"Adverbs (manner, degree, frequency)"},{"tag":"prepositions","name":"Prepositions"},{"tag":"participles","name":"Participles (non-finite verbs)"},{"tag":"sentence_types","name":"Simple, compound and complex sentences"}],"questions":[{"qid":"c9-12-01","type":"spot","level":1,"topic":"adverbs","prompt":"Which sentence is correct?","options":["The moon moved slow across the sky.","The moon moved slowly across the sky.","The moon moved slowness across the sky."],"answer":1,"rule":"To tell how an action happens, use an adverb: moved <b>slowly<\/b>."},{"qid":"c9-12-02","type":"spot","level":1,"topic":"prepositions","prompt":"Which sentence is correct?","options":["The dog is sleeping in its kennel.","The dog is sleeping into its kennel.","The dog are sleeping in its kennel."],"answer":0,"rule":"<b>In<\/b> shows position inside a place; <b>into<\/b> shows movement. <b>The dog<\/b> is singular: <b>is<\/b>."},{"qid":"c9-12-03","type":"fix","level":1,"topic":"adverbs","prompt":"One word is wrong. Find it and fix it.","words":["Riya","closed","the","door","quiet","so","that","the","baby","would","not","wake","up."],"errors":[{"i":4,"options":["quietly","quietness","quieten"],"answer":0}],"rule":"The word tells how she closed the door, so it must be an adverb: <b>quietly<\/b>."},{"qid":"c9-12-04","type":"fix","level":1,"topic":"prepositions","prompt":"One word is wrong. Find it and fix it.","words":["Kabir","has","been","waiting","at","the","gate","since","two","hours."],"errors":[{"i":7,"options":["from","by","for"],"answer":2}],"rule":"Use <b>for<\/b> with a length of time (for two hours) and <b>since<\/b> with a starting point (since noon)."},{"qid":"c9-12-05","type":"fill","level":1,"topic":"adverbs","prompt":"Fill in the gap.","before":"The moon walks","after":"across the night sky.","options":["silent","silence","silently"],"answer":2,"rule":"The word describes how the moon walks, so use the adverb <b>silently<\/b>."},{"qid":"c9-12-06","type":"fill","level":1,"topic":"prepositions","prompt":"Fill in the gap.","before":"Silver fruit hangs","after":"the silver trees.","options":["since","into","from"],"answer":2,"rule":"Fruit <b>hangs from<\/b> a branch or tree. <b>Since<\/b> is for time; <b>into<\/b> shows movement inside."},{"qid":"c9-12-07","type":"build","level":1,"topic":"participles","prompt":"Put the words in order.","answer":["Hearing","the","alarm,","Neha","jumped","out","of","bed."],"alts":[],"rule":"The participle phrase <b>Hearing the alarm<\/b> comes first and describes the subject, <b>Neha<\/b>."},{"qid":"c9-12-08","type":"chat","level":1,"topic":"adverbs","prompt":"Pick the correct reply.","chat":[["Aarav","How did the cat climb the wall?"]],"options":["It climbed it very careful.","It climb it very carefully.","It climbed it very carefully."],"answer":2,"rule":"<b>How<\/b> asks for manner, so use the adverb <b>carefully<\/b>, with the past tense <b>climbed<\/b>."},{"qid":"c9-12-09","type":"chat","level":1,"topic":"prepositions","prompt":"Pick the correct reply.","chat":[["Nani","Where did you keep my spectacles?"]],"options":["I kept them on the table beside your bed.","I kept them on the table besides your bed.","I keep them on the table beside your bed."],"answer":0,"rule":"<b>Beside<\/b> means 'next to'; <b>besides<\/b> means 'in addition to'. The question is past: <b>kept<\/b>."},{"qid":"c9-12-10","type":"change","level":1,"topic":"sentence_types","prompt":"Combine into one sentence using 'and'.","source":"The moon rose. The stars came out.","options":["The moon rose and the stars come out.","The moon rose and the stars came out.","The moon rises and the stars came out."],"answer":1,"rule":"Joining two simple sentences with <b>and<\/b> makes a compound sentence. Keep both verbs in the past."},{"qid":"c9-12-11","type":"spot","level":2,"topic":"participles","prompt":"Which sentence is correct?","options":["The doves slept in the shadowy cote, hide from the cold wind.","The doves slept in the shadowy cote, hidden from the cold wind.","The doves slept in the shadowy cote, hid from the cold wind."],"answer":1,"rule":"The doves were hidden, so use the past participle <b>hidden<\/b> to describe them."},{"qid":"c9-12-12","type":"spot","level":2,"topic":"adverbs","prompt":"Which sentence is correct?","options":["Our dog always sleep in the kennel.","Our dog always sleeps in the kennel.","Our dog always sleeping in the kennel."],"answer":1,"rule":"A frequency adverb (<b>always<\/b>) goes before the main verb, and <b>our dog<\/b> takes <b>sleeps<\/b>."},{"qid":"c9-12-13","type":"fix","level":2,"topic":"prepositions","prompt":"One word is wrong. Find it and fix it.","words":["We","reached","Nani's","village","in","midnight","on","Diwali."],"errors":[{"i":4,"options":["on","into","at"],"answer":2}],"rule":"Use <b>at<\/b> with exact times: <b>at<\/b> midnight, <b>at<\/b> noon, <b>at<\/b> seven o'clock."},{"qid":"c9-12-14","type":"fix","level":2,"topic":"participles","prompt":"One word is wrong. Find it and fix it.","words":["The","bark","dog","next","door","woke","up","the","whole","lane."],"errors":[{"i":1,"options":["barking","barked","barks"],"answer":0}],"rule":"A present participle can describe a noun: the <b>barking<\/b> dog (the dog that is barking)."},{"qid":"c9-12-15","type":"fill","level":2,"topic":"sentence_types","prompt":"Fill in the gap.","before":"The night was cold,","after":"the dog stayed in its kennel.","options":["because of","despite","so"],"answer":2,"rule":"<b>So<\/b> joins two clauses to show a result. <b>Because of<\/b> and <b>despite<\/b> need a noun, not a clause."},{"qid":"c9-12-16","type":"fill","level":2,"topic":"adverbs","prompt":"Fill in the gap.","before":"The night was","after":"quiet that we could hear the leaves fall.","options":["such","so","too"],"answer":1,"rule":"<b>So<\/b> + adjective + <b>that<\/b> shows a result. <b>Such<\/b> needs a noun; <b>too<\/b> is not used with <b>that<\/b>."},{"qid":"c9-12-17","type":"build","level":2,"topic":"sentence_types","prompt":"Make a complex sentence.","answer":["Moti","barked","because","he","heard","footsteps."],"alts":[],"rule":"<b>Because<\/b> starts the clause that gives the reason: because he heard footsteps."},{"qid":"c9-12-18","type":"chat","level":2,"topic":"participles","prompt":"Pick the correct reply.","chat":[["Riya","Did you see the fireworks last night?"]],"options":["Yes! I watched them standing on the terrace.","Yes! I watched them stood on the terrace.","Yes! I watch them standing on the terrace."],"answer":0,"rule":"The present participle <b>standing<\/b> shows what I was doing; <b>last night<\/b> needs <b>watched<\/b>."},{"qid":"c9-12-19","type":"change","level":2,"topic":"sentence_types","prompt":"Combine using 'who'.","source":"I saw an old man. He was feeding the doves.","options":["I saw an old man who was feeding the doves.","I saw an old man which was feeding the doves.","I saw an old man who he was feeding the doves."],"answer":0,"rule":"<b>Who<\/b> replaces <b>he<\/b> for a person, so drop <b>he<\/b>. <b>Which<\/b> is for things and animals."},{"qid":"c9-12-20","type":"proof","level":2,"topic":"sentence_types","prompt":"Find and fix the 2 errors in this message.","words":["Hi","Om!","Last","night","the","moon","was","so","bright","that","the","whole","village","look","silver.","Even","Moti","sleep","peacefully","on","the","porch."],"errors":[{"i":13,"options":["looking","looks","looked"],"answer":2},{"i":17,"options":["slept","sleeping","sleepy"],"answer":0}],"rule":"<b>Last night<\/b> is past, so both verbs need the simple past: <b>looked<\/b> and <b>slept<\/b>."},{"qid":"c9-12-21","type":"spot","level":3,"topic":"sentence_types","prompt":"Which is a correct complex sentence?","options":["Although the stream was still, but the fish were awake.","Though the stream was still, so the fish were awake.","Although the stream was still, the fish were awake."],"answer":2,"rule":"<b>Although/Though<\/b> already joins the clauses, so don't add <b>but<\/b> or <b>so<\/b>."},{"qid":"c9-12-22","type":"spot","level":3,"topic":"prepositions","prompt":"Which sentence is correct?","options":["Our old dog Moti has always been afraid from loud thunder.","Our old dog Moti has always been afraid of loud thunder.","Our old dog Moti has always been afraid with loud thunder."],"answer":1,"rule":"We say <b>afraid of<\/b> something: afraid <b>of<\/b> loud thunder. <b>From<\/b> and <b>with<\/b> are wrong here."},{"qid":"c9-12-23","type":"fix","level":3,"topic":"participles","prompt":"One word is wrong. Find it and fix it.","words":["Curl","up","in","his","kennel,","Moti","slept","like","a","log."],"errors":[{"i":0,"options":["Curled","Curls","Curler"],"answer":0}],"rule":"A past participle phrase can describe the subject: <b>Curled up<\/b> in his kennel, Moti slept."},{"qid":"c9-12-24","type":"fill","level":3,"topic":"sentence_types","prompt":"Fill in the gap.","before":"This is the stream","after":"silver reeds grow.","options":["which","where","who"],"answer":1,"rule":"Use <b>where<\/b> for a place when the clause already has its own subject and verb (silver reeds grow)."},{"qid":"c9-12-25","type":"fill","level":3,"topic":"adverbs","prompt":"Fill in the gap.","before":"Moti barked","after":"that he woke the whole lane.","options":["so loudly","such loudly","too loudly"],"answer":0,"rule":"<b>So<\/b> + adverb + <b>that<\/b> shows a result: so loudly that... <b>Such<\/b> goes with a noun."},{"qid":"c9-12-26","type":"build","level":3,"topic":"prepositions","prompt":"Put the words in order.","answer":["Doves","peeped","out","of","their","cote."],"alts":[],"rule":"<b>Out of<\/b> shows movement from inside a place to outside."},{"qid":"c9-12-27","type":"chat","level":3,"topic":"sentence_types","prompt":"Pick the correct reply.","chat":[["Dad","Why are you still awake?"]],"options":["I can't sleep because of the moon is so bright.","I can't sleep, because so the moon is bright.","I can't sleep because the moon is so bright."],"answer":2,"rule":"<b>Because<\/b> + clause gives a reason. <b>Because of<\/b> needs a noun, not a full clause."},{"qid":"c9-12-28","type":"chat","level":3,"topic":"participles","prompt":"Pick the correct reply.","chat":[["Kavya","What did you do on the night trek?"]],"options":["We walked for hours, guided by the moon.","We walked for hours, guiding by the moon.","We walk for hours, guided by the moon."],"answer":0,"rule":"We were guided (passive meaning), so use the past participle <b>guided<\/b>; the trek is past: <b>walked<\/b>."},{"qid":"c9-12-29","type":"change","level":3,"topic":"sentence_types","prompt":"Make it a simple sentence using a participle.","source":"The mouse saw the dog and ran away.","options":["Seen the dog, the mouse ran away.","Seeing the dog, the mouse run away.","Seeing the dog, the mouse ran away."],"answer":2,"rule":"Replace the first verb with the present participle <b>Seeing<\/b>; the main verb stays past: <b>ran<\/b>."},{"qid":"c9-12-30","type":"proof","level":3,"topic":"adverbs","prompt":"Find and fix the 2 errors in this message.","words":["Dear","Asha,","yesterday","we","walked","careful","through","the","dark","orchard.","The","moonlight","made","every","fruit","looks","silver,","and","the","trees","stood","still","like","statues."],"errors":[{"i":5,"options":["carefulness","cared","carefully"],"answer":2},{"i":15,"options":["looking","look","looked"],"answer":1}],"rule":"How we walked needs the adverb <b>carefully<\/b>. After <b>made<\/b> + object, use the base verb: made every fruit <b>look<\/b>."},{"qid":"c9-12-31","type":"spot","level":4,"topic":"participles","prompt":"Which sentence is correct?","options":["Building many years ago, the old temple still looks beautiful.","Built many years ago, the old temple still looks beautiful.","Built many years ago, the old temple still look beautiful."],"answer":1,"rule":"The temple was built (passive), so use <b>Built<\/b>. <b>The temple<\/b> is singular: <b>looks<\/b>."},{"qid":"c9-12-32","type":"fix","level":4,"topic":"sentence_types","prompt":"One word is wrong. Find it and fix it.","words":["No","sooner","had","the","moon","risen","when","the","dog","began","to","bark."],"errors":[{"i":6,"options":["than","then","that"],"answer":0}],"rule":"The pair is <b>no sooner ... than<\/b>. <b>When<\/b> goes with <b>hardly/scarcely<\/b>."},{"qid":"c9-12-33","type":"fix","level":4,"topic":"adverbs","prompt":"One word is wrong. Find it and fix it.","words":["Riya","speaks","English","very","good","for","a","ten-year-old."],"errors":[{"i":4,"options":["better","nice","well"],"answer":2}],"rule":"<b>Good<\/b> is an adjective. To describe how someone speaks, use the adverb <b>well<\/b>."},{"qid":"c9-12-34","type":"fill","level":4,"topic":"prepositions","prompt":"Fill in the gap.","before":"During the thunderstorm, Moti hid","after":"the bed.","options":["since","among","under"],"answer":2,"rule":"<b>Under<\/b> shows a place below something. <b>Since<\/b> is for time; <b>among<\/b> is for a group of things."},{"qid":"c9-12-35","type":"build","level":4,"topic":"adverbs","prompt":"Make a question.","answer":["How","often","do","you","walk","your","dog?"],"alts":[],"rule":"<b>How often<\/b> asks about frequency, followed by <b>do<\/b> + subject + base verb."},{"qid":"c9-12-36","type":"chat","level":4,"topic":"sentence_types","prompt":"Pick the correct reply.","chat":[["Om","Why didn't you call me last night?"]],"options":["I was too tired that I fell asleep early.","I was so tired that I fell asleep early.","I was so tired than I fell asleep early."],"answer":1,"rule":"Use <b>so ... that<\/b> to show a result. <b>Too<\/b> goes with <b>to<\/b> + verb, not <b>that<\/b>."},{"qid":"c9-12-37","type":"chat","level":4,"topic":"prepositions","prompt":"Pick the correct reply.","chat":[["Mom","When does your school trip start?"]],"options":["It starts at Monday on seven in the morning.","It starts on Monday at seven in the morning.","It starts on Monday at seven on the morning."],"answer":1,"rule":"<b>On<\/b> + day, <b>at<\/b> + clock time, <b>in<\/b> the morning."},{"qid":"c9-12-38","type":"change","level":4,"topic":"sentence_types","prompt":"Make it a complex sentence using 'as'.","source":"Being tired, the old dog slept all day.","options":["As the old dog was tired, it slept all day.","As the old dog was tired, so it slept all day.","As the old dog is tired, it slept all day."],"answer":0,"rule":"The participle <b>Being tired<\/b> becomes a reason clause: <b>As<\/b> the old dog <b>was<\/b> tired. No <b>so<\/b> after <b>as<\/b>."},{"qid":"c9-12-39","type":"change","level":4,"topic":"participles","prompt":"Join using a past participle.","source":"The house was painted white. It shone in the moonlight.","options":["Painting white, the house shone in the moonlight.","Painted white, the house shines in the moonlight.","Painted white, the house shone in the moonlight."],"answer":2,"rule":"<b>Was painted<\/b> becomes the past participle <b>Painted<\/b>; the main verb stays <b>shone<\/b>."},{"qid":"c9-12-40","type":"proof","level":4,"topic":"prepositions","prompt":"Find and fix the 3 errors in this message.","words":["Hi","Neha!","We","are","camping","besides","a","quiet","lake.","Last","night","the","moon","rose","over","the","hills","and","the","water","turn","silver.","Have","you","ever","saw","such","a","beautiful","sight?"],"errors":[{"i":5,"options":["between","among","beside"],"answer":2},{"i":20,"options":["turned","turning","turns"],"answer":0},{"i":25,"options":["seen","see","seeing"],"answer":0}],"rule":"<b>Beside<\/b> = next to; <b>last night<\/b> needs <b>turned<\/b>; present perfect question: have you ever <b>seen<\/b>."},{"qid":"c9-12-41","type":"spot","level":5,"topic":"participles","prompt":"Which sentence is correct?","options":["Walking through the orchard, the silver fruit caught my eye.","Walking through the orchard, I noticed the silver fruit on the trees.","Walked through the orchard, I noticed the silver fruit on the trees."],"answer":1,"rule":"A participle phrase must describe the subject. <b>I<\/b> was walking, not the fruit, so the subject must be <b>I<\/b>."},{"qid":"c9-12-42","type":"fix","level":5,"topic":"prepositions","prompt":"One word is wrong. Find it and fix it.","words":["For","the","Diwali","party,","Riya","prefers","silver","anklets","than","gold","ones."],"errors":[{"i":8,"options":["from","to","with"],"answer":1}],"rule":"<b>Prefer<\/b> takes <b>to<\/b>: prefer one thing <b>to<\/b> another. <b>Than<\/b> goes with comparatives."},{"qid":"c9-12-43","type":"fill","level":5,"topic":"participles","prompt":"Fill in the gap.","before":"","after":"by the silver moonlight, the old house looked like a palace.","options":["Bathing","Bathe","Bathed"],"answer":2,"rule":"The house was bathed by the moonlight (passive meaning), so use the past participle <b>Bathed<\/b>."},{"qid":"c9-12-44","type":"build","level":5,"topic":"sentence_types","prompt":"Put the words in order.","answer":["Hardly","had","the","moon","risen","when","Moti","began","to","bark."],"alts":[],"rule":"<b>Hardly<\/b> at the start is followed by <b>had<\/b> + subject + past participle, then <b>when<\/b>."},{"qid":"c9-12-45","type":"chat","level":5,"topic":"sentence_types","prompt":"Pick the correct reply.","chat":[["Ira","Did you finish the moon-watching project?"],["Ira","It was due today."]],"options":["Not only I finished it, but I also made a model.","Not only did I finished it, but I also made a model.","Not only did I finish it, but I also made a model."],"answer":2,"rule":"<b>Not only<\/b> at the start needs question order: <b>did I<\/b> + base verb <b>finish<\/b>."},{"qid":"c9-12-46","type":"change","level":5,"topic":"sentence_types","prompt":"Change into a compound sentence.","source":"Although the night was cold, the doves slept peacefully.","options":["The night was cold, but the doves slept peaceful.","The night was cold, but the doves slept peacefully.","The night was cold, but the doves sleep peacefully."],"answer":1,"rule":"<b>Although<\/b> (contrast) becomes <b>but<\/b>. Keep the past <b>slept<\/b> and the adverb <b>peacefully<\/b>."},{"qid":"c9-12-47","type":"change","level":5,"topic":"sentence_types","prompt":"Rewrite using 'No sooner ... than'.","source":"As soon as the moon rose, the stream began to gleam.","options":["No sooner did the moon rose than the stream began to gleam.","No sooner did the moon rise than the stream began to gleam.","No sooner the moon rose
