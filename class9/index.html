 than the stream began to gleam."],"answer":1,"rule":"<b>No sooner<\/b> needs question order: <b>did<\/b> + subject + base verb (<b>rise<\/b>), then <b>than<\/b>."},{"qid":"c9-12-48","type":"change","level":5,"topic":"adverbs","prompt":"Change into an exclamatory sentence.","source":"The moon is shining very brightly.","options":["How brightly the moon is shining!","How brightly is the moon shining!","What brightly the moon is shining!"],"answer":0,"rule":"<b>Very<\/b> + adverb becomes <b>How<\/b> + adverb, then statement order: how brightly <b>the moon is<\/b> shining!"},{"qid":"c9-12-49","type":"proof","level":5,"topic":"participles","prompt":"Find and fix the 3 errors in this paragraph.","words":["Seen","from","the","hill,","Shirgaon","look","like","a","silver","painting.","Every","roof","and","every","tree","were","shining","in","the","moonlight.","Not","a","single","leaf","moved,","and","the","stream","flowed","gently","past","the","sleep","houses."],"errors":[{"i":5,"options":["looking","looker","looked"],"answer":2},{"i":15,"options":["was","are","be"],"answer":0},{"i":32,"options":["slept","sleeping","sleeps"],"answer":1}],"rule":"Past story: <b>looked<\/b>; <b>every ... and every ...<\/b> takes <b>was<\/b>; the participle <b>sleeping<\/b> describes the houses."},{"qid":"c9-12-50","type":"proof","level":5,"topic":"sentence_types","prompt":"Find and fix the 3 errors in this message.","words":["Hi","Kabir!","If","I","had","knew","about","the","full","moon,","I","would","have","join","you","on","the","hill.","Next","time,","please","call","me","before","you","left","home."],"errors":[{"i":5,"options":["knowing","known","know"],"answer":1},{"i":13,"options":["joining","joins","joined"],"answer":2},{"i":25,"options":["leave","leaving","leaves"],"answer":0}],"rule":"Third conditional: <b>had known<\/b> ... <b>would have joined<\/b>. A future request needs the present: before you <b>leave<\/b>."}]},{"id":"13","num":"3.2","title":"Reading Works of Art","unit":"Unit he correct reply.","chat":[["Neha","Has the school wall been painted yet?"]],"options":["Yes, it has been painted with Gond designs.","Yes, it has painted with Gond designs.","Yes, it has been paint with Gond designs."],"answer":0,"rule":"Present perfect passive: <b>has been<\/b> + past participle (<b>painted<\/b>)."},{"qid":"c9-13-36","type":"chat","level":4,"topic":"used_to","prompt":"Pick the correct reply.","chat":[["Arjun","You draw so well!"],["Arjun","Did someone teach you?"]],"options":["My uncle used to teach me when I was small.","My uncle used to teaching me when I was small.","My uncle used to teach me when I am small."],"answer":0,"rule":"<b>Used to<\/b> + base verb, and the time clause stays in the past: <b>when I was small<\/b>."},{"qid":"c9-13-37","type":"chat","level":5,"topic":"noun_clause","prompt":"Pick the correct reply.","chat":[["Teacher","Rohan, what did the guide tell you about Raza?"]],"options":["He said that Raza have studied art in Nagpur and Mumbai.","He said that Raza had studied art in Nagpur and Mumbai.","He said that did Raza study art in Nagpur and Mumbai."],"answer":1,"rule":"After <b>said that<\/b>, use statement order and shift back the tense: <b>had studied<\/b>."},{"qid":"c9-13-38","type":"change","level":1,"topic":"passive","prompt":"Change into passive voice.","source":"Raza painted this picture.","options":["This picture is painted by Raza.","This picture was paint by Raza.","This picture was painted by Raza."],"answer":2,"rule":"Simple past active becomes <b>was<\/b> + past participle in the passive."},{"qid":"c9-13-39","type":"change","level":2,"topic":"adjective_clause","prompt":"Join the sentences using 'who'.","source":"Raza was a great painter. He was born in Madhya Pradesh.","options":["Raza, who he was born in Madhya Pradesh, was a great painter.","Raza, who was born in Madhya Pradesh, were a great painter.","Raza, who was born in Madhya Pradesh, was a great painter."],"answer":2,"rule":"<b>Who<\/b> replaces <b>he<\ ix the colours carefully, the picture will look dull.","Unless you mix the colours carefully, the picture will look dull.","Unless you will mix the colours carefully, the picture will look dull."],"answer":1,"rule":"<b>Unless<\/b> already means 'if not', so drop the <b>not<\/b>; keep the simple present."},{"qid":"c9-13-45","type":"change","level":5,"topic":"passive","prompt":"Change into passive voice.","source":"Did Raza use the colour blue in this painting?","options":["Did the colour blue used by Raza in this painting?","Was the colour blue use by Raza in this painting?","Was the colour blue used by Raza in this painting?"],"answer":2,"rule":"A past question in the passive: <b>Was<\/b> + subject + past participle (<b>used<\/b>)?"},{"qid":"c9-13-46","type":"proof","level":3,"topic":"passive","prompt":"Find and fix the 2 errors in this note.","words":["Gond","art","is","practised","by","many","tribal","families.","Long","ago,","colours","were","make","from","soil","and","leaves,","and","every","wall","were","decorated","with","dots."],"errors":[{"i":12,"options":["making","makes","made"],"answer":2},{"i":20,"options":["was","are","be"],"answer":0}],"rule":"Passive needs the past participle (<b>were made<\/b>); <b>every wall<\/b> is singular, so <b>was decorated<\/b>."},{"qid":"c9-13-47","type":"proof","level":4,"topic":"used_to","prompt":"Find and fix the 2 errors in this paragraph.","words":["Kamla","Bai,","who","live","in","a","village","near","Nagpur,","use","to","paint","birds","on","her","walls.","The","colours","which","she","used","came","from","flowers","and","bark."],"errors":[{"i":3,"options":["lives","living","life"],"answer":0},{"i":9,"options":["uses","using","used"],"answer":2}],"rule":"<b>Who<\/b> refers to Kamla Bai (singular): <b>who lives<\/b>. A past habit: <b>used to paint<\/b>."},{"qid":"c9-13-48","type":"proof","level":5,"topic":"noun_clause","prompt":"Find and fix the 3 errors in this message.","words":["Last","Sunday,","Meena","and","me","vi erunds and infinitives"},{"tag":"linking_words","name":"Linking words (although, despite, however, moreover)"}],"questions":[{"qid":"c9-14-01","type":"spot","level":1,"topic":"gerund_infinitive","prompt":"Which sentence is correct?","options":["I decided taking the grassy path.","I decided to take the grassy path.","I decided take the grassy path."],"answer":1,"rule":"<b>Decide<\/b> is followed by the infinitive: <b>decided to take<\/b>."},{"qid":"c9-14-02","type":"spot","level":1,"topic":"linking_words","prompt":"Which sentence is correct?","options":["Despite of the rain, we went for a walk in the woods.","Despite the rain, we went for a walk in the woods.","Despite it rained, we went for a walk in the woods."],"answer":1,"rule":"<b>Despite<\/b> takes a noun directly (no <b>of<\/b>) and is not followed by a full clause."},{"qid":"c9-14-03","type":"spot","level":2,"topic":"third_conditional","prompt":"Pick the sentence with the correct verb forms.","options":["If he would have taken the other road, he would have reached the river.","If he had taken the other road, he will have reached the river.","If he had taken the other road, he would have reached the river."],"answer":2,"rule":"Third conditional: <b>If<\/b> + past perfect, <b>would have<\/b> + past participle."},{"qid":"c9-14-04","type":"spot","level":2,"topic":"modal_deduction","prompt":"Which sentence is correct?","options":["The ground is wet, so it must have rained last night.","The ground is wet, so it must rained last night.","The ground is wet, so it must has rained last night."],"answer":0,"rule":"A sure guess about the past: <b>must have<\/b> + past participle."},{"qid":"c9-14-05","type":"spot","level":3,"topic":"gerund_infinitive","prompt":"Which sentence is correct?","options":["Choose a career is not an easy task.","Choosing a career is not an easy task.","Chose a career is not an easy task."],"answer":1,"rule":"An action used as the subject takes the gerund (-ing form): <b>Choosing<\/b> a career is ..."},{"qid":"c9-14-06","type":"spot","level":3,"topic":"linking_words","prompt":"Which sentence is correct?","options":["The first road looked fine; however, he has took the other one.","The first road looked fine; however, he taking the other one.","The first road looked fine; however, he took the other one."],"answer":2,"rule":"After <b>; however,<\/b> you need a full clause with a proper past verb: <b>he took<\/b>. 'Has took' and 'he taking' are wrong."},{"qid":"c9-14-07","type":"spot","level":4,"topic":"third_conditional","prompt":"Which sentence is correct?","options":["If Neha had practised more, she would have won the match.","If Neha had practised more, she would won the match.","If Neha had practise more, she would have won the match."],"answer":0,"rule":"Past perfect needs the past participle (<b>had practised<\/b>); the result is <b>would have won<\/b>."},{"qid":"c9-14-08","type":"spot","level":5,"topic":"modal_deduction","prompt":"Which sentence is correct?","options":["Arjun can't have chosen science; he hates physics.","Arjun can't have choose science; he hates physics.","Arjun can't has chosen science; he hates physics."],"answer":0,"rule":"To say something is impossible in the past: <b>can't have<\/b> + past participle (<b>chosen<\/b>)."},{"qid":"c9-14-09","type":"fix","level":1,"topic":"gerund_infinitive","prompt":"One word is wrong. Find it and fix it.","words":["Rohan","is","fond","of","read","poems","by","Robert","Frost."],"errors":[{"i":4,"options":["reads","reader","reading"],"answer":2}],"rule":"After a preposition like <b>of<\/b>, use the gerund: fond of <b>reading<\/b>."},{"qid":"c9-14-10","type":"fix","level":1,"topic":"linking_words","prompt":"One word is wrong. Find it and fix it.","words":["Sana","kept","walking","through","the","woods","although","her","aching","legs."],"errors":[{"i":6,"options":["because","unless","despite"],"answer":2}],"rule":"<b>Although<\/b> needs a full clause. Before a noun phrase (<b>her aching legs<\/b>) use <b>despite<\/b>."},{"qid":"c9-14-11","type":"fix","level":2,"topic":"third_conditional","prompt":"One word is wrong. Find it and fix it.","words":["If","I","had","known","about","the","fork,","I","will","have","brought","a","map."],"errors":[{"i":8,"options":["would","shall","can"],"answer":0}],"rule":"Third conditional result clause: <b>would have<\/b> + past participle."},{"qid":"c9-14-12","type":"fix","level":2,"topic":"modal_deduction","prompt":"One word is wrong. Find it and fix it.","words":["Someone","must","have","walking","on","this","path","last","night."],"errors":[{"i":3,"options":["walk","walked","walks"],"answer":1}],"rule":"<b>Must have<\/b> is followed by the past participle: <b>must have walked<\/b>."},{"qid":"c9-14-13","type":"fix","level":3,"topic":"gerund_infinitive","prompt":"One word is wrong. Find it and fix it.","words":["Kiran","is","thinking","of","choose","science","after","Class","10."],"errors":[{"i":4,"options":["chose","choosing","chosen"],"answer":1}],"rule":"A verb after the preposition <b>of<\/b> takes the -ing form: thinking of <b>choosing<\/b>."},{"qid":"c9-14-14","type":"fix","level":4,"topic":"third_conditional","prompt":"One word is wrong. Find it and fix it.","words":["If","Frost","has","not","stopped","at","the","fork,","he","would","not","have","written","the","poem."],"errors":[{"i":2,"options":["have","was","had"],"answer":2}],"rule":"With <b>would not have written<\/b>, the if-clause needs the past perfect: <b>had not stopped<\/b>."},{"qid":"c9-14-15","type":"fix","level":4,"topic":"linking_words","prompt":"One word is wrong. Find it and fix it.","words":["Despite","he","loves","cricket,","Neel","stayed","home","to","study."],"errors":[{"i":0,"options":["Unless","Until","Although"],"answer":2}],"rule":"A full clause (<b>he loves cricket<\/b>) needs <b>Although<\/b>; <b>Despite<\/b> takes a noun or -ing form."},{"qid":"c9-14-16","type":"fix","level":5,"topic":"modal_deduction","prompt":"One word is wrong. Find it and fix it.","words":["Rhea","can't","have","saw","the","notice,","or","she","would","have","come","to","the","meeting."],"errors":[{"i":3,"options":["see","seeing","seen"],"answer":2}],"rule":"<b>Can't have<\/b> + past participle: <b>can't have seen<\/b>. <b>Saw<\/b> is the simple past, not the participle."},{"qid":"c9-14-17","type":"fill","level":1,"topic":"gerund_infinitive","prompt":"Fill in the gap.","before":"Frost wanted","after":"both roads.","options":["to travel","travelling","travel"],"answer":0,"rule":"<b>Want<\/b> is followed by the infinitive: <b>wanted to travel<\/b>."},{"qid":"c9-14-18","type":"fill","level":1,"topic":"linking_words","prompt":"Choose the linking word.","before":"","after":"the path was steep, we reached the top.","options":["However","Although","Despite"],"answer":1,"rule":"<b>Although<\/b> joins a contrasting clause. <b>However<\/b> cannot join two clauses with a comma; <b>Despite<\/b> needs a noun."},{"qid":"c9-14-19","type":"fill","level":2,"topic":"third_conditional","prompt":"Fill in the gap.","before":"If you had left earlier, you","after":"the bus.","options":["would have caught","will catch","would catch"],"answer":0,"rule":"<b>Had left<\/b> (past perfect) pairs with <b>would have caught<\/b> for an unreal past."},{"qid":"c9-14-20","type":"fill","level":2,"topic":"modal_deduction","prompt":"Fill in the gap.","before":"The leaves are not crushed, so people","after":"used this road much.","options":["can't have","can't has","must had"],"answer":0,"rule":"Uncrushed leaves show it is impossible: <b>can't have used<\/b>. After a modal always use <b>have<\/b> + past participle."},{"qid":"c9-14-21","type":"fill","level":3,"topic":"gerund_infinitive","prompt":"Fill in the gap.","before":"I am looking forward to","after":"my cousin in Pune.","options":["meet","meeting","met"],"answer":1,"rule":"In <b>look forward to<\/b>, <b>to<\/b> is a preposition, so it takes the -ing form: <b>meeting<\/b>."},{"qid":"c9-14-22","type":"fill","level":3,"topic":"linking_words","prompt":"Choose the linking word.","before":"","after":"his doubts, he took the less-travelled road.","options":["Although","However","Despite"],"answer":2,"rule":"<b>His doubts<\/b> is a noun phrase, not a clause, so use <b>Despite<\/b>."},{"qid":"c9-14-23","type":"fill","level":4,"topic":"third_conditional","prompt":"Fill in the gap.","before":"Riya would have won the race if she","after":"fallen.","options":["has not","did not","had not"],"answer":2,"rule":"With <b>would have won<\/b>, the if-clause takes the past perfect: <b>had not fallen<\/b>."},{"qid":"c9-14-24","type":"fill","level":5,"topic":"third_conditional","prompt":"Fill in the gap (mixed conditional).","before":"If he had taken the other road, he","after":"be lost now.","options":["would have","will have","would"],"answer":2,"rule":"Past condition, present result (<b>now<\/b>): <b>had taken<\/b> ... <b>would be<\/b>."},{"qid":"c9-14-25","type":"build","level":1,"topic":"gerund_infinitive","prompt":"Make a sentence.","answer":["We","decided","to","walk","home."],"alts":[],"rule":"<b>Decide<\/b> + infinitive: <b>decided to walk<\/b>."},{"qid":"c9-14-26","type":"build","level":2,"topic":"linking_words","prompt":"Make a sentence with 'Despite'.","answer":["Despite","the","rain,","we","kept","walking."],"alts":[],"rule":"<b>Despite<\/b> + noun phrase, then the main clause."},{"qid":"c9-14-27","type":"build","level":3,"topic":"modal_deduction","prompt":"Make a sentence that shows a sure guess about the past.","answer":["The","road","must","have","been","quiet."],"alts":[],"rule":"<b>Must have been<\/b> = I am sure it was."},{"qid":"c9-14-28","type":"build","level":4,"topic":"third_conditional","prompt":"Make a third conditional sentence.","answer":["Meera","would","have","helped","if","she","had","known."],"alts":[],"rule":"Result <b>would have helped<\/b> + <b>if<\/b> + past perfect (<b>had known<\/b>)."},{"qid":"c9-14-29","type":"build","level":5,"topic":"gerund_infinitive","prompt":"Make a sentence about a regret.","answer":["He","regretted","not","having","chosen","the","other","road."],"alts":[["He","regretted","having","not","chosen","the","other","road."]],"rule":"<b>Regret<\/b> + perfect gerund (<b>not having chosen<\/b>) talks about an earlier action."},{"qid":"c9-14-30","type":"chat","level":1,"topic":"gerund_infinitive","prompt":"Pick the correct reply.","chat":[["Ishaan","What do you enjoy doing on Sundays?"]],"options":["I enjoy cycling with my friends.","I enjoy to cycle with my friends.","I enjoy cycle with my friends."],"answer":0,"rule":"<b>Enjoy<\/b> is followed by the gerund: <b>enjoy cycling<\/b>."},{"qid":"c9-14-31","type":"chat","level":1,"topic":"linking_words","prompt":"Pick the correct reply.","chat":[["Priya","Did you go to the park yesterday?"]],"options":["No. Because of the rain, we stayed in.","No. Although it rained, so we stayed in.","No. Because the rain, we stayed in."],"answer":0,"rule":"Before a noun use <b>because of<\/b>. <b>Although<\/b> and <b>so<\/b> are never used together."},{"qid":"c9-14-32","type":"chat","level":2,"topic":"third_conditional","prompt":"Pick the correct reply.","chat":[["Kunal","Did you watch the final yesterday?"]],"options":["No. If I would have known it was on, I would have watched it.","No. If I had known it was on, I would have watched it.","No. If I had known it was on, I will watch it."],"answer":1,"rule":"Unreal past: <b>If I had known<\/b>, <b>I would have watched<\/b>. Never put <b>would have<\/b> in the if-clause."},{"qid":"c9-14-33","type":"chat","level":2,"topic":"modal_deduction","prompt":"Pick the correct reply.","chat":[["Mom","Where are my keys?"],["Mom","I had them this morning."]],"options":["You must have leave them in the car.","You must have left them in the car.","You must had left them in the car."],"answer":1,"rule":"A sure guess about the past: <b>must have<\/b> + past participle (<b>left<\/b>)."},{"qid":"c9-14-34","type":"chat","level":3,"topic":"gerund_infinitive","prompt":"Pick the correct reply.","chat":[["Coach","Why did you stop at the shop on the way?"]],"options":["I stopped buy some water.","I stopped to buy some water.","I stopped for buy some water."],"answer":1,"rule":"<b>Stop to do<\/b> gives the purpose of stopping: <b>stopped to buy<\/b>."},{"qid":"c9-14-35","type":"chat","level":4,"topic":"linking_words","prompt":"Pick the correct reply.","chat":[["Aditi","Are you taking science or commerce?"]],"options":["Science. I love biology; moreover, I wants to be a doctor.","Science. I love biology; moreover, I want be a doctor.","Science. I love biology; moreover, I want to be a doctor."],"answer":2,"rule":"With <b>I<\/b>, use <b>want<\/b>, and <b>want<\/b> takes the infinitive: <b>want to be<\/b>."},{"qid":"c9-14-36","type":"chat","level":4,"topic":"third_conditional","prompt":"Pick the correct reply.","chat":[["Sam","You missed the school trip!"],["Sam","Why didn't you come?"]],"options":["I had a fever. If I had been well, I would have come.","I had a fever. If I had been well, I would had come.","I had a fever. If I had been well, I will come."],"answer":0,"rule":"Third conditional: <b>If I had been<\/b> ..., <b>I would have come<\/b>."},{"qid":"c9-14-37","type":"chat","level":5,"topic":"modal_deduction","prompt":"Pick the correct reply.","chat":[["Tara","Rohan didn't answer my call."],["Tara","Do you think he was angry?"]],"options":["He can't have be angry; he must have been asleep.","He can't have been angry; he must have been asleep.","He can't had been angry; he must have been asleep."],"answer":1,"rule":"Past deduction: <b>can't have been<\/b> (impossible) and <b>must have been<\/b> (sure)."},{"qid":"c9-14-38","type":"change","level":1,"topic":"gerund_infinitive","prompt":"Rewrite using a gerund as the subject.","source":"To walk in the woods is relaxing.","options":["Walking in the woods is relaxing.","Walk in the woods is relaxing.","Walked in the woods is relaxing."],"answer":0,"rule":"The infinitive subject <b>To walk<\/b> becomes the gerund <b>Walking<\/b>."},{"qid":"c9-14-39","type":"change","level":2,"topic":"linking_words","prompt":"Join the sentences using 'Although'.","source":"The road was less travelled. He took it.","options":["Although the road was less travelled, but he took it.","Although the road was less travelled, he took it.","Although the road was less travelled, he taken it."],"answer":1,"rule":"Do not add <b>but<\/b> after an <b>although<\/b> clause; the simple past is <b>took<\/b>, not taken."},{"qid":"c9-14-40","type":"change","level":3,"topic":"third_conditional","prompt":"Combine the sentences using 'If'.","source":"He did not take the first road. He did not see the river.","options":["If he had taken the first road, he would have seen the river.","If he took the first road, he would see the river.","If he had taken the first road, he would saw the river."],"answer":0,"rule":"Facts in the past become a third conditional: <b>If he had taken<\/b> ..., <b>he would have seen<\/b>."},{"qid":"c9-14-41","type":"change","level":3,"topic":"modal_deduction","prompt":"Rewrite using 'must have'.","source":"I am sure that Aman forgot the meeting.","options":["Aman must have forgot the meeting.","Aman must forgotten the meeting.","Aman must have forgotten the meeting."],"answer":2,"rule":"<b>Must have<\/b> + past participle; the participle of <b>forget<\/b> is <b>forgotten<\/b>."},{"qid":"c9-14-42","type":"change","level":4,"topic":"linking_words","prompt":"Rewrite using 'Despite'.","source":"Although she was afraid, Meera chose the dark path.","options":["Despite she was afraid, Meera chose the dark path.","Despite being afraid, Meera chose the dark path.","Despite of being afraid, Meera chose the dark path."],"answer":1,"rule":"<b>Despite<\/b> + -ing form (<b>being afraid<\/b>), with no <b>of<\/b> and no full clause."},{"qid":"c9-14-43","type":"change","level":4,"topic":"gerund_infinitive","prompt":"Join the sentences using 'Instead of'.","source":"He did not take the busy road. He took the quiet one.","options":["Instead of take the busy road, he took the quiet one.","Instead of to take the busy road, he took the quiet one.","Instead of taking the busy road, he took the quiet one."],"answer":2,"rule":"<b>Instead of<\/b> is a preposition, so the verb after it takes -ing: <b>taking<\/b>."},{"qid":"c9-14-44","type":"change","level":5,"topic":"third_conditional","prompt":"Rewrite beginning with 'Had' (omit 'if').","source":"If I had known the way, I would have gone alone.","options":["Had I know the way, I would have gone alone.","Had I known the way, I would have gone alone.","Had known I the way, I would have gone alone."],"answer":1,"rule":"Drop <b>if<\/b> and put <b>Had<\/b> before the subject: <b>Had I known<\/b>."},{"qid":"c9-14-45","type":"change","level":5,"topic":"linking_words","prompt":"Rewrite using 'however'.","source":"Both roads looked the same, but he chose the grassy one.","options":["Both roads looked the same; however, he choose the grassy one.","Both roads looked the same; however, he chose the grassy one.","Both roads looked the same; however, he chosen the grassy one."],"answer":1,"rule":"Use <b>; however,<\/b> between the clauses and keep the simple past <b>chose<\/b> (not choose or chosen)."},{"qid":"c9-14-46","type":"proof","level":3,"topic":"gerund_infinitive","prompt":"Find and fix the 2 errors in this note.","words":["After","finishing","Class","10,","Varun","hopes","to","studying","music.","He","is","good","at","play","the","sitar,","and","his","parents","have","agreed","to","support","him."],"errors":[{"i":7,"options":["study","studied","studies"],"answer":0},{"i":13,"options":["plays","played","playing"],"answer":2}],"rule":"<b>Hope<\/b> + infinitive: <b>hopes to study<\/b>. After the preposition <b>at<\/b>, use -ing: <b>good at playing<\/b>."},{"qid":"c9-14-47","type":"proof","level":4,"topic":"linking_words","prompt":"Find and fix the 2 errors in this paragraph.","words":["Ira","wanted","to","visited","the","lake;","however,","the","path","was","blocked.","Although","the","delay,","she","waited","patiently","and","finally","reached","the","water","before","sunset."],"errors":[{"i":3,"options":["visits","visiting","visit"],"answer":2},{"i":11,"options":["Despite","Because","Unless"],"answer":0}],"rule":"<b>Want<\/b> + to + base verb: <b>wanted to visit<\/b>. Before a noun (<b>the delay<\/b>) use <b>Despite<\/b>."},{"qid":"c9-14-48","type":"proof","level":5,"topic":"third_conditional","prompt":"Find and fix the 3 errors in this paragraph.","words":["If","Mohit","had","listen","to","his","teacher,","he","would","have","chose","the","right","subject.","Now","he","wishes","he","had","think","more","carefully."],"errors":[{"i":3,"options":["listened","listening","listens"],"answer":0},{"i":10,"options":["chosen","choose","choosing"],"answer":0},{"i":19,"options":["thinking","thinks","thought"],"answer":2}],"rule":"<b>Had<\/b> and <b>would have<\/b> need past participles: <b>had listened<\/b>, <b>would have chosen<\/b>, <b>had thought<\/b>."},{"qid":"c9-14-49","type":"proof","level":5,"topic":"modal_deduction","prompt":"Find and fix the 3 errors in this paragraph.","words":["The","leaves","on","this","road","are","fresh","and","uncrushed.","Raju","can't","have","walking","here","today;","he","must","have","came","by","the","river","path,","and","he","must","has","reached","home","by","now."],"errors":[{"i":12,"options":["walk","walked","walks"],"answer":1},{"i":18,"options":["coming","come","comes"],"answer":1},{"i":26,"options":["have","having","had"],"answer":0}],"rule":"Deduction about the past: <b>can't have walked<\/b>, <b>must have come<\/b>. After a modal, always <b>have<\/b>, never <b>has<\/b>."},{"qid":"c9-14-50","type":"proof","level":5,"topic":"gerund_infinitive","prompt":"Find and fix the 2 errors in this paragraph.","words":["Choosing","between","football","and","studies","was","hard","for","Dev.","Now","he","manages","to","finishing","his","homework","early","and","enjoys","play","football","on","weekends."],"errors":[{"i":13,"options":["finished","finishes","finish"],"answer":2},{"i":19,"options":["played","plays","playing"],"answer":2}],"rule":"<b>Manage<\/b> + infinitive: <b>manages to finish<\/b>. <b>Enjoy<\/b> + gerund: <b>enjoys playing<\/b>."}]},{"id":"15","num":"3.4","title":"How the First Letter was Written","unit":"Unit Three","topics":[{"tag":"direct_speech","name":"Direct speech with quotation marks"},{"tag":"reported_speech","name":"Reported (indirect) speech"},{"tag":"sentence_types","name":"Simple, compound and complex sentences"},{"tag":"time_clauses","name":"As soon as / No sooner ... than / Hardly ... when"}],"questions":[{"qid":"c9-15-01","type":"spot","level":1,"topic":"direct_speech","prompt":"Which sentence is correct?","options":["\"I can draw pictures,\" said Taffy.","\"I can draw pictures,\" told Taffy.","\"I can drew pictures,\" said Taffy."],"answer":0,"rule":"With direct speech use <b>said<\/b> (told needs a listener). After <b>can<\/b>, use the base verb <b>draw<\/b>."},{"qid":"c9-15-02","type":"spot","level":1,"topic":"sentence_types","prompt":"Which sentence is correct?","options":["Tegumai broke his spear, but he did not had another one.","Tegumai broke his spear, but he did not have another one.","Tegumai broke his spear, but he not have another one."],"answer":1,"rule":"In this compound sentence, the second clause needs <b>did not<\/b> + base verb: <b>did not have<\/b>."},{"qid":"c9-15-03","type":"spot","level":2,"topic":"reported_speech","prompt":"Which sentence is correct?","options":["Taffy asked the stranger if did he know where her mother lived.","Taffy asked the stranger if he knew where her mother lived.","Taffy asked the stranger that he knew where her mother lived."],"answer":1,"rule":"A reported yes/no question uses <b>if<\/b> and statement order: <b>if he knew<\/b>."},{"qid":"c9-15-04","type":"spot","level":2,"topic":"time_clauses","prompt":"Which sentence is correct?","options":["As soon as Teshumai saw the picture, she scream.","As soon as Teshumai will see the picture, she screamed.","As soon as Teshumai saw the picture, she screamed."],"answer":2,"rule":"Both actions happened in the past, so both verbs are simple past: <b>saw<\/b> ... <b>screamed<\/b>."},{"qid":"c9-15-05","type":"spot","level":3,"topic":"reported_speech","prompt":"Which reported command is correct?","options":["Tegumai told Taffy not to disturb the stranger.","Tegumai told Taffy don't disturb the stranger.","Tegumai said Taffy not to disturb the stranger."],"answer":0,"rule":"A negative command is reported with <b>told<\/b> + person + <b>not to<\/b> + verb."},{"qid":"c9-15-06","type":"spot","level":3,"topic":"sentence_types","prompt":"Which complex sentence is correct?","options":["The stranger smiled because of he had a daughter of his own.","The stranger smiled because he had a daughter of his own.","The stranger smiled because he have a daughter of his own."],"answer":1,"rule":"<b>Because<\/b> (not because of) introduces a clause; <b>he<\/b> takes <b>had<\/b> in the past."},{"qid":"c9-15-07","type":"spot","level":4,"topic":"time_clauses","prompt":"Which sentence is correct?","options":["No sooner did the stranger left than Taffy sat down, pleased.","No sooner had the stranger left than Taffy sat down, pleased.","No sooner had the stranger left when Taffy sat down, pleased."],"answer":1,"rule":"The pattern is <b>No sooner had<\/b> + past participle ... <b>than<\/b>."},{"qid":"c9-15-08","type":"spot","level":5,"topic":"reported_speech","prompt":"Which sentence is correct?","options":["Taffy said that I had drawn the spear outside our cave.","Taffy said that she had drew the spear outside their cave.","Taffy said that she had drawn the spear outside their cave."],"answer":2,"rule":"In reported speech <b>I/our<\/b> become <b>she/their<\/b>, and <b>had<\/b> takes the past participle <b>drawn<\/b>."},{"qid":"c9-15-09","type":"fix","level":1,"topic":"direct_speech","prompt":"One word is wrong. Find it and fix it.","words":["Tegumai","said,","\"I","break","my","spear","an","hour","ago.\""],"errors":[{"i":3,"options":["broke","broken","breaking"],"answer":0}],"rule":"<b>An hour ago<\/b> is past time, so use the simple past: <b>broke<\/b>."},{"qid":"c9-15-10","type":"fix","level":1,"topic":"sentence_types","prompt":"One word is wrong. Find it and fix it.","words":["Tegumai","sat","down","and","begin","to","mend","the","spear."],"errors":[{"i":4,"options":["begun","begins","began"],"answer":2}],"rule":"Verbs joined by <b>and<\/b> keep the same tense: <b>sat<\/b> ... <b>began<\/b>."},{"qid":"c9-15-11","type":"fix","level":2,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["Taffy","asked","the","stranger","if","he","know","her","mother."],"errors":[{"i":6,"options":["knew","known","knowing"],"answer":0}],"rule":"After the past verb <b>asked<\/b>, the reported question moves back a tense: <b>if he knew<\/b>."},{"qid":"c9-15-12","type":"fix","level":2,"topic":"time_clauses","prompt":"One word is wrong. Find it and fix it.","words":["As","soon","as","the","stranger","got","the","bark,","he","run","into","the","bushes."],"errors":[{"i":9,"options":["running","runs","ran"],"answer":2}],"rule":"<b>Got<\/b> is past, so the main clause is past too: <b>he ran<\/b>."},{"qid":"c9-15-13","type":"fix","level":3,"topic":"direct_speech","prompt":"One word is wrong. Find it and fix it.","words":["\"Daddy","and","me","are","going","fishing,\"","said","Taffy."],"errors":[{"i":2,"options":["mine","myself","I"],"answer":2}],"rule":"The subject of <b>are going<\/b> needs the subject pronoun: <b>Daddy and I<\/b>."},{"qid":"c9-15-14","type":"fix","level":4,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["Taffy","told","the","stranger","that","her","had","drawn","the","picture","herself."],"errors":[{"i":5,"options":["she","hers","herself"],"answer":0}],"rule":"The reported clause needs a subject pronoun: <b>she<\/b> had drawn it (Taffy's 'I' becomes <b>she<\/b>)."},{"qid":"c9-15-15","type":"fix","level":4,"topic":"sentence_types","prompt":"One word is wrong. Find it and fix it.","words":["The","stranger","did","not","understand","Taffy,","yet","he","smile","kindly","at","her."],"errors":[{"i":8,"options":["smiling","smiled","smiles"],"answer":1}],"rule":"Both clauses of this compound sentence are in the past: did not understand ... <b>smiled<\/b>."},{"qid":"c9-15-16","type":"fix","level":5,"topic":"time_clauses","prompt":"One word is wrong. Find it and fix it.","words":["Hardly","had","Tegumai","mended","his","spear","than","the","carp","swam","away."],"errors":[{"i":6,"options":["then","when","after"],"answer":1}],"rule":"<b>Hardly<\/b> pairs with <b>when<\/b>; <b>than<\/b> goes with <b>no sooner<\/b>."},{"qid":"c9-15-17","type":"fill","level":1,"topic":"direct_speech","prompt":"Fill in the gap.","before":"\"Don't bother me,\"","after":"Tegumai.","options":["said","told","spoke"],"answer":0,"rule":"After a quotation, use <b>said<\/b>. <b>Told<\/b> needs a listener, and <b>spoke<\/b> does not introduce words."},{"qid":"c9-15-18","type":"fill","level":1,"topic":"time_clauses","prompt":"Fill in the gap.","before":"","after":"the stranger saw the drawing, he nodded very hard.","options":["As soon as","Despite","Because of"],"answer":0,"rule":"<b>As soon as<\/b> shows that one action follows another immediately."},{"qid":"c9-15-19","type":"fill","level":2,"topic":"reported_speech","prompt":"Fill in the gap.","before":"Taffy","after":"the stranger to fetch the spear.","options":["said","asked","spoke"],"answer":1,"rule":"A request is reported with <b>asked<\/b> + person + <b>to<\/b> + verb."},{"qid":"c9-15-20","type":"fill","level":2,"topic":"sentence_types","prompt":"Choose the joining word.","before":"Tegumai had forgotten to bring extra spears,","after":"he had to mend the broken one.","options":["so","because of","despite"],"ans ic":"reported_speech","prompt":"Make a reported request.","answer":["Taffy","asked","him","to","fetch","the","spear."],"alts":[],"rule":"Reported request: <b>asked<\/b> + person + <b>to<\/b> + verb."},{"qid":"c9-15-28","type":"build","level":4,"topic":"sentence_types","prompt":"Make a complex sentence.","answer":["The","stranger","ran","off","before","Taffy","could","explain."],"alts":[],"rule":"Main clause + subordinate clause of time beginning with <b>before<\/b>."},{"qid":"c9-15-29","type":"build","level":5,"topic":"time_clauses","prompt":"Make a sentence with 'Hardly ... when'.","answer":["Hardly","had","Tegumai","sat","down","when","the","stranger","arrived."],"alts":[["Hardly","had","the","stranger","sat","down","when","Tegumai","arrived."]],"rule":"<b>Hardly had<\/b> + subject + past participle ... <b>when<\/b> + simple past."},{"qid":"c9-15-30","type":"chat","level":1,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Mom","What did your teacher say today?"]],"options":["She said that the test were on Monday.","She said that the test was on Monday.","She told that the test was on Monday."],"answer":1,"rule":"Use <b>said that<\/b> (told needs a person); <b>the test<\/b> is singular: <b>was<\/b>."},{"qid":"c9-15-31","type":"chat","level":1,"topic":"time_clauses","prompt":"Pick the correct reply.","chat":[["Dad","Call me when you finish your drawing."]],"options":["Sure, I will call you as soon as I will finish.","Sure, I am call you as soon as I finish.","Sure, I will call you as soon as I finish."],"answer":2,"rule":"A future time clause uses the simple present: <b>as soon as I finish<\/b>."},{"qid":"c9-15-32","type":"chat","level":2,"topic":"sentence_types","prompt":"Pick the correct reply.","chat":[["Riya","Did you finish the letter to Grandma?"]],"options":["Yes, I wrote it, and Dad post it this morning.","Yes, I written it, and Dad posted it this morning.","Yes, I wrote it, and Dad posted it this morning."],"answer":2,"rule":"Both clauses of this compound sentence are in the simple past: <b>wrote<\/b>, <b>posted<\/b>."},{"qid":"c9-15-33","type":"chat","level":2,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Aarav","What did the new boy ask you?"]],"options":["He asked me where did I live.","He asked me where I lived.","He asked me where I live in."],"answer":1,"rule":"A reported wh-question uses statement order and shifts back: <b>where I lived<\/b>."},{"qid":"c9-15-34","type":"chat","level":3,"topic":"time_clauses","prompt":"Pick the correct reply.","chat":[["Neha","When did the rain start?"]],"options":["No sooner had we left home than it started raining.","No sooner we had left home than it started raining.","No sooner had we left home when it started raining."],"answer":0,"rule":"<b>No sooner had<\/b> + subject + past participle ... <b>than<\/b>."},{"qid":"c9-15-35","type":"chat","level":4,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Kabir","What did Ms Iyer tell you after class?"]],"options":["She told me to bring my art book tomorrow.","She told me bring my art book tomorrow.","She said me to bring my art book tomorrow."],"answer":0,"rule":"Reported instruction: <b>told<\/b> + person + <b>to<\/b> + verb. <b>Said<\/b> cannot take <b>me<\/b> directly."},{"qid":"c9-15-36","type":"chat","level":4,"topic":"sentence_types","prompt":"Pick the correct reply.","chat":[["Sara","Why are you so late?"]],"options":["I missed the bus, so I have to walked.","I missed the bus, so I had to walk.","I missed the bus, so I had walk."],"answer":1,"rule":"Past necessity: <b>had to<\/b> + base verb (<b>walk<\/b>)."},{"qid":"c9-15-37","type":"chat","level":5,"topic":"time_clauses","prompt":"Pick the correct reply.","chat":[["Dev","Did the match start on time?"]],"options":["Hardly we had sat down when the first ball was bowled.","Hardly had we sat down than the first ball was bowled.","Hardly had we sat down when the first ball was bowled."],"answer":2,"rule":"<b>Hardly<\/b> at the start needs inversion (<b>had we<\/b>) and pairs with <b>when<\/b>."},{"qid":"c9-15-38","type":"change","level":1,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Taffy said, \"I am happy.\"","options":["Taffy said that I was happy.","Taffy said that she were happy.","Taffy said that she was happy."],"answer":2,"rule":"<b>I<\/b> becomes <b>she<\/b> and <b>am<\/b> becomes <b>was<\/b>."},{"qid":"c9-15-39","type":"change","level":2,"topic":"sentence_types","prompt":"Combine into a compound sentence using 'but'.","source":"The stranger smiled. He did not understand a word.","options":["The stranger smiled, but he did not understand a word.","The stranger smiled, but he not understand a word.","The stranger smiled, but he does not understood a word."],"answer":0,"rule":"Two main clauses joined by <b>but<\/b>; keep <b>did not<\/b> + base verb."},{"qid":"c9-15-40","type":"change","level":3,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Tegumai said to Taffy, \"Don't bother me.\"","options":["Tegumai told Taffy not to bother me.","Tegumai told Taffy not to bother him.","Tegumai told Taffy to not bothering him."],"answer":1,"rule":"Negative command: <b>told<\/b> + <b>not to<\/b> + verb; Tegumai's <b>me<\/b> becomes <b>him<\/b>."},{"qid":"c9-15-41","type":"change","level":3,"topic":"time_clauses","prompt":"Rewrite using 'No sooner ... than'.","source":"As soon as Taffy saw the carp, she stamped her foot.","options":["No sooner did Taffy saw the carp than she stamped her foot.","No sooner did Taffy see the carp than she stamped her foot.","No sooner Taffy saw the carp than she stamped her foot."],"answer":1,"rule":"<b>No sooner<\/b> needs inversion: <b>did Taffy see<\/b> (did + base verb) ... <b>than<\/b>."},{"qid":"c9-15-42","type":"change","level":4,"topic":"direct_speech","prompt":"Change into direct speech.","source":"Taffy asked her father if he would be surprised.","options":["Taffy said to her father, \"Will he be surprised?\"","Taffy said to her father, \"Will you be surprised?\"","Taffy said to her father, \"Would you surprised?\""],"answer":1,"rule":"In direct speech Taffy speaks to her father: <b>he<\/b> becomes <b>you<\/b> and <b>would<\/b> becomes <b>will<\/b>."},{"qid":"c9-15-43","type":"change","level":4,"topic":"sentence_types","prompt":"Make it a complex sentence using 'Because'.","source":"Taffy could not write, so she drew pictures.","options":["Because Taffy could not write, so she drew pictures.","Because Taffy could not wrote, she drew pictures.","Because Taffy could not write, she drew pictures."],"answer":2,"rule":"<b>Because<\/b> replaces <b>so<\/b>; never use both. After <b>could not<\/b>, use the base verb."},{"qid":"c9-15-44","type":"change","level":5,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"The stranger said, \"I will get help from the Chief's tribe.\"","options":["The stranger said that I would get help from the Chief's tribe.","The stranger said that he will got help from the Chief's tribe.","The stranger said that he would get help from the Chief's tribe."],"answer":2,"rule":"<b>I<\/b> becomes <b>he<\/b> and <b>will<\/b> becomes <b>would<\/b>."},{"qid":"c9-15-45","type":"change","level":5,"topic":"time_clauses","prompt":"Rewrite using 'Hardly ... when'.","source":"As soon as the stranger reached the cave, the ladies attacked him.","options":["Hardly had the stranger reached the cave when the ladies attacked him.","Hardly the stranger had reached the cave when the ladies attacked him.","Hardly had the stranger reach the cave when the ladies attacked him."],"answer":0,"rule":"<b>Hardly had<\/b> + subject + past participle (<b>reached<\/b>) ... <b>when<\/b>."},{"qid":"c9-15-46","type":"proof","level":3,"topic":"direct_speech","prompt":"Find and fix the 2 errors in this speech.","words":["Taffy","said,","\"Daddy,","Mummy","will","knowing","it","is","you","because","I","drawn","your","spear","all","broken","in","two.\""],"errors":[{"i":5,"options":["know","known","knew"],"answer":0},{"i":11,"options":["drew","draws","drawing"],"answer":0}],"rule":"After <b>will<\/b> use the base verb (<b>know<\/b>); without <b>have<\/b>, the past needs the simple past <b>drew<\/b>, not <b>drawn<\/b>."},{"qid":"c9-15-47","type":"proof","level":4,"topic":"reported_speech","prompt":"Find and fix the 2 errors in this paragraph.","words":["Tegumai","asked","Taffy","what","she","was","doing.","Taffy","said","that","it","were","a","little","plan","of","her","own","and","asked","him","to","promising","that","he","would","be","surprised."],"errors":[{"i":11,"options":["be","was","are"],"answer":1},{"i":22,"options":["promise","promised","promises"],"answer":0}],"rule":"<b>It<\/b> takes <b>was<\/b> in reported speech; a reported request is <b>asked him to promise<\/b>."},{"qid":"c9-15-48","type":"proof","level":5,"topic":"time_clauses","prompt":"Find and fix the 3 errors in this paragraph.","words":["No","sooner","had","Teshumai","saw","the","picture","than","she","screamed.","Hardly","had","the","stranger","spoken","than","the","ladies","knock","him","down."],"errors":[{"i":4,"options":["seeing","see","seen"],"answer":2},{"i":15,"options":["when","then","that"],"answer":0},{"i":18,"options":["knocked","knocking","knocks"],"answer":0}],"rule":"<b>Had<\/b> + past participle (<b>seen<\/b>); <b>Hardly<\/b> pairs with <b>when<\/b>; the result is simple past: <b>knocked<\/b>."},{"qid":"c9-15-49","type":"proof","level":5,"topic":"sentence_types","prompt":"Find and fix the 3 errors in this paragraph.","words":["Tegumai","went","to","the","river","to","catch","fish,","and","Taffy","go","too.","His","spear","broken","on","a","rock,","but","he","had","no","other","spear,","so","he","sit","down","to","mend","it."],"errors":[{"i":10,"options":["goes","went","going"],"answer":1},{"i":14,"options":["breaking","breaks","broke"],"answer":2},{"i":26,"options":["sitting","seat","sat"],"answer":2}],"rule":"Every clause of this story is in the simple past: <b>went<\/b>, <b>broke<\/b>, <b>sat<\/b>."},{"qid":"c9-15-50","type":"proof","level":5,"topic":"reported_speech","prompt":"Find and fix the 2 errors in this paragraph.","words":["The","stranger","thought","that","Taffy","were","the","daughter","of","a","great","Chief.","He","told","himself","that","I","must","fetch","help","from","the","Chief's","tribe","at","once."],"errors":[{"i":5,"options":["are","was","be"],"answer":1},{"i":16,"options":["him","he","his"],"answer":1}],"rule":"<b>Taffy<\/b> is singular: <b>was<\/b>. In a reported thought, the stranger's <b>I<\/b> becomes <b>he<\/b>."}]},{"id":"16","num":"4.1","title":"Please Listen !","unit":"Unit Four","topics":[{"tag":"imperative","name":"Imperatives: dos and don'ts"},{"tag":"agree","name":"Agreeing and disagreeing (so / neither / nor)"},{"tag":"questions","name":"Wh- and yes/no questions"},{"tag":"deduction","name":"Modals of deduction (must have, can't have)"},{"tag":"reported_command","name":"Reporting requests, commands and questions"}],"questions":[{"qid":"c9-16-01","type":"spot","level":1,"topic":"imperative","prompt":"Which 'Don't' instruction is correct?","options":["Don't gives me advice right now.","Not give me advice right now.","Don't give me advice right now."],"answer":2,"rule":"A negative imperative is <b>Don't<\/b> + base verb: <b>Don't give<\/b>."},{"qid":"c9-16-02","type":"spot","level":1,"topic":"questions","prompt":"Which question is correct?","options":["Do it belong to the history book?","Does it belong to the history book?","Does it belongs to the history book?"],"answer":1,"rule":"With <b>it<\/b>, use <b>Does<\/b> + base verb: <b>Does it belong<\/b>? The verb after does never takes -s."},{"qid":"c9-16-03","type":"fix","level":1,"topic":"imperative","prompt":"One word is wrong. Find it and fix it.","words":["Please","listens","to","me","and","do","not","interrupt."],"errors":[{"i":1,"options":["listen","listened","listening"],"answer":0}],"rule":"A request starts with the base verb: <b>Please listen<\/b> ... and <b>do not interrupt<\/b>."},{"qid":"c9-16-04","type":"fix","level":1,"topic":"deduction","prompt":"One word is wrong. Find it and fix it.","words":["Riya","looks","upset;","something","must","has","happened","at","school."],"errors":[{"i":5,"options":["had","have","having"],"answer":1}],"rule":"After a modal, use the base form: <b>must have<\/b> + past participle, never <b>must has<\/b>."},{"qid":"c9-16-05","type":"fill","level":1,"topic":"agree","prompt":"Fill in the gap.","before":"Meera loves mobile games, and so","after":"her brother.","options":["is","do","does"],"answer":2,"rule":"<b>So<\/b> + helper + subject agrees with a positive idea. <b>Loves<\/b> needs <b>does<\/b>, and <b>her brother<\/b> is singular."},{"qid":"c9-16-06","type":"fill","level":1,"topic":"questions","prompt":"Fill in the gap.","before":"","after":"do you think about the new traffic signal?","options":["How","What","Which"],"answer":1,"rule":"We ask for an opinion with <b>What do you think about<\/b> ...? (We say <b>How do you feel<\/b>, but <b>What do you think<\/b>.)"},{"qid":"c9-16-07","type":"build","level":1,"topic":"imperative","prompt":"Make a polite 'don't' instruction.","answer":["Don't","talk","while","I","am","speaking."],"alts":[],"rule":"A negative command: <b>Don't<\/b> + base verb, then the time clause: <b>while I am speaking<\/b>."},{"qid":"c9-16-08","type":"chat","level":1,"topic":"agree","prompt":"Pick the correct reply.","chat":[["Kabir","I think cricket is more fun than football."]],"options":["I am totally agree with you.","I totally agrees with you.","I totally agree with you."],"answer":2,"rule":"<b>Agree<\/b> is a verb, so no <b>am<\/b> before it, and with <b>I<\/b> it has no -s: <b>I totally agree<\/b>."},{"qid":"c9-16-09","type":"change","level":1,"topic":"reported_command","prompt":"Change into indirect speech.","source":"Aryan said to me, \"Please listen.\"","options":["Aryan requested me to listen.","Aryan requested me that listen.","Aryan requested me to listened."],"answer":0,"rule":"A request is reported with <b>requested<\/b> + object + <b>to<\/b> + base verb: <b>requested me to listen<\/b>."},{"qid":"c9-16-10","type":"proof","level":1,"topic":"imperative","prompt":"Find and fix the 2 errors in this message.","words":["When","I","talk","to","you,","please","listen.","Don't","starts","giving","me","advice","and","don't","tells","me","how","I","should","feel.","Just","hear","me."],"errors":[{"i":8,"options":["start","started","starting"],"answer":0},{"i":14,"options":["told","telling","tell"],"answer":2}],"rule":"After <b>Don't<\/b>, use the base verb: <b>Don't start<\/b>, <b>don't tell<\/b>."},{"qid":"c9-16-11","type":"spot","level":2,"topic":"deduction","prompt":"The road is wet this morning. Which sentence is correct?","options":["It must have rained last night.","It must has rained last night.","It must have rain last night."],"answer":0,"rule":"A sure guess about the past: <b>must have<\/b> + past participle: <b>must have rained<\/b>."},{"qid":"c9-16-12","type":"spot","level":2,"topic":"agree","prompt":"Which sentence is correct?","options":["I don't like loud TV shows, and neither do my sister.","I don't like loud TV shows, and neither my sister does.","I don't like loud TV shows, and neither does my sister."],"answer":2,"rule":"<b>Neither<\/b> + helper + subject agrees with a negative idea. <b>My sister<\/b> is singular: <b>neither does my sister<\/b>."},{"qid":"c9-16-13","type":"fix","level":2,"topic":"questions","prompt":"One word is wrong. Find it and fix it.","words":["Why","did","you","started","a","diary","last","week?"],"errors":[{"i":3,"options":["starting","start","starts"],"answer":1}],"rule":"In a question with <b>did<\/b>, the main verb stays in the base form: <b>did you start<\/b>?"},{"qid":"c9-16-14","type":"fix","level":2,"topic":"reported_command","prompt":"One word is wrong. Find it and fix it.","words":["The","coach","told","the","players","to","listening","to","his","plan."],"errors":[{"i":6,"options":["listened","listen","listens"],"answer":1}],"rule":"A reported command uses <b>told<\/b> + object + <b>to<\/b> + base verb: <b>told the players to listen<\/b>."},{"qid":"c9-16-15","type":"fill","level":2,"topic":"imperative","prompt":"Fill in the gap.","before":"Please","after":"worry; I can solve this problem myself.","options":["not","don't","doesn't"],"answer":1,"rule":"A negative request is <b>Please don't<\/b> + base verb. <b>Doesn't<\/b> is not used in imperatives."},{"qid":"c9-16-16","type":"build","level":2,"topic":"questions","prompt":"Ask your friend's opinion.","answer":["Do","you","agree","with","my","opinion?"],"alts":[],"rule":"A yes/no question: <b>Do<\/b> + subject + base verb: <b>Do you agree with<\/b> ...?"},{"qid":"c9-16-17","type":"chat","level":2,"topic":"questions","prompt":"Pick the correct reply.","chat":[["Sana","I am thinking of something from our science book. Guess!"]],"options":["Is it a plant or a animal?","Are it a plant or an animal?","Is it a plant or an animal?"],"answer":2,"rule":"<b>It<\/b> takes <b>is<\/b>, and <b>animal<\/b> starts with a vowel sound, so we say <b>an animal<\/b>."},{"qid":"c9-16-18","type":"chat","level":2,"topic":"agree","prompt":"Pick the correct reply.","chat":[["Dev","The new bus route is very useful."],["Dev","What do you think?"]],"options":["I suppose so, but it are too crowded.","I suppose so, but it is too crowded.","I suppose so, but it too crowded."],"answer":1,"rule":"Every clause needs a verb, and <b>it<\/b> takes <b>is<\/b>: <b>it is too crowded<\/b>."},{"qid":"c9-16-19","type":"change","level":2,"topic":"reported_command","prompt":"Change into indirect speech.","source":"Mother said to Neha, \"Don't over-protect your little brother.\"","options":["Mother told Neha not to over-protect your little brother.","Mother told Neha don't over-protect her little brother.","Mother told Neha not to over-protect her little brother."],"answer":2,"rule":"<b>Don't<\/b> becomes <b>not to<\/b> + base verb, and <b>your<\/b> changes to <b>her<\/b> for Neha."},{"qid":"c9-16-20","type":"proof","level":2,"topic":"deduction","prompt":"Find and fix the 2 errors in this message.","words":["Kiran's","phone","is","switched","off.","He","must","have","forgot","to","charge","it,","or","his","battery","might","have","die","on","the","way","to","school."],"errors":[{"i":8,"options":["forgotten","forget","forgetting"],"answer":0},{"i":17,"options":["dying","dies","died"],"answer":2}],"rule":"Use <b>must have<\/b> / <b>might have<\/b> + past participle: <b>must have forgotten<\/b>, <b>might have died<\/b>."},{"qid":"c9-16-21","type":"spot","level":3,"topic":"deduction","prompt":"Which sentence is correct?","options":["She can't have heard the bell; she was wearing headphones.","She can't have hear the bell; she was wearing headphones.","She can't has heard the bell; she was wearing headphones."],"answer":0,"rule":"A sure 'no' about the past: <b>can't have<\/b> + past participle: <b>can't have heard<\/b>."},{"qid":"c9-16-22","type":"spot","level":3,"topic":"reported_command","prompt":"Which sentence is correct?","options":["The speaker asked us that wait for our turn.","The speaker asked us waiting for our turn.","The speaker asked us to wait for our turn."],"answer":2,"rule":"A reported request: <b>asked<\/b> + object + <b>to<\/b> + base verb: <b>asked us to wait<\/b>."},{"qid":"c9-16-23","type":"fix","level":3,"topic":"agree","prompt":"One word is wrong. Find it and fix it.","words":["My","friends","hate","fake","news,","and","so","am","I."],"errors":[{"i":7,"options":["does","do","did"],"answer":1}],"rule":"The short answer copies the helper of the first verb. <b>Hate<\/b> (simple present) needs <b>do<\/b>: <b>so do I<\/b>."},{"qid":"c9-16-24","type":"fill","level":3,"topic":"questions","prompt":"Fill in the gap.","before":"Nobody knows the answer,","after":"they?","options":["do","does","don't"],"answer":0,"rule":"<b>Nobody<\/b> is negative, so the tag is positive, and it uses <b>they<\/b>: <b>do they<\/b>?"},{"qid":"c9-16-25","type":"fill","level":3,"topic":"imperative","prompt":"Fill in the gap.","before":"Let's agree to disagree,","after":"we?","options":["shall","will","don't"],"answer":0,"rule":"A suggestion with <b>Let's<\/b> always takes the tag <b>shall we<\/b>?"},{"qid":"c9-16-26","type":"build","level":3,"topic":"deduction","prompt":"Make a sure guess about the past.","answer":["The","speaker","must","have","felt","very","lonely."],"alts":[],"rule":"<b>must have<\/b> + past participle (<b>felt<\/b>) shows we are sure about the past."},{"qid":"c9-16-27","type":"chat","level":3,"topic":"deduction","prompt":"Pick the correct reply.","chat":[["Ishaan","Rohan didn't come to the match today."]],"options":["He must have been ill.","He must had been ill.","He must have be ill."],"answer":0,"rule":"<b>must have<\/b> + past participle: <b>must have been<\/b>. After <b>must<\/b> we never use <b>had<\/b>."},{"qid":"c9-16-28","type":"chat","level":3,"topic":"reported_command","prompt":"Pick the correct reply.","chat":[["Ms Joshi","What did your father say about the phone?"]],"options":["He told me to not using it after nine o'clock.","He told me don't use it after nine o'clock.","He told me not to use it after nine o'clock."],"answer":2,"rule":"A reported 'don't' order: <b>told<\/b> + object + <b>not to<\/b> + base verb: <b>told me not to use<\/b>."},{"qid":"c9-16-29","type":"change","level":3,"topic":"questions","prompt":"Change into a yes/no question.","source":"The leader gives truthful answers.","options":["Does the leader gives truthful answers?","Does the leader give truthful answers?","Is the leader give truthful answers?"],"answer":1,"rule":"Simple present question: <b>Does<\/b> + subject + base verb. The -s moves to <b>does<\/b>: <b>Does the leader give<\/b>?"},{"qid":"c9-16-30","type":"proof","level":3,"topic":"agree","prompt":"Find and fix the 2 errors in this message.","words":["Arjun","thinks","these","apps","is","better","than","books.","I","don't","think","so.","Does","he","really","believes","that?","I","totally","disagree","with","him."],"errors":[{"i":4,"options":["are","was","be"],"answer":0},{"i":15,"options":["believed","believing","believe"],"answer":2}],"rule":"<b>These apps<\/b> is plural, so use <b>are<\/b>. After <b>Does<\/b>, use the base verb: <b>believe<\/b>."},{"qid":"c9-16-31","type":"spot","level":4,"topic":"deduction","prompt":"Which sentence is correct?","options":["She must have been cry before we arrived.","She must have been crying before we arrived.","She must have been crying before we had arrive."],"answer":1,"rule":"<b>must have been<\/b> + -ing guesses about an ongoing past action; <b>before we arrived<\/b> uses the simple past."},{"qid":"c9-16-32","type":"fix","level":4,"topic":"imperative","prompt":"One word is wrong. Find it and fix it.","words":["Please","don't","told","me","why","I","shouldn't","feel","so","sad."],"errors":[{"i":2,"options":["tell","telling","tells"],"answer":0}],"rule":"After <b>don't<\/b> in an imperative, use the base verb: <b>Please don't tell me<\/b>."},{"qid":"c9-16-33","type":"fix","level":4,"topic":"agree","prompt":"One word is wrong. Find it and fix it.","words":["Anil","has","finished","his","diary","for","the","week,","and","so","does","Meera."],"errors":[{"i":10,"options":["is","was","has"],"answer":2}],"rule":"The short answer copies the helper: <b>has finished<\/b> ... <b>so has Meera<\/b>."},{"qid":"c9-16-34","type":"fill","level":4,"topic":"questions","prompt":"Fill in the gap.","before":"How long","after":"you been writing this diary?","options":["did","have","has"],"answer":1,"rule":"Present perfect continuous: <b>have<\/b> + <b>been<\/b> + -ing. With <b>you<\/b>, use <b>have<\/b>: <b>have you been writing<\/b>?"},{"qid":"c9-16-35","type":"build","level":4,"topic":"deduction","prompt":"Ask a question that guesses about the past.","answer":["What","must","have","happened","before","this?"],"alts":[],"rule":"Wh-word + <b>must have<\/b> + past participle: <b>What must have happened<\/b> ...?"},{"qid":"c9-16-36","type":"chat","level":4,"topic":"agree","prompt":"Pick the correct reply.","chat":[["Tanvi","Mobile phones should be banned in school."],["Tanvi","Do you agree?"]],"options":["Not necessarily. Some students uses them for learning.","Not necessarily. Some students use them for learning.","Not necessarily. Some student use them for learning."],"answer":1,"rule":"<b>Some<\/b> + plural noun (<b>students<\/b>) takes a plural verb without -s: <b>use<\/b>."},{"qid":"c9-16-37","type":"chat","level":4,"topic":"imperative","prompt":"Pick the correct reply.","chat":[["Grandpa","I tried to send you a photo, but it didn't work."]],"options":["Don't worry, Grandpa. Let me show you how to do it.","Don't worry, Grandpa. Let me shows you how to do it.","Don't worry, Grandpa. Let me to show you how to do it."],"answer":0,"rule":"<b>Let<\/b> + object + base verb, with no <b>to<\/b> and no -s: <b>Let me show you<\/b>."},{"qid":"c9-16-38","type":"change","level":4,"topic":"reported_command","prompt":"Change into indirect speech.","source":"The teacher said, \"Students, form groups of six.\"","options":["The teacher ordered the students to formed groups of six.","The teacher ordered the students that form groups of six.","The teacher ordered the students to form groups of six."],"answer":2,"rule":"A command is reported with <b>ordered<\/b> + object + <b>to<\/b> + base verb: <b>ordered the students to form<\/b>."},{"qid":"c9-16-39","type":"change","level":4,"topic":"questions","prompt":"Change into an interrogative sentence without changing the meaning.","source":"Advice is cheap.","options":["Isn't advice cheap?","Isn't advice is cheap?","Doesn't advice cheap?"],"answer":0,"rule":"A positive statement becomes a negative question: <b>Isn't advice cheap?<\/b> The helper <b>is<\/b> moves to the front once."},{"qid":"c9-16-40","type":"proof","level":4,"topic":"reported_command","prompt":"Find and fix the 2 errors in this message.","words":["Yesterday","Mother","told","me","to","listen","more","and","talks","less.","She","also","told","me","to","wait","for","my","friend","to","finished","his","story."],"errors":[{"i":8,"options":["talk","talked","talking"],"answer":0},{"i":20,"options":["finishing","finishes","finish"],"answer":2}],"rule":"After <b>to<\/b>, use the base verb: <b>to listen more and talk less<\/b>, <b>to finish<\/b>."},{"qid":"c9-16-41","type":"spot","level":5,"topic":"deduction","prompt":"Which sentence is correct?","options":["They can't have went far; their bikes are still outside the gate.","They can't have go far; their bikes are still outside the gate.","They can't have gone far; their bikes are still outside the gate."],"answer":2,"rule":"<b>can't have<\/b> + past participle. The past participle of <b>go<\/b> is <b>gone<\/b>, not <b>went<\/b>."},{"qid":"c9-16-42","type":"fix","level":5,"topic":"agree","prompt":"One word is wrong. Find it and fix it.","words":["Ayaan","has","never","seen","snow","in","his","life,","and","neither","do","I."],"errors":[{"i":10,"options":["has","have","am"],"answer":1}],"rule":"<b>Has never seen<\/b> is present perfect, so the reply copies it with <b>I<\/b>: <b>neither have I<\/b>."},{"qid":"c9-16-43","type":"fill","level":5,"topic":"deduction","prompt":"Fill in the gap.","before":"Someone","after":"taken my notebook; it isn't in my bag.","options":["must have","must has","must having"],"answer":0,"rule":"A modal is followed by the base form: <b>must have taken<\/b>."},{"qid":"c9-16-44","type":"fill","level":5,"topic":"reported_command","prompt":"Fill in the gap.","before":"The leader asked us what","after":"in mind.","options":["had we","did we have","we had"],"answer":2,"rule":"A reported question uses statement word order: <b>what we had<\/b>, not question order."},{"qid":"c9-16-45","type":"build","level":5,"topic":"reported_command","prompt":"Report the question.","answer":["She","asked","me","why","I","was","so","upset."],"alts":[],"rule":"In a reported question, the subject comes before the verb: <b>why I was<\/b>, not <b>why was I<\/b>."},{"qid":"c9-16-46","type":"chat","level":5,"topic":"deduction","prompt":"Pick the correct reply.","chat":[["Mrs Rao","The window is broken and there is a cricket ball on the floor."],["Mrs Rao","Who do you think did it?"]],"options":["The boys next door must have been play cricket.","The boys next door must have been playing cricket.","The boys next door must been playing cricket."],"answer":1,"rule":"A guess about an ongoing past action: <b>must have been<\/b> + -ing: <b>must have been playing<\/b>."},{"qid":"c9-16-47","type":"change","level":5,"topic":"reported_command","prompt":"Change into indirect speech.","source":"He said to me, \"Please don't talk; just hear me.\"","options":["He requested me not to talk but just to hear him.","He requested me not to talk but just to hear me.","He requested me to not talking but just hear him."],"answer":0,"rule":"<b>Please<\/b> becomes <b>requested<\/b>; <b>don't talk<\/b> becomes <b>not to talk<\/b>; the speaker's <b>me<\/b> becomes <b>him<\/b>."},{"qid":"c9-16-48","type":"change","level":5,"topic":"questions","prompt":"Change into indirect speech.","source":"Ravi asked me, \"Do you agree with my opinion?\"","options":["Ravi asked me if did I agree with his opinion.","Ravi asked me if I agreed with his opinion.","Ravi asked me if I agreed with my opinion."],"answer":1,"rule":"A yes/no question is reported with <b>if<\/b> + statement order; the tense moves back (<b>agreed<\/b>) and <b>my<\/b> becomes <b>his<\/b>."},{"qid":"c9-16-49","type":"change","level":5,"topic":"agree","prompt":"Combine using 'neither ... nor'.","source":"The speaker does not want advice. He does not want pity either.","options":["The speaker wants neither advice or pity.","The speaker wants neither advice nor pity.","The speaker does not want neither advice nor pity."],"answer":1,"rule":"<b>Neither<\/b> always pairs with <b>nor<\/b>, and it is already negative, so we do not add <b>not<\/b>."},{"qid":"c9-16-50","type":"proof","level":5,"topic":"imperative","prompt":"Find and fix the 3 errors in this message.","words":["If","you","really","want","to","help","me,","please","don't","gave","me","advice.","Advice","is","cheap,","but","a","patient","listener","are","rare.","Strange","as","it","may","seem,","listening","quietly","to","me","make","me","feel","much","stronger."],"errors":[{"i":9,"options":["given","giving","give"],"answer":2},{"i":19,"options":["were","be","is"],"answer":2},{"i":30,"options":["makes","making","maker"],"answer":0}],"rule":"<b>don't<\/b> + base verb (<b>give<\/b>); <b>a patient listener<\/b> is singular (<b>is<\/b>); a gerund subject (<b>listening ...<\/b>) takes a singular verb (<b>makes<\/b>)."}]},{"id":"17","num":"4.2","title":"The Storyteller","unit":"Unit Four","topics":[{"tag":"narrative_tenses","name":"Past tenses in a story (simple, continuous, perfect)"},{"tag":"reported_speech","name":"Reported speech with say, tell and ask"},{"tag":"conditional3","name":"Third conditional (If ... had ..., would have ...)"},{"tag":"punctuation","name":"Colon and semicolon"},{"tag":"comparison","name":"Degrees of comparison"}],"questions":[{"qid":"c9-17-01","type":"spot","level":1,"topic":"narrative_tenses","prompt":"Pick the sentence with the correct tense.","options":["One night a man had a dream.","One night a man was have a dream.","One night a man haved a dream."],"answer":0,"rule":"A finished past event uses the simple past. The past of <b>have<\/b> is <b>had<\/b>."},{"qid":"c9-17-02","type":"spot","level":1,"topic":"punctuation","prompt":"Which sentence uses the semicolon correctly?","options":["Cyril kept; asking questions as his aunt had no answers.","Cyril kept asking questions; his aunt had no answers.","Cyril kept asking questions; because his aunt had no answers."],"answer":1,"rule":"A <b>semicolon<\/b> joins two complete, closely linked sentences. It never splits a verb, and is not used before <b>because<\/b>."},{"qid":"c9-17-03","type":"fix","level":1,"topic":"narrative_tenses","prompt":"One word is wrong. Find it and fix it.","words":["Both","the","girls","was","asking","questions","all","afternoon."],"errors":[{"i":3,"options":["were","has","is"],"answer":0}],"rule":"<b>Both the girls<\/b> is plural, so the past continuous uses <b>were<\/b>: <b>were asking<\/b>."},{"qid":"c9-17-04","type":"fix","level":1,"topic":"conditional3","prompt":"One word is wrong. Find it and fix it.","words":["If","Bertha","had","been","less","good,","she","would","have","stay","safe","at","home."],"errors":[{"i":9,"options":["stayed","staying","stays"],"answer":0}],"rule":"Third conditional result: <b>would have<\/b> + past participle: <b>would have stayed<\/b>."},{"qid":"c9-17-05","type":"fill","level":1,"topic":"comparison","prompt":"Fill in the gap.","before":"Cyril said it was the","after":"story he had ever heard.","options":["better","good","best"],"answer":2,"rule":"<b>the<\/b> ... <b>ever<\/b> compares with all others, so use the superlative: <b>the best<\/b>."},{"qid":"c9-17-06","type":"fill","level":1,"topic":"reported_speech","prompt":"Fill in the gap.","before":"The bachelor","after":"the children a story about Bertha.","options":["said","spoke","told"],"answer":2,"rule":"We <b>tell<\/b> someone a story. <b>Said<\/b> and <b>spoke<\/b> cannot take a person + a story after them."},{"qid":"c9-17-07","type":"build","level":1,"topic":"narrative_tenses","prompt":"Describe the scene in the past continuous.","answer":["The","wolf","was","sniffing","among","the","bushes."],"alts":[],"rule":"Past continuous: <b>was<\/b> + -ing for an action going on in the past: <b>was sniffing<\/b>."},{"qid":"c9-17-08","type":"chat","level":1,"topic":"comparison","prompt":"Pick the correct reply.","chat":[["Anya","Is your sister older than you?"]],"options":["No, she is more young than me.","No, she is younger than me.","No, she is youngest than me."],"answer":1,"rule":"Short adjectives add <b>-er<\/b> before <b>than<\/b>: <b>younger than<\/b>."},{"qid":"c9-17-09","type":"change","level":1,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Cyril said, \"I am bored.\"","options":["Cyril said that I was bored.","Cyril said that he were bored.","Cyril said that he was bored."],"answer":2,"rule":"<b>I<\/b> becomes <b>he<\/b> for Cyril, and <b>am<\/b> moves back to <b>was<\/b>."},{"qid":"c9-17-10","type":"proof","level":1,"topic":"narrative_tenses","prompt":"Find and fix the 2 errors in this paragraph.","words":["On","that","hot","afternoon,","the","two","girls","were","bored","and","keep","asking","silly","questions.","Their","aunt","decided","to","told","them","a","story,","but","it","was","very","dull."],"errors":[{"i":10,"options":["keeps","kept","keeping"],"answer":1},{"i":18,"options":["telling","tell","tells"],"answer":1}],"rule":"The story is in the past: <b>were bored and kept asking<\/b>. After <b>to<\/b>, use the base verb: <b>to tell<\/b>."},{"qid":"c9-17-11","type":"spot","level":2,"topic":"conditional3","prompt":"Which sentence is correct?","options":["If the aunt had told a better story, the children will have listened.","If the aunt has told a better story, the children would have listened.","If the aunt had told a better story, the children would have listened."],"answer":2,"rule":"Third conditional: <b>If<\/b> + <b>had<\/b> + past participle, <b>would have<\/b> + past participle."},{"qid":"c9-17-12","type":"spot","level":2,"topic":"reported_speech","prompt":"Which sentence is correct?","options":["The aunt said that the story was very good.","The aunt told that the story was very good.","The aunt said me that the story was very good."],"answer":0,"rule":"<b>Say<\/b> needs no person after it: <b>said that<\/b>. <b>Tell<\/b> needs a person: <b>told me that<\/b>."},{"qid":"c9-17-13","type":"fix","level":2,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["Bertha","was","the","more","obedient","child","of","all."],"errors":[{"i":3,"options":["most","much","mostly"],"answer":0}],"rule":"Comparing with <b>all<\/b> the others needs the superlative: <b>the most obedient<\/b>."},{"qid":"c9-17-14","type":"fix","level":2,"topic":"narrative_tenses","prompt":"One word is wrong. Find it and fix it.","words":["After","the","last","scene","had","flashed,","he","look","back","at","the","footprints."],"errors":[{"i":7,"options":["looks","looking","looked"],"answer":2}],"rule":"The earlier action takes the past perfect (<b>had flashed<\/b>); the later one takes the simple past: <b>looked<\/b>."},{"qid":"c9-17-15","type":"fill","level":2,"topic":"narrative_tenses","prompt":"Fill in the gap.","before":"When the wolf came, Bertha","after":"in the myrtle bushes.","options":["is hiding","has hiding","was hiding"],"answer":2,"rule":"An action going on when another past action happened takes the past continuous: <b>was hiding<\/b>."},{"qid":"c9-17-16","type":"build","level":2,"topic":"reported_speech","prompt":"Report the aunt's order.","answer":["The","aunt","asked","Cyril","to","sit","down."],"alts":[],"rule":"A reported order: <b>asked<\/b> + person + <b>to<\/b> + base verb: <b>asked Cyril to sit down<\/b>."},{"qid":"c9-17-17","type":"chat","level":2,"topic":"conditional3","prompt":"Pick the correct reply.","chat":[["Neel","Oh no, we missed the school bus this morning!"]],"options":["If we had left early, we would have catch it.","If we had left early, we would have caught it.","If we left early, we would have caught it."],"answer":1,"rule":"For an unreal past: <b>If<\/b> + <b>had left<\/b>, <b>would have caught<\/b>."},{"qid":"c9-17-18","type":"chat","level":2,"topic":"narrative_tenses","prompt":"Pick the correct reply.","chat":[["Ma","Why didn't you answer my call?"]],"options":["Sorry, Ma. I am travelling on the train yesterday.","Sorry, Ma. I was travelling on the train.","Sorry, Ma. I was travel on the train."],"answer":1,"rule":"An action in progress at a past moment takes the past continuous: <b>I was travelling<\/b>."},{"qid":"c9-17-19","type":"change","level":2,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"The girl said to the bachelor, \"Tell us a story.\"","options":["The girl asked the bachelor to tell us a story.","The girl asked the bachelor to tell them a story.","The girl asked the bachelor to told them a story."],"answer":1,"rule":"An order becomes <b>asked<\/b> + person + <b>to<\/b> + base verb, and <b>us<\/b> becomes <b>them<\/b>."},{"qid":"c9-17-20","type":"proof","level":2,"topic":"comparison","prompt":"Find and fix the 2 errors in this paragraph.","words":["The","bachelor's","story","was","more","exciting","than","the","aunt's.","The","children","said","it","was","the","better","story","they","had","ever","heard.","For","them,","the","aunt's","tale","was","not","as","good","than","his."],"errors":[{"i":15,"options":["best","good","well"],"answer":0},{"i":30,"options":["so","then","as"],"answer":2}],"rule":"<b>The ... ever heard<\/b> needs the superlative <b>best<\/b>. The pattern is <b>as good as<\/b>, never <b>as good than<\/b>."},{"qid":"c9-17-21","type":"spot","level":3,"topic":"punctuation","prompt":"Which sentence uses the colon correctly?","options":["Bertha had: three medals for obedience, punctuality and good behaviour.","Bertha had three medals: one for obedience, one for punctuality and one for good behaviour.","Bertha won three medals for: obedience, punctuality and good behaviour."],"answer":1,"rule":"A <b>colon<\/b> comes after a complete statement to introduce a list. It never comes straight after a verb or a preposition."},{"qid":"c9-17-22","type":"spot","level":3,"topic":"conditional3","prompt":"Which sentence is correct?","options":["If Bertha hadn't worn the medals, the wolf wouldn't have found her.","If Bertha hasn't worn the medals, the wolf wouldn't have found her.","If Bertha hadn't worn the medals, the wolf won't have found her."],"answer":0,"rule":"Third conditional: <b>If<\/b> + <b>hadn't worn<\/b>, <b>wouldn't have found<\/b>."},{"qid":"c9-17-23","type":"fix","level":3,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["Cyril","said","his","aunt","that","the","story","was","stupid."],"errors":[{"i":1,"options":["told","spoke","talked"],"answer":0}],"rule":"When the listener is named, use <b>tell<\/b>: <b>told his aunt that<\/b>. <b>Said<\/b> needs <b>to<\/b> before a person."},{"qid":"c9-17-24","type":"fill","level":3,"topic":"narrative_tenses","prompt":"Fill in the gap.","before":"The children","after":"bored long before the aunt started her story.","options":["had become","have become","become"],"answer":0,"rule":"The earlier of two past actions takes the past perfect: <b>had become<\/b> ... before she <b>started<\/b>."},{"qid":"c9-17-25","type":"fill","level":3,"topic":"conditional3","prompt":"Fill in the gap.","before":"If the wolf had not heard the medals, Bertha","after":"survived.","options":["will have","would have","would"],"answer":1,"rule":"The result of an unreal past: <b>would have<\/b> + past participle: <b>would have survived<\/b>."},{"qid":"c9-17-26","type":"build","level":3,"topic":"punctuation","prompt":"Join two ideas with a semicolon.","answer":["The","story","was","dull;","nobody","listened."],"alts":[],"rule":"A <b>semicolon<\/b> joins two complete, closely linked ideas: <b>The story was dull; nobody listened.<\/b>"},{"qid":"c9-17-27","type":"chat","level":3,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Riya","What did the bus conductor tell you?"]],"options":["He told me that the bus will left at six.","He told me that the bus would leave at six.","He said me that the bus would leave at six."],"answer":1,"rule":"<b>Told<\/b> + person + <b>that<\/b>; <b>will leave<\/b> moves back to <b>would leave<\/b>."},{"qid":"c9-17-28","type":"chat","level":3,"topic":"comparison","prompt":"Pick the correct reply.","chat":[["Kunal","Which story did you like more?"]],"options":["The second one. It was far exciting than the first.","The second one. It was far more exciting than the first.","The second one. It was far most exciting than the first."],"answer":1,"rule":"Long adjectives use <b>more<\/b> + adjective + <b>than<\/b>; <b>far<\/b> makes it stronger: <b>far more exciting than<\/b>."},{"qid":"c9-17-29","type":"change","level":3,"topic":"comparison","prompt":"Change into the comparative degree.","source":"The bachelor's story was the most exciting story of all.","options":["The bachelor's story was more exciting than any other story.","The bachelor's story was more exciting than any story.","The bachelor's story was most exciting than any other story."],"answer":0,"rule":"Superlative to comparative: <b>more exciting than any other<\/b>. Without <b>other<\/b>, the story is compared with itself."},{"qid":"c9-17-30","type":"proof","level":3,"topic":"conditional3","prompt":"Find and fix the 2 errors in this paragraph.","words":["If","Bertha","had","stayed","at","home,","the","wolf","would","not","have","catch","her.","Her","medals","would","not","have","clinked","if","she","has","not","trembled","so","much."],"errors":[{"i":11,"options":["caught","catching","catches"],"answer":0},{"i":21,"options":["have","is","had"],"answer":2}],"rule":"Third conditional: <b>would have<\/b> + past participle (<b>caught<\/b>) and <b>if<\/b> + <b>had<\/b> + past participle (<b>had not trembled<\/b>)."},{"qid":"c9-17-31","type":"spot","level":4,"topic":"narrative_tenses","prompt":"Which sentence is correct?","options":["Bertha had hid in the bushes before the wolf reached them.","Bertha has hidden in the bushes before the wolf reached them.","Bertha had hidden in the bushes before the wolf reached them."],"answer":2,"rule":"Past perfect = <b>had<\/b> + past participle. The past participle of <b>hide<\/b> is <b>hidden<\/b>."},{"qid":"c9-17-32","type":"fix","level":4,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["The","aunt","asked","the","children","to","came","and","listen","to","a","story."],"errors":[{"i":6,"options":["coming","come","comes"],"answer":1}],"rule":"A reported request: <b>asked<\/b> + person + <b>to<\/b> + base verb: <b>to come and listen<\/b>."},{"qid":"c9-17-33","type":"fix","level":4,"topic":"conditional3","prompt":"One word is wrong. Find it and fix it.","words":["If","Bertha","has","been","naughty,","the","Prince","would","not","have","invited","her."],"errors":[{"i":2,"options":["have","was","had"],"answer":2}],"rule":"With <b>would have invited<\/b>, the if-clause needs the past perfect: <b>If Bertha had been<\/b>."},{"qid":"c9-17-34","type":"fill","level":4,"topic":"comparison","prompt":"Fill in the gap.","before":"No other child in the town had","after":"medals as Bertha.","options":["as much","so much","as many"],"answer":2,"rule":"<b>Medals<\/b> can be counted, so use <b>as many<\/b> ... <b>as<\/b>. <b>Much<\/b> is for uncountable nouns."},{"qid":"c9-17-35","type":"build","level":4,"topic":"conditional3","prompt":"Make a third conditional sentence.","answer":["If","Cyril","had","listened,","he","would","have","understood."],"alts":[],"rule":"<b>If<\/b> + <b>had<\/b> + past participle, <b>would have<\/b> + past participle."},{"qid":"c9-17-36","type":"chat","level":4,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Mihir","What did the ticket checker ask you?"]],"options":["He asked me where I was going.","He asked me where was I going.","He asked me where am I going."],"answer":0,"rule":"A reported question uses statement order and moves the tense back: <b>where I was going<\/b>."},{"qid":"c9-17-37","type":"chat","level":4,"topic":"narrative_tenses","prompt":"Pick the correct reply.","chat":[["Coach","Why were you late for practice?"]],"options":["By the time I reached the station, the train
