tten","writing","write"],"answer":0}],"rule":"After <b>has<\/b> in a perfect tense, use the past participle: <b>has written<\/b>."},{"qid":"c9-04-12","type":"fix","level":3,"topic":"causative_have","prompt":"One word is wrong. Find it and fix it.","words":["We","had","our","house","paint","before","Diwali."],"errors":[{"i":4,"options":["painting","painted","paints"],"answer":1}],"rule":"Someone else did the work: <b>have + object + past participle<\/b> - <b>had our house painted<\/b>."},{"qid":"c9-04-13","type":"fix","level":3,"topic":"have_main","prompt":"One word is wrong. Find it and fix it.","words":["Let","us","has","a","party","for","Ira's","birthday."],"errors":[{"i":2,"options":["having","had","have"],"answer":2}],"rule":"After <b>let us<\/b>, use the base form of the verb: <b>let us have a party<\/b>."},{"qid":"c9-04-14","type":"fix","level":4,"topic":"have_main","prompt":"One word is wrong. Find it and fix it.","words":["One","of","my","cousins","have","his","own","horse","in","Satara."],"errors":[{"i":4,"options":["having","has","are"],"answer":1}],"rule":"The subject is <b>one<\/b> (of my cousins), which is singular, so use <b>has<\/b>."},{"qid":"c9-04-15","type":"fix","level":4,"topic":"have_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Mr","Desai","has","been","our","principal","since","ten","years."],"errors":[{"i":6,"options":["from","during","for"],"answer":2}],"rule":"Use <b>for<\/b> with a length of time (ten years) and <b>since<\/b> with a starting point (2015)."},{"qid":"c9-04-16","type":"fix","level":5,"topic":"have_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Every","one","of","the","players","have","had","a","medical","check-up","this","week."],"errors":[{"i":5,"options":["having","is","has"],"answer":2}],"rule":"<b>Every one<\/b> is singular, so the helping verb is <b>has<\/b>: <b>has had a check-up<\/b>."},{"qid":"c9-04-17","type":"fill","level":1,"topic":"have_main","prompt":"Fill in the gap.","before":"Grandfather","after":"a heart attack last year.","options":["had","has","have"],"answer":0,"rule":"<b>Last year<\/b> is in the past, so use <b>had<\/b>."},{"qid":"c9-04-18","type":"fill","level":1,"topic":"have_do","prompt":"Fill in the gap.","before":"","after":"you have a spare pen, Kunal?","options":["Does","Do","Are"],"answer":1,"rule":"Questions with main verb have use <b>do/does<\/b>. With <b>you<\/b>, use <b>Do<\/b>."},{"qid":"c9-04-19","type":"fill","level":2,"topic":"have_main","prompt":"Fill in the gap.","before":"We usually","after":"breakfast at eight o'clock.","options":["have","has","having"],"answer":0,"rule":"For a daily habit with <b>we<\/b>, use the simple present <b>have<\/b>."},{"qid":"c9-04-20","type":"fill","level":2,"topic":"have_perfect","prompt":"Fill in the gap.","before":"The guests","after":"already arrived at the hall.","options":["are","have","has"],"answer":1,"rule":"Present perfect with a plural subject: <b>have arrived<\/b>."},{"qid":"c9-04-21","type":"fill","level":3,"topic":"causative_have","prompt":"Fill in the gap.","before":"Dad is going to have the leaking tap","after":"tomorrow.","options":["fixed","fix","fixing"],"answer":0,"rule":"A plumber will do it: <b>have + object + past participle<\/b> - <b>have the tap fixed<\/b>."},{"qid":"c9-04-22","type":"fill","level":4,"topic":"have_do","prompt":"Choose the correct question tag.","before":"Sara doesn't have a cold today,","after":"she?","options":["has","does","is"],"answer":1,"rule":"The sentence uses <b>doesn't<\/b>, so the tag uses the positive <b>does<\/b>: <b>does she?<\/b>"},{"qid":"c9-04-23","type":"fill","level":5,"topic":"have_perfect","prompt":"Fill in the gap.","before":"By the time the doctor arrived, the patient","after":"already taken the medicine.","options":["has","have","had"],"answer":2,"rule":"The earlier of two past actions takes the past perfect: <b>had taken<\/b>."},{"qid":"c9-04-24","type":"fill","level":5,"topic":"causative_have","prompt":"Fill in the gap.","before":"Meera got her bicycle tyre","after":"at the corner shop.","options":["mended","mend","to mend"],"answer":0,"rule":"<b>Get + object + past participle<\/b> means someone else did it: <b>got her tyre mended<\/b>."},{"qid":"c9-04-25","type":"build","level":1,"topic":"have_main","prompt":"Say how you feel.","answer":["I","have","a","headache","today."],"alts":[],"rule":"Use <b>have<\/b> for a physical condition: <b>I have a headache<\/b>."},{"qid":"c9-04-26","type":"build","level":2,"topic":"have_do","prompt":"Make a question.","answer":["Does","Aarav","have","a","new","bicycle?"],"alts":[],"rule":"Question with main verb have: <b>Does + subject + have<\/b>."},{"qid":"c9-04-27","type":"build","level":3,"topic":"causative_have","prompt":"Say that a painter is doing the work.","answer":["We","are","getting","our","kitchen","painted."],"alts":[],"rule":"<b>Get + object + past participle<\/b>: <b>getting our kitchen painted<\/b>."},{"qid":"c9-04-28","type":"build","level":4,"topic":"have_perfect","prompt":"Make a question.","answer":["How","long","have","you","had","this","laptop?"],"alts":[],"rule":"<b>How long<\/b> asks about a period up to now, so use the present perfect: <b>have you had<\/b>."},{"qid":"c9-04-29","type":"build","level":5,"topic":"have_do","prompt":"Make a sentence with a reason.","answer":["Ravi","didn't","have","lunch","because","he","was","late."],"alts":[],"rule":"Past negative of main verb have: <b>didn't have<\/b>; <b>because<\/b> gives the reason."},{"qid":"c9-04-30","type":"chat","level":1,"topic":"have_do","prompt":"Pick the correct reply.","chat":[["Ishaan","Do you have a pencil, Tara?"]],"options":["Yes, I has one.","Yes, I have one.","Yes, I having one."],"answer":1,"rule":"With <b>I<\/b>, the main verb is <b>have<\/b>."},{"qid":"c9-04-31","type":"chat","level":1,"topic":"have_main","prompt":"Pick the correct reply.","chat":[["Mum","What would you like to have, tea or coffee?"]],"options":["I'll has tea, please.","I'll having tea, please.","I'll have tea, please."],"answer":2,"rule":"After <b>will ('ll)<\/b>, use the base form: <b>I'll have<\/b>."},{"qid":"c9-04-32","type":"chat","level":2,"topic":"have_main","prompt":"Pick the correct reply.","chat":[["Teacher","Why were you absent yesterday, Pooja?"]],"options":["I have had a high fever yesterday, ma'am.","I has a high fever, ma'am.","I had a high fever, ma'am."],"answer":2,"rule":"The illness was in the past (yesterday), so use the simple past <b>had<\/b>."},{"qid":"c9-04-33","type":"chat","level":3,"topic":"have_perfect","prompt":"Pick the correct reply.","chat":[["Arjun","Have you seen the new Marathi film yet?"]],"options":["No, I didn't saw it yet.","No, I haven't seen it yet.","No, I haven't saw it yet."],"answer":1,"rule":"Present perfect negative: <b>haven't + past participle<\/b> - <b>haven't seen<\/b>."},{"qid":"c9-04-34","type":"chat","level":3,"topic":"causative_have","prompt":"Pick the correct reply.","chat":[["Nikhil","Your hair looks different!"]],"options":["Yes, I had it cut yesterday.","Yes, I had it cutting yesterday.","Yes, I have it cut yesterday."],"answer":0,"rule":"The barber did it in the past: <b>had + it + past participle<\/b> - <b>had it cut<\/b>."},{"qid":"c9-04-35","type":"chat","level":4,"topic":"have_do","prompt":"Pick the correct reply.","chat":[["Grandpa","You don't have school tomorrow, do you?"]],"options":["No, I don't. It's a holiday.","No, I doesn't. It's a holiday.","No, I not. It's a holiday."],"answer":0,"rule":"A short answer repeats the helping verb: <b>No, I don't.<\/b>"},{"qid":"c9-04-36","type":"chat","level":5,"topic":"have_do","prompt":"Pick the correct reply.","chat":[["Kavya","Did you have a good time at the wedding?"],["Kavya","I heard there was a band."]],"options":["Yes, I did! The band played till midnight.","Yes, I had! The band played till midnight.","Yes, I did! The band was played till midnight."],"answer":0,"rule":"The question uses <b>did<\/b>, so the short answer is <b>I did<\/b>; the band itself <b>played<\/b> (active)."},{"qid":"c9-04-37","type":"chat","level":5,"topic":"have_perfect","prompt":"Pick the correct reply.","chat":[["Coach","Has Dev recovered from his cold?"]],"options":["Not yet. He is having it since Monday.","Not yet. He has it since Monday.","Not yet. He has had it since Monday."],"answer":2,"rule":"A state from Monday till now takes the present perfect: <b>has had<\/b>."},{"qid":"c9-04-38","type":"change","level":1,"topic":"have_do","prompt":"Make the sentence negative.","source":"Raju has a bicycle.","options":["Raju doesn't has a bicycle.","Raju don't have a bicycle.","Raju doesn't have a bicycle."],"answer":2,"rule":"Negative of main verb have: <b>doesn't have<\/b> (base form after does)."},{"qid":"c9-04-39","type":"change","level":2,"topic":"have_do","prompt":"Change into a yes/no question.","source":"Your brother has a laptop.","options":["Does your brother has a laptop?","Does your brother have a laptop?","Do your brother have a laptop?"],"answer":1,"rule":"Use <b>Does<\/b> with a singular subject, then the base form <b>have<\/b>."},{"qid":"c9-04-40","type":"change","level":2,"topic":"have_perfect","prompt":"Change into the present perfect tense.","source":"Smita wrote a letter to her grandmother.","options":["Smita has wrote a letter to her grandmother.","Smita has written a letter to her grandmother.","Smita have written a letter to her grandmother."],"answer":1,"rule":"Present perfect: <b>has + past participle<\/b> - <b>has written<\/b>."},{"qid":"c9-04-41","type":"change","level":3,"topic":"causative_have","prompt":"Rewrite beginning with 'I had my'.","source":"The tailor stitched my school uniform.","options":["I had my school uniform stitch by the tailor.","I had my school uniform stitching by the tailor.","I had my school uniform stitched by the tailor."],"answer":2,"rule":"Causative: <b>had + object + past participle<\/b> - <b>had my uniform stitched<\/b>."},{"qid":"c9-04-42","type":"change","level":4,"topic":"have_main","prompt":"Change into indirect speech.","source":"Ravi said, \"I have a headache.\"","options":["Ravi said that he had a headache.","Ravi said that I had a headache.","Ravi said that he has had a headache."],"answer":0,"rule":"After <b>said<\/b>, <b>I have<\/b> becomes <b>he had<\/b>: change the pronoun and move the tense back."},{"qid":"c9-04-43","type":"change","level":4,"topic":"have_do","prompt":"Add a question tag.","source":"Sanika doesn't have any brothers.","options":["Sanika doesn't have any brothers, doesn't she?","Sanika doesn't have any brothers, does she?","Sanika doesn't have any brothers, has she?"],"answer":1,"rule":"A negative sentence with <b>doesn't<\/b> takes a positive tag: <b>does she?<\/b>"},{"qid":"c9-04-44","type":"change","level":5,"topic":"have_perfect","prompt":"Change into passive voice.","source":"The workers have repaired the old bridge.","options":["The old bridge has repaired by the workers.","The old bridge has been repaired by the workers.","The old bridge have been repaired by the workers."],"answer":1,"rule":"Present perfect passive: <b>has/have been + past participle<\/b>; <b>bridge<\/b> is singular - <b>has been<\/b>."},{"qid":"c9-04-45","type":"change","level":5,"topic":"have_perfect","prompt":"Rewrite beginning with 'No sooner'.","source":"As soon as we had our dinner, the power went off.","options":["No sooner had we had our dinner than the power went off.","No sooner we had our dinner than the power went off.","No sooner had we had our dinner when the power went off."],"answer":0,"rule":"<b>No sooner<\/b> takes inverted order (<b>had we<\/b>) and pairs with <b>than<\/b>, not when."},{"qid":"c9-04-46","type":"proof","level":1,"topic":"have_main","prompt":"Find and fix the 2 errors in this message.","words":["Uncle","Prakash","have","a","small","farm","near","Nashik.","He","has","two","cows","and","a","goat.","Every","morning","my","cousins","and","I","has","fresh","milk","for","breakfast."],"errors":[{"i":2,"options":["has","having","is"],"answer":0},{"i":21,"options":["have","having","is"],"answer":0}],"rule":"<b>Uncle Prakash<\/b> (one person) takes <b>has<\/b>; <b>my cousins and I<\/b> (plural) takes <b>have<\/b>."},{"qid":"c9-04-47","type":"proof","level":3,"topic":"have_do","prompt":"Find and fix the 2 errors in this message.","words":["Kiran","has","not","came","to","school","since","Monday.","He","has","a","bad","cold","and","don't","have","any","energy.","We","have","sent","him","our","notes."],"errors":[{"i":3,"options":["coming","comes","come"],"answer":2},{"i":14,"options":["haven't","doesn't","isn't"],"answer":1}],"rule":"Perfect tense needs the past participle <b>come<\/b>; the subject <b>he<\/b> is singular, so <b>doesn't have<\/b>."},{"qid":"c9-04-48","type":"proof","level":4,"topic":"causative_have","prompt":"Find and fix the 2 errors in this message.","words":["Last","week","Papa","had","the","brakes","of","our","car","check","at","a","garage","in","Thane.","The","mechanic","said","the","battery","was","weak,","so","Papa","got","it","replace","too.","Now","the","car","starts","easily."],"errors":[{"i":9,"options":["checking","checked","checks"],"answer":1},{"i":26,"options":["replacing","replaces","replaced"],"answer":2}],"rule":"Causative <b>have/get + object + past participle<\/b>: <b>had the brakes checked<\/b>, <b>got it replaced<\/b>."},{"qid":"c9-04-49","type":"proof","level":4,"topic":"have_perfect","prompt":"Find and fix the 3 errors in this message.","words":["Mrs","Kulkarni","has","taught","in","our","school","since","twenty","years.","Since","she","came,","she","has","gave","lessons","to","thousands","of","children,","and","her","former","students","has","become","doctors,","engineers","and","teachers."],"errors":[{"i":7,"options":["for","during","from"],"answer":0},{"i":15,"options":["giving","given","gives"],"answer":1},{"i":25,"options":["having","is","have"],"answer":2}],"rule":"<b>For<\/b> + a length of time (twenty years); <b>has given<\/b> needs the past participle; plural <b>students<\/b> take <b>have<\/b>."},{"qid":"c9-04-50","type":"proof","level":5,"topic":"have_perfect","prompt":"Find and fix the 3 errors in this message.","words":["Every","girl","in","our","hostel","have","a","small","locker.","Yesterday","Riya","find","that","hers","had","been","broke","open,","but","nothing","was","missing","because","she","had","kept","her","money","with","the","warden."],"errors":[{"i":5,"options":["having","are","has"],"answer":2},{"i":11,"options":["found","finds","finding"],"answer":0},{"i":16,"options":["broken","breaking","breaks"],"answer":0}],"rule":"<b>Every girl<\/b> takes <b>has<\/b>; <b>yesterday<\/b> needs <b>found<\/b>; the passive past perfect is <b>had been broken<\/b>."}]},{"id":"05","num":"1.5","title":"The Necklace","unit":"Unit One","topics":[{"tag":"determiners","name":"Determiners (articles, possessives, quantifiers, each/every/neither)"},{"tag":"verb_forms","name":"Verb forms (base, -s, past, -ing, past participle)"},{"tag":"modal_perfect","name":"Modal + have + past participle (must have, should have, can't have)"},{"tag":"reported_speech","name":"Reported speech (statements, questions, orders)"},{"tag":"conditional_3","name":"Third conditional (If ... had ..., would have ...)"}],"questions":[{"qid":"c9-05-01","type":"spot","level":1,"topic":"determiners","prompt":"Which sentence is correct?","options":["Mathilde had no rich dresses and a jewels.","Mathilde had no rich dresses and many jewel.","Mathilde had no rich dresses and no jewels."],"answer":2,"rule":"<b>No<\/b> + plural noun is fine (<b>no jewels<\/b>); <b>a<\/b> needs a singular noun and <b>many<\/b> needs a plural one."},{"qid":"c9-05-02","type":"spot","level":1,"topic":"verb_forms","prompt":"Pick the sentence with the correct past forms.","options":["She teared open the envelope and drew out a card.","She tore open the envelope and drew out a card.","She tore open the envelope and drawed out a card."],"answer":1,"rule":"<b>Tear<\/b> and <b>draw<\/b> are irregular: their past forms are <b>tore<\/b> and <b>drew<\/b>."},{"qid":"c9-05-03","type":"spot","level":2,"topic":"modal_perfect","prompt":"Which sentence is correct?","options":["You must have made a mistake, madam.","You must had made a mistake, madam.","You must have make a mistake, madam."],"answer":0,"rule":"To guess about the past, use <b>must have + past participle<\/b>: <b>must have made<\/b>."},{"qid":"c9-05-04","type":"spot","level":2,"topic":"determiners","prompt":"Which sentence is correct?","options":["Each guests received an invitation card.","Each guest received an invitation card.","Each guest received a invitation card."],"answer":1,"rule":"<b>Each<\/b> takes a singular noun (<b>guest<\/b>), and <b>an<\/b> goes before a vowel sound (<b>an invitation<\/b>)."},{"qid":"c9-05-05","type":"spot","level":3,"topic":"reported_speech","prompt":"Pick the correct reported question.","options":["Loisel asked her whether had she taken the cab's number.","Loisel asked her that whether she had taken the cab's number.","Loisel asked her whether she had taken the cab's number."],"answer":2,"rule":"A reported question uses statement order (<b>she had taken<\/b>) and no <b>that<\/b> before whether."},{"qid":"c9-05-06","type":"spot","level":3,"topic":"conditional_3","prompt":"Which sentence is correct?","options":["If they had found the necklace, they would not borrowed money.","If they would have found the necklace, they would not have borrowed money.","If they had found the necklace, they would not have borrowed money."],"answer":2,"rule":"Third conditional: <b>If + had + past participle<\/b>, then <b>would have + past participle<\/b>."},{"qid":"c9-05-07","type":"spot","level":4,"topic":"determiners","prompt":"Which sentence is correct?","options":["Many money was needed to replace the necklace.","Much money was needed to replace the necklace.","Much money were needed to replace the necklace."],"answer":1,"rule":"<b>Money<\/b> is uncountable: use <b>much<\/b> and a singular verb <b>was<\/b>."},{"qid":"c9-05-08","type":"spot","level":5,"topic":"modal_perfect","prompt":"Which sentence is correct?","options":["Madame Forestier need not to have worried about her necklace.","Madame Forestier need not have worry about her necklace.","Madame Forestier need not have worried about her necklace."],"answer":2,"rule":"<b>Need not have + past participle<\/b> (no 'to') means something was done but was not necessary."},{"qid":"c9-05-09","type":"fix","level":1,"topic":"verb_forms","prompt":"One word is wrong. Find it and fix it.","words":["Mathilde","wash","the","dishes","every","morning","now."],"errors":[{"i":1,"options":["washes","washing","washer"],"answer":0}],"rule":"Simple present with a third person singular subject takes the <b>-s form<\/b>: <b>washes<\/b>."},{"qid":"c9-05-10","type":"fix","level":2,"topic":"determiners","prompt":"One word is wrong. Find it and fix it.","words":["Mathilde","returned","the","necklace","to","she","friend."],"errors":[{"i":5,"options":["hers","her","herself"],"answer":1}],"rule":"Before a noun, use the possessive determiner <b>her<\/b>: <b>her friend<\/b>."},{"qid":"c9-05-11","type":"fix","level":2,"topic":"modal_perfect","prompt":"One word is wrong. Find it and fix it.","words":["You","should","have","return","the","necklace","last","week."],"errors":[{"i":3,"options":["returning","returns","returned"],"answer":2}],"rule":"<b>Should have + past participle<\/b> talks about the past: <b>should have returned<\/b>."},{"qid":"c9-05-12","type":"fix","level":3,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["Mathilde","wrote","to","her","friend","that","she","has","broken","the","clasp","the","day","before."],"errors":[{"i":7,"options":["have","had","having"],"answer":1}],"rule":"After a past reporting verb (<b>wrote<\/b>), <b>has broken<\/b> moves back to <b>had broken<\/b>; <b>the day before<\/b> also needs the past perfect."},{"qid":"c9-05-13","type":"fix","level":3,"topic":"conditional_3","prompt":"One word is wrong. Find it and fix it.","words":["If","Mathilde","has","not","lost","the","necklace,","her","life","would","have","been","easier."],"errors":[{"i":2,"options":["had","have","having"],"answer":0}],"rule":"Third conditional: the if-part takes the past perfect - <b>If Mathilde had not lost<\/b>."},{"qid":"c9-05-14","type":"fix","level":4,"topic":"verb_forms","prompt":"One word is wrong. Find it and fix it.","words":["The","necklace","was","bought","from","a","shop","and","pay","for","with","borrowed","money."],"errors":[{"i":8,"options":["paying","paid","pays"],"answer":1}],"rule":"Both verbs share <b>was<\/b> (passive), so both need the past participle: <b>bought<\/b> and <b>paid<\/b>."},{"qid":"c9-05-15","type":"fix","level":4,"topic":"modal_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Madame","Forestier","can't","have","knew","about","the","new","necklace."],"errors":[{"i":4,"options":["know","knowing","known"],"answer":2}],"rule":"<b>Can't have + past participle<\/b> says something was impossible in the past: <b>can't have known<\/b>."},{"qid":"c9-05-16","type":"fix","level":5,"topic":"determiners","prompt":"One word is wrong. Find it and fix it.","words":["Neither","Mathilde","nor","her","husband","were","able","to","forget","the","ten","hard","years."],"errors":[{"i":5,"options":["was","being","been"],"answer":0}],"rule":"<b>Neither ... nor<\/b> with two singular nouns takes a singular verb: <b>was<\/b>."},{"qid":"c9-05-17","type":"fill","level":1,"topic":"determiners","prompt":"Fill in the gap.","before":"Mathilde had","after":"rich friend from her school days.","options":["an","much","a"],"answer":2,"rule":"<b>Rich<\/b> starts with a consonant sound, so use <b>a<\/b>; <b>much<\/b> is only for uncountable nouns."},{"qid":"c9-05-18","type":"fill","level":1,"topic":"verb_forms","prompt":"Fill in the gap.","before":"Mathilde","after":"the necklace around her neck and looked in the mirror.","options":["fasten","fastened","fastening"],"answer":1,"rule":"Both actions are in the past (<b>looked<\/b>), so use <b>fastened<\/b>."},{"qid":"c9-05-19","type":"fill","level":2,"topic":"modal_perfect","prompt":"Fill in the gap.","before":"The necklace must","after":"fallen in the cab.","options":["has","had","have"],"answer":2,"rule":"After a modal like <b>must<\/b>, always use the base form <b>have<\/b>."},{"qid":"c9-05-20","type":"fill","level":2,"topic":"determiners","prompt":"Fill in the gap.","before":"There was","after":"money left after the party.","options":["few","little","many"],"answer":1,"rule":"<b>Money<\/b> is uncountable, so use <b>little<\/b>; <b>few<\/b> and <b>many<\/b> go with plural nouns."},{"qid":"c9-05-21","type":"fill","level":3,"topic":"reported_speech","prompt":"Fill in the gap.","before":"Madame Forestier asked Mathilde how","after":"changed so much.","options":["she had","had she","did she"],"answer":0,"rule":"Reported questions use statement word order: <b>how she had changed<\/b>."},{"qid":"c9-05-22","type":"fill","level":4,"topic":"conditional_3","prompt":"Fill in the gap.","before":"If Mathilde had stayed at home, she","after":"lost the necklace.","options":["would not have","will not have","would not"],"answer":0,"rule":"Third conditional result clause: <b>would (not) have + past participle<\/b>."},{"qid":"c9-05-23","type":"fill","level":5,"topic":"verb_forms","prompt":"Fill in the gap.","before":"They stared at each other,","after":"by the loss.","options":["stunning","stunned","stun"],"answer":1,"rule":"The past participle <b>stunned<\/b> describes how they felt; it pairs with <b>by<\/b>."},{"qid":"c9-05-24","type":"fill","level":5,"topic":"determiners","prompt":"Fill in the gap.","before":"The jeweller showed them two necklaces, but","after":"of them was cheap.","options":["neither","all","every"],"answer":0,"rule":"For two things, use <b>neither<\/b> with a singular verb; <b>every<\/b> cannot take 'of', and <b>all<\/b> needs 'were'."},{"qid":"c9-05-25","type":"build","level":1,"topic":"determiners","prompt":"Make a sentence.","answer":["She","had","no","jewels","to","wear."],"alts":[],"rule":"The determiner <b>no<\/b> comes right before the noun: <b>no jewels<\/b>."},{"qid":"c9-05-26","type":"build","level":2,"topic":"verb_forms","prompt":"Make a sentence in the past continuous.","answer":["Her","hands","were","trembling","with","joy."],"alts":[],"rule":"Past continuous: <b>was/were + -ing form<\/b> - <b>were trembling<\/b>."},{"qid":"c9-05-27","type":"build","level":3,"topic":"modal_perfect","prompt":"Make a guess about the past.","answer":["She","must","have","dropped","it","in","the","street."],"alts":[],"rule":"A sure guess about the past: <b>must have + past participle<\/b>."},{"qid":"c9-05-28","type":"build","level":4,"topic":"reported_speech","prompt":"Make a reported question.","answer":["He","asked","her","what","the","matter","was."],"alts":[],"rule":"In a reported question the verb comes after the subject: <b>what the matter was<\/b>."},{"qid":"c9-05-29","type":"build","level":5,"topic":"conditional_3","prompt":"Make a third conditional sentence.","answer":["They","would","have","saved","ten","years","if","she","had","known."],"alts":[],"rule":"<b>would have + past participle<\/b> in the result, <b>had + past participle<\/b> after <b>if<\/b>."},{"qid":"c9-05-30","type":"chat","level":1,"topic":"determiners","prompt":"Pick the correct reply.","chat":[["Priya","Can I borrow your blue pen?"]],"options":["Sure, take it. It's on mine desk.","Sure, take it. It's on me desk.","Sure, take it. It's on my desk."],"answer":2,"rule":"Before a noun, use the possessive determiner <b>my<\/b>, not mine or me."},{"qid":"c9-05-31","type":"chat","level":1,"topic":"verb_forms","prompt":"Pick the correct reply.","chat":[["Aai","Did you give the invitation to Mrs Joshi?"]],"options":["Yes, I gave it to her.","Yes, I gived it to her.","Yes, I given it to her."],"answer":0,"rule":"<b>Give<\/b> is irregular: past <b>gave<\/b>, past participle <b>given<\/b>."},{"qid":"c9-05-32","type":"chat","level":2,"topic":"modal_perfect","prompt":"Pick the correct reply.","chat":[["Sahil","I can't find my phone anywhere!"]],"options":["You might have left it on the bus.","You might has left it on the bus.","You might have leave it on the bus."],"answer":0,"rule":"A possible past event: <b>might have + past participle<\/b> - <b>might have left<\/b>."},{"qid":"c9-05-33","type":"chat","level":3,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Mum","What did your teacher say?"]],"options":["She told that we had a test on Monday.","She told us that we had a test on Monday.","She said us that we had a test on Monday."],"answer":1,"rule":"<b>Told<\/b> needs a person after it (<b>told us<\/b>); <b>said<\/b> does not take one directly."},{"qid":"c9-05-34","type":"chat","level":3,"topic":"conditional_3","prompt":"Pick the correct reply.","chat":[["Dhruv","We missed the train by two minutes!"]],"options":["If we had left earlier, we would have caught it.","If we left earlier, we would have caught it.","If we had left earlier, we would caught it."],"answer":0,"rule":"For an unreal past: <b>If + had left<\/b>, <b>would have caught<\/b>."},{"qid":"c9-05-35","type":"chat","level":4,"topic":"determiners","prompt":"Pick the correct reply.","chat":[["Coach","Did the players get their jerseys?"]],"options":["Yes, each players got a jersey.","Yes, each player got an jersey.","Yes, each player got a jersey."],"answer":2,"rule":"<b>Each<\/b> takes a singular noun, and <b>jersey<\/b> starts with a consonant sound, so <b>a jersey<\/b>."},{"qid":"c9-05-36","type":"chat","level":5,"topic":"modal_perfect","prompt":"Pick the correct reply.","chat":[["Riddhi","Anu didn't come to the party."],["Riddhi","Was she ill?"]],"options":["She can't have be ill. I saw her at the market.","She can't have been ill. I saw her at the market.","She can't had been ill. I saw her at the market."],"answer":1,"rule":"To say something was impossible in the past: <b>can't have + past participle<\/b> - <b>can't have been<\/b>."},{"qid":"c9-05-37","type":"chat","level":5,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Teacher","Who told you about the change in the timetable?"]],"options":["Kunal told me that the timetable had been change.","Kunal told to me that the timetable had been changed.","Kunal told me that the timetable had been changed."],"answer":2,"rule":"<b>Told me<\/b> (no 'to'), and the passive needs the past participle: <b>had been changed<\/b>."},{"qid":"c9-05-38","type":"change","level":1,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Loisel said to his wife, \"Try and get a really beautiful dress.\"","options":["Loisel told his wife to tried and get a really beautiful dress.","Loisel told his wife to try and get a really beautiful dress.","Loisel told to his wife try and get a really beautiful dress."],"answer":1,"rule":"An order or advice is reported with <b>told + person + to + base form<\/b>."},{"qid":"c9-05-39","type":"change","level":2,"topic":"verb_forms","prompt":"Change into the past continuous tense.","source":"Mathilde danced at the party.","options":["Mathilde were dancing at the party.","Mathilde was danced at the party.","Mathilde was dancing at the party."],"answer":2,"rule":"Past continuous: <b>was + -ing form<\/b> with a singular subject - <b>was dancing<\/b>."},{"qid":"c9-05-40","type":"change","level":2,"topic":"determiners","prompt":"Make it negative using 'any'.","source":"Mathilde had some jewels.","options":["Mathilde did not had any jewels.","Mathilde did not have any jewels.","Mathilde did not have some jewel."],"answer":1,"rule":"In negatives, <b>some<\/b> becomes <b>any<\/b>; after <b>did not<\/b>, use the base form <b>have<\/b>."},{"qid":"c9-05-41","type":"change","level":3,"topic":"modal_perfect","prompt":"Rewrite using 'must have'.","source":"I am sure that the guests enjoyed the party.","options":["The guests must enjoyed the party.","The guests must have enjoyed the party.","The guests must had enjoyed the party."],"answer":1,"rule":"Being sure about the past = <b>must have + past participle<\/b>."},{"qid":"c9-05-42","type":"change","level":4,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Loisel asked Mathilde, \"Did you take his number?\"","options":["Loisel asked Mathilde if had she taken his number.","Loisel asked Mathilde if she has took his number.","Loisel asked Mathilde if she had taken his number."],"answer":2,"rule":"Yes/no questions are reported with <b>if/whether<\/b>, statement order and backshift: <b>she had taken<\/b>."},{"qid":"c9-05-43","type":"change","level":4,"topic":"conditional_3","prompt":"Combine the sentences using 'If'.","source":"Loisel did not take the cab's number. He could not find the cab.","options":["If Loisel took the cab's number, he could have found the cab.","If Loisel had taken the cab's number, he could have found the cab.","If Loisel had taken the cab's number, he could found the cab."],"answer":1,"rule":"Imagining a different past: <b>If + had + past participle<\/b>, <b>could have + past participle<\/b>."},{"qid":"c9-05-44","type":"change","level":5,"topic":"conditional_3","prompt":"Rewrite beginning with 'Had'.","source":"If Mathilde had told her friend the truth, she would not have suffered so much.","options":["Had Mathilde told her friend the truth, she would not suffered so much.","Had Mathilde tell her friend the truth, she would not have suffered so much.","Had Mathilde told her friend the truth, she would not have suffered so much."],"answer":2,"rule":"Drop <b>if<\/b> and put <b>had<\/b> before the subject; the rest stays the same."},{"qid":"c9-05-45","type":"change","level":5,"topic":"verb_forms","prompt":"Change into passive voice, beginning with 'Mathilde'.","source":"Madame Forestier lent Mathilde a diamond necklace.","options":["Mathilde was lend a diamond necklace by Madame Forestier.","Mathilde is lent a diamond necklace by Madame Forestier.","Mathilde was lent a diamond necklace by Madame Forestier."],"answer":2,"rule":"Simple past passive: <b>was + past participle<\/b>; the past participle of lend is <b>lent<\/b>."},{"qid":"c9-05-46","type":"proof","level":1,"topic":"verb_forms","prompt":"Find and fix the 2 errors in this message.","words":["Mathilde's","husband","come","home","one","evening","with","a","large","envelope.","She","tore","it","open","and","draw","out","a","card.","It","was","an","invitation","to","a","grand","party."],"errors":[{"i":2,"options":["came","comes","coming"],"answer":0},{"i":15,"options":["drew","draws","drawn"],"answer":0}],"rule":"The story is in the past: <b>came<\/b> and <b>drew<\/b> (irregular past forms)."},{"qid":"c9-05-47","type":"proof","level":3,"topic":"determiners","prompt":"Find and fix the 2 errors in this message.","words":["Mathilde","did","not","have","much","dresses,","and","those","she","had","were","all","old.","She","had","very","little","friends,","and","only","one","of","them","was","rich."],"errors":[{"i":4,"options":["a","many","every"],"answer":1},{"i":16,"options":["few","much","less"],"answer":0}],"rule":"Countable plural nouns take <b>many<\/b> and <b>few<\/b>; much and little are for uncountable nouns. <b>those ... were<\/b> and <b>one of them<\/b> show the nouns are plural."},{"qid":"c9-05-48","type":"proof","level":4,"topic":"modal_perfect","prompt":"Find and fix the 2 errors in this message.","words":["Madame","Forestier","said","coldly","that","Mathilde","should","of","returned","the","necklace","sooner.","She","must","have","been","annoyed,","but","she","can't","have","saw","the","change","in","the","diamonds."],"errors":[{"i":7,"options":["has","had","have"],"answer":2},{"i":21,"options":["seen","see","seeing"],"answer":0}],"rule":"Modal + <b>have<\/b> (never 'of') + past participle: <b>should have returned<\/b>, <b>can't have seen<\/b>."},{"qid":"c9-05-49","type":"proof","level":4,"topic":"conditional_3","prompt":"Find and fix the 2 errors in this message.","words":["If","the","Loisels","had","not","borrowed","so","much","money,","they","would","not","have","became","so","poor.","They","had","to","rent","a","small","garret","and","done","all","the","housework","themselves."],"errors":[{"i":13,"options":["become","becoming","becomes"],"answer":0},{"i":24,"options":["doing","does","do"],"answer":2}],"rule":"<b>would have + past participle<\/b> (<b>become<\/b>); after <b>had to<\/b>, both verbs take the base form: <b>rent ... and do<\/b>."},{"qid":"c9-05-50","type":"proof","level":5,"topic":"verb_forms","prompt":"Find and fix the 3 errors in this message.","words":["Ten","years","later,","Mathilde","met","Madame","Forestier,","which","was","still","young","and","charming.","She","explained","that","she","had","worked","hard","to","replace","the","necklace","she","had","borrow","from","her.","Madame","Forestier,","deeply","moved,","took","both","of","her","hand","in","her","own."],"errors":[{"i":7,"options":["whom","who","whose"],"answer":1},{"i":26,"options":["borrowed","borrowing","borrows"],"answer":0},{"i":37,"options":["handed","handing","hands"],"answer":2}],"rule":"Use <b>who<\/b> for a person, <b>had borrowed<\/b> (past participle), and <b>both of her hands<\/b> (plural)."}]},{"id":"06","num":"2.1","title":"Invictus","unit":"Unit Two","topics":[{"tag":"linking_words","name":"Linking words (although, despite, however, therefore)"},{"tag":"non_finite","name":"Non-finite verbs (infinitive, gerund, participle)"},{"tag":"sentence_types","name":"Simple, compound and complex sentences"},{"tag":"time_conj","name":"unless / until / as soon as / no sooner ... than / hardly ... when"}],"questions":[{"qid":"c9-06-01","type":"spot","level":1,"topic":"linking_words","prompt":"Which sentence is correct?","options":["Although it was dark, but Neel walked home bravely.","Although it was dark, Neel walked home bravely.","Despite it was dark, Neel walked home bravely."],"answer":1,"rule":"<b>Although<\/b> already joins the ideas, so don't add <b>but<\/b>. <b>Despite<\/b> cannot take a full clause."},{"qid":"c9-06-02","type":"spot","level":1,"topic":"non_finite","prompt":"Which sentence is correct?","options":["Asha decided facing her fear.","Asha decided to face her fear.","Asha decided to faced her fear."],"answer":1,"rule":"<b>Decide<\/b> is followed by the infinitive: <b>to + base form<\/b> - <b>to face<\/b>."},{"qid":"c9-06-03","type":"spot","level":2,"topic":"time_conj","prompt":"Which sentence is correct?","options":["Do not give up until you will reach the top.","Do not give up until you reached the top.","Do not give up until you reach the top."],"answer":2,"rule":"After <b>until<\/b>, use the simple present for a future event: <b>until you reach<\/b>."},{"qid":"c9-06-04","type":"spot","level":2,"topic":"linking_words","prompt":"Which sentence is correct?","options":["Despite the heavy rain, the team kept playing.","Despite of the heavy rain, the team kept playing.","Despite the heavy rain, the team kept play."],"answer":0,"rule":"Say <b>despite<\/b> (no 'of') or <b>in spite of<\/b>. <b>Kept<\/b> is followed by an -ing form."},{"qid":"c9-06-05","type":"spot","level":3,"topic":"sentence_types","prompt":"Which compound sentence is correct?","options":["The storm was fierce, but the sailors did not lost hope.","The storm was fierce, but the sailors did not lose hope.","The storm was fierce, although but the sailors did not lose hope."],"answer":1,"rule":"A compound sentence joins two clauses with one linker like <b>but<\/b>; after <b>did not<\/b>, use the base form."},{"qid":"c9-06-06","type":"spot","level":3,"topic":"non_finite","prompt":"Which sentence is correct?","options":["Facing problems calmly needs real courage.","Face problems calmly needs real courage.","Faced problems calmly needs real courage."],"answer":0,"rule":"An action used as the subject takes the gerund (-ing form): <b>Facing problems<\/b>."},{"qid":"c9-06-07","type":"spot","level":4,"topic":"time_conj","prompt":"Which sentence is correct?","options":["Unless you don't practise daily, you will not improve.","Unless you will practise daily, you will not improve.","Unless you practise daily, you will not improve."],"answer":2,"rule":"<b>Unless<\/b> means 'if not', so don't add another not; use the simple present after it."},{"qid":"c9-06-08","type":"spot","level":5,"topic":"time_conj","prompt":"Which sentence is correct?","options":["Hardly the sun had risen when the climbers set out.","Hardly had the sun risen than the climbers set out.","Hardly had the sun risen when the climbers set out."],"answer":2,"rule":"<b>Hardly<\/b> takes inverted order (<b>had the sun risen<\/b>) and pairs with <b>when<\/b>."},{"qid":"c9-06-09","type":"fix","level":1,"topic":"non_finite","prompt":"One word is wrong. Find it and fix it.","words":["Kabir","is","fond","of","climb","hills","near","Lonavala."],"errors":[{"i":4,"options":["climbing","climbs","climbed"],"answer":0}],"rule":"After a preposition like <b>of<\/b>, use the gerund: <b>fond of climbing<\/b>."},{"qid":"c9-06-10","type":"fix","level":2,"topic":"linking_words","prompt":"One word is wrong. Find it and fix it.","words":["Despite","he","was","injured,","Rahul","finished","the","race."],"errors":[{"i":0,"options":["Moreover","Therefore","Although"],"answer":2}],"rule":"A full clause (<b>he was injured<\/b>) needs <b>Although<\/b>; <b>despite<\/b> takes a noun or -ing form."},{"qid":"c9-06-11","type":"fix","level":2,"topic":"time_conj","prompt":"One word is wrong. Find it and fix it.","words":["Wait","here","until","Aai","come","back","from","work."],"errors":[{"i":4,"options":["comes","coming","came"],"answer":0}],"rule":"After <b>until<\/b>, use the simple present for the future; <b>Aai<\/b> is singular, so <b>comes<\/b>."},{"qid":"c9-06-12","type":"fix","level":3,"topic":"sentence_types","prompt":"One word is wrong. Find it and fix it.","words":["The","climber","who","reach","the","top","first","was","only","nineteen."],"errors":[{"i":3,"options":["reached","reaching","reachable"],"answer":0}],"rule":"The relative clause tells a past event, matching <b>was<\/b>: <b>who reached the top first<\/b>."},{"qid":"c9-06-13","type":"fix","level":3,"topic":"non_finite","prompt":"One word is wrong. Find it and fix it.","words":["Encourage","by","her","coach,","Tanvi","tried","again."],"errors":[{"i":0,"options":["Encouraging","Encourages","Encouraged"],"answer":2}],"rule":"Tanvi received the action, so use the past participle: <b>Encouraged by her coach<\/b>."},{"qid":"c9-06-14","type":"fix","level":4,"topic":"linking_words","prompt":"One word is wrong. Find it and fix it.","words":["The","path","was","steep;","however,","every","climber","were","calm."],"errors":[{"i":7,"options":["being","was","been"],"answer":1}],"rule":"<b>Every climber<\/b> is singular, so use <b>was<\/b>. <b>However<\/b> after a semicolon links the ideas."},{"qid":"c9-06-15","type":"fix","level":4,"topic":"time_conj","prompt":"One word is wrong. Find it and fix it.","words":["Yesterday,","as","soon","as","the","sun","rose,","the","birds","begin","to","sing."],"errors":[{"i":9,"options":["begun","began","beginning"],"answer":1}],"rule":"<b>Yesterday<\/b> and <b>rose<\/b> show the past, so use the simple past: <b>began<\/b>."},{"qid":"c9-06-16","type":"fix","level":5,"topic":"time_conj","prompt":"One word is wrong. Find it and fix it.","words":["No","sooner","had","the","match","started","when","it","began","to","rain."],"errors":[{"i":6,"options":["then","that","than"],"answer":2}],"rule":"<b>No sooner<\/b> always pairs with <b>than<\/b>; <b>hardly<\/b> pairs with when."},{"qid":"c9-06-17","type":"fill","level":1,"topic":"linking_words","prompt":"Fill in the gap.","before":"","after":"the darkness, the boy was not afraid.","options":["Despite","Although","However"],"answer":0,"rule":"<b>The darkness<\/b> is a noun phrase, not a clause, so use <b>Despite<\/b>."},{"qid":"c9-06-18","type":"fill","level":1,"topic":"non_finite","prompt":"Fill in the gap.","before":"We hope","after":"the summit by noon.","options":["reaching","to reach","reach"],"answer":1,"rule":"<b>Hope<\/b> is followed by the infinitive: <b>hope to reach<\/b>."},{"qid":"c9-06-19","type":"fill","level":2,"topic":"time_conj","prompt":"Fill in the gap.","before":"Unless you","after":"your fear, it will control you.","options":["will face","face","faced"],"answer":1,"rule":"After <b>unless<\/b>, use the simple present to talk about the future: <b>unless you face<\/b>."},{"qid":"c9-06-20","type":"fill","level":2,"topic":"linking_words","prompt":"Fill in the gap.","before":"In spite","after":"the pain, he smiled.","options":["from","with","of"],"answer":2,"rule":"The fixed phrase is <b>in spite of<\/b> + noun."},{"qid":"c9-06-21","type":"fill","level":3,"topic":"sentence_types","prompt":"Fill in the gap.","before":"The night was black,","after":"the poet did not lose courage.","options":["despite","however","yet"],"answer":2,"rule":"<b>Yet<\/b> joins two clauses into a compound sentence; <b>despite<\/b> can't join clauses and <b>however<\/b> needs a semicolon."},{"qid":"c9-06-22","type":"fill","level":4,"topic":"non_finite","prompt":"Fill in the gap.","before":"You should avoid","after":"in the sun at noon.","options":["to play","playing","play"],"answer":1,"rule":"<b>Avoid<\/b> is followed by a gerund: <b>avoid playing<\/b>."},{"qid":"c9-06-23","type":"fill","level":5,"topic":"time_conj","prompt":"Fill in the gap.","before":"Hardly had the climbers reached the camp","after":"the storm broke.","options":["than","then","when"],"answer":2,"rule":"<b>Hardly ... when<\/b> is the correct pair (No sooner ... than)."},{"qid":"c9-06-24","type":"fill","level":5,"topic":"non_finite","prompt":"Fill in the gap.","before":"","after":"the poem twice, Isha understood its message.","options":["Having read","Have read","Had read"],"answer":0,"rule":"The perfect participle <b>Having read<\/b> shows an action finished before the main one."},{"qid":"c9-06-25","type":"build","level":1,"topic":"non_finite","prompt":"Make a sentence.","answer":["I","want","to","be","brave."],"alts":[],"rule":"<b>Want<\/b> is followed by the infinitive: <b>want to be<\/b>."},{"qid":"c9-06-26","type":"build","level":2,"topic":"linking_words","prompt":"Make a sentence with 'despite'.","answer":["Despite","heavy","rain,","our","boat","returned","safely."],"alts":[],"rule":"<b>Despite<\/b> + noun phrase (<b>heavy rain<\/b>), then the main clause."},{"qid":"c9-06-27","type":"build","level":3,"topic":"time_conj","prompt":"Give an instruction with 'until'.","answer":["Do","not","stop","until","you","reach","home."],"alts":[],"rule":"<b>Until<\/b> + simple present: <b>until you reach home<\/b>."},{"qid":"c9-06-28","type":"build","level":4,"topic":"sentence_types","prompt":"Make a complex sentence.","answer":["She","is","the","girl","who","never","gives","up."],"alts":[],"rule":"The relative clause <b>who never gives up<\/b> describes <b>the girl<\/b>."},{"qid":"c9-06-29","type":"build","level":5,"topic":"time_conj","prompt":"Make a 'No sooner' sentence.","answer":["No","sooner","had","the","bell","rung","than","we","ran","out."],"alts":[],"rule":"<b>No sooner had + subject + past participle ... than<\/b> + simple past."},{"qid":"c9-06-30","type":"chat","level":1,"topic":"non_finite","prompt":"Pick the correct reply.","chat":[["Rohit","What do you want to do after school?"]],"options":["I want to become a pilot.","I want become a pilot.","I want to becoming a pilot."],"answer":0,"rule":"<b>Want<\/b> is followed by <b>to + base form<\/b>: <b>want to become<\/b>."},{"qid":"c9-06-31","type":"chat","level":1,"topic":"linking_words","prompt":"Pick the correct reply.","chat":[["Aditi","Did you go for your run this morning?"]],"options":["Yes, although it was raining.","Yes, despite it was raining.","Yes, al :"One word is wrong. Find it and fix it.","words":["Mr","Katdare","is","the","man","which","started","the","turtle","project."],"errors":[{"i":5,"options":["whose","whom","who"],"answer":2}],"rule":"For a person who does the action, use <b>who<\/b>, not 'which'."},{"qid":"c9-07-14","type":"fix","level":2,"topic":"adverb_clause","prompt":"One word is wrong. Find it and fix it.","words":["Sneha","stayed","on","the","beach","until","the","last","hatchling","reach","the","sea."],"errors":[{"i":9,"options":["reaching","reached","reaches"],"answer":1}],"rule":"The main clause is in the past (<b>stayed<\/b>), so the 'until' clause is also past: <b>reached<\/b>."},{"qid":"c9-07-15","type":"fill","level":2,"topic":"relative_clause","prompt":"Fill in the gap.","before":"The female turtle,","after":"shell was olive green, came ashore at night.","options":["whose","who's","which"],"answer":0,"rule":"<b>whose<\/b> shows possession (her shell). 'who's' means 'who is'."},{"qid":"c9-07-16","type":"fill","level":2,"topic":"adverb_clause","prompt":"Fill in the gap.","before":"","after":"the turtle has laid her eggs, she covers them with sand.","options":["As soon as","No sooner","Hardly"],"answer":0,"rule":"<b>As soon as<\/b> starts a time clause with normal word order. 'No sooner' and 'Hardly' need 'had/does' and 'than/when'."},{"qid":"c9-07-17","type":"build","level":2,"topic":"passive_voice","prompt":"Make a passive sentence.","answer":["The","eggs","were","buried","in","a","fenced","pit."],"alts":[],"rule":"Passive: subject + <b>were<\/b> + past participle <b>buried<\/b>."},{"qid":"c9-07-18","type":"chat","level":2,"topic":"linking_words","prompt":"Pick the correct reply.","chat":[["Kabir","Did you see the hatchlings at Velas?"]],"options":["No, we reached late; although, the guide showed us a video.","No, we reached late; however, the guide showed us a video.","No, we reached late, despite the guide showed us a video."],"answer":1,"rule":"<b>however,<\/b> links two sentences after a semicolon. 'Although' and 'despite' cannot be used like this."},{"qid":"c9-07-19","type":"change","level":2,"topic":"adverb_clause","prompt":"Join using 'as soon as'.","source":"The eggs hatched. The hatchlings rushed to the sea.","options":["As soon as the eggs hatched, the hatchlings rush to the sea.","As soon as the eggs hatched, the hatchlings rushed to the sea.","As soon as the eggs hatched, then the hatchlings rushed to the sea."],"answer":1,"rule":"<b>As soon as<\/b> joins the clauses; keep both in the past and do not add 'then'."},{"qid":"c9-07-20","type":"change","level":2,"topic":"relative_clause","prompt":"Join using 'who'.","source":"The villagers offer homestays. They help protect the turtles.","options":["The villagers who offer homestays they help protect the turtles.","The villagers who offer homestays help protect the turtles.","The villagers who offers homestays help protect the turtles."],"answer":1,"rule":"<b>who<\/b> replaces 'They', so drop 'they'. 'who' refers to 'villagers' (plural), so the verb is <b>offer<\/b>."},{"qid":"c9-07-21","type":"spot","level":3,"topic":"relative_clause","prompt":"Which sentence is correct?","options":["Velas, that is in Ratnagiri district, is famous for its turtles.","Velas, which is in Ratnagiri district, is famous for its turtles.","Velas, which is in Ratnagiri district, are famous for its turtles."],"answer":1,"rule":"Between commas (extra information) use <b>which<\/b>, not 'that'. Velas is one place, so <b>is famous<\/b>."},{"qid":"c9-07-22","type":"spot","level":3,"topic":"passive_voice","prompt":"Pick the correct passive sentence.","options":["A booklet on turtles is being printed this week.","A booklet on turtles is being print this week.","A booklet on turtles is been printed this week."],"answer":0,"rule":"Present continuous passive = <b>is/are being<\/b> + past participle: <b>is being printed<\/b>."},{"qid":"c9-07-23","type":"fix","level":3,"topic":"linking_words","prompt":"One word is wrong. Find "have","to","wake","up","at","five."],"errors":[{"i":6,"options":["having","has","were"],"answer":1}],"rule":"<b>Every volunteer<\/b> is singular, so the main verb is <b>has to<\/b>. The clause 'who joins the camp' does not change that."},{"qid":"c9-07-33","type":"fill","level":4,"topic":"relative_clause","prompt":"Fill in the gap.","before":"Each of the families that offer homestays","after":"ten per cent to the fund.","options":["give","giving","gives"],"answer":2,"rule":"<b>Each of<\/b> + plural noun takes a singular verb: <b>Each ... gives<\/b>."},{"qid":"c9-07-34","type":"fill","level":4,"topic":"linking_words","prompt":"Fill in the gap.","before":"Despite","after":"no experience, the team started a turtle project.","options":["having","have","had"],"answer":0,"rule":"After <b>despite<\/b>, use a noun or an -ing form: <b>Despite having<\/b>."},{"qid":"c9-07-35","type":"build","level":4,"topic":"passive_voice","prompt":"Make a present perfect passive sentence.","answer":["The","festival","has","been","visited","by","eight","hundred","people."],"alts":[],"rule":"Present perfect passive = <b>has/have been<\/b> + past participle: <b>has been visited<\/b>."},{"qid":"c9-07-36","type":"chat","level":4,"topic":"passive_voice","prompt":"Pick the correct reply.","chat":[["Mom","Has the homestay room been cleaned for the guests?"]],"options":["Yes, it has just be cleaned.","Yes, it have just been cleaned.","Yes, it has just been cleaned."],"answer":2,"rule":"Present perfect passive: <b>it has been cleaned<\/b>. 'it' takes <b>has<\/b>, and after 'has' we need <b>been<\/b>."},{"qid":"c9-07-37","type":"chat","level":4,"topic":"adverb_clause","prompt":"Pick the correct reply.","chat":[["Rohan","Will you call me when the eggs hatch?"]],"options":["Sure, I will call you as soon as they hatch.","Sure, I will call you as soon as they will hatch.","Sure, I call you as soon as they hatched."],"answer":0,"rule":"In a time clause about the future, use the simple present (<b>as soon as they hatch<\/b>), not 'will'."},{"qid":"c9-07-38","type":"change","level":4,"topic":"adverb_clause","prompt":"Rewrite using 'unless'.","source":"If people do not protect the nests, the turtles will die out.","options":["Unless people protect the nests, the turtles will die out.","Unless people do not protect the nests, the turtles will die out.","Unless people protected the nests, the turtles will die out."],"answer":0,"rule":"<b>Unless<\/b> means 'if ... not', so drop 'do not' and keep the present tense: <b>Unless people protect<\/b>."},{"qid":"c9-07-39","type":"proof","level":4,"topic":"linking_words","prompt":"Find and fix the 2 errors in this message.","words":["Turtles","are","an","important","part","of","marine","life","because","they","keeps","the","sea","clean.","However,","in","2005,","hundreds","of","their","eggs","are","stolen","from","these","beaches."],"errors":[{"i":10,"options":["keeping","keeper","keep"],"answer":2},{"i":21,"options":["is","were","was"],"answer":1}],"rule":"Plural <b>they keep<\/b> (a general truth). 'In 2005' is past and 'hundreds of eggs' is plural: <b>were stolen<\/b>."},{"qid":"c9-07-40","type":"spot","level":5,"topic":"relative_clause","prompt":"Which sentence is correct?","options":["The fund, which the villagers set up with their homestay income, are used to protect turtles.","The fund, which the villagers set up with their homestay income, is used to protect turtles.","The fund, who the villagers set up with their homestay income, is used to protect turtles."],"answer":1,"rule":"The main subject <b>The fund<\/b> (singular) takes <b>is used<\/b>. For a thing, use <b>which<\/b>, not 'who'."},{"qid":"c9-07-41","type":"fix","level":5,"topic":"adverb_clause","prompt":"One word is wrong. Find it and fix it.","words":["The","tourists","were","asked","to","stay","quiet","so","that","the","hatchlings","would","not","got","frightened."],"errors":[{"i":13,"options":["gets","get","getting"],"answer":1}],"rule":"After a modal like <b>would (not)<\/b>, use the base form: <b>would not get<\/b>."},{"qid":"c9-07-42","type":"fill","level":5,"topic":"adverb_clause","prompt":"Fill in the gap.","before":"The hatchlings had barely left the nest","after":"a crab attacked one of them.","options":["than","when","then"],"answer":1,"rule":"<b>barely/hardly ... when<\/b> is the pair. 'than' goes with 'no sooner'."},{"qid":"c9-07-43","type":"build","level":5,"topic":"relative_clause","prompt":"Make a sentence with 'whose'.","answer":["Velas","is","a","village","whose","people","protect","the","turtles."],"alts":[],"rule":"<b>whose people<\/b> = the people of that village. The clause describes 'a village'."},{"qid":"c9-07-44","type":"chat","level":5,"topic":"linking_words","prompt":"Pick the correct reply.","chat":[["Meera","Was the turtle festival crowded?"],["Meera","I heard it rained."]],"options":["Yes, it was crowded, despite it rained all evening.","Yes, it was crowded; however, nobody minded the rain.","Yes, although it was crowded, but nobody minded the rain."],"answer":1,"rule":"<b>however<\/b> shows contrast between two sentences. 'despite' needs a noun, and 'although' never pairs with 'but'."},{"qid":"c9-07-45","type":"change","level":5,"topic":"adverb_clause","prompt":"Rewrite using 'No sooner ... than'.","source":"As soon as the female turtle lays her eggs, she returns to the sea.","options":["No sooner does the female turtle lay her eggs than she returns to the sea.","No sooner the female turtle lays her eggs than she returns to the sea.","No sooner does the female turtle lay her eggs when she returns to the sea."],"answer":0,"rule":"<b>No sooner does + subject + base verb ... than<\/b>. The helper comes before the subject, and the pair is 'than', not 'when'."},{"qid":"c9-07-46","type":"change","level":5,"topic":"passive_voice","prompt":"Change into passive voice.","source":"The Forest Department will train the local volunteers.","options":["The local volunteers will trained by the Forest Department.","The local volunteers would be trained by the Forest Department.","The local volunteers will be trained by the Forest Department."],"answer":2,"rule":"Future passive = <b>will be<\/b> + past participle. Keep 'will'; do not change it to 'would'."},{"qid":"c9-07-47","type":"change","level":5,"topic":"relative_clause","prompt":"Make one complex sentence using 'which'.","source":"Turtles keep the sea clean. This makes them important for marine ecology.","options":["Turtles keep the sea clean, which makes them important for marine ecology.","Turtles keep the sea clean, which make them important for marine ecology.","Turtles which keep the sea clean, which makes them important for marine ecology."],"answer":0,"rule":"Here <b>which<\/b> stands for the whole idea 'keeping the sea clean' (singular), so it takes <b>makes<\/b>."},{"qid":"c9-07-48","type":"proof","level":5,"topic":"adverb_clause","prompt":"Find and fix the 2 errors in this message.","words":["The","female","turtle,","which","returns","to","the","beach","where","she","was","born,","lay","her","eggs","in","a","deep","pit.","As","soon","as","she","finishes,","she","covers","the","nest","and","goes","back","to","the","sea","despite","she","is","tired."],"errors":[{"i":12,"options":["laying","lain","lays"],"answer":2},{"i":34,"options":["although","however","therefore"],"answer":0}],"rule":"The main subject <b>The female turtle<\/b> takes <b>lays<\/b>. Before a full clause use <b>although<\/b>, not 'despite'."},{"qid":"c9-07-49","type":"proof","level":5,"topic":"relative_clause","prompt":"Find and fix the 3 errors in this message.","words":["Our","school","group","stayed","with","a","family","who's","house","was","close","to","the","beach.","Both","rooms","was","simple","but","clean.","Every","evening,","the","guide","which","knew","all","about","turtles","told","us","stories."],"errors":[{"i":7,"options":["whose","who","which"],"answer":0},{"i":16,"options":["is","were","has"],"answer":1},{"i":24,"options":["whom","who","whose"],"answer":1}],"rule":"Possession: <b>whose house<\/b>. <b>Both rooms<\/b> is plural: <b>were<\/b>. A person takes <b>who<\/b>."},{"qid":"c9-07-50","type":"proof","level":4,"topic":"passive_voice","prompt":"Find and fix the 2 errors in this message.","words":["Our","club","started","a","turtle","project","three","years","ago.","Since","then,","many","nests","has","been","protected,","and","the","villagers","which","once","stole","eggs","now","guard","them."],"errors":[{"i":13,"options":["was","is","have"],"answer":2},{"i":19,"options":["whose","whom","who"],"answer":2}],"rule":"'Since then' + plural <b>many nests<\/b> = <b>have been protected<\/b>. For people, use <b>who<\/b>."}]},{"id":"08","num":"2.3","title":"Somebody's Mother","unit":"Unit Two","topics":[{"tag":"degrees_comparison","name":"Degrees of comparison"},{"tag":"reported_speech","name":"Reported speech"},{"tag":"conditionals","name":"Conditionals (types 1, 2 and 3)"},{"tag":"participles","name":"Non-finite verbs: participles, gerunds, infinitives"}],"questions":[{"qid":"c9-08-01","type":"spot","level":1,"topic":"degrees_comparison","prompt":"Which sentence is correct?","options":["Raju was the happier boy in the whole group.","Raju was the most happiest boy in the whole group.","Raju was the happiest boy in the whole group."],"answer":2,"rule":"Comparing one with a whole group needs the superlative: <b>the happiest<\/b>. Never use 'most' with '-est'."},{"qid":"c9-08-02","type":"spot","level":1,"topic":"participles","prompt":"Which sentence is correct?","options":["Heard the bell, the boys ran out of school.","Hear the bell, the boys ran out of school.","Hearing the bell, the boys ran out of school."],"answer":2,"rule":"The boys did the hearing, so use the present participle: <b>Hearing the bell<\/b>, ..."},{"qid":"c9-08-03","type":"fix","level":1,"topic":"degrees_comparison","prompt":"One word is wrong. Find it and fix it.","words":["The","old","woman","was","weaker","then","the","young","boy."],"errors":[{"i":5,"options":["than","that","as"],"answer":0}],"rule":"A comparative (<b>weaker<\/b>) is followed by <b>than<\/b>. 'then' is about time."},{"qid":"c9-08-04","type":"fix","level":1,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["The","teacher","said","us","to","help","old","people."],"errors":[{"i":2,"options":["spoke","talked","told"],"answer":2}],"rule":"<b>told<\/b> takes a person as object (told us to ...). 'said' cannot be followed directly by 'us'."},{"qid":"c9-08-05","type":"fill","level":1,"topic":"participles","prompt":"Fill in the gap.","before":"The boys came out of school,","after":"and shouting.","options":["laughed","laughing","laugh"],"answer":1,"rule":"Two matching -ing participles describe what the boys were doing: <b>laughing and shouting<\/b>."},{"qid":"c9-08-06","type":"fill","level":1,"topic":"conditionals","prompt":"Fill in the gap.","before":"If you","after":"to go, I will help you across.","options":["wished","wish","will wish"],"answer":1,"rule":"First conditional: <b>If + simple present<\/b>, <b>will + verb<\/b>. No 'will' in the if-clause."},{"qid":"c9-08-07","type":"build","level":1,"topic":"degrees_comparison","prompt":"Make a sentence with a superlative.","answer":["She","is","the","oldest","woman","in","our","street."],"alts":[],"rule":"Superlative: <b>the oldest<\/b> + noun + <b>in<\/b> the place."},{"qid":"c9-08-08","type":"chat","level":1,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Dev","What did the boy say to the old woman?"]],"options":["He said that he will helps her across.","He said that he would help her across.","He said that I would help you across."],"answer":1,"rule":"In reported speech, 'I' becomes <b>he<\/b>, 'you' becomes <b>her<\/b>, and 'will' becomes <b>would<\/b>."},{"qid":"c9-08-09","type":"chat","level":1,"topic":"conditionals","prompt":"Pick the correct reply.","chat":[["Mom","Will you help Grandpa if he needs you?"]],"options":["Yes, if he needs me, I will help him.","Yes, if he will need me, I help him.","Yes, if he needs me, I helped him."],"answer":0,"rule":"First conditional: <b>if he needs<\/b> (present), <b>I will help<\/b> (future)."},{"qid":"c9-08-10","type":"change","level":1,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"Tanvi said, \"I am cold.\"","options":["Tanvi said that I was cold.","Tanvi said that she were cold.","Tanvi said that she was cold."],"answer":2,"rule":"'I' becomes <b>she<\/b> (Tanvi), and 'am' moves back to <b>was<\/b>."},{"qid":"c9-08-11","type":"spot","level":2,"topic":"degrees_comparison","prompt":"Which sentence is correct?","options":["The road was as slippery as a sheet of ice.","The road was as slippery than a sheet of ice.","The road was as slipperier as a sheet of ice."],"answer":0,"rule":"Positive degree: <b>as<\/b> + plain adjective + <b>as<\/b>: as slippery as."},{"qid":"c9-08-12","type":"spot","level":2,"topic":"participles","prompt":"Which sentence is correct?","options":["The woman waited at the crossing, felt very nervous.","The woman waited at the crossing, feeling very nervous.","The woman waited at the crossing, feels very nervous."],"answer":1,"rule":"A participle phrase adds a second action to the same subject: <b>feeling very nervous<\/b>."},{"qid":"c9-08-13","type":"fix","level":2,"topic":"conditionals","prompt":"One word is wrong. Find it and fix it.","words":["If","it","snows","tomorrow,","the","roads","will","became","slippery."],"errors":[{"i":7,"options":["become","becomes","becoming"],"answer":0}],"rule":"After <b>will<\/b>, use the base form of the verb: <b>will become<\/b>."},{"qid":"c9-08-14","type":"fix","level":2,"topic":"participles","prompt":"One word is wrong. Find it and fix it.","words":["The","boys","went","home,","singing","and","throw","snowballs."],"errors":[{"i":6,"options":["threw","throwing","thrown"],"answer":1}],"rule":"Words joined by 'and' should match: <b>singing and throwing<\/b>."},{"qid":"c9-08-15","type":"fill","level":2,"topic":"degrees_comparison","prompt":"Fill in the gap.","before":"Sameer was the","after":"boy in the whole group.","options":["kindest","kinder","more kind"],"answer":0,"rule":"'the ... in the whole group' compares one with all: superlative <b>kindest<\/b>."},{"qid":"c9-08-16","type":"fill","level":2,"topic":"reported_speech","prompt":"Fill in the gap.","before":"The old woman","after":"the boy where he lived.","options":["said","spoke","asked"],"answer":2,"rule":"A reported question uses <b>asked<\/b> + person. 'said' and 'spoke' cannot take 'the boy' like this."},{"qid":"c9-08-17","type":"build","level":2,"topic":"participles","prompt":"Begin with a participle.","answer":["Seeing","the","old","woman,","Raj","stopped","at","once."],"alts":[],"rule":"<b>Seeing the old woman<\/b> is a participle phrase. It describes Raj, who comes right after the comma."},{"qid":"c9-08-18","type":"chat","level":2,"topic":"degrees_comparison","prompt":"Pick the correct reply.","chat":[["Asha","How was the weather in Manali?"]],"options":["It was much colder than I expected.","It was more colder than I expected.","It was very colder than I expected."],"answer":0,"rule":"To make a comparative stronger, use <b>much<\/b>: much colder. Not 'more colder' or 'very colder'."},{"qid":"c9-08-19","type":"change","level":2,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"The boy said to the woman, \"I will help you across.\"","options":["The boy told the woman that I would help her across.","The boy told the woman that he would help her across.","The boy said the woman that he would help her across."],"answer":1,"rule":"'said to' becomes <b>told<\/b>; 'I' becomes <b>he<\/b>, 'you' becomes <b>her<\/b>, and 'will' becomes <b>would<\/b>."},{"qid":"c9-08-20","type":"change","level":2,"topic":"degrees_comparison","prompt":"Change into the comparative degree.","source":"Sameer was the strongest boy in the group.","options":["Sameer was stronger than any boy in the group.","Sameer was more stronger than any other boy in the group.","Sameer was stronger than any other boy in the group."],"answer":2,"rule":"Sameer is in the group, so he is compared with <b>any other boy<\/b>. Do not use 'more' with '-er'."},{"qid":"c9-08-21","type":"spot","level":3,"topic":"conditionals","prompt":"Which sentence is correct?","options":["If the boy had not helped her, she might have slipped on the ice.","If the boy has not helped her, she might have slipped on the ice.","If the boy had not helped her, she might slipped on the ice."],"answer":0,"rule":"Third conditional (past, unreal): <b>If + had + past participle<\/b>, <b>might/would have + past participle<\/b>."},{"qid":"c9-08-22","type":"spot","level":3,"topic":"reported_speech","prompt":"Which indirect speech is correct?","options":["She asked him where was he going.","She asked him where he was going.","She asked him where is he going."],"answer":1,"rule":"In a reported question, use statement order (subject before verb): <b>where he was going<\/b>."},{"qid":"c9-08-23","type":"fix","level":3,"topic":"degrees_comparison","prompt":"One word is wrong. Find it and fix it.","words":["The","second","street","was","even","busiest","than","the","first","one."],"errors":[{"i":5,"options":["busy","busily","busier"],"answer":2}],"rule":"<b>than<\/b> needs the comparative: <b>even busier than<\/b>."},{"qid":"c9-08-24","type":"fix","level":3,"topic":"participles","prompt":"One word is wrong. Find it and fix it.","words":["Covering","in","fresh","snow,","the","street","looked","white."],"errors":[{"i":0,"options":["Covered","Cover","Covers"],"answer":0}],"rule":"The street was covered by snow (passive idea), so use the past participle: <b>Covered in snow<\/b>."},{"qid":"c9-08-25","type":"fill","level":3,"topic":"conditionals","prompt":"Fill in the gap.","before":"If I","after":"you, I would wait for the green signal.","options":["am","will be","were"],"answer":2,"rule":"For an imaginary situation (second conditional), use <b>If I were you<\/b>, ... <b>would<\/b>."},{"qid":"c9-08-26","type":"build","level":3,"topic":"reported_speech","prompt":"Make a reported question.","answer":["She","asked","me","where","the","bus","stop","was."],"alts":[],"rule":"Reported questions keep statement order: <b>where the bus stop was<\/b>, not 'where was the bus stop'."},{"qid":"c9-08-27","type":"chat","level":3,"topic":"participles","prompt":"Pick the correct reply.","chat":[["Neel","Why were the boys so noisy?"]],"options":["They were excited, ran out of school after the exam.","They were excited, having just finished their last exam.","They were excited, have just finished their last exam."],"answer":1,"rule":"A perfect participle (<b>having finished<\/b>) shows an action completed before another."},{"qid":"c9-08-28","type":"chat","level":3,"topic":"conditionals","prompt":"Pick the correct reply.","chat":[["Grandma","Why did you wait for me at the crossing?"]],"options":["If I would leave you alone, you would have been afraid.","If I had left you alone, you would have been afraid.","If I had left you alone, you will be afraid."],"answer":1,"rule":"An unreal past needs the third conditional: <b>If I had left<\/b> ..., <b>you would have been<\/b> ..."},{"qid":"c9-08-29","type":"change","level":3,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"The teacher said to us, \"Help those who are in need.\"","options":["The teacher advised us that help those who were in need.","The teacher advised us to helped those who are in need.","The teacher advised us to help those who are in need."],"answer":2,"rule":"An imperative becomes <b>advised/told + person + to + base verb<\/b>. A general truth ('are in need') can stay present."},{"qid":"c9-08-30","type":"proof","level":3,"topic":"reported_speech","prompt":"Find and fix the 2 errors in this message.","words":["Yesterday","I","saw","an","old","man","waiting","at","the","busy","signal.","Nobody","stopped,","so","I","asked","him","if","he","need","help.","He","smiled","and","say","thank","you."],"errors":[{"i":19,"options":["needed","needing","wanting"],"answer":0},{"i":24,"options":["says","saying","said"],"answer":2}],"rule":"The reported question moves back to the past: <b>if he needed<\/b>. 'smiled and said' keeps both verbs in the past."},{"qid":"c9-08-31","type":"spot","level":4,"topic":"degrees_comparison","prompt":"Which sentence is correct?","options":["No other boy in the group was as kind than Sameer.","No other boy in the group were as kind as Sameer.","No other boy in the group was as kind as Sameer."],"answer":2,"rule":"<b>No other boy<\/b> is singular (was), and the positive degree uses <b>as ... as<\/b>."},{"qid":"c9-08-32","type":"fix","level":4,"topic":"conditionals","prompt":"One word is wrong. Find it and fix it.","words":["If","the","boys","were","not","so","busy,","they","would","helped","her."],"errors":[{"i":9,"options":["help","helping","helps"],"answer":0}],"rule":"Second conditional: <b>If + past<\/b>, <b>would + base verb<\/b>: would help."},{"qid":"c9-08-33","type":"fill","level":4,"topic":"participles","prompt":"Fill in the gap.","before":"The old woman was afraid of","after":"on the icy road.","options":["slipping","slip","slipped"],"answer":0,"rule":"After a preposition like <b>of<\/b>, use the gerund (-ing form): <b>afraid of slipping<\/b>."},{"qid":"c9-08-34","type":"fill","level":4,"topic":"degrees_comparison","prompt":"Fill in the gap.","before":"Every year, the boy grew","after":"and stronger.","options":["tallest","taller","tall"],"answer":1,"rule":"'and stronger' is comparative, so match it: <b>taller and stronger<\/b> (growing more and more)."},{"qid":"c9-08-35","type":"build","level":4,"topic":"conditionals","prompt":"Make an offer with an if-clause.","answer":["I'll","hold","your","arm","if","you","want","to","cross."],"alts":[],"rule":"Main clause first (<b>I'll hold your arm<\/b>), then the condition <b>if you want to cross<\/b>, in the present."},{"qid":"c9-08-36","type":"chat","level":4,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Papa","What did your teacher ask you today?"]],"options":["She asked me why I had come late.","She asked me why had I come late.","She asked me why did I come late."],"answer":0,"rule":"Reported wh-questions use statement order and move the tense back: <b>why I had come late<\/b>."},{"qid":"c9-08-37","type":"chat","level":4,"topic":"participles","prompt":"Pick the correct reply.","chat":[["Kiara","Did you see the snow in Gulmarg?"]],"options":["Yes! Reached the top, we saw snow everywhere.","Yes! Having reached the top, we saw snow everywhere.","Yes! Having reach the top, we saw snow everywhere."],"answer":1,"rule":"Perfect participle = <b>having + past participle<\/b>: Having reached the top, ..."},{"qid":"c9-08-38","type":"change","level":4,"topic":"conditionals","prompt":"Rewrite using 'unless'.","source":"If you do not hold the railing, you will slip.","options":["Unless you do not hold the railing, you will slip.","Unless you hold the railing, you slipped.","Unless you hold the railing, you will slip."],"answer":2,"rule":"<b>Unless<\/b> = 'if ... not', so remove 'do not'. Keep 'will slip' in the main clause."},{"qid":"c9-08-39","type":"proof","level":4,"topic":"participles","prompt":"Find and fix the 2 errors in this message.","words":["The","old","woman","stood","at","the","busy","crossing,","waited","for","help.","Nobody","stopped","that","evening","because","each","driver","were","in","a","hurry."],"errors":[{"i":8,"options":["waits","waiting","wait"],"answer":1},{"i":18,"options":["are","was","being"],"answer":1}],"rule":"A participle adds the second action: <b>waiting for help<\/b>. <b>each driver<\/b> is singular: <b>was<\/b>."},{"qid":"c9-08-40","type":"spot","level":5,"topic":"conditionals","prompt":"Which sentence is correct?","options":["Had the boy not stopped, the old woman would waited much longer.","Had the boy not stopped, the old woman would have waited much longer.","If had the boy not stopped, the old woman would have waited much longer."],"answer":1,"rule":"<b>Had + subject + not + past participle<\/b> replaces 'If ... had not'. The result is <b>would have waited<\/b>."},{"qid":"c9-08-41","type":"fix","level":5,"topic":"degrees_comparison","prompt":"One word is wrong. Find it and fix it.","words":["Helping","a","stranger","is","one","of","the","noblest","thing","a","person","can","do."],"errors":[{"i":8,"options":["things","thinks","thinking"],"answer":0}],"rule":"<b>one of the<\/b> + superlative + <b>plural noun<\/b>: one of the noblest things."},{"qid":"c9-08-42","type":"fill","level":5,"topic":"reported_speech","prompt":"Fill in the gap.","before":"The old woman asked the boy","after":"he would help her across the street.","options":["if","that","what"],"answer":0,"rule":"A reported yes/no question is joined with <b>if<\/b> or <b>whether<\/b>, not 'that'."},{"qid":"c9-08-43","type":"build","level":5,"topic":"participles","prompt":"Begin with a perfect participle.","answer":["Having","helped","Grandma","across,","Arjun","ran","back","to","his","friends."],"alts":[],"rule":"<b>Having helped<\/b> shows the first action was finished before Arjun ran back."},{"qid":"c9-08-44","type":"chat","level":5,"topic":"degrees_comparison","prompt":"Pick the correct reply.","chat":[["Sir","Who is the most helpful student in your class?"]],"options":["Ravi is, because he is more helpful than any student in our class.","Ravi is, because no other student is as helpful as he is.","Ravi is, because he is the more helpful of all of us."],"answer":1,"rule":"Ravi is one of the class, so say <b>no other student<\/b> (or 'any other'). For all of us, use the superlative, not 'more'."},{"qid":"c9-08-45","type":"change","level":5,"topic":"degrees_comparison","prompt":"Change into the positive degree.","source":"That boy is kinder than most other people.","options":["Very few people are kinder as that boy.","Very few people are as kind as that boy.","Very few people is as kind as that boy."],"answer":1,"rule":"Comparative with 'most other' becomes <b>Very few ... are as kind as<\/b> in the positive degree."},{"qid":"c9-08-46","type":"change","level":5,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"The old woman said, \"God, be kind to that noble boy!\"","options":["The old woman prayed that God would be kind to that noble boy.","The old woman said that God, be kind to that noble boy.","The old woman prayed to God that be kind to that noble boy."],"answer":0,"rule":"A prayer or wish is reported with <b>prayed that<\/b> + subject + <b>would/might<\/b> + verb."},{"qid":"c9-08-47","type":"change","level":5,"topic":"conditionals","prompt":"Combine using 'If' (third conditional).","source":"The other boys did not notice her. So they did not help her.","options":["If the other boys had noticed her, they would have helped her.","If the other boys noticed her, they would have helped her.","If the other boys had noticed her, they would helped her."],"answer":0,"rule":"Unreal past: <b>If + had noticed<\/b>, <b>would have helped<\/b>."},{"qid":"c9-08-48","type":"proof","level":5,"topic":"conditionals","prompt":"Find and fix the 3 errors in this message.","words":["Seeing","the","woman","alone,","the","boy","walked","over","and","asked","her","whether","she","want","help.","He","was","more","cheerful","then","all","the","other","boys,","and","if","he","had","not","helped","her,","she","will","have","waited","for","hours."],"errors":[{"i":13,"options":["wanting","needing","wanted"],"answer":2},{"i":19,"options":["that","as","than"],"answer":2},{"i":32,"options":["shall","can","would"],"answer":2}],"rule":"Reported question: <b>whether she wanted<\/b>. A comparative takes <b>than<\/b>. Third conditional: <b>would have waited<\/b>."},{"qid":"c9-08-49","type":"proof","level":5,"topic":"degrees_comparison","prompt":"Find and fix the 3 errors in this message.","words":["Last","winter","my","brother","and","I","visited","Shimla.","It","was","the","colder","place","we","had","ever","seen.","Our","guide","said","that","we","must","wore","warm","gloves,","and","we","were","glad","that","we","listen","to","him."],"errors":[{"i":11,"options":["cold","coldly","coldest"],"answer":2},{"i":23,"options":["wearing","worn","wear"],"answer":2},{"i":32,"options":["listened","listens","listening"],"answer":0}],"rule":"'the ... we had ever seen' needs <b>the coldest<\/b>. After 'must', use <b>wear<\/b>. 'were glad' is past, so <b>listened<\/b>."},{"qid":"c9-08-50","type":"proof","level":4,"topic":"conditionals","prompt":"Find and fix the 2 errors in this message.","words":["Grandma","said","that","she","had","felt","very","scared.","If","I","had","not","come","in","time,","she","would","have","stand","there","for","hours.","She","thanked","me","and","give","me","a","sweet."],"errors":[{"i":18,"options":["standing","stood","stands"],"answer":1},{"i":26,"options":["gives","given","gave"],"answer":2}],"rule":"<b>would have<\/b> + past participle: <b>would have stood<\/b>. 'thanked ... and gave' keeps both verbs in the past."}]},{"id":"09","num":"2.4","title":"The Fall of Troy","unit":"Unit Two","topics":[{"tag":"too_enough_so_that","name":"too ... to, enough to, so ... that"},{"tag":"adj_preposition","name":"Adjective + preposition (tired of, afraid of, famous for)"},{"tag":"conditional_3","name":"Third conditional (unreal past)"},{"tag":"clauses","name":"Clauses and linking words in complex sentences"}],"questions":[{"qid":"c9-09-01","type":"spot","level":1,"topic":"too_enough_so_that","prompt":"Which sentence is correct?","options":["The horse was too big to go through the gate.","The horse was too big for go through the gate.","The horse was too big that go through the gate."],"answer":0,"rule":"The pattern is <b>too<\/b> + adjective + <b>to<\/b> + verb: too big to go."},{"qid":"c9-09-02","type":"spot
