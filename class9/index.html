has already left.","By the time I reached the station, the train had already left.","By the time I reach the station, the train had already left."],"answer":1,"rule":"The earlier past action takes the past perfect (<b>had left<\/b>); the later one takes the simple past (<b>reached<\/b>)."},{"qid":"c9-17-38","type":"change","level":4,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"The bachelor said to the aunt, \"I don't agree with you.\"","options":["The bachelor told the aunt that he doesn't agree with you.","The bachelor told the aunt that he didn't agree with her.","The bachelor told the aunt that he didn't agreed with her."],"answer":1,"rule":"<b>said to<\/b> becomes <b>told<\/b>; <b>don't<\/b> moves back to <b>didn't<\/b> + base verb; <b>I<\/b>/<b>you<\/b> become <b>he<\/b>/<b>her<\/b>."},{"qid":"c9-17-39","type":"change","level":4,"topic":"conditional3","prompt":"Join using 'if'.","source":"The aunt did not tell a good story. So the children did not listen.","options":["If the aunt told a good story, the children would have listened.","If the aunt had told a good story, the children would listen.","If the aunt had told a good story, the children would have listened."],"answer":2,"rule":"Imagining a different past: <b>If<\/b> + <b>had told<\/b>, <b>would have listened<\/b>."},{"qid":"c9-17-40","type":"proof","level":4,"topic":"reported_speech","prompt":"Find and fix the 2 errors in this paragraph.","words":["Cyril","asked","the","bachelor","if","there","were","any","sheep","in","the","park.","The","bachelor","said","there","were","none,","but","he","told","that","there","were","other","animals.","The","children","begged","him","to","continuing","the","story."],"errors":[{"i":20,"options":["added","spoke","talked"],"answer":0},{"i":31,"options":["continued","continues","continue"],"answer":2}],"rule":"<b>Told<\/b> needs a listener; with no listener use a verb like <b>added that<\/b>. After <b>to<\/b>, use the base verb: <b>to continue<\/b>."},{"qid":"c9-17-41","type":"spot","level":5,"topic":"conditional3","prompt":"Which sentence is correct?","options":["Had Bertha not wore her medals, the wolf would never have found her.","Had Bertha not worn her medals, the wolf would never have found her.","Had Bertha not worn her medals, the wolf would never had found her."],"answer":1,"rule":"<b>Had<\/b> + subject + past participle can replace <b>If<\/b>: <b>Had Bertha not worn<\/b> ..., <b>would never have found<\/b>."},{"qid":"c9-17-42","type":"fix","level":5,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["Of","Riya","and","her","sister,","Riya","is","the","tallest","one."],"errors":[{"i":8,"options":["taller","tall","most"],"answer":0}],"rule":"When we compare only two people, we use the comparative: <b>the taller one<\/b>."},{"qid":"c9-17-43","type":"fill","level":5,"topic":"narrative_tenses","prompt":"Fill in the gap.","before":"Bertha","after":"in the bush for a few minutes when the medals clinked.","options":["has been hiding","had been hiding","have hidden"],"answer":1,"rule":"An action that had gone on for some time before a past event takes the past perfect continuous: <b>had been hiding<\/b>."},{"qid":"c9-17-44","type":"fill","level":5,"topic":"conditional3","prompt":"Fill in the gap.","before":"If the bachelor","after":"the train earlier, the children would have troubled him even more.","options":["did not leave","has not left","had not left"],"answer":2,"rule":"The result <b>would have troubled<\/b> needs the past perfect in the if-clause: <b>had not left<\/b>."},{"qid":"c9-17-45","type":"build","level":5,"topic":"reported_speech","prompt":"Report the question.","answer":["The","girl","asked","whether","Bertha","had","been","pretty."],"alts":[],"rule":"A reported yes/no question: <b>asked whether<\/b> + statement order; <b>was<\/b> moves back to <b>had been<\/b>."},{"qid":"c9-17-46","type":"chat","level":5,"topic":"conditional3","prompt":"Pick the correct reply.","chat":[["Papa","You lost the semi-final. What went wrong?"]],"options":["If I had practised harder, I would have won it.","If I had practised harder, I would won it.","If I would have practised harder, I would have won it."],"answer":0,"rule":"Never put <b>would<\/b> in the if-clause. Use <b>If I had practised<\/b>, <b>I would have won<\/b>."},{"qid":"c9-17-47","type":"change","level":5,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"\"Were there any sheep in the park?\" demanded Cyril.","options":["Cyril asked whether were there any sheep in the park.","Cyril asked whether there have been any sheep in the park.","Cyril asked whether there had been any sheep in the park."],"answer":2,"rule":"A yes/no question takes <b>whether<\/b> + statement order; <b>were<\/b> moves back to <b>had been<\/b>."},{"qid":"c9-17-48","type":"change","level":5,"topic":"comparison","prompt":"Change into the positive degree.","source":"Bertha was the best child in the town.","options":["No other child in the town was so good than Bertha.","No other child in the town was as good as Bertha.","No other child in the town was as better as Bertha."],"answer":1,"rule":"Superlative to positive: <b>No other<\/b> ... <b>as good as<\/b>. The positive degree uses the plain adjective."},{"qid":"c9-17-49","type":"change","level":5,"topic":"punctuation","prompt":"Rewrite as one sentence using a semicolon.","source":"The wolf could not see Bertha. The myrtle bushes were too thick.","options":["The wolf could not see Bertha; the myrtle bushes were too thick.","The wolf could not see Bertha; because the myrtle bushes were too thick.","The wolf could not see Bertha: and the myrtle bushes were too thick."],"answer":0,"rule":"A <b>semicolon<\/b> alone joins two closely linked sentences; it is not followed by <b>because<\/b> or <b>and<\/b>."},{"qid":"c9-17-50","type":"proof","level":5,"topic":"narrative_tenses","prompt":"Find and fix the 3 errors in this paragraph.","words":["Bertha","was","walking","in","the","park","when","an","enormous","wolf","come","prowling","in.","She","runs","as","fast","as","she","could","and","hid","in","the","thickest","bush.","The","wolf","would","have","went","away","if","her","medals","had","not","clinked."],"errors":[{"i":10,"options":["came","comes","coming"],"answer":0},{"i":14,"options":["run","ran","running"],"answer":1},{"i":30,"options":["gone","go","going"],"answer":0}],"rule":"Tell a past story in the past: <b>came<\/b>, <b>ran<\/b>. After <b>would have<\/b>, use the past participle: <b>gone<\/b>."}]},{"id":"18","num":"4.3","title":"Intellectual Rubbish","unit":"Unit Four","topics":[{"tag":"word_class","name":"Noun or verb: advice/advise, device/devise, practice/practise"},{"tag":"dep_prep","name":"Expressions with prepositions (prone to, wary of, under the influence)"},{"tag":"linkers","name":"Linking words (however, therefore, although, despite)"},{"tag":"conditional2","name":"Second conditional (If I were ...)"},{"tag":"unless_until","name":"Unless, until, as soon as, no sooner ... than"}],"questions":[{"qid":"c9-18-01","type":"spot","level":1,"topic":"word_class","prompt":"Which sentence is correct?","options":["My grandmother gave me some good advice.","My grandmother gave me some good advise.","My grandmother gave me a good advices."],"answer":0,"rule":"<b>Advice<\/b> (with c) is the noun and is uncountable. <b>Advise<\/b> (with s) is the verb."},{"qid":"c9-18-02","type":"spot","level":1,"topic":"dep_prep","prompt":"Which sentence is correct?","options":["Be wary on opinions that flatter you.","Be wary with opinions that flatter you.","Be wary of opinions that flatter you."],"answer":2,"rule":"The fixed expression is <b>wary of<\/b> something."},{"qid":"c9-18-03","type":"fix","level":1,"topic":"dep_prep","prompt":"One word is wrong. Find it and fix it.","words":["Divya","and","Kabir","had","a","difference","with","opinion","about","the","new","film."],"errors":[{"i":6,"options":["for","at","of"],"answer":2}],"rule":"The expression is <b>a difference of opinion<\/b>."},{"qid":"c9-18-04","type":"fix","level":1,"topic":"conditional2","prompt":"One word is wrong. Find it and fix it.","words":["If","Rohan","had","a","telescope,","he","would","studies","the","night","sky."],"errors":[{"i":7,"options":["studied","study","studying"],"answer":1}],"rule":"Second conditional: <b>would<\/b> + base verb: <b>would study<\/b>."},{"qid":"c9-18-05","type":"fill","level":1,"topic":"linkers","prompt":"Fill in the gap.","before":"","after":"his fame, Aristotle made a silly mistake.","options":["Although","Despite","However"],"answer":1,"rule":"<b>Despite<\/b> is followed by a noun (<b>his fame<\/b>). <b>Although<\/b> needs a full clause."},{"qid":"c9-18-06","type":"fill","level":1,"topic":"word_class","prompt":"Fill in the gap.","before":"Our teacher will","after":"us on how to prepare for the exam.","options":["advice","advices","advise"],"answer":2,"rule":"After <b>will<\/b> we need a verb: <b>advise<\/b> (with s). <b>Advice<\/b> (with c) is a noun."},{"qid":"c9-18-07","type":"build","level":1,"topic":"conditional2","prompt":"Give advice with 'If I were you'.","answer":["If","I","were","you,","I'd","check","it."],"alts":[],"rule":"We give advice with <b>If I were you, I'd<\/b> + base verb."},{"qid":"c9-18-08","type":"chat","level":1,"topic":"unless_until","prompt":"Pick the correct reply.","chat":[["Aai","When shall we leave for the market?"]],"options":["We'll leave as soon as the rain will stop.","We'll leave as soon as the rain stop.","We'll leave as soon as the rain stops."],"answer":2,"rule":"After <b>as soon as<\/b>, use the simple present for the future, not <b>will<\/b>: <b>as soon as the rain stops<\/b>."},{"qid":"c9-18-09","type":"change","level":1,"topic":"unless_until","prompt":"Rewrite using 'unless'.","source":"If you don't check the facts, you will believe rumours.","options":["Unless you don't check the facts, you will believe rumours.","Unless you check the facts, you will believe rumours.","Unless you will check the facts, you will believe rumours."],"answer":1,"rule":"<b>Unless<\/b> means <b>if not<\/b>, so drop the <b>don't<\/b>: <b>Unless you check<\/b>."},{"qid":"c9-18-10","type":"proof","level":1,"topic":"word_class","prompt":"Find and fix the 2 errors in this message.","words":["My","coach","gave","me","some","very","good","advise","yesterday.","She","said,","'Practise","every","day,","because","practise","makes","perfect.'"],"errors":[{"i":7,"options":["advice","advices","advised"],"answer":0},{"i":15,"options":["practised","practises","practice"],"answer":2}],"rule":"Nouns end in <b>-ice<\/b> (<b>advice<\/b>, <b>practice<\/b>); verbs end in <b>-ise<\/b> (<b>Practise every day<\/b>)."},{"qid":"c9-18-11","type":"spot","level":2,"topic":"conditional2","prompt":"Which sentence is correct?","options":["If I knew the answer, I would tell you.","If I knew the answer, I will tell you.","If I know the answer, I would tell you."],"answer":0,"rule":"Second conditional: <b>If<\/b> + simple past, <b>would<\/b> + base verb."},{"qid":"c9-18-12","type":"spot","level":2,"topic":"linkers","prompt":"Which sentence is correct?","options":["Although the test was hard, but Sameer passed it.","Although the test was hard, Sameer passed it.","Despite the test was hard, Sameer passed it."],"answer":1,"rule":"<b>Although<\/b> + clause, then the main clause with no <b>but<\/b>. <b>Despite<\/b> cannot take a full clause."},{"qid":"c9-18-13","type":"fix","level":2,"topic":"word_class","prompt":"One word is wrong. Find it and fix it.","words":["The","science","club","will","device","a","new","experiment."],"errors":[{"i":4,"options":["devices","devised","devise"],"answer":2}],"rule":"After <b>will<\/b> we need the verb <b>devise<\/b> (to plan). <b>Device<\/b> is a noun (a tool)."},{"qid":"c9-18-14","type":"fix","level":2,"topic":"unless_until","prompt":"One word is wrong. Find it and fix it.","words":["Please","wait","at","the","gate","until","Papa","arrive","from","the","office."],"errors":[{"i":7,"options":["arriving","arrived","arrives"],"answer":2}],"rule":"After <b>until<\/b>, use the simple present for a future event. <b>Papa<\/b> is singular: <b>arrives<\/b>."},{"qid":"c9-18-15","type":"fill","level":2,"topic":"dep_prep","prompt":"Fill in the gap.","before":"Fear has a strong influence","after":"our thinking.","options":["on","to","at"],"answer":0,"rule":"We say <b>an influence on<\/b> something."},{"qid":"c9-18-16","type":"build","level":2,"topic":"linkers","prompt":"Make a sentence with 'despite'.","answer":["Despite","heavy","rain,","the","match","continued."],"alts":[],"rule":"<b>Despite<\/b> + noun phrase (<b>heavy rain<\/b>), then the main clause."},{"qid":"c9-18-17","type":"chat","level":2,"topic":"conditional2","prompt":"Pick the correct reply.","chat":[["Om","What would you do with a time machine?"]],"options":["I will visited the age of the dinosaurs.","I would visit the age of the dinosaurs.","I would visited the age of the dinosaurs."],"answer":1,"rule":"An imagined situation: <b>would<\/b> + base verb: <b>I would visit<\/b>."},{"qid":"c9-18-18","type":"chat","level":2,"topic":"word_class","prompt":"Pick the correct reply.","chat":[["Coach","Why are you here so early, Sahil?"]],"options":["I have come for practise, sir.","I have come for practice, sir.","I has come for practice, sir."],"answer":1,"rule":"After <b>for<\/b> we need the noun <b>practice<\/b> (with c), and <b>I<\/b> takes <b>have<\/b>."},{"qid":"c9-18-19","type":"change","level":2,"topic":"linkers","prompt":"Combine using 'although'.","source":"Riya was tired. She finished her homework.","options":["Although Riya was tired, but she finished her homework.","Although Riya is tired, she finished her homework.","Although Riya was tired, she finished her homework."],"answer":2,"rule":"<b>Although<\/b> + clause, then the main clause with no <b>but<\/b>. Both clauses stay in the past."},{"qid":"c9-18-20","type":"proof","level":2,"topic":"dep_prep","prompt":"Find and fix the 2 errors in this message.","words":["Fear","has","many","forms.","My","cousin","is","afraid","from","the","dark,","and","Kabir","is","always","wary","of","talk","to","strangers."],"errors":[{"i":8,"options":["of","by","at"],"answer":0},{"i":17,"options":["talked","talks","talking"],"answer":2}],"rule":"We say <b>afraid of<\/b>. After a preposition like <b>of<\/b>, use the -ing form: <b>wary of talking<\/b>."},{"qid":"c9-18-21","type":"spot","level":3,"topic":"dep_prep","prompt":"Which sentence is correct?","options":["The prophetess took advantage on her followers.","The prophetess took advantage of her followers.","The prophetess took advantage at her followers."],"answer":1,"rule":"The fixed expression is <b>take advantage of<\/b> someone."},{"qid":"c9-18-22","type":"spot","level":3,"topic":"unless_until","prompt":"Which sentence is correct?","options":["Until you admit your fears, you cannot conquer them.","Unless you don't admit your fears, you cannot conquer them.","Until you won't admit your fears, you cannot conquer them."],"answer":0,"rule":"<b>Until<\/b> takes the simple present for the future, and <b>unless<\/b> is never used with <b>don't<\/b>."},{"qid":"c9-18-23","type":"fix","level":3,"topic":"linkers","prompt":"One word is wrong. Find it and fix it.","words":["Despite","he","was","very","tired,","Arjun","finished","the","race."],"errors":[{"i":0,"options":["However","Therefore","Although"],"answer":2}],"rule":"A full clause (<b>he was very tired<\/b>) needs <b>Although<\/b>. <b>Despite<\/b> takes a noun or -ing form."},{"qid":"c9-18-24","type":"fill","level":3,"topic":"conditional2","prompt":"Fill in the gap.","before":"If I","after":"you, I would read a different newspaper for a change.","options":["am","were","will be"],"answer":1,"rule":"For an imaginary situation, use <b>If I were you<\/b> with <b>would<\/b>."},{"qid":"c9-18-25","type":"fill","level":3,"topic":"word_class","prompt":"Fill in the gap.","before":"Regular","after":"will improve your handwriting.","options":["practise","practice","practised"],"answer":1,"rule":"The subject of a sentence is a noun: <b>practice<\/b> (with c). <b>Practise<\/b> (with s) is the verb."},{"qid":"c9-18-26","type":"build","level":3,"topic":"unless_until","prompt":"Give a warning with 'unless'.","answer":["Don't","believe","rumours","unless","you","check","them."],"alts":[],"rule":"<b>Unless<\/b> means <b>if not<\/b>: <b>Don't believe rumours unless you check them.<\/b>"},{"qid":"c9-18-27","type":"chat","level":3,"topic":"linkers","prompt":"Pick the correct reply.","chat":[["Nisha","Did the cricket match go ahead yesterday?"]],"options":["Yes, it was played despite of the rain.","Yes, it was played although the rain.","Yes, it was played in spite of the rain."],"answer":2,"rule":"Say <b>in spite of<\/b> or <b>despite<\/b> (never <b>despite of<\/b>) before a noun. <b>Although<\/b> needs a clause."},{"qid":"c9-18-28","type":"chat","level":3,"topic":"dep_prep","prompt":"Pick the correct reply.","chat":[["Mr Iyer","Why do you look worried, Pooja?"]],"options":["I'm afraid from the science test tomorrow.","I'm afraid of the science test tomorrow.","I'm afraid with the science test tomorrow."],"answer":1,"rule":"The adjective <b>afraid<\/b> is followed by <b>of<\/b>: <b>afraid of the test<\/b>."},{"qid":"c9-18-29","type":"change","level":3,"topic":"conditional2","prompt":"Rewrite using 'If' (second conditional).","source":"I don't have a car, so I can't drive you home.","options":["If I had a car, I could drive you home.","If I have a car, I could drive you home.","If I had a car, I can drive you home."],"answer":0,"rule":"An unreal present: <b>If<\/b> + simple past (<b>had<\/b>), <b>could<\/b>/<b>would<\/b> + base verb."},{"qid":"c9-18-30","type":"proof","level":3,"topic":"word_class","prompt":"Find and fix the 3 errors in this message.","words":["My","grandma","always","gives","us","good","advise","about","health.","She","advice","us","to","practice","yoga","every","morning","before","school."],"errors":[{"i":6,"options":["advice","advices","advised"],"answer":0},{"i":10,"options":["advise","advising","advises"],"answer":2},{"i":13,"options":["practise","practising","practised"],"answer":0}],"rule":"Noun: <b>advice<\/b>. Verbs: <b>She advises<\/b> (with -s for she) and <b>to practise<\/b> (with s)."},{"qid":"c9-18-31","type":"spot","level":4,"topic":"linkers","prompt":"Which sentence is correct?","options":["Fear causes superstition; however, courage defeats it.","Fear cause superstition; however, courage defeats it.","Fear causes superstition; however, courage defeat it."],"answer":0,"rule":"<b>However<\/b> after a semicolon joins two clauses; each singular subject (<b>fear<\/b>, <b>courage<\/b>) takes a verb with -s."},{"qid":"c9-18-32","type":"fix","level":4,"topic":"conditional2","prompt":"One word is wrong. Find it and fix it.","words":["If","Iceland","were","on","the","equator,","it","would","is","much","warmer."],"errors":[{"i":8,"options":["be","been","being"],"answer":0}],"rule":"After <b>would<\/b>, use the base verb: <b>would be much warmer<\/b>."},{"qid":"c9-18-33","type":"fix","level":4,"topic":"unless_until","prompt":"One word is wrong. Find it and fix it.","words":["No","sooner","had","the","stranger","arrived","then","my","mother","called","the","police."],"errors":[{"i":6,"options":["when","than","that"],"answer":1}],"rule":"<b>No sooner<\/b> is a comparative, so it pairs with <b>than<\/b>, never <b>then<\/b> or <b>when<\/b>."},{"qid":"c9-18-34","type":"fill","level":4,"topic":"dep_prep","prompt":"Fill in the gap.","before":"People often act foolishly","after":"the influence of fear.","options":["below","under","on"],"answer":1,"rule":"The fixed expression is <b>under the influence of<\/b>."},{"qid":"c9-18-35","type":"build","level":4,"topic":"conditional2","prompt":"Ask an imaginary question.","answer":["If","Raju","were","a","bird,","where","would","he","fly?"],"alts":[],"rule":"Second conditional question: <b>If<\/b> + <b>were<\/b>, then wh-word + <b>would<\/b> + subject + base verb."},{"qid":"c9-18-36","type":"chat","level":4,"topic":"linkers","prompt":"Pick the correct reply.","chat":[["Tara","Why did you carry an umbrella? It's sunny!"]],"options":["The forecast said it might rain, so I brought it.","The forecast said it might rain, so I brings it.","The forecast said it might rain, despite I brought it."],"answer":0,"rule":"<b>So<\/b> joins a reason to its result, and the story stays in the past: <b>so I brought it<\/b>."},{"qid":"c9-18-37","type":"chat","level":4,"topic":"unless_until","prompt":"Pick the correct reply.","chat":[["Didi","Shall we start dinner?"]],"options":["Let's wait until Mummy will come home.","Let's wait unless Mummy comes home.","Let's wait until Mummy comes home."],"answer":2,"rule":"<b>Until<\/b> (up to the time) + simple present for the future: <b>until Mummy comes<\/b>."},{"qid":"c9-18-38","type":"change","level":4,"topic":"unless_until","prompt":"Rewrite using 'No sooner ... than'.","source":"As soon as the prophetess spoke, the crowd replied.","options":["No sooner the prophetess spoke than the crowd replied.","No sooner did the prophetess spoke than the crowd replied.","No sooner did the prophetess speak than the crowd replied."],"answer":2,"rule":"<b>No sooner<\/b> + <b>did<\/b> + subject + base verb + <b>than<\/b>: <b>No sooner did the prophetess speak than<\/b>."},{"qid":"c9-18-39","type":"change","level":4,"topic":"linkers","prompt":"Rewrite using 'despite'.","source":"Although he was afraid, Raj went into the dark room.","options":["Despite he was afraid, Raj went into the dark room.","Despite being afraid, Raj went into the dark room.","Despite of being afraid, Raj went into the dark room."],"answer":1,"rule":"<b>Despite<\/b> + -ing form (<b>being afraid<\/b>). It never takes a full clause or <b>of<\/b>."},{"qid":"c9-18-40","type":"proof","level":4,"topic":"conditional2","prompt":"Find and fix the 2 errors in this message.","words":["If","I","had","enough","money,","I","would","travelled","to","Japan","and","Brazil.","Meeting","new","people","would","help","me","understand","them","better.","Unless","I","travel,","I","will","never","knows","how","others","live."],"errors":[{"i":7,"options":["travels","travelling","travel"],"answer":2},{"i":27,"options":["known","knew","know"],"answer":2}],"rule":"After <b>would<\/b> and <b>will<\/b>, use the base verb: <b>would travel<\/b>, <b>will never know<\/b>."},{"qid":"c9-18-41","type":"spot","level":5,"topic":"conditional2","prompt":"Which sentence is correct?","options":["Were I a scientist, I would test every claim myself.","Were I a scientist, I would tested every claim myself.","Was I a scientist, I would test every claim myself."],"answer":0,"rule":"<b>Were I<\/b> ... is a formal way to say <b>If I were<\/b> ..., followed by <b>would<\/b> + base verb."},{"qid":"c9-18-42","type":"fix","level":5,"topic":"linkers","prompt":"One word is wrong. Find it and fix it.","words":["In","spite","of","feel","afraid","of","ghosts,","Kiran","entered","the","dark","room."],"errors":[{"i":3,"options":["felt","feeling","feels"],"answer":1}],"rule":"<b>In spite of<\/b> is followed by a noun or an -ing form: <b>In spite of feeling afraid<\/b>."},{"qid":"c9-18-43","type":"fill","level":5,"topic":"unless_until","prompt":"Fill in the gap.","before":"Hardly had the faithful gathered","after":"the prophetess began to speak.","options":["than","then","when"],"answer":2,"rule":"<b>Hardly<\/b> pairs with <b>when<\/b>; <b>No sooner<\/b> pairs with <b>than<\/b>."},{"qid":"c9-18-44","type":"fill","level":5,"topic":"dep_prep","prompt":"Fill in the gap.","before":"You must guard yourself","after":"the myth-making power of fear.","options":["with","on","against"],"answer":2,"rule":"The verb <b>guard<\/b> takes <b>against<\/b>: <b>guard yourself against<\/b> a danger."},{"qid":"c9-18-45","type":"build","level":5,"topic":"unless_until","prompt":"Use 'No sooner ... than'.","answer":["No","sooner","had","we","reached","home","than","it","rained."],"alts":[],"rule":"<b>No sooner had<\/b> + subject + past participle + <b>than<\/b> + simple past."},{"qid":"c9-18-46","type":"chat","level":5,"topic":"conditional2","prompt":"Pick the correct reply.","chat":[["Aditi","Would you trust someone who promised to turn silver into gold?"]],"options":["Of course not. If someone said that, I will call the police.","Of course not. If someone says that, I would call the police.","Of course not. If someone said that, I would call the police."],"answer":2,"rule":"An imagined situation: <b>If<\/b> + simple past (<b>said<\/b>), <b>would<\/b> + base verb (<b>would call<\/b>)."},{"qid":"c9-18-47","type":"change","level":5,"topic":"linkers","prompt":"Combine using 'not only ... but also'.","source":"Fear causes superstition. It also causes cruelty.","options":["Fear causes not only superstition and also cruelty.","Fear causes not only superstition but also cruelty.","Fear causes not only superstition but cruelty also causes."],"answer":1,"rule":"<b>Not only<\/b> and <b>but also<\/b> stand before matching parts: <b>not only superstition but also cruelty<\/b>."},{"qid":"c9-18-48","type":"change","level":5,"topic":"conditional2","prompt":"Rewrite using 'If' (second conditional).","source":"Rahul isn't careful, so he makes silly errors.","options":["If Rahul is careful, he would not make silly errors.","If Rahul were careful, he would not make silly errors.","If Rahul were careful, he would not made silly errors."],"answer":1,"rule":"An unreal present: <b>If<\/b> + <b>were<\/b>, <b>would not<\/b> + base verb: <b>would not make<\/b>."},{"qid":"c9-18-49","type":"change","level":5,"topic":"unless_until","prompt":"Rewrite using 'Hardly ... when'.","source":"As soon as the bell rang, the students rushed out.","options":["Hardly had the bell rung when the students rushed out.","Hardly had the bell rang when the students rushed out.","Hardly the bell had rung than the students rushed out."],"answer":0,"rule":"<b>Hardly had<\/b> + subject + past participle (<b>rung<\/b>) + <b>when<\/b> + simple past."},{"qid":"c9-18-50","type":"proof","level":5,"topic":"linkers","prompt":"Find and fix the 3 errors in this message.","words":["Many","people","are","prone","to","believing","rumours;","however,","a","wise","person","check","the","facts.","Although","his","great","learning,","Aristotle","made","a","silly","error.","He","would","have","avoided","it","if","he","has","asked","his","wife."],"errors":[{"i":11,"options":["checks","checking","checker"],"answer":0},{"i":14,"options":["Though","However","Despite"],"answer":2},{"i":30,"options":["had","have","was"],"answer":0}],"rule":"<b>A wise person checks<\/b>; <b>Despite<\/b> + noun phrase; <b>would have avoided<\/b> needs <b>if he had asked<\/b>."}]},{"id":"19","num":"4.4","title":"My Financial Career","unit":"Unit Four","topics":[{"tag":"reported_speech","name":"Reported (indirect) speech"},{"tag":"past_perfect","name":"Past perfect in stories"},{"tag":"modal_deduction","name":"Modals of deduction (must have, can't have)"},{"tag":"linking","name":"Linking words (although, despite, however, no sooner)"}],"questions":[{"qid":"c9-19-01","type":"spot","level":1,"topic":"reported_speech","prompt":"Which reported question is correct?","options":["The manager asked me what I wanted.","The manager asked me what did I want.","The manager asked me that what I wanted."],"answer":0,"rule":"A reported question uses statement word order and no <b>that<\/b>: <b>asked me what I wanted<\/b>."},{"qid":"c9-19-02","type":"spot","level":1,"topic":"past_perfect","prompt":"Which sentence is correct?","options":["I realised that I had wrote fifty-six instead of six.","I realised that I had written fifty-six instead of six.","I realised that I had writing fifty-six instead of six."],"answer":1,"rule":"Past perfect = <b>had<\/b> + past participle: <b>had written<\/b>."},{"qid":"c9-19-03","type":"fix","level":1,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Ravi","had","never","open","a","bank","account","before","last","year."],"errors":[{"i":3,"options":["opening","opened","opens"],"answer":1}],"rule":"After <b>had<\/b> we need the past participle: <b>had never opened<\/b>."},{"qid":"c9-19-04","type":"fix","level":1,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["The","manager","told","me","to","came","out","of","the","safe."],"errors":[{"i":5,"options":["come","coming","comes"],"answer":0}],"rule":"A reported command uses <b>told<\/b> + person + <b>to<\/b> + base verb: <b>told me to come out<\/b>."},{"qid":"c9-19-05","type":"fill","level":1,"topic":"modal_deduction","prompt":"Fill in the gap.","before":"The manager looked alarmed. He","after":"thought I was a detective.","options":["must have","must had","must has"],"answer":0,"rule":"To guess about the past, use <b>must have<\/b> + past participle: <b>must have thought<\/b>."},{"qid":"c9-19-06","type":"fill","level":1,"topic":"linking","prompt":"Fill in the gap.","before":"","after":"he was nervous, he went into the bank.","options":["Despite","However","Although"],"answer":2,"rule":"<b>Although<\/b> joins a full clause (he was nervous). <b>Despite<\/b> needs a noun, and <b>however<\/b> cannot join two clauses."},{"qid":"c9-19-07","type":"build","level":1,"topic":"reported_speech","prompt":"Make the reported question.","answer":["He","asked","me","where","I","kept","my","money."],"alts":[],"rule":"In a reported question the subject comes before the verb: <b>where I kept<\/b>, not <b>where did I keep<\/b>."},{"qid":"c9-19-08","type":"chat","level":1,"topic":"modal_deduction","prompt":"Pick the correct reply.","chat":[["Riya","Aman's phone is on his desk, but he isn't here."]],"options":["He must went to the canteen.","He must have gone to the canteen.","He must have go to the canteen."],"answer":1,"rule":"A guess about the past: <b>must have<\/b> + past participle: <b>must have gone<\/b>."},{"qid":"c9-19-09","type":"chat","level":1,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Mom","What did the bank clerk say to you?"]],"options":["He said that my account were ready.","He said that my account was ready.","He said me that my account was ready."],"answer":1,"rule":"<b>Said<\/b> takes no person after it (said me is wrong), and <b>account<\/b> is singular: <b>was ready<\/b>."},{"qid":"c9-19-10","type":"change","level":1,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"\"Can I see the manager?\" I said.","options":["I asked if can I see the manager.","I asked if I could see the manager.","I asked that could I see the manager."],"answer":1,"rule":"A yes/no question is reported with <b>if<\/b>, statement order, and <b>can<\/b> becomes <b>could<\/b>."},{"qid":"c9-19-11","type":"spot","level":2,"topic":"linking","prompt":"Which sentence is correct?","options":["Although his fear, he opened an account.","Despite of his fear, he opened an account.","Despite his fear, he opened an account."],"answer":2,"rule":"<b>Despite<\/b> is followed directly by a noun (no <b>of<\/b>). <b>Although<\/b> needs a full clause."},{"qid":"c9-19-12","type":"spot","level":2,"topic":"modal_deduction","prompt":"Which sentence is correct?","options":["Nobody laughed, so they can't have heard the joke.","Nobody laughed, so they can't have hear the joke.","Nobody laughed, so they can't has heard the joke."],"answer":0,"rule":"To say something surely did not happen, use <b>can't have<\/b> + past participle: <b>can't have heard<\/b>."},{"qid":"c9-19-13","type":"fix","level":2,"topic":"modal_deduction","prompt":"One word is wrong. Find it and fix it.","words":["Meena","must","have","leave","her","umbrella","on","the","bus","yesterday."],"errors":[{"i":3,"options":["leaving","left","leaves"],"answer":1}],"rule":"<b>Must have<\/b> is followed by the past participle: <b>must have left<\/b>."},{"qid":"c9-19-14","type":"fix","level":2,"topic":"linking","prompt":"One word is wrong. Find it and fix it.","words":["Kavya","was","tired,","despite","she","still","played","cricket","with","us."],"errors":[{"i":3,"options":["during","with","but"],"answer":2}],"rule":"<b>Despite<\/b> cannot join two clauses. Use the conjunction <b>but<\/b> to show contrast: <b>tired, but she still played<\/b>."},{"qid":"c9-19-15","type":"fill","level":2,"topic":"reported_speech","prompt":"Fill in the gap.","before":"The manager asked me","after":"I was one of Pinkerton's men.","options":["whether","that","what"],"answer":0,"rule":"A reported yes/no question is joined with <b>whether<\/b> or <b>if<\/b>, never <b>that<\/b>."},{"qid":"c9-19-16","type":"fill","level":2,"topic":"past_perfect","prompt":"Fill in the gap.","before":"When I reached the bank, the manager","after":"already left.","options":["has","have","had"],"answer":2,"rule":"The leaving happened before I reached (past), so use the past perfect: <b>had already left<\/b>."},{"qid":"c9-19-17","type":"build","level":2,"topic":"modal_deduction","prompt":"Make a sentence that guesses about the past.","answer":["He","must","have","been","very","nervous."],"alts":[],"rule":"<b>must have been<\/b> shows we are sure about something in the past."},{"qid":"c9-19-18","type":"chat","level":2,"topic":"linking","prompt":"Pick the correct reply.","chat":[["Mom","Did you really go to the bank in that heavy rain?"]],"options":["Yes, despite the rain, I went.","Yes, despite it rained, I went.","Yes, although the rain, I went."],"answer":0,"rule":"<b>Despite<\/b> + noun: <b>despite the rain<\/b>. <b>Although<\/b> would need a clause: although it rained."},{"qid":"c9-19-19","type":"change","level":2,"topic":"past_perfect","prompt":"Join using 'after'.","source":"The clerk counted the money. He gave me a slip.","options":["After the clerk had counted the money, he had give me a slip.","After the clerk has counted the money, he gave me a slip.","After the clerk had counted the money, he gave me a slip."],"answer":2,"rule":"The earlier action takes the past perfect (<b>had counted<\/b>); the later one takes the simple past (<b>gave<\/b>)."},{"qid":"c9-19-20","type":"proof","level":2,"topic":"reported_speech","prompt":"Find and fix the 3 errors in this message.","words":["The","narrator","told","the","manager","that","he","has","come","to","open","an","account.","The","manager","asked","how","much","he","want","to","deposit.","He","said","that","he","will","deposit","fifty-six","dollars."],"errors":[{"i":7,"options":["had","have","having"],"answer":0},{"i":19,"options":["wants","wanting","wanted"],"answer":2},{"i":26,"options":["shall","would","can"],"answer":1}],"rule":"After a past reporting verb, tenses move back: <b>has<\/b> to <b>had<\/b>, <b>want<\/b> to <b>wanted<\/b>, <b>will<\/b> to <b>would<\/b>."},{"qid":"c9-19-21","type":"spot","level":3,"topic":"reported_speech","prompt":"Which reported command is correct?","options":["The manager ordered him that come out.","The manager ordered him to come out.","The manager ordered him to came out."],"answer":1,"rule":"A command is reported with <b>ordered/told<\/b> + person + <b>to<\/b> + base verb: <b>ordered him to come out<\/b>."},{"qid":"c9-19-22","type":"fix","level":3,"topic":"reported_speech","prompt":"One word is wrong. Find it and fix it.","words":["Yesterday,","the","clerk","asked","me","whether","I","am","drawing","out","all","my","money."],"errors":[{"i":7,"options":["were","is","was"],"answer":2}],"rule":"After the past verb <b>asked<\/b>, the present continuous moves back: <b>am drawing<\/b> becomes <b>was drawing<\/b>."},{"qid":"c9-19-23","type":"fix","level":3,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["The","film","had","already","start","when","we","reached","the","hall."],"errors":[{"i":4,"options":["starting","started","starts"],"answer":1}],"rule":"Past perfect = <b>had<\/b> + past participle: <b>had already started<\/b>."},{"qid":"c9-19-24","type":"fill","level":3,"topic":"modal_deduction","prompt":"Fill in the gap.","before":"That young man","after":"have known much about banks; he even walked into the safe.","options":["don't","isn't","can't"],"answer":2,"rule":"To say we are sure something was NOT true in the past, use <b>can't have<\/b> + past participle."},{"qid":"c9-19-25","type":"fill","level":3,"topic":"linking","prompt":"Fill in the gap.","before":"The bank was crowded;","after":"the clerk served me quickly.","options":["however,","although,","despite,"],"answer":0,"rule":"<b>However<\/b> is a linking adverb; it comes after a semicolon and is followed by a comma."},{"qid":"c9-19-26","type":"build","level":3,"topic":"past_perfect","prompt":"Put the tiles in order.","answer":["I","had","never","seen","such","a","big","iron","safe."],"alts":[],"rule":"<b>had never seen<\/b> is the past perfect; size comes before material: <b>big iron safe<\/b>."},{"qid":"c9-19-27","type":"chat","level":3,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Dad","What did your teacher tell you today?"]],"options":["She said us to bring our project files tomorrow.","She told us to bring our project files tomorrow.","She told us bring our project files tomorrow."],"answer":1,"rule":"Use <b>told<\/b> + person + <b>to<\/b> + verb. <b>Said<\/b> cannot take a person straight after it."},{"qid":"c9-19-28","type":"chat","level":3,"topic":"modal_deduction","prompt":"Pick the correct reply.","chat":[["Kabir","Is that Rohan at the door? I thought he was in Pune this week."]],"options":["No, it can't be him; he is in Pune.","No, it can't is him; he is in Pune.","No, it can't been him; he is in Pune."],"answer":0,"rule":"For a present deduction use <b>can't<\/b> + base verb: <b>it can't be him<\/b>."},{"qid":"c9-19-29","type":"change","level":3,"topic":"linking","prompt":"Rewrite using 'despite'.","source":"Although the manager was busy, he met me.","options":["Despite the manager was busy, he met me.","Despite being busy, the manager met me.","Despite of being busy, the manager met me."],"answer":1,"rule":"<b>Despite<\/b> takes a noun or an <b>-ing<\/b> form, never a full clause and never <b>of<\/b>."},{"qid":"c9-19-30","type":"proof","level":3,"topic":"past_perfect","prompt":"Find and fix the 3 errors in this message.","words":["When","I","reached","the","bank,","the","doors","has","already","closed.","I","had","forget","my","passbook","too,","so","I","go","home","sadly."],"errors":[{"i":7,"options":["have","is","had"],"answer":2},{"i":12,"options":["forgetting","forgotten","forgets"],"answer":1},{"i":18,"options":["gone","goes","went"],"answer":2}],"rule":"Earlier past action: <b>had closed<\/b>, <b>had forgotten<\/b> (past participle). The story's next step is simple past: <b>went<\/b>."},{"qid":"c9-19-31","type":"spot","level":4,"topic":"reported_speech","prompt":"Which sentence is correct?","options":["He asked me if my money had been deposited.","He asked me if had my money been deposited.","He asked me if my money had deposited."],"answer":0,"rule":"Money does not deposit itself, so use the passive <b>had been deposited<\/b>, in statement word order."},{"qid":"c9-19-32","type":"spot","level":4,"topic":"linking","prompt":"Which sentence is correct?","options":["He was too nervous that he could not speak.","He was so nervous to speak.","He was so nervous that he could not speak."],"answer":2,"rule":"Use <b>so ... that<\/b> or <b>too ... to<\/b>; do not mix them."},{"qid":"c9-19-33","type":"fix","level":4,"topic":"modal_deduction","prompt":"One word is wrong. Find it and fix it.","words":["The","money","must","have","been","count","by","the","clerk."],"errors":[{"i":5,"options":["counting","counted","counts"],"answer":1}],"rule":"Passive deduction: <b>must have been<\/b> + past participle: <b>must have been counted<\/b>."},{"qid":"c9-19-34","type":"fill","level":4,"topic":"reported_speech","prompt":"Fill in the gap.","before":"The clerk asked me how I","after":"to have the money.","options":["want","did want","wanted"],"answer":2,"rule":"Reported question: past tense after <b>asked<\/b> and statement order: <b>how I wanted<\/b>."},{"qid":"c9-19-35","type":"build","level":4,"topic":"linking","prompt":"Put the tiles in order.","answer":["He","kept","his","savings","in","a","sock","because","he","feared banks."],"alts":[],"rule":"<b>because<\/b> joins the main clause to the clause that gives the reason."},{"qid":"c9-19-36","type":"chat","level":4,"topic":"reported_speech","prompt":"Pick the correct reply.","chat":[["Sana","What did the manager ask you when you went in?"]],"options":["He asked me whether I was a detective.","He asked me whether was I a detective.","He asked to me whether I was a detective."],"answer":0,"rule":"<b>asked<\/b> + person (no <b>to<\/b>) + <b>whether<\/b> + subject + verb: <b>whether I was<\/b>."},{"qid":"c9-19-37","type":"chat","level":4,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Grandpa","Had you ever written a cheque before today?"]],"options":["No, I had never written one before.","No, I had never wrote one before.","No, I had not never written one before."],"answer":0,"rule":"Past perfect uses the past participle <b>written<\/b>; <b>not never<\/b> is a double negative."},{"qid":"c9-19-38","type":"change","level":4,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"\"Are you drawing it all out again?\" he asked in surprise.","options":["He asked in surprise whether was I drawing it all out again.","He asked in surprise whether I was drawing it all out again.","He asked in surprise whether I am drawing it all out again."],"answer":1,"rule":"Use <b>whether<\/b>, statement order, change <b>you<\/b> to <b>I<\/b>, and move <b>are drawing<\/b> back to <b>was drawing<\/b>."},{"qid":"c9-19-39","type":"change","level":4,"topic":"modal_deduction","prompt":"Rewrite using 'must have'.","source":"I am sure the clerks laughed at him.","options":["The clerks must have laughed at him.","The clerks must laughed at him.","The clerks must have laugh at him."],"answer":0,"rule":"<b>I am sure<\/b> + past action = <b>must have<\/b> + past participle: <b>must have laughed<\/b>."},{"qid":"c9-19-40","type":"proof","level":4,"topic":"linking","prompt":"Find and fix the 3 errors in this message.","words":["Although","the","long","queue","at","the","bank,","Neha","waited","patient","for","her","turn.","She","smiled","at","the","clerk","despite","he","was","rude","to","her."],"errors":[{"i":0,"options":["However","Because","Despite"],"answer":2},{"i":9,"options":["patience","impatient","patiently"],"answer":2},{"i":18,"options":["during","nevertheless","although"],"answer":2}],"rule":"<b>Despite<\/b> + noun, <b>although<\/b> + clause; the verb <b>waited<\/b> needs the adverb <b>patiently<\/b>."},{"qid":"c9-19-41","type":"spot","level":5,"topic":"reported_speech","prompt":"Which sentence is correct?","options":["The manager told the accountant that I was opening an account and would deposit fifty-six dollars.","The manager told to the accountant that I was opening an account and would deposit fifty-six dollars.","The manager said the accountant that I was opening an account and would deposit fifty-six dollars."],"answer":0,"rule":"<b>told<\/b> + person directly (no <b>to<\/b>); <b>said<\/b> needs <b>to<\/b> before a person: said to the accountant."},{"qid":"c9-19-42","type":"fix","level":5,"topic":"linking","prompt":"One word is wrong. Find it and fix it.","words":["No","sooner","had","the","clerk","handed","me","the","money","when","I","rushed","out","of","the","bank."],"errors":[{"i":9,"options":["than","then","that"],"answer":0}],"rule":"The pair is always <b>no sooner ... than<\/b> (but <b>hardly ... when<\/b>)."},{"qid":"c9-19-43","type":"fill","level":5,"topic":"modal_deduction","prompt":"Fill in the gap.","before":"He can't","after":"the cheque carefully, or he would not have written fifty-six instead of six.","options":["has checked","have checked","had checked"],"answer":1,"rule":"After a modal, use <b>have<\/b> (never has/had) + past participle: <b>can't have checked<\/b>."},{"qid":"c9-19-44","type":"build","level":5,"topic":"reported_speech","prompt":"Make the reported question.","answer":["The","clerk","asked","me","how","I","would","have","the money."],"alts":[],"rule":"\"How will you have it?\" becomes <b>how I would have<\/b> the money: statement order, <b>will<\/b> to <b>would<\/b>."},{"qid":"c9-19-45","type":"chat","level":5,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Riya","Why did the clerk look so surprised when he saw your cheque?"]],"options":["Because I had wrote fifty-six instead of six on it.","Because I had written fifty-six instead of six on it.","Because I have been written fifty-six instead of six on it."],"answer":1,"rule":"The mistake came before his surprise, so use the past perfect with the participle: <b>had written<\/b>."},{"qid":"c9-19-46","type":"change","level":5,"topic":"reported_speech","prompt":"Change into indirect speech.","source":"\"Let us do this painful thing quickly,\" I said to the clerk.","options":["I suggested to the clerk that we should do that painful thing quickly.","I suggested to the clerk that let us do that painful thing quickly.","I suggested the clerk to do that painful thing quickly."],"answer":0,"rule":"<b>Let us<\/b> is reported with <b>suggested (to someone) that we should<\/b>; <b>this<\/b> becomes <b>that<\/b>."},{"qid":"c9-19-47","type":"change","level":5,"topic":"linking","prompt":"Rewrite using 'No sooner ... than'.","source":"As soon as I left the bank, the clerks burst out laughing.","options":["No sooner did I left the bank than the clerks burst out laughing.","No sooner had I left the bank when the clerks burst out laughing.","No sooner had I left the bank than the clerks burst out laughing."],"answer":2,"rule":"<b>No sooner had<\/b> + subject + past participle ... <b>than<\/b> + simple past."},{"qid":"c9-19-48","type":"change","level":5,"topic":"past_perfect","prompt":"Join using 'before'.","source":"Mr Montgomery counted the money. Then I signed the book.","options":["Mr Montgomery had counted the money before I signed the book.","Mr Montgomery had counted the money before I had sign the book.","Mr Montgomery has counted the money before I signed the book."],"answer":0,"rule":"The first action takes the past perfect (<b>had counted<\/b>), the second the simple past (<b>signed<\/b>)."},{"qid":"c9-19-49","type":"proof","level":5,"topic":"modal_deduction","prompt":"Find and fix the 3 errors in this message.","words":["Anil's","bike","is","not","outside,","so","he","must","have","went","to","the","market.","He","can't","have","walk","there","because","it","is","far,","so","he","must","have","ride","his","bike."],"errors":[{"i":9,"options":["go","gone","goes"],"answer":1},{"i":16,"options":["walking","walked","walks"],"answer":1},{"i":26,"options":["rode","riding","ridden"],"answer":2}],"rule":"<b>must have / can't have<\/b> always take the past participle: <b>gone<\/b>, <b>walked<\/b>, <b>ridden<\/b>."},{"qid":"c9-19-50","type":"proof","level":5,"topic":"reported_speech","prompt":"Find and fix the 3 errors in this message.","words":["Riya","asked","the","clerk","how","she","can","open","a","savings","account.","The","clerk","told","her","to","filling","in","a","form","and","said","that","she","will","need","two","photos."],"errors":[{"i":6,"options":["able","could","can't"],"answer":1},{"i":16,"options":["filled","fills","fill"],"answer":2},{"i":24,"options":["would","shall","is"],"answer":0}],"rule":"After past reporting verbs: <b>can<\/b> to <b>could<\/b>, <b>will<\/b> to <b>would<\/b>; <b>told her to<\/b> + base verb: <b>to fill in<\/b>."}]},{"id":"20","num":"4.5","title":"Tansen","unit":"Unit Four","topics":[{"tag":"archaic_modern","name":"Archaic words to modern English (thou, thee, thy, thine)"},{"tag":"conditionals","name":"Conditionals (second, third and mixed)"},{"tag":"non_finite","name":"Non-finite verbs (infinitive, gerund, participle)"},{"tag":"sentence_conversion","name":"Simple, compound and complex sentences"}],"questions":[{"qid":"c9-20-01","type":"spot","level":1,"topic":"archaic_modern","prompt":"'Thy Teacher must be great' in modern English is:","options":["Your teacher must be great.","You teacher must be great.","Yours teacher must be great."],"answer":0,"rule":"<b>Thy<\/b> is old English for <b>your<\/b>. Before a noun we use the possessive adjective <b>your<\/b>."},{"qid":"c9-20-02","type":"spot","level":1,"topic":"conditionals","prompt":"Which sentence is correct?","options":["If Akbar heard the Ostad, he will be happy.","If Akbar hears the Ostad, he would be happy.","If Akbar heard the Ostad, he would be happy."],"answer":2,"rule":"Second conditional: <b>If<\/b> + simple past, <b>would<\/b> + base verb."},{"qid":"c9-20-03","type":"fix","level":1,"topic":"non_finite","prompt":"One word is wrong. Find it and fix it.","words":["Tansen","wanted","to","singing","for","the","king."],"errors":[{"i":3,"options":["sang","sing","sung"],"answer":1}],"rule":"An infinitive is <b>to<\/b> + base verb: <b>wanted to sing<\/b>."},{"qid":"c9-20-04","type":"fix","level":1,"topic":"conditionals","prompt":"One word is wrong. Find it and fix it.","words":["If","it","rains","tomorrow,","the","farmers","will","danced","with","joy."],"errors":[{"i":7,"options":["dancing","dances","dance"],"answer":2}],"rule":"First conditional: <b>If<\/b> + simple present, <b>will<\/b> + base verb: <b>will dance<\/b>."},{"qid":"c9-20-05","type":"fill","level":1,"topic":"non_finite","prompt":"Fill in the gap.","before":"Akbar enjoyed","after":"to Tansen's songs.","options":["listening","to listen","listen"],"answer":0,"rule":"<b>Enjoy<\/b> is followed by a gerund (<b>-ing<\/b> form): <b>enjoyed listening<\/b>."},{"qid":"c9-20-06","type":"fill","level":1,"topic":"archaic_modern","promp rticiple (<b>-ing<\/b>) can open a sentence to show an action by the subject: <b>Hearing ..., the birds<\/b>."},{"qid":"c9-20-12","type":"spot","level":2,"topic":"sentence_conversion","prompt":"Which sentence is correct?","options":["Although Akbar was a king, but he dressed like a slave.","Although Akbar was a king, he dressed like a slave.","Although Akbar was a king, he dressing like a slave."],"answer":1,"rule":"<b>Although<\/b> already joins the clauses, so do not add <b>but<\/b>. The main clause needs a finite verb: <b>dressed<\/b>."},{"qid":"c9-20-13","type":"fix","level":2,"topic":"conditionals","prompt":"One word is wrong. Find it and fix it.","words":["If","the","maiden","had","not","sang","Malhar,","Tansen","would","have","burnt."],"errors":[{"i":5,"options":["sung","sing","singing"],"answer":0}],"rule":"Third conditional: <b>If<\/b> + <b>had<\/b> + past participle: <b>had not sung<\/b> (sing, sang, sung)."},{"qid":"c9-20-14","type":"fix","level":2,"topic":"non_finite","prompt":"One word is wrong. Find it and fix it.","words":["The","king","was","eager","to","met","the","holy","teacher."],"errors":[{"i":5,"options":["meets","meet","meeting"],"answer":1}],"rule":"After <b>eager to<\/b>, use the base verb: <b>eager to meet<\/b>."},{"qid":"c9-20-15","type":"fill","level":2,"topic":"conditionals","prompt":"Fill in the gap.","before":"If I","after":"Akbar, I would also want to hear the Ostad.","options":["were","am","be"],"answer":0,"rule":"For an imaginary situation, use <b>If I were<\/b> ..., <b>I would<\/b> ...."},{"qid":"c9-20-16","type":"fill","level":2,"topic":"sentence_conversion","prompt":"Fill in the gap.","before":"Tansen bowed","after":"thanked the king.","options":["although","despite","and"],"answer":2,"rule":"Two actions by the same subject are joined by <b>and<\/b> to make a compound sentence."},{"qid":"c9-20-17","type":"build","level":2,"topic":"non_finite","prompt":"Put the tiles in order.","answer":["The","singers","were","eager","to","perform."],"alts":[],"rule":"Adjective + infinitive: <b>eager to perform<\/b>."},{"qid":"c9-20-18","type":"chat","level":2,"topic":"sentence_conversion","prompt":"Pick the correct reply.","chat":[["Arjun","Why did Akbar dress like a poor man?"]],"options":["He dressed like that because of the Ostad never sang for kings.","He dressed like that because the Ostad never sang for kings.","He dressed like that because the Ostad never sing for kings."],"answer":1,"rule":"<b>because<\/b> + clause (because of + noun only). <b>The Ostad<\/b> is singular, so <b>sang<\/b>, not sing."},{"qid":"c9-20-19","type":"change","level":2,"topic":"conditionals","prompt":"Rewrite using 'unless'.","source":"If you do not practise daily, you will not sing well.","options":["Unless you do not practise daily, you will not sing well.","Unless you practise daily, you will not sing well.","Unless you practise daily, you would not sing well."],"answer":1,"rule":"<b>Unless<\/b> means <b>if not<\/b>, so drop the <b>not<\/b> from that clause and keep <b>will<\/b>."},{"qid":"c9-20-20","type":"proof","level":2,"topic":"non_finite","prompt":"Find and fix the 3 errors in this message.","words":["Tansen","was","fond","of","sing","for","the","king.","One","day","he","decided","to","singing","the","Deepak","Raga,","and","soon","his","body","started","burn","like","a","fire."],"errors":[{"i":4,"options":["sang","sung","singing"],"answer":2},{"i":13,"options":["sing","sung","sang"],"answer":0},{"i":22,"options":["burnt","burns","burning"],"answer":2}],"rule":"After a preposition use <b>-ing<\/b> (<b>of singing<\/b>); after <b>to<\/b> use the base verb (<b>to sing<\/b>); <b>started burning<\/b>."},{"qid":"c9-20-21","type":"spot","level":3,"topic":"archaic_modern","prompt":"'Thou art my teacher' in modern English is:","options":["You are my teacher.","You is my teacher.","You am my teacher."],"answer":0,"rule":"<b>Thou art<\/b> is old English for <b>you are<\/b>. <b>You<\/b> always takes <b>are<\/b>."},{"qid":"c9-20-22","type":"fix","level":3,"topic":"non_finite","prompt":"One word is wrong. Find it and fix it.","words":["Enchanted","by","the","song,","the","birds","and","beasts","gathers","to","listen."],"errors":[{"i":8,"options":["gathering","gather","is"],"answer":1}],"rule":"<b>The birds and beasts<\/b> is plural, so the finite verb is <b>gather<\/b>. <b>Enchanted<\/b> is a past participle."},{"qid":"c9-20-23","type":"fix","level":3,"topic":"conditionals","prompt":"One word is wrong. Find it and fix it.","words":["If","Akbar","had","stayed","in","his","palace,","he","would","never","have","hear","the","Ostad."],"errors":[{"i":11,"options":["hearing","hears","heard"],"answer":2}],"rule":"Third conditional result: <b>would have<\/b> + past participle: <b>would never have heard<\/b>."},{"qid":"c9-20-24","type":"fill","level":3,"topic":"non_finite","prompt":"Fill in the gap.","before":"The birds stood still,","after":"by the beautiful raga.","options":["charming","charmed","charm"],"answer":1,"rule":"The birds were charmed by the raga (passive meaning), so use the past participle <b>charmed<\/b>."},{"qid":"c9-20-25","type":"fill","level":3,"topic":"sentence_conversion","prompt":"Fill in the gap.","before":"Not only did Tansen sing well,","after":"he also taught music.","options":["but","and","so"],"answer":0,"rule":"The pair is <b>not only ... but also<\/b>."},{"qid":"c9-20-26","type":"build","level":3,"topic":"conditionals","prompt":"Make a third conditional sentence.","answer":["If","the","maiden","hadn't","sung,","Tansen's","body","would","have","burnt."],"alts":[],"rule":"Third conditional: <b>If<\/b> + <b>hadn't<\/b> + past participle, then <b>would have<\/b> + past participle: <b>would have burnt<\/b>."},{"qid":"c9-20-27","type":"chat","level":3,"topic":"archaic_modern","prompt":"Pick the correct reply.","chat":[["Grandma","Do you know what 'Whither goest thou?' means?"]],"options":["It means 'Where are you going?'","It means 'Where you are going?'","It means 'Where are ,"type":"spot","level":4,"topic":"conditionals","prompt":"Which sentence is correct?","options":["Had Akbar not travelled, he would have missed the song.","Had Akbar not travelled, he would missed the song.","Had Akbar not travel, he would have missed the song."],"answer":0,"rule":"<b>Had<\/b> + subject + past participle can replace <b>If<\/b>; the result is <b>would have<\/b> + past participle."},{"qid":"c9-20-33","type":"fix","level":4,"topic":"sentence_conversion","prompt":"One word is wrong. Find it and fix it.","words":["The","Ostad","lived","in","a","cave","who","was","high","in","the","mountains."],"errors":[{"i":6,"options":["whom","whose","which"],"answer":2}],"rule":"For things like a cave, the relative pronoun is <b>which<\/b> (or that), not <b>who<\/b>."},{"qid":"c9-20-34","type":"fill","level":4,"topic":"archaic_modern","prompt":"'Thou knowest the answer' in modern English:","before":"You","after":"the answer.","options":["knows","knowing","know"],"answer":2,"rule":"<b>Thou knowest<\/b> = <b>you know<\/b>. With <b>you<\/b> the present verb has no <b>-s<\/b>."},{"qid":"c9-20-35","type":"build","level":4,"topic":"sentence_conversion","prompt":"Make a complex sentence that shows purpose.","answer":["Akbar","wore","plain","clothes","so","that","the","Ostad","would","sing."],"alts":[],"rule":"<b>so that<\/b> + <b>would<\/b> introduces a clause of purpose in the past."},{"qid":"c9-20-36","type":"chat","level":4,"topic":"non_finite","prompt":"Pick the correct reply.","chat":[["Tara","Why did you stop going to music class?"]],"options":["I stopped going because I wanted preparing for exams.","I stopped going because I wanted to prepare for exams.","I stopped go because I wanted to prepare for exams."],"answer":1,"rule":"<b>Stop<\/b> + gerund (<b>stopped going<\/b>); <b>want<\/b> + infinitive (<b>wanted to prepare<\/b>)."},{"qid":"c9-20-37","type":"chat","level":4,"topic":"sentence_conversion","prompt":"Pick the correct reply.","chat":[["Dad","How was the concert last night?"]],"options":["Not only was the singing good, but the tabla player were also great.","Not only was the singing good, but the tabla player was also great.","Not only was the singing good, and the tabla player was also great."],"answer":1,"rule":"When <b>Not only<\/b> begins a clause, invert the verb (<b>was the singing<\/b>) and pair it with <b>but also<\/b>; <b>the tabla player<\/b> is singular."},{"qid":"c9-20-38","type":"change","level":4,"topic":"sentence_conversion","prompt":"Make it a simple sentence using 'Having'.","source":"The Ostad finished his song and vanished.","options":["Having finished his song, the Ostad vanished.","Having finish his song, the Ostad vanished.","Having finished his song, the Ostad vanish."],"answer":0,"rule":"<b>Having<\/b> + past participle shows the first action; the sentence keeps one finite verb: <b>vanished<\/b>."},{"qid":"c9-20-39","type":"change","level":4,"topic":"conditionals","prompt":"Combine as one mixed conditional sentence using 'if'.","source":"Riya did not practise yesterday. She is nervous now.","options":["If Riya had practised yesterday, she would not be nervous now.","If Riya practised yesterday, she would not be nervous now.","If Riya had practised yesterday, she would not have been nervous now."],"answer":0,"rule":"Mixed conditional: past condition (<b>had practised<\/b>) with a present result (<b>would not be ... now<\/b>)."},{"qid":"c9-20-40","type":"proof","level":4,"topic":"non_finite","prompt":"Find and fix the 2 errors in this message.","words":["Akbar","agreed","to","going","with","Tansen","as","a","poor","man.","Tired","of","walk","for","days,","they","finally","reached","the","cave","high","in","the","mountains."],"errors":[{"i":3,"options":["go","gone","goes"],"answer":0},{"i":12,"options":["walked","walking","walks"],"answer":1}],"rule":"<b>agree to<\/b> + base verb (<b>agreed to go<\/b>); after the preposition <b>of<\/b> use a gerund (<b>tired of walking<\/b>)."},{"qid":"c9-20-41","type":"spot","level":5,"topic":"conditionals","prompt":"Which sentence is correct?","options":["If the maiden would not have sung Malhar, Tansen might have died.","If the maiden had not sung Malhar, Tansen might have died.","If the maiden had not sung Malhar, Tansen might have die."],"answer":1,"rule":"Never put <b>would<\/b> in the <b>if<\/b> clause. Third conditional: <b>had not sung<\/b> ..., <b>might have died<\/b>."},{"qid":"c9-20-42","type":"fix","level":5,"topic":"sentence_conversion","prompt":"One word is wrong. Find it and fix it.","words":["Hardly","had","the","Ostad","finished","his","song","than","he","disappeared","from","sight."],"errors":[{"i":7,"options":["when","then","after"],"answer":0}],"rule":"The pair is <b>hardly ... when<\/b> (but <b>no sooner ... than<\/b>)."},{"qid":"c9-20-43","type":"fill","level":5,"topic":"non_finite","prompt":"Fill in the gap.","before":"","after":"the long road, Akbar finally reached the holy cave.","options":["Travelled","Having travel","Having travelled"],"answer":2,"rule":"A perfect participle (<b>Having<\/b> + past participle) shows an action completed before the main action."},{"qid":"c9-20-44","type":"build","level":5,"topic":"sentence_conversion","prompt":"Make a complex sentence with 'although'.","answer":["Although","Akbar","was","a","mighty","king,","he","travelled","on","foot."],"alts":[["Although","he","was","a","mighty","king,","Akbar","travelled","on","foot."]],"rule":"<b>Although<\/b> starts the subordinate clause; the main clause follows the comma, without <b>but<\/b>."},{"qid":"c9-20-45","type":"chat","level":5,"topic":"archaic_modern","prompt":"Pick the correct reply.","chat":[["Kiran","How would you say 'Mighty thy Teacher must be' in modern English?"]],"options":["I would say 'Your teacher must is mighty.'","I would say 'You teacher must be mighty.'","I would say 'Your teacher must be mighty.'"],"answer":2,"rule":"<b>Thy<\/b> becomes <b>your<\/b>, and a modal like <b>must<\/b> is followed by the base verb <b>be<\/b>."},{"qid":"c9-20-46","type":"change","level":5,"topic":"archaic_modern","prompt":"Change into modern English.","source":"To thee I sing; he sings to God.","options":["I sing to thou; he sings to God.","I sing to your; he sings to God.","I sing to you; he sings to God."],"answer":2,"rule":"<b>Thee<\/b> is the old object form; after the preposition <b>to<\/b>, modern English uses <b>you<\/b>."},{"qid":"c9-20-47","type":"change","level":5,"topic":"sentence_conversion","prompt":"Make it a compound sentence.","source":"Won by their humility, the Ostad sang for them.","options":["The Ostad was won by their humility, and he sung for them.","The Ostad was won by their humility, and he sang for them.","The Ostad was winning by their humility, and he sang for them."],"answer":1,"rule":"A compound sentence joins two main clauses with <b>and<\/b>; <b>was won by<\/b> is passive, and the past of sing is <b>sang<\/b>."},{"qid":"c9-20-48","type":"change","level":5,"topic":"conditionals","prompt":"Rewrite as a third conditional sentence.","source":"Akbar was humble, so the Ostad sang for him.","options":["If Akbar was not humble, the Ostad would not have sung for him.","If Akbar had not been humble, the Ostad would not have sang for him.","If Akbar had not been humble, the Ostad would not have sung for him."],"answer":2,"rule":"Third conditional: <b>If<\/b> + <b>had not been<\/b> ..., <b>would not have<\/b> + past participle <b>sung<\/b> (not sang)."},{"qid":"c9-20-49","type":"proof","level":5,"topic":"sentence_conversion","prompt":"Find and fix the 3 errors in this message.","words":["No","sooner","had","they","reached","the","cave","when","the","Ostad","began","to","sing.","Each","of","the","listeners","were","enchanted,","and","Akbar","sit","in","silence."],"errors":[{"i":7,"options":["than","then","after"],"answer":0},{"i":17,"options":["are","was","being"],"answer":1},{"i":21,"options":["sits","sat","sitting"],"answer":1}],"rule":"<b>No sooner ... than<\/b>; <b>Ea
