","himself."],"errors":[{"i":2,"options":["were","is","be"],"answer":1}],"rule":"<b>Each<\/b> + singular noun takes a singular verb: <b>each packet is blessed<\/b>."},{"qid":"c7-18-35","type":"fill","level":4,"topic":"present_perfect","prompt":"Fill in the gap.","before":"Ritika has acted in films","after":"ten years.","options":["since","for","from"],"answer":1,"rule":"A length of time (<b>ten years<\/b>) takes <b>for<\/b> with the present perfect."},{"qid":"c7-18-36","type":"fill","level":4,"topic":"reported","prompt":"Fill in the gap.","before":"The invigilator said that we","after":"not use our phones.","options":["can't","cannot","could"],"answer":2,"rule":"In reported speech <b>can<\/b> moves back to <b>could<\/b>: <b>could not use<\/b>. 'can't not' is a double negative."},{"qid":"c7-18-37","type":"change","level":4,"topic":"passive","prompt":"Change into passive voice.","source":"A journalist interviewed Ritika.","options":["Ritika was interviewed by a journalist.","Ritika is interviewed by a journalist.","Ritika was interview by a journalist."],"answer":0,"rule":"Simple past active becomes <b>was + past participle<\/b>: <b>was interviewed<\/b>."},{"qid":"c7-18-38","type":"change","level":4,"topic":"comparison","prompt":"Change into the positive degree.","source":"Radio is cheaper than TV.","options":["TV is not as cheap as radio.","TV is not as cheaper as radio.","Radio is not as cheap as TV."],"answer":0,"rule":"Swap the two and use <b>not as + plain adjective + as<\/b>: <b>TV is not as cheap as radio.<\/b>"},{"qid":"c7-18-39","type":"build","level":4,"topic":"passive","prompt":"Make a passive sentence.","answer":["Pens","will","be","provided","by","the","invigilators."],"alts":[],"rule":"Future passive: <b>will be + past participle<\/b> + <b>by<\/b> + doer."},{"qid":"c7-18-40","type":"chat","level":4,"topic":"reported","prompt":"Pick the correct reply.","chat":[["Teacher","What did Dr Karnik tell the reporter?"]],"options":["He told her that more patients had came to the hospital.","He told her that more patients had come to the hospital.","He said her that more patients had come to the hospital."],"answer":1,"rule":"<b>told her<\/b> (not 'said her') + past perfect <b>had come<\/b>."},{"qid":"c7-18-41","type":"spot","level":5,"topic":"passive","prompt":"Which sentence is correct?","options":["The candidates was told that they would not be allowed to carry pens.","The candidates were told that they would not be allow to carry pens.","The candidates were told that they would not be allowed to carry pens."],"answer":2,"rule":"Plural <b>candidates were told<\/b>, and modal passive <b>would not be allowed<\/b>."},{"qid":"c7-18-42","type":"spot","level":5,"topic":"present_perfect","prompt":"Pick the sentence with the correct tenses.","options":["Ever since the news came out, fewer people visited Ralewadi.","Ever since the news came out, fewer people have visited Ralewadi.","Ever since the news has come out, fewer people visited Ralewadi."],"answer":1,"rule":"<b>Ever since<\/b> + past point (<b>came out<\/b>), then present perfect in the main clause: <b>have visited<\/b>."},{"qid":"c7-18-43","type":"fix","level":5,"topic":"comparison","prompt":"One word is wrong. Find it and fix it.","words":["Hawking","said","that","this","was","the","more","dangerous","time","ever","in","the","history","of","mankind."],"errors":[{"i":6,"options":["much","most","many"],"answer":1}],"rule":"<b>the ... ever<\/b> compares with all times, so use the superlative: <b>the most dangerous<\/b>."},{"qid":"c7-18-44","type":"fix","level":5,"topic":"passive","prompt":"One word is wrong. Find it and fix it.","words":["A","new","list","of","rules","has","been","issue","by","the","institute","this","year."],"errors":[{"i":7,"options":["issuing","issued","issues"],"answer":1}],"rule":"Present perfect passive: <b>has been + past participle<\/b> = <b>has been issued<\/b>."},{"qid":"c7-18-45","type":"fill","level":5,"topic":"reported","prompt":"Fill in the gap.","before":"Ritika told the journalists that she","after":"sign any more films after her next one.","options":["will not to","not will","would not"],"answer":2,"rule":"After <b>told<\/b>, <b>will not<\/b> moves back to <b>would not<\/b> + base verb."},{"qid":"c7-18-46","type":"build","level":5,"topic":"reported","prompt":"Put the words in order.","answer":["Hawking","warned","that","mankind","was","facing","great","danger."],"alts":[],"rule":"Reported statement: <b>is facing<\/b> moves back to <b>was facing<\/b>."},{"qid":"c7-18-47","type":"chat","level":5,"topic":"passive","prompt":"Pick the correct reply.","chat":[["Dadi","Why are so many people waiting in the sun?"],["Dadi","Is something being given away?"]],"options":["Yes, a powder is being sell by a man who says it cures everything.","Yes, a powder is being sold by a man which says it cures everything.","Yes, a powder is being sold by a man who says it cures everything."],"answer":2,"rule":"Continuous passive: <b>is being + past participle<\/b> = <b>is being sold<\/b>. Use <b>who<\/b> for a man."},{"qid":"c7-18-48","type":"chat","level":5,"topic":"present_perfect","prompt":"Pick the correct reply.","chat":[["Kunal","Have you ever written a letter to the Principal?"]],"options":["Yes, I have written one last year about our class bulletin.","Yes, I have wrote one last year about our class bulletin.","Yes, I wrote one last year about our class bulletin."],"answer":2,"rule":"<b>Last year<\/b> is a finished time, so the answer uses the simple past: <b>I wrote one<\/b>."},{"qid":"c7-18-49","type":"change","level":5,"topic":"reported","prompt":"Change into reported speech.","source":"The invigilator said to the candidates, \"You must switch off your phones.\"","options":["The invigilator told the candidates that they had to switch off their phones.","The invigilator told the candidates that they has to switch off their phones.","The invigilator told the candidates that you had to switch off your phones."],"answer":0,"rule":"<b>said to<\/b> becomes <b>told<\/b>; <b>you/your<\/b> become <b>they/their<\/b>; <b>must<\/b> becomes <b>had to<\/b>."},{"qid":"c7-18-50","type":"change","level":5,"topic":"comparison","prompt":"Change into the superlative degree.","source":"No other actress in Bollywood is paid as highly as Ritika.","options":["Ritika is the most highly paid actress in Bollywood.","Ritika is the more highly paid actress in Bollywood.","Ritika is the highest paid actresses in Bollywood."],"answer":0,"rule":"'No other ... as highly as' becomes the superlative: <b>the most highly paid actress<\/b>."}]},{"id":"19","num":"3.6","title":"Think Before You Speak !","unit":"Unit Three","topics":[{"tag":"noun_verb","name":"Same word as noun and verb; noun forms"},{"tag":"adverbials","name":"Adverbials: word, phrase and clause"},{"tag":"reported","name":"Reported speech (statements)"},{"tag":"cond1","name":"Conditionals type 1 (if ... will)"},{"tag":"modals","name":"Modals: should, must, ought to, have to"}],"questions":[{"qid":"c7-19-01","type":"spot","level":1,"topic":"noun_verb","prompt":"Which sentence is correct?","options":["Grandpa made a kind remarked.","Grandpa made a kind remarks.","Grandpa made a kind remark."],"answer":2,"rule":"After <b>a kind<\/b> we need a singular noun: <b>remark<\/b>. Here remark is a noun, not a verb."},{"qid":"c7-19-02","type":"spot","level":1,"topic":"adverbials","prompt":"Which sentence is correct?","options":["Riya spoke soften to her friend.","Riya spoke softly to her friend.","Riya spoked softly to her friend."],"answer":1,"rule":"To tell <b>how<\/b> she spoke, use the adverb <b>softly<\/b>. The past of speak is <b>spoke<\/b>."},{"qid":"c7-19-03","type":"fix","level":1,"topic":"adverbials","prompt":"One word is wrong. Find it and fix it.","words":["Amit","runs","very","quick","in","every","race."],"errors":[{"i":3,"options":["quickly","quickness","quicker"],"answer":0}],"rule":"<b>Quickly<\/b> is an adverb. It tells us how Amit runs."},{"qid":"c7-19-04","type":"fix","level":1,"topic":"noun_verb","prompt":"One word is wrong. Find it and fix it.","words":["Yesterday,","the","young","man","show","the","paper","to","his","teacher."],"errors":[{"i":4,"options":["shows","showing","showed"],"answer":2}],"rule":"Here <b>show<\/b> is a verb, and <b>Yesterday<\/b> needs the simple past: <b>showed<\/b>."},{"qid":"c7-19-05","type":"fill","level":1,"topic":"modals","prompt":"Fill in the gap.","before":"We","after":"think before we speak.","options":["should","should to","shoulds"],"answer":0,"rule":"A modal like <b>should<\/b> never takes -s and is followed by the base verb without <b>to<\/b>."},{"qid":"c7-19-06","type":"fill","level":1,"topic":"cond1","prompt":"Fill in the gap.","before":"If you tear the paper, the wind","after":"the bits away.","options":["carried","will carry","carrying"],"answer":1,"rule":"Type 1 conditional: <b>if<\/b> + simple present, then <b>will<\/b> + base verb: <b>will carry<\/b>."},{"qid":"c7-19-07","type":"build","level":1,"topic":"adverbials","prompt":"Make a sentence with an adverb phrase of place.","answer":["We","played","cricket","on","the","playground."],"alts":[],"rule":"<b>On the playground<\/b> is a phrase used as an adverb. It tells us where we played."},{"qid":"c7-19-08","type":"chat","level":1,"topic":"modals","prompt":"Pick the correct reply.","chat":[["Mom","Rahul, you look upset. What happened?"]],"options":["I said something rude to Kabir. I should apologise.","I says something rude to Kabir. I should apologise.","I said something rude to Kabir. I should apologises."],"answer":0,"rule":"Use the past <b>said<\/b> for what happened, and the base verb after <b>should<\/b>: <b>should apologise<\/b>."},{"qid":"c7-19-09","type":"chat","level":1,"topic":"cond1","prompt":"Pick the correct reply.","chat":[["Ananya","Will you come to the park after school?"]],"options":["Yes, if it won't rain, I will come.","Yes, if it doesn't rain, I will come.","Yes, if it doesn't rain, I coming."],"answer":1,"rule":"In the <b>if<\/b>-clause use the simple present (<b>doesn't rain<\/b>); put <b>will<\/b> in the main clause."},{"qid":"c7-19-10","type":"change","level":1,"topic":"reported","prompt":"Change into reported speech.","source":"Riya said, \"I am tired.\"","options":["Riya said that I was tired.","Riya said that she were tired.","Riya said that she was tired."],"answer":2,"rule":"<b>I<\/b> becomes <b>she<\/b> and <b>am<\/b> becomes <b>was<\/b> after the past verb <b>said<\/b>."},{"qid":"c7-19-11","type":"spot","level":2,"topic":"noun_verb","prompt":"Which sentence is correct?","options":["Please don't change the plan now.","Please don't changes the plan now.","Please don't changed the plan now."],"answer":0,"rule":"Here <b>change<\/b> is a verb. After <b>don't<\/b> we use the base verb: <b>change<\/b>."},{"qid":"c7-19-12","type":"spot","level":2,"topic":"cond1","prompt":"Which sentence is correct?","options":["If you will speak in anger, you will regret it.","If you speak in anger, you regretting it.","If you speak in anger, you will regret it."],"answer":2,"rule":"Type 1 conditional: <b>if<\/b> + simple present, main clause <b>will<\/b> + base verb."},{"qid":"c7-19-13","type":"fix","level":2,"topic":"modals","prompt":"One word is wrong. Find it and fix it.","words":["Neha","ought","to","stays","calm","during","the","debate."],"errors":[{"i":3,"options":["stayed","stay","staying"],"answer":1}],"rule":"<b>Ought to<\/b> is followed by the base verb: <b>ought to stay<\/b>."},{"qid":"c7-19-14","type":"fix","level":2,"topic":"adverbials","prompt":"One word is wrong. Find it and fix it.","words":["The","bits","of","paper","scattered","rapid","in","the","wind."],"errors":[{"i":5,"options":["rapidly","rapidity","rapids"],"answer":0}],"rule":"To say how the bits scattered, use the adverb <b>rapidly<\/b>."},{"qid":"c7-19-15","type":"fill","level":2,"topic":"reported","prompt":"Fill in the gap.","before":"Kabir said that he","after":"lost his friend's pen.","options":["have","had","having"],"answer":1,"rule":"In reported speech after <b>said<\/b>, the earlier action takes the past perfect: <b>had lost<\/b>."},{"qid":"c7-19-16","type":"fill","level":2,"topic":"noun_verb","prompt":"Fill in the gap.","before":"The wind made it hard to","after":"the bits of paper.","options":["collection","collected","collect"],"answer":2,"rule":"After <b>to<\/b> we need the base verb: <b>to collect<\/b>."},{"qid":"c7-19-17","type":"build","level":2,"topic":"cond1","prompt":"Make a type 1 conditional sentence.","answer":["If","you","shout,","your","friend","will","feel","hurt."],"alts":[],"rule":"<b>If<\/b> + simple present (<b>you shout<\/b>), then <b>will<\/b> + base verb (<b>will feel<\/b>)."},{"qid":"c7-19-18","type":"chat","level":2,"topic":"reported","prompt":"Pick the correct reply.","chat":[["Dad","What did your coach say about the match?"]],"options":["He said that we has played very well.","He said that we had played very well.","He said that we playing very well."],"answer":1,"rule":"Report the coach's words in the past perfect: <b>we had played<\/b>."},{"qid":"c7-19-19","type":"change","level":2,"topic":"cond1","prompt":"Join the sentences using 'if'.","source":"You listen carefully. You will learn a lot.","options":["If you will listen carefully, you will learn a lot.","If you listen carefully, you learn a lot will.","If you listen carefully, you will learn a lot."],"answer":2,"rule":"Keep the simple present in the <b>if<\/b>-clause and <b>will learn<\/b> in the main clause."},{"qid":"c7-19-20","type":"change","level":2,"topic":"reported","prompt":"Change into reported speech.","source":"Kabir said, \"I like this song.\"","options":["Kabir said that he liked that song.","Kabir said that he liked this songs.","Kabir said that I liked that song."],"answer":0,"rule":"<b>I<\/b> becomes <b>he<\/b>, <b>like<\/b> becomes <b>liked<\/b> and <b>this<\/b> becomes <b>that<\/b>."},{"qid":"c7-19-21","type":"spot","level":3,"topic":"adverbials","prompt":"Which sentence is correct?","options":["I will call you when I will reach home.","I will call you when I reach home.","I will call you when I reached home."],"answer":1,"rule":"In an adverb clause of time about the future, use the simple present: <b>when I reach<\/b>."},{"qid":"c7-19-22","type":"spot","level":3,"topic":"noun_verb","prompt":"Which sentence is correct?","options":["His return made everyone happy.","His returned made everyone happy.","His return make everyone happy."],"answer":0,"rule":"After <b>His<\/b> we need a noun: <b>return<\/b>. The verb is past: <b>made<\/b>."},{"qid":"c7-19-23","type":"fix","level":3,"topic":"cond1","prompt":"One word is wrong. Find it and fix it.","words":["If","Tanvi","practise","every","day,","she","will","win","the","debate."],"errors":[{"i":2,"options":["practised","practising","practises"],"answer":2}],"rule":"In the <b>if<\/b>-clause use the simple present. <b>Tanvi<\/b> is singular: <b>practises<\/b>."},{"qid":"c7-19-24","type":"fix","level":3,"topic":"reported","prompt":"One word is wrong. Find it and fix it.","words":["Mohan","told","me","that","both","his","sisters","was","feeling","unwell."],"errors":[{"i":7,"options":["is","were","has"],"answer":1}],"rule":"<b>Both his sisters<\/b> is plural, and the reported verb stays past: <b>were feeling<\/b>."},{"qid":"c7-19-25","type":"fill","level":3,"topic":"adverbials","prompt":"Fill in the gap.","before":"The wise teacher listened","after":"and then gave the young man a sheet of paper.","options":["patient","patience","patiently"],"answer":2,"rule":"We need an adverb to tell how he listened: <b>patiently<\/b>."},{"qid":"c7-19-26","type":"build","level":3,"topic":"reported","prompt":"Make a reported statement.","answer":["She","said","that","she","was","very","sorry."],"alts":[],"rule":"Reported speech: <b>said that<\/b> + pronoun + past verb: <b>she was very sorry<\/b>."},{"qid":"c7-19-27","type":"build","level":3,"topic":"modals","prompt":"Make a sentence g o was more than a hundred years old.","We rested under a banyan tree which it was more than a hundred years old.","We rested under a banyan tree which was more than a hundred years old."],"answer":2,"rule":"<b>Which<\/b> replaces <b>It<\/b>, so do not repeat <b>it<\/b>. Use <b>which<\/b> for things."},{"qid":"c7-20-50","type":"change","level":5,"topic":"tags","prompt":"Add the correct question tag.","source":"There is an old banyan tree near the lake.","options":["There is an old banyan tree near the lake, isn't it?","There is an old banyan tree near the lake, isn't there?","There is an old banyan tree near the lake, doesn't there?"],"answer":1,"rule":"When a sentence begins with <b>There is<\/b>, the tag repeats <b>there<\/b>, not it: <b>isn't there?<\/b>"}]},{"id":"21","num":"4.2","title":"Unke Munke Timpetoo","unit":"Unit Four","topics":[{"tag":"adj_suffix","name":"Adjectives from nouns and verbs (harmless, fearful, courageous)"},{"tag":"affixes","name":"Prefixes and suffixes (un-, dis-, -ship, -ness, -ly)"},{"tag":"past_perfect","name":"Past perfect (had asked, had climbed)"},{"tag":"reported","name":"Reported speech (statements)"},{"tag":"modals_mw","name":"Modals might / would (Would you mind ...?)"}],"questions":[{"qid":"c7-21-01","type":"spot","level":1,"topic":"adj_suffix","prompt":"Which sentence is correct?","options":["Muk gave a thoughtfully smile.","Muk gave a thoughtful smile.","Muk gave a thoughts smile."],"answer":1,"rule":"A noun (<b>smile<\/b>) is described by an adjective: thought + ful = <b>thoughtful<\/b>."},{"qid":"c7-21-02","type":"spot","level":1,"topic":"affixes","prompt":"Which sentence is correct?","options":["Rohan untied the strings impatience.","Rohan untieing the strings impatiently.","Rohan untied the strings impatiently."],"answer":2,"rule":"To tell how he untied them, add the suffix -ly: <b>impatiently<\/b>."},{"qid":"c7-21-03","type":"fix","level":1,"topic":"adj_suffix","prompt":"One word is wrong. Find it and fix it.","words":["M s.\"","options":["Muk said that he didn't believe in charms.","Muk said that he doesn't believed in charms.","Muk said that I didn't believe in charms."],"answer":0,"rule":"<b>I<\/b> becomes <b>he<\/b>, and <b>don't believe<\/b> becomes <b>didn't believe<\/b>."},{"qid":"c7-21-21","type":"spot","level":3,"topic":"affixes","prompt":"Which sentence is correct?","options":["The children were unhappy and disappoint.","The children were unhappy and disappointed.","The children were unhappily and disappointed."],"answer":1,"rule":"After <b>were<\/b> use adjectives: <b>unhappy<\/b> (un + happy) and <b>disappointed<\/b>."},{"qid":"c7-21-22","type":"spot","level":3,"topic":"modals_mw","prompt":"Which sentence is correct?","options":["Would you mind to close the gate?","Would you minding closing the gate?","Would you mind closing the gate?"],"answer":2,"rule":"<b>Would you mind<\/b> + -ing form is a polite request: <b>closing<\/b>."},{"qid":"c7-21-23","type":"fix","level":3,"topic":"adj_suffix","prompt":"One word is wrong. Find it and fix it.","words":["The","boys","were","fear","of","the","big","dog."],"errors":[{"i":3,"options":["fearfully","fearful","fearing"],"answer":1}],"rule":"After <b>were<\/b> we need an adjective: fear + ful = <b>fearful<\/b> (of)."},{"qid":"c7-21-24","type":"fix","level":3,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["After","Rohan","had","finished","the","rounds,","he","leave","the","garden."],"errors":[{"i":7,"options":["leaves","leaving","left"],"answer":2}],"rule":"After a past perfect clause, the later action is in the simple past: <b>left<\/b>."},{"qid":"c7-21-25","type":"fill","level":3,"topic":"past_perfect","prompt":"Fill in the gap.","before":"By the time Mrs Groover came out, Muk","after":"up the banyan tree.","options":["has climbed","climbing","had climbed"],"answer":2,"rule":"<b>By the time<\/b> + past: the earlier action takes the past perfect: <b>had climbed<\/b>."},{"qid":"c7-21-26","type":"build","level":3,"topic":"adj_suffix","prompt":"Make a sentence describing a person.","answer":["Mrs","Groover","was","kind","and","thoughtful."],"alts":[],"rule":"After <b>was<\/b> we use adjectives: <b>kind<\/b> and <b>thoughtful<\/b> (thought + ful)."},{"qid":"c7-21-27","type":"build","level":3,"topic":"modals_mw","prompt":"Make a polite request.","answer":["Would","you","mind","using","the","front","gate?"],"alts":[],"rule":"<b>Would you mind<\/b> + -ing form makes a polite request."},{"qid":"c7-21-28","type":"chat","level":3,"topic":"adj_suffix","prompt":"Pick the correct reply.","chat":[["Riya","How was the magic show?"]],"options":["It was wonderful! I loved it.","It was wonder! I loved it.","It was wonderfully! I loved it."],"answer":0,"rule":"After <b>was<\/b> we need an adjective: wonder + ful = <b>wonderful<\/b>."},{"qid":"c7-21-29","type":"change","level":3,"topic":"reported","prompt":"Change into reported speech.","source":"Mrs Groover said, \"I make the best cookies.\"","options":["Mrs Groover said that I made the best cookies.","Mrs Groover said that she make the best cookies.","Mrs Groover said that she made the best cookies."],"answer":2,"rule":"<b>I<\/b> becomes <b>she<\/b> and <b>make<\/b> becomes <b>made<\/b>."},{"qid":"c7-21-30","type":"change","level":3,"topic":"past_perfect","prompt":"Join the sentences using 'before'.","source":"Rohan finished his rounds. Then he left through the front gate.","options":["Rohan has finished his rounds before he left through the front gate.","Rohan had finished his rounds before he leaves through the front gate.","Rohan had finished his rounds before he left through the front gate."],"answer":2,"rule":"The earlier action takes <b>had finished<\/b>; the later one stays simple past: <b>left<\/b>."},{"qid":"c7-21-31","type":"spot","level":4,"topic":"affixes","prompt":"Which sentence is correct?","options":["Their friendship grow stronger every week.","Their friendship grew stronger every week.","Their friendly grew stronger every week."],"answer":1,"rule":"<b>Friendship<\/b> (friend + ship) is a singular noun, so use <b>grew<\/b>, not grow."},{"qid":"c7-21-32","type":"spot","level":4,"topic":"reported","prompt":"Which sentence is correct?","options":["Rohan told Muk that he would never return.","Rohan told to Muk that he would never return.","Rohan told Muk that he would never returned."],"answer":0,"rule":"<b>Told<\/b> takes a person directly (no <b>to<\/b>), and <b>would<\/b> takes the base verb."},{"qid":"c7-21-33","type":"fix","level":4,"topic":"adj_suffix","prompt":"One word is wrong. Find it and fix it.","words":["It","was","the","most","wonder","gift","that","Rohan","had","ever","received."],"errors":[{"i":4,"options":["wonderful","wonderfully","wondering"],"answer":0}],"rule":"<b>The most<\/b> + adjective: <b>the most wonderful<\/b> gift."},{"qid":"c7-21-34","type":"fix","level":4,"topic":"modals_mw","prompt":"One word is wrong. Find it and fix it.","words":["Muk","said","that","the","chant","would","not","did","any","harm."],"errors":[{"i":7,"options":["do","done","doing"],"answer":0}],"rule":"After <b>would not<\/b> we use the base verb: <b>would not do<\/b>."},{"qid":"c7-21-35","type":"fill","level":4,"topic":"adj_suffix","prompt":"Fill in the gap.","before":"The table tennis set was not new, but it was in","after":"condition.","options":["excellence","excellent","excellently"],"answer":1,"rule":"Before the noun <b>condition<\/b> we need an adjective: <b>excellent<\/b>."},{"qid":"c7-21-36","type":"fill","level":4,"topic":"reported","prompt":"Fill in the gap.","before":"Rohan's mother asked him who","after":"sent the big parcel.","options":["have","had","having"],"answer":1,"rule":"In a reported question about an earlier action, use the past perfect: <b>who had sent<\/b>."},{"qid":"c7-21-37","type":"build","level":4,"topic":"past_perfect","prompt":"Make a sentence in the past perfect.","answer":["Rohan","had","gone","over","his","lines","many","times."],"alts":[],"rule" ,"rule":"The sending happened before the wondering: <b>had sent<\/b> (had + past participle)."},{"qid":"c7-21-43","type":"fix","level":5,"topic":"reported","prompt":"One word is wrong. Find it and fix it.","words":["Rohan","told","his","mother","that","he","had","never","saw","such","a","big","parcel","before."],"errors":[{"i":8,"options":["seen","see","seeing"],"answer":0}],"rule":"In reported speech, <b>had<\/b> needs the past participle: <b>had never seen<\/b>."},{"qid":"c7-21-44","type":"fix","level":5,"topic":"affixes","prompt":"One word is wrong. Find it and fix it.","words":["Mrs","Groover's","sudden","kind","surprised","the","two","boys."],"errors":[{"i":3,"options":["kindness","kindly","kinder"],"answer":0}],"rule":"After <b>Mrs Groover's sudden<\/b> we need a noun: kind + ness = <b>kindness<\/b>."},{"qid":"c7-21-45","type":"fill","level":5,"topic":"modals_mw","prompt":"Fill in the gap.","before":"Rohan was worried that the dog","after":"bite him, so he begged Mrs Groover to hold it.","options":["ought","would to","might"],"answer":2,"rule":"<b>Might<\/b> + base verb shows a possibility. <b>Ought<\/b> needs <b>to<\/b>, and <b>would<\/b> never takes <b>to<\/b>."},{"qid":"c7-21-46","type":"build","level":5,"topic":"reported","prompt":"Make a reported question.","answer":["She","asked","him","why","he","was","in","her","garden."],"alts":[],"rule":"A reported question keeps statement order: <b>why he was<\/b>, not why was he."},{"qid":"c7-21-47","type":"chat","level":5,"topic":"adj_suffix","prompt":"Pick the correct reply.","chat":[["Sana","Did you like Mrs Groover in the end?"]],"options":["Yes, she was really friend and helpful.","Yes, she was really friendly and helpfully.","Yes, she was really friendly and helpful."],"answer":2,"rule":"After <b>was<\/b> use adjectives: <b>friendly<\/b> and <b>helpful<\/b> (help + ful)."},{"qid":"c7-21-48","type":"chat","level":5,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Dad","Why didn't you eat any 's meet at seven.","Yes, I can to come. Let's meet at seven."],"answer":0,"rule":"<b>can<\/b> + base verb, with no 'to' and no -s: <b>I can come<\/b>."},{"qid":"c7-22-09","type":"change","level":1,"topic":"modals","prompt":"Change into a negative sentence.","source":"Spaulding can develop photographs.","options":["Spaulding does not can develop photographs.","Spaulding cannot developed photographs.","Spaulding cannot develop photographs."],"answer":2,"rule":"Modals make negatives without 'do': <b>can<\/b> becomes <b>cannot<\/b>, and the verb stays in base form."},{"qid":"c7-22-10","type":"change","level":1,"topic":"reported","prompt":"Change into reported speech.","source":"Mr Wilson said, \"I am shocked.\"","options":["Mr Wilson said that I was shocked.","Mr Wilson said that he was shocked.","Mr Wilson said that he were shocked."],"answer":1,"rule":"<b>I<\/b> becomes <b>he<\/b>, and <b>am<\/b> moves back to <b>was<\/b> after 'said'."},{"qid":"c7-22-11","type":"spot","level":2,"topic":"past_perfect","prompt":"Pick the sentence with the correct tense.","options":["Wilson had already leave when Watson came in.","Wilson has already left when Watson came in.","Wilson had already left when Watson came in."],"answer":2,"rule":"The action that happened first in the past takes <b>had + past participle<\/b>: <b>had left<\/b>."},{"qid":"c7-22-12","type":"spot","level":2,"topic":"reported","prompt":"Which sentence is correct?","options":["Holmes said that he would solve the case by Monday.","Holmes said that he will solved the case by Monday.","Holmes said that he would solves the case by Monday."],"answer":0,"rule":"In reported speech <b>will<\/b> becomes <b>would<\/b>, followed by the base verb: <b>would solve<\/b>."},{"qid":"c7-22-13","type":"fix","level":2,"topic":"adverbs","prompt":"One word is wrong. Find it and fix it.","words":["Mr","Wilson","copied","the","pages","diligent","for","four","hours."],"errors":[{"i":5,"options":["diligence","diligently","careful"],"answer" }],"rule":"<b>has<\/b> takes the past participle: <b>has gone<\/b>, not 'has went'."},{"qid":"c7-24-35","type":"fill","level":4,"topic":"phrasal_verbs","prompt":"Fill in the gap.","before":"Yesterday the volunteers","after":"their old books to the library.","options":["give away","gave away","have given away"],"answer":1,"rule":"<b>Yesterday<\/b> needs the simple past: <b>gave away<\/b> (gave them free)."},{"qid":"c7-24-36","type":"fill","level":4,"topic":"present_perfect","prompt":"Fill in the gap.","before":"The residents","after":"the students' visit very much last Sunday.","options":["have enjoyed","enjoy","enjoyed"],"answer":2,"rule":"<b>last Sunday<\/b> is a finished time, so use the simple past <b>enjoyed<\/b>, not the present perfect."},{"qid":"c7-24-37","type":"build","level":4,"topic":"present_perfect","prompt":"Make a question.","answer":["How","long","have","you","known","Mr","Bendre?"],"alts":[],"rule":"<b>How long<\/b> + present perfect asks about time up to now: <b>have you known<\/b>."},{"qid":"c7-24-38","type":"chat","level":4,"topic":"present_perfect","prompt":"Pick the correct reply.","chat":[["Kiran","How long have you lived in Girgaon?"]],"options":["I have lived here for 2019.","I have lived here since 2019.","I am living here since 2019."],"answer":1,"rule":"From a starting point (2019) up to now: <b>have lived ... since<\/b>."},{"qid":"c7-24-39","type":"chat","level":4,"topic":"phrasal_verbs","prompt":"Pick the correct reply.","chat":[["Dad","What will you do this Sunday?"]],"options":["I will help Grandma clear out her old cupboard.","I will helps Grandma clear out her old cupboard.","I will help Grandma clearing out her old cupboard."],"answer":0,"rule":"<b>will help<\/b> + person + base verb: <b>help Grandma clear out<\/b> (clear out = empty and tidy)."},{"qid":"c7-24-40","type":"change","level":4,"topic":"sentence_transform","prompt":"Change into a negative sentence without changing the meaning.","source":"Everyone was present at the PTA ve","after":"more young visitors every month.","options":["having had","have","to have"],"answer":2,"rule":"<b>would love<\/b> is followed by the infinitive: <b>would love to have<\/b>."},{"qid":"c7-24-46","type":"build","level":5,"topic":"sentence_transform","prompt":"Make a wh- question.","answer":["Why","did","Mr","Bendre","want","to","meet","the","Principal?"],"alts":[],"rule":"Wh- question in the past: <b>Why + did + subject + base verb<\/b>."},{"qid":"c7-24-47","type":"chat","level":5,"topic":"present_perfect","prompt":"Pick the correct reply.","chat":[["Mrs Rao","Have you ever written a thank-you letter?"]],"options":["Yes, I have written one to my aunt last week.","Yes, I written one to my aunt last week.","Yes, I wrote one to my aunt last week."],"answer":2,"rule":"Once you name a finished time (<b>last week<\/b>), switch to the simple past: <b>wrote<\/b>."},{"qid":"c7-24-48","type":"change","level":5,"topic":"sentence_transform","prompt":"Change into a negative sentence without changing the meaning.","source":"The visit was a great success.","options":["The visit was not a success.","The visit were not a failure.","The visit was not a failure."],"answer":2,"rule":"Keep the meaning by using the opposite word: <b>a success<\/b> -> <b>not a failure<\/b>."},{"qid":"c7-24-49","type":"change","level":5,"topic":"present_perfect","prompt":"Change into the present perfect tense.","source":"The children brightened up the whole week for the residents.","options":["The children have brightened up the whole week for the residents.","The children has brightened up the whole week for the residents.","The children have brighten up the whole week for the residents."],"answer":0,"rule":"Present perfect = <b>have<\/b> (plural subject) + past participle <b>brightened<\/b>."},{"qid":"c7-24-50","type":"change","level":5,"topic":"sentence_transform","prompt":"Make a question beginning with 'How much'.","source":"Our residents enjoyed the visit very much.","options":["How much did our residents enjoy the visit?","How much did our residents enjoyed the visit?","How much our residents enjoyed the visit?"],"answer":0,"rule":"Wh- question in the past: <b>How much + did + subject + base verb<\/b>."}]},{"id":"25","num":"4.6","title":"Papa Panov's Special Christmas","unit":"Unit Four","topics":[{"tag":"homophones","name":"Homophones used as the right part of speech"},{"tag":"past_perfect","name":"Past perfect tense"},{"tag":"degrees","name":"Degrees of comparison"},{"tag":"joining","name":"Joining sentences (and, because, so, while, who, whose)"}],"questions":[{"qid":"c7-25-01","type":"spot","level":1,"topic":"homophones","prompt":"Which sentence is correct?","options":["Papa Panov new that someone would come.","Papa Panov knowed that someone would come.","Papa Panov knew that someone would come."],"answer":2,"rule":"<b>knew<\/b> is the past tense of the verb know. <b>new<\/b> is an adjective (not old)."},{"qid":"c7-25-02","type":"spot","level":1,"topic":"degrees","prompt":"Pick the correct sentence.","options":["They were the best shoes he had ever made.","They were the goodest shoes he had ever made.","They were the better shoes he had ever made."],"answer":0,"rule":"<b>good - better - best<\/b>. 'Ever made' compares with all of them, so use the superlative <b>best<\/b>."},{"qid":"c7-25-03","type":"fix","level":1,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Papa","Panov's","children","had","grow","up","and","gone","away."],"errors":[{"i":4,"options":["grew","growing","grown"],"answer":2}],"rule":"Past perfect = <b>had + past participle<\/b>: <b>had grown up<\/b>."},{"qid":"c7-25-04","type":"fix","level":1,"topic":"degrees","prompt":"One word is wrong. Find it and fix it.","words":["The","road","sweeper","looked","more","miserable","then","ever."],"errors":[{"i":6,"options":["that","than","as"],"answer":1}],"rule":"A comparative is followed by <b>than<\/b>: <b>more miserable than ever<\/b>. 'Then' is about time."},{"qid":"c7-25-05","type":"fill","level":1,"topic":"homophones","prompt":"Fill in the gap.","before":"Did you","after":"the church bells this morning?","options":["here","hear","heard"],"answer":1,"rule":"We need a verb after <b>Did you<\/b>: <b>hear<\/b>. 'Here' tells a place."},{"qid":"c7-25-06","type":"fill","level":1,"topic":"degrees","prompt":"Fill in the gap.","before":"The armchair was","after":"than the stool.","options":["bigger","biggest","more big"],"answer":0,"rule":"Comparing two things with <b>than<\/b> needs the comparative: <b>bigger<\/b>."},{"qid":"c7-25-07","type":"build","level":1,"topic":"joining","prompt":"Join the ideas with 'so'.","answer":["He","was","tired,","so","he","slept."],"alts":[],"rule":"<b>so<\/b> joins a reason to its result: <b>He was tired, so he slept.<\/b>"},{"qid":"c7-25-08","type":"chat","level":1,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Tara","Did you see the Christmas play?"]],"options":["No, it had ended before I reached the hall.","No, it had end before I reached the hall.","No, it has ended before I reached the hall."],"answer":0,"rule":"The play ended first, so use the past perfect: <b>had ended<\/b>."},{"qid":"c7-25-09","type":"change","level":1,"topic":"degrees","prompt":"Change into the comparative degree.","source":"No other shoes were as good as these.","options":["These shoes were gooder than any other shoes.","These shoes were best than any other shoes.","These shoes were better than any other shoes."],"answer":2,"rule":"The comparative of good is <b>better<\/b>, followed by <b>than any other<\/b>."},{"qid":"c7-25-10","type":"change","level":1,"topic":"joining","prompt":"Join the sentences using 'and'.","source":"Papa Panov made coffee. He gave it to the sweeper.","options":["Papa Panov made coffee and give it to the sweeper.","Papa Panov made coffee and gave it to the sweeper.","Papa Panov made coffee and gave them to the sweeper."],"answer":1,"rule":"Both verbs stay in the past (<b>made ... gave<\/b>), and coffee is <b>it<\/b>."},{"qid":"c7-25-11","type":"spot","level":2,"topic":"homophones","prompt":"Which sentence is correct?","options":["I no the way to the next village.","I knows the way to the next village.","I know the way to the next village."],"answer":2,"rule":"<b>know<\/b> is the verb; <b>no<\/b> is a negative word. With <b>I<\/b>, use know (no -s)."},{"qid":"c7-25-12","type":"spot","level":2,"topic":"past_perfect","prompt":"Pick the sentence with the correct tense.","options":["The bells had start ringing before Papa Panov woke up.","The bells had started ringing before Papa Panov woke up.","The bells has started ringing before Papa Panov woke up."],"answer":1,"rule":"The bells began first, so <b>had started<\/b>; the later action stays in the simple past."},{"qid":"c7-25-13","type":"fix","level":2,"topic":"joining","prompt":"One word is wrong. Find it and fix it.","words":["The","sweeper,","who","clothes","were","old,","was","glad","to","come","inside."],"errors":[{"i":2,"options":["whose","whom","which"],"answer":0}],"rule":"The sweeper's clothes = <b>whose clothes<\/b>. Use whose to show belonging."},{"qid":"c7-25-14","type":"fix","level":2,"topic":"degrees","prompt":"One word is wrong. Find it and fix it.","words":["Papa","Panov","was","the","kinder","man","in","the","whole","village."],"errors":[{"i":4,"options":["kindness","kinds","kindest"],"answer":2}],"rule":"<b>the ... in the whole village<\/b> compares with everyone, so use the superlative <b>kindest<\/b>."},{"qid":"c7-25-15","type":"fill","level":2,"topic":"joining","prompt":"Fill in the gap.","before":"The girl had no money,","after":"she could not buy shoes.","options":["because of","so","despite"],"answer":1,"rule":"Having no money is the reason; not buying shoes is the result. A result clause is joined with <b>so<\/b>."},{"qid":"c7-25-16","type":"fill","level":2,"topic":"homophones","prompt":"Fill in the gap.","before":"A thin light was filtering","after":"the shutters.","options":["through","threw","thorough"],"answer":0,"rule":"We need a preposition: <b>through<\/b>. 'Threw' is the past of throw."},{"qid":"c7-25-17","type":"build","level":2,"topic":"past_perfect","prompt":"Put the words in order.","answer":["She","had","walked","from","the","next","village."],"alts":[],"rule":"Past perfect = <b>had + past participle<\/b>: <b>had walked<\/b>."},{"qid":"c7-25-18","type":"chat","level":2,"topic":"degrees","prompt":"Pick the correct reply.","chat":[["Kabir","Is Pune colder than Mumbai in December?"]],"options":["Yes, Pune is much more colder than Mumbai.","Yes, Pune is much colder than Mumbai.","Yes, Pune is much coldest than Mumbai."],"answer":1,"rule":"Short adjectives add -er: <b>colder<\/b>. Never use 'more' with an -er word."},{"qid":"c7-25-19","type":"chat","level":2,"topic":"homophones","prompt":"Pick the correct reply.","chat":[["Neighbour","Is anybody at home?"]],"options":["Yes, I am hear. Please come in.","Yes, I am here. Please come in.","Yes, I is here. Please come in."],"answer":1,"rule":"<b>here<\/b> tells the place; <b>hear<\/b> is a verb (listen). With <b>I<\/b>, use <b>am<\/b>."},{"qid":"c7-25-20","type":"change","level":2,"topic":"joining","prompt":"Join the sentences using 'because'.","source":"The girl was walking to the next village. She needed work.","options":["The girl was walking to the next village because she need work.","The girl was walking to the next village because her needed work.","The girl was walking to the next village because she needed work."],"answer":2,"rule":"<b>because<\/b> joins the reason; keep the subject pronoun <b>she<\/b> and the past tense <b>needed<\/b>."},{"qid":"c7-25-21","type":"spot","level":3,"topic":"degrees","prompt":"Which sentence is correct?","options":["The further he read, the sleepier he became.","The further he read, the sleepiest he became.","The further he read, more sleepy he became."],"answer":0,"rule":"In <b>the ... the ...<\/b> sentences both parts use the ule":"<b>because<\/b> introduces the reason: <b>because it was cold<\/b>."},{"qid":"c7-25-28","type":"chat","level":3,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Dev","Why didn't you buy the cake?"]],"options":["The shop had closed by the time I got there.","The shop had close by the time I got there.","The shop has closed by the time I got there."],"answer":0,"rule":"<b>By the time<\/b> + past points to an earlier action: <b>had closed<\/b>."},{"qid":"c7-25-29","type":"chat","level":3,"topic":"joining","prompt":"Pick the correct reply.","chat":[["Mum","Why are you wearing a sweater?"]],"options":["I am wearing it because it is cold today.","I am wearing it because it cold today.","I am wearing it because it are cold today."],"answer":0,"rule":"The reason after <b>because<\/b> needs a full clause: <b>it is cold<\/b>."},{"qid":"c7-25-30","type":"change","level":3,"topic":"past_perfect","prompt":"Join the sentences using 'Before'.","source":"Papa Panov gave the baby a pair of shoes. Then the girl left.","options":["Before the girl left, Papa Panov had given her baby a pair of shoes.","Before the girl left, Papa Panov has given her baby a pair of shoes.","Before the girl left, Papa Panov had gave her baby a pair of shoes."],"answer":0,"rule":"The earlier action takes <b>had given<\/b>; the later one stays in the simple past <b>left<\/b>."},{"qid":"c7-25-31","type":"spot","level":4,"topic":"homophones","prompt":"Which sentence is correct?","options":["Riya through the old box away and bought a new one.","Riya threw the old box away and bought a new one.","Riya threw the old box away and bought a knew one."],"answer":1,"rule":"<b>threw<\/b> = past of throw (a verb); <b>new<\/b> = adjective. 'Through' and 'knew' don't fit."},{"qid":"c7-25-32","type":"spot","level":4,"topic":"degrees","prompt":"Pick the correct sentence.","options":["It was one of the coldest days of the winter.","It was one of the coldest day of the winter.","It was one of the colder days of the winter."],"answer":0,"rule":"<b>one of the<\/b> + superlative + <b>plural noun<\/b>: <b>one of the coldest days<\/b>."},{"qid":"c7-25-33","type":"fix","level":4,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["The","shoes","had","been","keep","in","a","small,","dusty","box."],"errors":[{"i":4,"options":["keeping","kept","keeps"],"answer":1}],"rule":"Past perfect passive = <b>had been + past participle<\/b>: <b>had been kept<\/b>."},{"qid":"c7-25-34","type":"fix","level":4,"topic":"degrees","prompt":"One word is wrong. Find it and fix it.","words":["The","sweeper","was","very","more","grateful","than","he","could","say."],"errors":[{"i":3,"options":["much","many","most"],"answer":0}],"rule":"We strengthen a comparative with <b>much<\/b> (or far), never with 'very': <b>much more grateful<\/b>."},{"qid":"c7-25-35","type":"fill","level":4,"topic":"joining","prompt":"Fill in the gap.","before":"He saw a young mother","after":"baby had no shoes.","options":["who","whose","which"],"answer":1,"rule":"The mother's baby = <b>whose baby<\/b>. Use whose to show belonging."},{"qid":"c7-25-36","type":"fill","level":4,"topic":"past_perfect","prompt":"Fill in the gap.","before":"By evening, Papa Panov","after":"many visitors, but not the one he expected.","options":["has met","meets","had met"],"answer":2,"rule":"<b>By evening<\/b> (a past time) takes the past perfect: <b>had met<\/b>."},{"qid":"c7-25-37","type":"build","level":4,"topic":"degrees","prompt":"Put the words in order.","answer":["Nothing","is","more","precious","than","kindness."],"alts":[],"rule":"Long adjectives form the comparative with <b>more<\/b>: <b>more precious than<\/b>."},{"qid":"c7-25-38","type":"chat","level":4,"topic":"homophones","prompt":"Pick the correct reply.","chat":[["Aunt Leela","Do you know the new boy in your class?"]],"options":["Yes, I no him. He is very friendly.","Yes, I know him. He is very friendly.","Yes, I knows him. He is very friendly."],"answer":1,"rule":"The verb is <b>know<\/b> (no -s with I). 'No' is not a verb."},{"qid":"c7-25-39","type":"chat","level":4,"topic":"degrees","prompt":"Pick the correct reply.","chat":[["Coach","Who is the fastest runner in your team?"]],"options":["Meera is the faster of us all.","Meera is the most fastest of us all.","Meera is the fastest of us all."],"answer":2,"rule":"Comparing with the whole group needs the superlative <b>fastest<\/b>, never 'most fastest'."},{"qid":"c7-25-40","type":"change","level":4,"topic":"degrees","prompt":"Change into the positive degree.","source":"Papa Panov was the kindest man in the village.","options":["No other man in the village was so kinder as Papa Panov.","No other man in the village were as kind as Papa Panov.","No other man in the village was as kind as Papa Panov."],"answer":2,"rule":"Superlative -> positive: <b>No other ... was as kind as ...<\/b> (positive form <b>kind<\/b>)."},{"qid":"c7-25-41","type":"spot","level":5,"topic":"joining","prompt":"Which sentence is correct?","options":["Although he was disappointed, but Papa Panov kept watching the street.","Although he disappointed, Papa Panov kept watching the street.","Although he was disappointed, Papa Panov kept watching the street."],"answer":2,"rule":"<b>Although<\/b> already joins the two parts, so don't add 'but'. 'He was disappointed' needs <b>was<\/b>."},{"qid":"c7-25-42","type":"spot","level":5,"topic":"past_perfect","prompt":"Pick the sentence with the correct tense.","options":["Papa Panov realised that he had seen his visitor many times that day.","Papa Panov realised that he has seen his visitor many times that day.","Papa Panov realised that he had saw his visitor many times that day."],"answer":0,"rule":"The seeing came before the realising: <b>had seen<\/b> (had + past participle)."},{"qid":"c7-25-43","type":"fix","level":5,"topic":"joining","prompt":"One word is wrong. Find it and fix it.","words":["The","young","mother,","which","had","walked","for","miles,","sank","into","the","armchair."],"errors":[{"i":3,"options":["whose","who","whom"],"answer":1}],"rule":"The mother is a person and the subject of <b>had walked<\/b>, so use <b>who<\/b>."},{"qid":"c7-25-44","type":"fix","level":5,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["No","sooner","had","Papa","Panov","opened","the","door","than","the","cold","air","rush","in."],"errors":[{"i":12,"options":["rushed","rushing","rushes"],"answer":0}],"rule":"<b>No sooner had ... than<\/b> + simple past: <b>than the cold air rushed in<\/b>."},{"qid":"c7-25-45","type":"fill","level":5,"topic":"degrees","prompt":"Fill in the gap.","before":"Of all the people he helped, the baby was the","after":"one.","options":["youngest","younger","more young"],"answer":0,"rule":"<b>Of all<\/b> compares with more than two, so use the superlative <b>youngest<\/b>."},{"qid":"c7-25-46","type":"build","level":5,"topic":"joining","prompt":"Put the words in order.","answer":["The","shoes","that","he","had","kept","fitted","the","baby."],"alts":[],"rule":"<b>that he had kept<\/b> describes <b>the shoes<\/b> and comes right after them."},{"qid":"c7-25-47","type":"chat","level":5,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Grandma","Did you enjoy the story session at the library yesterday?"]],"options":["Yes! Until yesterday, I have never heard such a lovely story.","Yes! Until yesterday, I had never hear such a lovely story.","Yes! Until yesterday, I had never heard such a lovely story."],"answer":2,"rule":"<b>Until yesterday<\/b> points to a time before a past moment, so use the past perfect: <b>had never heard<\/b>."},{"qid":"c7-25-48","type":"change","level":5,"topic":"joining","prompt":"Join the sentences using 'who'.","source":"Papa Panov was a shoemaker. He lived alone in a little village.","options":["Papa Panov, who he lived alone in a little village, was a shoemaker.","Papa Panov, who lived alone in a little village, was a shoemaker.","Papa Panov, which lived alone in a little village, was a shoemaker."],"answer":1,"rule":"<b>who<\/b> replaces <b>he<\/b>, so don't keep both; use who, not which, for a person."},{"qid":"c7-25-49","type":"change","level":5,"topic":"degrees","prompt":"Change into the superlative degree.","source":"Very few villagers were as kind as Papa Panov.","options":["Papa Panov was one of the kindest villager.","Papa Panov was one of the kindest villagers.","Papa Panov was one of the kinder villagers."],"answer":1,"rule":"<b>Very few ... as kind as<\/b> -> <b>one of the kindest<\/b> + plural noun."},{"qid":"c7-25-50","type":"change","level":5,"topic":"joining","prompt":"Join the sentences using 'As soon as'.","source":"Papa Panov saw the beggars. He hurried indoors to fetch soup.","options":["As soon as Papa Panov saw the beggars, he hurry indoors to fetch soup.","As soon as Papa Panov saw the beggars, he hurried indoors to fetch soup.","As soon as Papa Panov saw the beggars, so he hurried indoors to fetch soup."],"answer":1,"rule":"<b>As soon as<\/b> joins the two actions; no 'so' is added, and both verbs stay in the past."}]}]};

<script>
(function(){
"use strict";
const CLS = DATA.class, KEY = "zq_grammar_c" + CLS;
const STOPS = [
  {k:"spot",  name:"Spot it",  icon:"🔍", color:"#1e9bf0", types:["spot"],  n:8},
  {k:"fix",   name:"Fix it",   icon:"🖍️", color:"#ee3b4b", types:["fix"],   n:8},
  {k:"fill",  name:"Fill it",  icon:"🧩", color:"#ff8a3d", types:["fill"],  n:8},
  {k:"build", name:"Build it", icon:"🧱", color:"#1fb47a", types:["build"], n:6},
  {k:"talk",  name:"Talk it",  icon:"💬", color:"#5b3cc4", types:["chat"],  n:8},
  {k:"change",name:"Change it",icon:"🔄", color:"#0ca5a5", types:["change"],n:8},
  {k:"boss",  name:"Boss round",icon:"👑",color:"#e9a800", types:null,      n:10}
];
const TYPE = {spot:["Spot it","#1e9bf0"],fix:["Fix it","#ee3b4b"],proof:["Proofread","#d6336c"],fill:["Fill it","#ff8a3d"],build:["Build it","#1fb47a"],chat:["Talk it","#5b3cc4"],change:["Change it","#0ca5a5"]};
const UNIT_COLORS = ["#5b3cc4","#1e9bf0","#ff8a3d","#1fb47a","#ee3b4b","#0ca5a5","#e9a800","#d6336c"];
const CHEERS = ["Brilliant!","Super!","Spot on!","Well done!","Excellent!","Perfect!","Shabash!","Great job!"];
const OOPS = ["Not quite","Oops!","Almost!","Let's learn this one"];

/* ---------- storage ---------- */
let S;
function blank(){return {xp:0,streak:0,last:"",stops:{},seen:{},wrong:{},topic:{},sound:true,daily:""}}
function load(){try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ---------- data helpers ---------- */
const CH = DATA.chapters, Q = {};
CH.forEach(c=>{c.questions.forEach(q=>{q.ch=c.id;Q[q.qid]=q})});
const hasType = t=>CH.some(c=>c.questions.some(q=>q.type===t));
const stopsFor = c=>STOPS.filter(s=>!s.types||c.questions.some(q=>s.types.includes(q.type)));
const esc = s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const today = ()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function chapterStars(c){return stopsFor(c).reduce((a,s)=>a+(S.stops[c.id+"|"+s.k]||0),0)}
function totalStars(){return CH.reduce((a,c)=>a+chapterStars(c),0)}
function correctSentence(q){
  if(q.type==="spot"||q.type==="chat"||q.type==="change")return q.options[q.answer];
  if(q.type==="fill")return (q.before+" "+q.options[q.answer]+" "+q.after).trim();
  if(q.type==="build")return q.answer.join(" ");
  const w=q.words.slice();q.errors.forEach(e=>w[e.i]=e.options[e.answer]);return w.join(" ");
}

/* ---------- sound / speech ---------- */
let AC;
function tone(seq){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
  seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8})}catch(e){}}
const sfx={ok:()=>tone([[660,.12],[880,.12],[1320,.22]]),bad:()=>tone([[220,.18,"triangle"],[180,.25,"triangle"]]),tap:()=>tone([[520,.05]]),part:()=>tone([[520,.12],[660,.18]]),win:()=>tone([[523,.14],[659,.14],[784,.14],[1046,.35]])};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function speak(text){try{const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,""));const v=speechSynthesis.getVoices();
  u.voice=v.find(x=>/en[-_]IN/i.test(x.lang))||v.find(x=>/^en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)}

/* ---------- confetti ---------- */
function confetti(){const cv=document.getElementById("confetti"),cx=cv.getContext("2d");cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  const cols=["#5b3cc4","#ffc531","#ee3b4b","#1fb47a","#1e9bf0","#ff8a3d"];const P=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height*.5,r:(4+Math.random()*6)*devicePixelRatio,c:cols[Math.random()*6|0],vy:(2+Math.random()*4)*devicePixelRatio,vx:(Math.random()-.5)*3*devicePixelRatio,a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function step(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
    if(++f<170)requestAnimationFrame(step);else cx.clearRect(0,0,cv.width,cv.height)})()}

function topnav(title,sub,back){return `<div class="topnav"><button class="iconbtn" id="back" aria-label="Back">⬅️</button><div><h2>${title}</h2>${sub?`<small>${sub}</small>`:""}</div></div>`}

/* ---------- TRAIL ---------- */
function trail(c){
  const stops=stopsFor(c),n=stops.length,H=150*n+40,W=520;
  const pts=stops.map((s,i)=>({x:i%2?W*.72:W*.28,y:80+i*150}));
  let d=`M${pts[0].x} ${pts[0].y}`;for(let i=1;i<n;i++){const a=pts[i-1],b=pts[i];d+=` C${a.x} ${a.y+90}, ${b.x} ${b.y-90}, ${b.x} ${b.y}`}
  const nextI=stops.findIndex(s=>!(S.stops[c.id+"|"+s.k]>=1));
  app.innerHTML=`${topnav(esc(c.title),"Lesson "+esc(c.num||c.id)+" · ⭐ "+chapterStars(c)+" / "+n*3)}
   <div class="topics">${c.topics.map(t=>`<span class="topic">${esc(t.name)}</span>`).join("")}</div>
   <div class="trailwrap"><div class="trail" style="aspect-ratio:${W}/${H}">
   <svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="#e3e1f3" stroke-width="22" stroke-linecap="round"/>
   <path d="${d}" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round"/></svg>
   ${stops.map((s,i)=>{const st=S.stops[c.id+"|"+s.k]||0;return `<button class="stop ${i===nextI?"next":""}" data-k="${s.k}" style="left:${pts[i].x/W*100}%;top:${pts[i].y/H*100}%">
     <span class="node" style="background:${s.color}">${s.icon}</span><span class="lbl">${s.name}</span><span class="st">${"★".repeat(st)}${'<span style="color:#d9d5ef">'+"★".repeat(3-st)+"</span>"}</span></button>`}).join("")}
   </div></div>`;
  app.querySelector("#back").onclick=()=>go(home);
  app.querySelectorAll(".stop").forEach(b=>b.onclick=()=>{sfx.tap();startStop(c,stops.find(s=>s.k===b.dataset.k))});
}
function pickRound(pool,n,sortLevel){
  const unseen=shuffle(pool.filter(q=>!S.seen[q.qid])),wrong=shuffle(pool.filter(q=>S.seen[q.qid]&&S.wrong[q.qid])),rest=shuffle(pool.filter(q=>S.seen[q.qid]&&!S.wrong[q.qid]));
  let r=unseen.concat(wrong,rest).slice(0,n);
  if(sortLevel)r.sort((a,b)=>a.level-b.level);
  return r;
}
function startStop(c,s){
  let pool;
  if(s.types)pool=c.questions.filter(q=>s.types.includes(q.type));
  else{pool=c.questions.filter(q=>q.level>=4);if(pool.length<s.n)pool=c.questions}
  const qs=pickRound(pool,s.n,true);
  play({qs,title:s.name,color:s.color,onEnd:(score)=>{const k=c.id+"|"+s.k,st=stars(score,qs.length);if(st>(S.stops[k]||0))S.stops[k]=st;save()},back:()=>go(trail,c),next:()=>{const st=stopsFor(c);const i=st.findIndex(x=>x.k===s.k);return i<st.length-1?()=>startStop(c,st[i+1]):null}});
}
function startDaily(){
  const played=CH.filter(c=>chapterStars(c)>0);const src=(played.length?played:CH.slice(0,3));
  const pool=[].concat(...src.map(c=>c.questions));
  play({qs:pickRound(pool,5,false),title:"Daily 5",color:"#ff8a3d",onEnd:()=>{S.daily=today();save()},back:()=>go(home)});
}
const stars=(score,n)=>{const p=score/n;return p>=.9?3:p>=.7?2:p>=.4?1:0};

/* ---------- PLAY ---------- */
let R;
function play(cfg){
  R=Object.assign({i:0,score:0,combo:0,xp:0,log:[]},cfg);
  renderQ();
}
function renderQ(){
  hideSheet();window.scrollTo(0,0);
  const q=R.qs[R.i],[tname,tcol]=TYPE[q.type];
  app.innerHTML=`<div class="play">
    <div class="playtop"><button class="iconbtn" id="quit" aria-label="Quit round">✖️</button>
      <div class="pbar"><i id="pb" style="width:${R.i/R.qs.length*100}%"></i></div>
      <div class="combo" id="combo">${R.combo>=2?"🔥×"+R.combo:""}</div></div>
    <div class="card" id="card">
      <div><span class="badge" style="background:${tcol}">${tname}</span><span class="lv">${"●".repeat(q.level)}${"○".repeat(5-q.level)} · ${R.i+1} of ${R.qs.length}</span></div>
      <div class="prompt">${esc(q.prompt)}</div>
      <div id="body" style="display:grid;gap:16px"></div>
      <div class="spacer" id="sp" hidden></div>
    </div></div>`;
  app.querySelector("#quit").onclick=()=>R.back();
  const body=app.querySelector("#body");
  ({spot:qChoice,chat:qChoice,change:qChoice,fill:qFill,build:qBuild,fix:qFix,proof:qFix})[q.type](q,body);
}
function finish(q,score,you,detail){
  const ok=score===1;
  R.score+=score;
  if(ok){R.combo++;const gain=10+(R.combo>=3?5:0);R.xp+=gain}else{R.combo=0;R.xp+=Math.round(10*score)}
  S.seen[q.qid]=1;
  if(ok)delete S.wrong[q.qid];else S.wrong[q.qid]=1;
  const t=S.topic[q.topic]||(S.topic[q.topic]=[0,0]);t[0]+=score;t[1]+=1;
  save();
  R.log.push({q,score,you,right:correctSentence(q)});
  try{window.parent!==window&&window.parent.postMessage({type:"zq-grammar-attempt",class:CLS,chapter:q.ch,qid:q.qid,score,answer:you},"*");window.ZQ_onAttempt&&window.ZQ_onAttempt({class:CLS,chapter:q.ch,qid:q.qid,score,answer:you})}catch(e){}
  const pb=document.getElementById("pb");if(pb)pb.style.width=((R.i+1)/R.qs.length*100)+"%";
  const cb=document.getElementById("combo");if(cb){cb.textContent=R.combo>=2?"🔥×"+R.combo:"";if(R.combo>=2){cb.classList.add("pop");setTimeout(()=>cb.classList.remove("pop"),220)}}
  if(ok){sfx.ok();buzz(20)}else if(score>0)sfx.part();else{sfx.bad();buzz([40,40,40])}
  const cls=ok?"good":score>0?"part":"bad";
  const title=ok?CHEERS[Math.random()*CHEERS.length|0]:score>0?"Half marks, nearly there!":OOPS[Math.random()*OOPS.length|0];
  const right=correctSentence(q);
  const sheet=document.getElementById("sheet"),inn=document.getElementById("sheetIn");
  sheet.className="sheet "+cls;
  inn.innerHTML=`<div class="head"><div class="face">${penny(ok?"happy":score>0?"wow":"sad")}</div><h3>${title}${ok&&R.combo>=3?" 🔥 +5 combo":""}</h3></div>
    ${ok?`<div class="ans"><span class="ok">✔ <b>${esc(right)}</b></span></div>`:`<div class="ans">${detail?`<span class="you">✖ Yours: <b>${esc(you)}</b></span>`:""}<span class="ok">✔ Right: <b>${esc(right)}</b></span></div>`}
    <div class="rule">💡 ${q.rule}</div>
    <button class="speak" id="say">🔊 Hear it</button>
    <button class="go" id="cont">${R.i===R.qs.length-1?"See my stars":"Continue"}</button>`;
  requestAnimationFrame(()=>sheet.classList.add("show"));
  document.getElementById("sp").hidden=false;
  inn.querySelector("#say").onclick=()=>speak(right);
  const c=inn.querySelector("#cont");c.focus({preventScroll:true});
  c.onclick=()=>{R.i++;if(R.i<R.qs.length)renderQ();else results()};
}
function hideSheet(){const s=document.getElementById("sheet");if(s)s.className="sheet"}

/* choice: spot / chat / change */
function qChoice(q,body){
  if(q.type==="chat")body.insertAdjacentHTML("beforeend",`<div class="chat">${q.chat.map(m=>`<div class="msg"><b>${esc(m[0])}</b>${esc(m[1])}</div>`).join("")}</div>`);
  if(q.type==="change")body.insertAdjacentHTML("beforeend",`<div class="source">${esc(q.source)}</div>`);
  const order=shuffle(q.options.map((o,i)=>i));
  const box=document.createElement("div");box.className="opts";
  let sel=-1;
  order.forEach(i=>{const b=document.createElement("button");b.className="opt"+(q.type==="chat"?" bubble":"");b.textContent=q.options[i];b.dataset.i=i;
    b.onclick=()=>{sfx.tap();sel=i;box.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));chk.disabled=false};box.appendChild(b)});
  const chk=document.createElement("button");chk.className="go";chk.textContent="Check";chk.disabled=true;
  chk.onclick=()=>{box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;x.classList.remove("sel");if(+x.dataset.i===q.answer)x.classList.add("right");else if(+x.dataset.i===sel)x.classList.add("wrong")});
    chk.remove();finish(q,sel===q.answer?1:0,q.options[sel],sel!==q.answer)};
  body.append(box,chk);
}
/* fill */
function qFill(q,body){
  const line=document.createElement("div");line.className="gapline";
  line.innerHTML=`${esc(q.before)} <span class="gap" id="gap">&nbsp;?&nbsp;</span> ${esc(q.after)}`;
  const chips=document.createElement("div");chips.className="chips";let sel=-1;
  const chk=document.createElement("button");chk.className="go";chk.textContent="Check";chk.disabled=true;
  shuffle(q.options.map((o,i)=>i)).forEach(i=>{const b=document.createElement("button");b.className="chip";b.textContent=q.options[i];b.dataset.i=i;
    b.onclick=()=>{sfx.tap();sel=i;line.querySelector("#gap").textContent=q.options[i];chips.querySelectorAll(".chip").forEach(x=>x.style.outline=x===b?"3px solid var(--sea)":"");chk.disabled=false};chips.appendChild(b)});
  chk.onclick=()=>{const ok=sel===q.answer,g=line.querySelector("#gap");g.classList.add(ok?"right":"wrong");
    chips.querySelectorAll(".chip").forEach(x=>{x.disabled=true;x.style.outline="";if(+x.dataset.i===q.answer)x.classList.add("right");else if(+x.dataset.i===sel)x.classList.add("wrong")});
    chk.remove();finish(q,ok?1:0,q.options[sel],!ok)};
  body.append(line,chips,chk);
}
/* build */
function qBuild(q,body){
  const line=document.createElement("div");line.className="buildline";
  const pool=document.createElement("div");pool.className="chips";
  const hint=document.createElement("p");hint.className="hint";hint.textContent="Tap the tiles in order. Tap a word in the line to send it back.";
  const chk=document.createElement("button");chk.className="go";chk.textContent="Check";chk.disabled=true;
  let tiles=shuffle(q.answer.map((w,i)=>i));
  if(tiles.every((v,i)=>v===i))tiles.reverse();
  const placed=[];
  function draw(){line.innerHTML="";placed.forEach((ti,k)=>{const b=document.createElement("button");b.className="chip";b.textContent=q.answer[ti];b.onclick=()=>{sfx.tap();placed.splice(k,1);draw()};line.appendChild(b)});
    pool.querySelectorAll(".chip").forEach(b=>b.classList.toggle("ghost",placed.includes(+b.dataset.t)));chk.disabled=placed.length!==q.answer.length}
  tiles.forEach(ti=>{const b=document.createElement("button");b.className="chip";b.textContent=q.answer[ti];b.dataset.t=ti;b.onclick=()=>{if(placed.includes(ti))return;sfx.tap();placed.push(ti);draw()};pool.appendChild(b)});
  chk.onclick=()=>{const words=placed.map(t=>q.answer[t]);const orders=[q.answer].concat(q.alts||[]);
    let best=0,bestOrd=q.answer;orders.forEach(o=>{const n=words.filter((w,k)=>w===o[k]).length;if(n>best){best=n;bestOrd=o}});
    const full=best===q.answer.length,score=full?1:best>=q.answer.length/2?.5:0;
    line.querySelectorAll(".chip").forEach((b,k)=>{b.disabled=true;b.classList.add(words[k]===bestOrd[k]?"right":"wrong")});
    pool.remove();hint.remove();chk.remove();finish(q,score,words.join(" "),!full)};
  body.append(line,pool,hint,chk);draw();
}
/* fix + proof */
function qFix(q,body){
  const paper=document.createElement("div");paper.className="paper";
  const words=document.createElement("div");words.className="words";paper.appendChild(words);
  const errIdx=q.errors.map(e=>e.i);
  const st={misses:0,done:{},open:null};
  const info=document.createElement("p");info.className="hint";
  const fixbox=document.createElement("div");fixbox.className="fixbox";fixbox.hidden=true;
  const N=q.errors.length;
  function setInfo(t){info.innerHTML=(N>1?`<span class="counter">Fixed ${Object.keys(st.done).length} / ${N}</span> · `:"")+t}
  setInfo(N>1?"Tap a wrong word with your red pen 🖍️":"Tap the wrong word with your red pen 🖍️");
  const btns=q.words.map((w,i)=>{const b=document.createElement("button");b.className="w";b.textContent=w;
    b.onclick=()=>tapWord(i,b);words.appendChild(b);return b});
  function tapWord(i,b){
    if(st.open!==null||st.done[i]!==undefined)return;
    if(!errIdx.includes(i)){st.misses++;sfx.bad();buzz(30);b.classList.remove("miss");void b.offsetWidth;b.classList.add("miss");
      if(st.misses>=3){setInfo("Here they are! Now choose the fixes.");errIdx.forEach(k=>{if(st.done[k]===undefined)btns[k].classList.add("reveal")})}
      else setInfo(`“${esc(q.words[i])}” is fine. Look again 👀`);return}
    sfx.tap();b.classList.remove("reveal");b.classList.add("found","struck");st.open=i;
    const e=q.errors.find(x=>x.i===i);
    fixbox.hidden=false;fixbox.innerHTML=`<p>Replace “${esc(q.words[i])}” with:</p>`;
    const chips=document.createElement("div");chips.className="chips";
    shuffle(e.options.map((o,k)=>k)).forEach(k=>{const c=document.createElement("button");c.className="chip";c.textContent=e.options[k];
      c.onclick=()=>{const ok=k===e.answer;st.done[i]={ok,pick:e.options[k]};
        b.insertAdjacentHTML("beforeend",`<span class="fx ${ok?"ok":""}">${esc(e.options[e.answer])}</span>`);
        if(ok)sfx.tap();else sfx.bad();
        st.open=null;fixbox.hidden=true;
        if(Object.keys(st.done).length===N)done();else setInfo(st.misses>=3?"Fix the next highlighted word.":"Good! Find the next one.")};
      chips.appendChild(c)});
    fixbox.appendChild(chips);setInfo("Now pick the right word.");
  }
  function done(){
    btns.forEach(b=>b.disabled=true);
    const findCredit=st.misses===0?1:st.misses===1?.5:0;
    const fixCredit=q.errors.filter(e=>st.done[e.i].ok).length/N;
    const score=Math.round((findCredit*.5+fixCredit*.5)*100)/100;
    const yw=q.words.slice();q.errors.forEach(e=>yw[e.i]=st.done[e.i].pick);
    info.textContent=st.misses?`You tapped ${st.misses} correct word${st.misses>1?"s":""} by mistake.`:"";
    finish(q,score,(st.misses?"(found after "+st.misses+" miss"+(st.misses>1?"es":"")+") ":"")+yw.join(" "),score<1);
  }
  body.append(paper,info,fixbox);
}

/* ---------- RESULTS ---------- */
function results(){
  hideSheet();
  const n=R.qs.length,st=stars(R.score,n);
  R.onEnd&&R.onEnd(R.score);
  const d=today();if(S.last!==d){const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();S.streak=S.last===ys?S.streak+1:1;S.last=d}
  S.xp+=R.xp;save();
  const nxt=R.next&&R.next();
  app.innerHTML=`<div class="result">
    <div class="mascot" style="width:110px;height:110px">${penny(st>=2?"happy":st===1?"wow":"sad")}</div>
    <div class="bigstars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <h2>${st===3?"Superstar!":st===2?"Great work!":st===1?"Good try!":"Keep practising!"}</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><span class="pill">✅ ${+R.score.toFixed(2)} / ${n}</span><span class="pill">⚡ +${R.xp} XP</span><span class="pill">🔥 ${S.streak} day streak</span></div>
    <div class="btnrow"><button class="go white" id="again">↻ Play again</button><button class="go purple" id="nextb">${nxt?"Next stop ➜":"Done ➜"}</button></div>
    <div class="review">${R.log.map((r,k)=>`<div class="rv"><div class="t"><span>${k+1}. ${TYPE[r.q.type][0]}</span><span>${r.score===1?"✅":r.score>0?"🌗 ½":"❌"}</span></div>
      ${r.score===1?`<span class="ok">${esc(r.right)}</span>`:`<span class="you">Yours: ${esc(r.you)}</span><span class="ok">Right: ${esc(r.right)}</span><span style="color:var(--muted);font-size:.88rem">💡 ${r.q.rule}</span>`}</div>`).join("")}</div>
  </div>`;
  const ss=app.querySelectorAll(".bigstars span");for(let i=0;i<st;i++)setTimeout(()=>{ss[i].classList.add("on");tone([[600+i*200,.15]])},350+i*380);
  if(st===3)setTimeout(()=>{confetti();sfx.win()},1400);
  const cfg=R;
  app.querySelector("#again").onclick=()=>{const pool=cfg.qs;play(Object.assign({},cfg,{qs:shuffle(pool)}))};
  app.querySelector("#nextb").onclick=()=>nxt?nxt():cfg.back();
}

/* ---------- POCKET ---------- */
function pocket(){
  const ids=Object.keys(S.wrong).filter(id=>Q[id]);
  app.innerHTML=`${topnav("My Mistakes","Every question you missed waits here until you get it right")}
   ${ids.length?`<button class="go" id="prac" style="margin-bottom:14px">🎯 Practise ${Math.min(ids.length,10)} mistakes</button>
   <div class="list">${ids.slice(0,60).map(id=>{const q=Q[id],c=CH.find(x=>x.id===q.ch);return `<div class="rv"><div class="t"><span>${TYPE[q.type][0]}</span><small style="color:var(--muted)">${esc(c.title)}</small></div><span class="ok">${esc(correctSentence(q))}</span><span style="color:var(--muted);font-size:.9rem">💡 ${q.rule}</span></div>`}).join("")}</div>`
   :`<div class="empty"><div style="width:90px">${penny("happy")}</div><b>No mistakes saved.</b>Play a lesson. Anything you miss shows up here to practise again.</div>`}`;
  app.querySelector("#back").onclick=()=>go(home);
  const p=app.querySelector("#prac");if(p)p.onclick=()=>play({qs:shuffle(ids.map(i=>Q[i])).slice(0,10),title:"My Mistakes",onEnd:()=>{},back:()=>go(pocket)});
}
/* ---------- SKILLS ---------- */
function skills(){
  const names={};CH.forEach(c=>c.topics.forEach(t=>names[t.tag]=t.name));
  const rows=Object.entries(S.topic).filter(([t,v])=>v[1]>0).map(([t,v])=>({t,name:names[t]||t,p:v[0]/v[1],n:v[1]})).sort((a,b)=>a.p-b.p);
  app.innerHTML=`${topnav("My Skills","Weakest first, so you know what to practise")}
   ${rows.length?`<div class="list">${rows.map(r=>{const col=r.p>=.8?"var(--mint)":r.p>=.5?"var(--sun)":"var(--pen)";return `<div class="skill"><div class="row"><span>${esc(r.name)}</span><span>${Math.round(r.p*100)}%</span></div><div class="bar"><i style="width:${r.p*100}%;background:${col}"></i></div><small style="color:var(--muted)">${r.n} question${r.n>1?"s":""} · ${r.p>=.8?"🏅 Strong":r.p>=.5?"Getting there":"Practise this"}</small></div>`}).join("")}</div>`
   :`<div class="empty"><div style="width:90px">${penny("wow")}</div><b>No skills yet.</b>Finish a round and your grammar skills appear here.</div>`}`;
  app.querySelector("#back").onclick=()=>go(home);
}

window.ZQ_TEST={Q,run:ids=>play({qs:ids.map(i=>Q[i]),title:"test",onEnd:()=>{},back:()=>go(home)})};
home();
})();
</script>
</body>
