e":"A command begins with the verb (<b>Keep<\/b>); <b>keep<\/b> is followed by the <b>-ing<\/b> form."},{"qid":"c7-06-47","type":"chat","level":5,"topic":"gerund_infinitive","prompt":"Pick the correct reply.","chat":[["Anil","My cousins from Pune are coming to the exhibition."]],"options":["Great! I'm looking forward to meet them there.","Great! I'm looking forward to meeting them there.","Great! I'm looking forward meeting them there."],"answer":1,"rule":"In <b>look forward to<\/b>, <b>to<\/b> is a preposition, so use the <b>-ing<\/b> form: <b>to meeting<\/b>."},{"qid":"c7-06-48","type":"chat","level":5,"topic":"articles","prompt":"Pick the correct reply.","chat":[["Teacher","Where did Vivekananda give his famous speech?"]],"options":["He gave it in the Chicago, in the United States.","He gave it in Chicago, in the United States.","He gave it in Chicago, in United States."],"answer":1,"rule":"City names take no article (<b>Chicago<\/b>), but <b>the United States<\/b> always takes <b>the<\/b>."},{"qid":"c7-06-49","type":"change","level":5,"topic":"conditionals_1","prompt":"Join using 'if'.","source":"You talk to yourself every day. You will know yourself better.","options":["If you talk to yourself every day, you will know yourself better.","If you will talk to yourself every day, you will know yourself better.","If you talk to yourself every day, you knew yourself better."],"answer":0,"rule":"Type 1: <b>If + simple present<\/b> (talk), <b>will + base verb<\/b> (will know)."},{"qid":"c7-06-50","type":"change","level":5,"topic":"sentence_kinds","prompt":"Change into an imperative sentence.","source":"You should not miss a meeting with yourself.","options":["Not miss a meeting with yourself.","Do not missed a meeting with yourself.","Do not miss a meeting with yourself."],"answer":2,"rule":"A negative command starts with <b>Do not<\/b> + base verb, without a subject: <b>Do not miss<\/b>."}]},{"id":"07","num":"2.1","title":"From a Railway Carriage","unit":"Unit Two","topics":[{"tag":"simile","name":"Comparisons with like and as ... as"},{"tag":"degrees","name":"Degrees of comparison"},{"tag":"relative","name":"Relative pronouns who / which / that / whose"},{"tag":"here_there","name":"Here is / There are: agreement"},{"tag":"present_perfect","name":"Present perfect tense"}],"questions":[{"qid":"c7-07-01","type":"spot","level":1,"topic":"simile","prompt":"Which sentence is correct?","options":["The train ran as fast like the wind.","The train ran as faster as the wind.","The train ran as fast as the wind."],"answer":2,"rule":"A comparison of equals uses <b>as + adjective + as<\/b>: <b>as fast as<\/b>. Don't mix it with <b>like<\/b> or use -er."},{"qid":"c7-07-02","type":"spot","level":1,"topic":"here_there","prompt":"Which sentence is correct?","options":["There are two cows in the meadow.","There is two cows in the meadow.","There are two cow in the meadow."],"answer":0,"rule":"<b>Two cows<\/b> is plural, so use <b>There are<\/b> and the plural noun <b>cows<\/b>."},{"qid":"c7-07-03","type":"fix","level":1,"topic":"relative","prompt":"One word is wrong. Find it and fix it.","words":["I","waved","to","a","woman","which","was","selling","flowers","at","the","station."],"errors":[{"i":5,"options":["who","whom","whose"],"answer":0}],"rule":"For a person (a woman) use <b>who<\/b> as the subject: <b>a woman who was selling flowers<\/b>. <b>Which<\/b> is for things."},{"qid":"c7-07-04","type":"fix","level":1,"topic":"here_there","prompt":"One word is wrong. Find it and fix it.","words":["There","are","a","tramp","standing","near","the","gate."],"errors":[{"i":1,"options":["is","were","been"],"answer":0}],"rule":"<b>A tramp<\/b> is one person, so use <b>There is<\/b>: <b>There is a tramp standing near the gate.<\/b>"},{"qid":"c7-07-05","type":"fill","level":1,"topic":"simile","prompt":"Fill in the gap.","before":"The wind was as cold","after":"ice.","options":["like","than","as"],"answer":2,"rule":"<b>as ... as<\/b> always comes in a pair: <b>as cold as ice<\/b>."},{"qid":"c7-07-06","type":"fill","level":1,"topic":"present_perfect","prompt":"Fill in the gap.","before":"Meera","after":"just boarded the train.","options":["is","have","has"],"answer":2,"rule":"Present perfect = <b>has/have + past participle<\/b>. <b>Meera<\/b> is one person, so use <b>has<\/b>: <b>has just boarded<\/b>."},{"qid":"c7-07-07","type":"build","level":1,"topic":"present_perfect","prompt":"Make a sentence in the present perfect.","answer":["The","train","has","just","reached","Pune."],"alts":[],"rule":"<b>has + just + past participle<\/b> tells us something happened a moment ago: <b>has just reached<\/b>."},{"qid":"c7-07-08","type":"chat","level":1,"topic":"here_there","prompt":"Pick the correct reply.","chat":[["Aai","What can you see from the train window?"]],"options":["I can see a river. There is cows near it.","I can see a river. There are cows near it.","I can sees a river. There are cows near it."],"answer":1,"rule":"<b>Cows<\/b> is plural, so <b>There are cows<\/b>. After <b>can<\/b> use the base verb: <b>can see<\/b>."},{"qid":"c7-07-09","type":"chat","level":1,"topic":"simile","prompt":"Pick the correct reply.","chat":[["Kabir","How fast was the express train?"]],"options":["It was as fast than an arrow!","It was as fast as an arrow!","It was more fast as an arrow!"],"answer":1,"rule":"To say two things are equal, use <b>as fast as<\/b>. <b>Than<\/b> goes only with a comparative like <b>faster<\/b>."},{"qid":"c7-07-10","type":"change","level":1,"topic":"degrees","prompt":"Rewrite using 'not as ... as'.","source":"The bus is slower than the train.","options":["The bus is not as faster as the train.","The bus is not as fast as the train.","The bus is not as fast than the train."],"answer":1,"rule":"<b>slower than<\/b> = <b>not as fast as<\/b>. Keep the plain adjective between the two <b>as<\/b> words."},{"qid":"c7-07-11","type":"spot","level":2,"topic":"relative","prompt":"Pick the sentence with the correct relative pronoun.","options":["I saw a mill who stood by the river.","I saw a mill which stood by the river.","I saw a mill whom stood by the river."],"answer":1,"rule":"A mill is a thing, so use <b>which<\/b> (or that): <b>a mill which stood by the river<\/b>."},{"qid":"c7-07-12","type":"spot","level":2,"topic":"present_perfect","prompt":"Pick the sentence with the correct tense.","options":["We have already cross three bridges.","We has already crossed three bridges.","We have already crossed three bridges."],"answer":2,"rule":"Present perfect = <b>have/has + past participle<\/b>. With <b>We<\/b> use <b>have crossed<\/b>."},{"qid":"c7-07-13","type":"fix","level":2,"topic":"simile","prompt":"One word is wrong. Find it and fix it.","words":["The","old","horse","was","as","slow","than","a","snail."],"errors":[{"i":6,"options":["as","like","then"],"answer":0}],"rule":"<b>as ... as<\/b> is a pair: <b>as slow as a snail<\/b>. <b>Than<\/b> is used only after a comparative like <b>slower<\/b>."},{"qid":"c7-07-14","type":"fix","level":2,"topic":"present_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Arjun","has","never","see","a","windmill","before."],"errors":[{"i":3,"options":["saw","sees","seen"],"answer":2}],"rule":"After <b>has<\/b> we need the past participle: <b>has never seen<\/b>, not the base form <b>see<\/b>."},{"qid":"c7-07-15","type":"fill","level":2,"topic":"relative","prompt":"Fill in the gap.","before":"This is the cart","after":"ran away down the road.","options":["who","whose","which"],"answer":2,"rule":"A cart is a thing, so use <b>which<\/b>: <b>the cart which ran away<\/b>."},{"qid":"c7-07-16","type":"fill","level":2,"topic":"here_there","prompt":"Fill in the gap.","before":"Here","after":"the daisies for your garland.","options":["are","is","am"],"answer":0,"rule":"The real subject comes after <b>Here<\/b>: <b>the daisies<\/b> is plural, so <b>Here are the daisies<\/b>."},{"qid":"c7-07-17","type":"build","level":2,"topic":"relative","prompt":"Put the tiles in order.","answer":["We","waved","at","the","farmer","who","was","milking","cows."],"alts":[],"rule":"<b>who<\/b> comes right after the person it describes: <b>the farmer who was milking cows<\/b>."},{"qid":"c7-07-18","type":"chat","level":2,"topic":"present_perfect","prompt":"Pick the correct reply.","chat":[["Dad","Have you packed your bag for the trip?"]],"options":["Yes, I have packed it already.","Yes, I have pack it already.","Yes, I has packed it already."],"answer":0,"rule":"Answer a <b>Have you ...?<\/b> question with <b>I have + past participle<\/b>: <b>I have packed<\/b>."},{"qid":"c7-07-19","type":"change","level":2,"topic":"relative","prompt":"Join the sentences using 'who'.","source":"Here is a child. He is gathering brambles.","options":["Here is a child who he is gathering brambles.","Here is a child who is gathering brambles.","Here is a child which is gathering brambles."],"answer":1,"rule":"<b>who<\/b> replaces <b>He<\/b>, so drop the pronoun: <b>a child who is gathering brambles<\/b>."},{"qid":"c7-07-20","type":"change","level":2,"topic":"degrees","prompt":"Rewrite using 'not as ... as' without changing the meaning.","source":"The aeroplane is faster than the train.","options":["The train is not as faster as the aeroplane.","The aeroplane is not as fast as the train.","The train is not as fast as the aeroplane."],"answer":2,"rule":"Start with the slower one: <b>The train is not as fast as the aeroplane.<\/b> Swapping the nouns would change the meaning."},{"qid":"c7-07-21","type":"spot","level":3,"topic":"simile","prompt":"Which sentence is correct?","options":["The meadow was as green as an emerald.","The meadow was green as like an emerald.","The meadow was as greener as an emerald."],"answer":0,"rule":"Use the plain adjective inside <b>as ... as<\/b>: <b>as green as an emerald<\/b>."},{"qid":"c7-07-22","type":"spot","level":3,"topic":"here_there","prompt":"Which sentence is correct?","options":["There was many people at the station yesterday.","There were many people at the station yesterday.","There were many people at the station tomorrow."],"answer":1,"rule":"<b>Many people<\/b> is plural and <b>yesterday<\/b> is past, so use <b>There were<\/b>."},{"qid":"c7-07-23","type":"fix","level":3,"topic":"relative","prompt":"One word is wrong. Find it and fix it.","words":["The","girl","whose","bag","I","found","are","my","cousin."],"errors":[{"i":6,"options":["am","is","were"],"answer":1}],"rule":"The subject is <b>The girl<\/b> (one person), so the verb is <b>is<\/b>: <b>The girl whose bag I found is my cousin.<\/b>"},{"qid":"c7-07-24","type":"fix","level":3,"topic":"present_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Rohan","has","lived","in","Nashik","since","five","years."],"errors":[{"i":5,"options":["from","for","during"],"answer":1}],"rule":"Use <b>for<\/b> with a length of time (<b>for five years<\/b>) and <b>since<\/b> with a starting point (<b>since 2020<\/b>)."},{"qid":"c7-07-25","type":"fill","level":3,"topic":"present_perfect","prompt":"Fill in the gap.","before":"I","after":"this poem three times already.","options":["has read","had reading","have read"],"answer":2,"rule":"<b>already<\/b> goes with the present perfect. With <b>I<\/b> use <b>have read<\/b>."},{"qid":"c7-07-26","type":"build","level":3,"topic":"present_perfect","prompt":"Make a question.","answer":["Have","you","ever","seen","stars","like","these?"],"alts":[],"rule":"Present perfect question: <b>Have + you + ever + past participle<\/b>: <b>Have you ever seen ...?<\/b>"},{"qid":"c7-07-27","type":"build","level":3,"topic":"relative","prompt":"Put the tiles in order.","answer":["This","is","the","bridge","that","Grandpa","built."],"alts":[],"rule":"<b>that<\/b> joins the extra detail to <b>the bridge<\/b>: <b>the bridge that Grandpa built<\/b>."},{"qid":"c7-07-28","type":"chat","level":3,"topic":"relative","prompt":"Pick the correct reply.","chat":[["Teacher","Who was R. L. Stevenson?"]],"options":["He was a Scottish writer who wrote Treasure Island.","He was a Scottish writer which wrote Treasure Island.","He was a Scottish writer who write Treasure Island."],"answer":0,"rule":"A writer is a person, so use <b>who<\/b>; the action is past, so <b>who wrote<\/b>."},{"qid":"c7-07-29","type":"chat","level":3,"topic":"here_there","prompt":"Pick the correct reply.","chat":[["Neha","Is there a shop near the station?"]],"options":["Yes, there are a small tea stall next to it.","Yes, there is a small tea stall next of it.","Yes, there is a small tea stall next to it."],"answer":2,"rule":"<b>A small tea stall<\/b> is singular, so <b>there is<\/b>. The phrase is <b>next to<\/b>, not next of."},{"qid":"c7-07-30","type":"change","level":3,"topic":"present_perfect","prompt":"Change into a negative sentence.","source":"Ravi has finished his homework.","options":["Ravi has not finish his homework.","Ravi did not finished his homework.","Ravi has not finished his homework."],"answer":2,"rule":"Put <b>not<\/b> after <b>has<\/b> and keep the past participle: <b>has not finished<\/b>."},{"qid":"c7-07-31","type":"spot","level":4,"topic":"degrees","prompt":"Which sentence is correct?","options":["This is the best journey I have ever had.","This is the most good journey I have ever had.","This is the best journey I have ever have."],"answer":0,"rule":"<b>good - better - best<\/b> is irregular. With <b>ever<\/b> use the present perfect: <b>I have ever had<\/b>."},{"qid":"c7-07-32","type":"spot","level":4,"topic":"simile","prompt":"Which sentence is correct?","options":["The children were as busy as bees.","The children were as busy as a bees.","The children was as busy as bees."],"answer":0,"rule":"<b>Children<\/b> is plural, so <b>were<\/b>. <b>A<\/b> cannot go with the plural <b>bees<\/b>: <b>as busy as bees<\/b>."},{"qid":"c7-07-33","type":"fix","level":4,"topic":"relative","prompt":"One word is wrong. Find it and fix it.","words":["All","the","stations","which","we","passed","was","painted","blue."],"errors":[{"i":6,"options":["is","were","has"],"answer":1}],"rule":"The subject is <b>All the stations<\/b> (plural), so the verb is <b>were<\/b>, even after the <b>which<\/b> clause."},{"qid":"c7-07-34","type":"fix","level":4,"topic":"present_perfect","prompt":"One word is wrong. Find it and fix it.","words":["You","have","seen","the","Taj","Mahal,","didn't","you?"],"errors":[{"i":6,"options":["hasn't","haven't","weren't"],"answer":1}],"rule":"The tag uses the same helper as the sentence: <b>You have seen ...<\/b> takes <b>haven't you?<\/b>"},{"qid":"c7-07-35","type":"fill","level":4,"topic":"degrees","prompt":"Fill in the gap.","before":"Of all the sights, the river was the","after":"beautiful.","options":["more","most","very"],"answer":1,"rule":"<b>Of all<\/b> compares more than two things, so use the superlative: <b>the most beautiful<\/b>."},{"qid":"c7-07-36","type":"fill","level":4,"topic":"present_perfect","prompt":"Fill in the gap.","before":"We","after":"the Konkan Railway last year.","options":["have travelled on","has travelled on","travelled on"],"answer":2,"rule":"<b>Last year<\/b> is a finished past time, so use the simple past <b>travelled<\/b>, not the present perfect."},{"qid":"c7-07-37","type":"build","level":4,"topic":"degrees","prompt":"Put the tiles in order.","answer":["An","aeroplane","flies","higher","than","birds."],"alts":[],"rule":"Comparing two things: <b>comparative + than<\/b>: <b>flies higher than birds<\/b>."},{"qid":"c7-07-38","type":"chat","level":4,"topic":"degrees","prompt":"Pick the correct reply.","chat":[["Kabir","Which is longer, the bridge or the tunnel?"]],"options":["The tunnel is longer than the bridge.","The tunnel is more longer than the bridge.","The tunnel is longest than the bridge."],"answer":0,"rule":"For two things use the comparative <b>longer than<\/b>. Never add <b>more<\/b> to an -er word."},{"qid":"c7-07-39","type":"change","level":4,"topic":"degrees","prompt":"Change into the comparative degree.","source":"No other river in India is as long as the Ganga.","options":["The Ganga is longest than any other river in India.","The Ganga is longer than any other river in India.","The Ganga is more longer than any other river in India."],"answer":1,"rule":"Positive <b>No other ... as long as<\/b> becomes comparative <b>longer than any other<\/b>."},{"qid":"c7-07-40","type":"change","level":4,"topic":"relative","prompt":"Join the sentences using 'which'.","source":"We crossed a bridge. It was very old.","options":["We crossed a bridge which it was very old.","We crossed a bridge who was very old.","We crossed a bridge which was very old."],"answer":2,"rule":"<b>which<\/b> replaces <b>It<\/b>, so don't repeat the pronoun: <b>a bridge which was very old<\/b>."},{"qid":"c7-07-41","type":"spot","level":5,"topic":"present_perfect","prompt":"Pick the sentence with the correct tense.","options":["Grandpa has worked at the station since 1995.","Grandpa has worked at the station for 1995.","Grandpa is working at the station since 1995."],"answer":0,"rule":"<b>since<\/b> + a starting point (<b>1995<\/b>) goes with the present perfect <b>has worked<\/b>; <b>for<\/b> needs a length of time."},{"qid":"c7-07-42","type":"spot","level":5,"topic":"relative","prompt":"Pick the sentence with the correct relative pronoun.","options":["That is the boy who's kite got stuck in the tree.","That is the boy whose kite got stuck in the tree.","That is the boy whom kite got stuck in the tree."],"answer":1,"rule":"<b>whose<\/b> shows ownership (the boy's kite). <b>who's<\/b> means <b>who is<\/b>."},{"qid":"c7-07-43","type":"fix","level":5,"topic":"degrees","prompt":"One word is wrong. Find it and fix it.","words":["This","is","one","of","the","longest","bridge","in","Asia."],"errors":[{"i":6,"options":["bridge's","bridges","bridged"],"answer":1}],"rule":"<b>one of the + superlative<\/b> is always followed by a plural noun: <b>one of the longest bridges<\/b>."},{"qid":"c7-07-44","type":"fix","level":5,"topic":"here_there","prompt":"One word is wrong. Find it and fix it.","words":["Look,","here","comes","Rani's","two","brothers","with","their","kites."],"errors":[{"i":2,"options":["coming","come","arrives"],"answer":1}],"rule":"After <b>here<\/b> the subject comes after the verb: <b>Rani's two brothers<\/b> is plural, so <b>here come Rani's two brothers<\/b>."},{"qid":"c7-07-45","type":"fill","level":5,"topic":"relative","prompt":"Fill in the gap.","before":"The man","after":"cart ran away was very upset.","options":["who","which","whose"],"answer":2,"rule":"The cart belongs to the man, so use the possessive <b>whose<\/b>: <b>The man whose cart ran away<\/b>."},{"qid":"c7-07-46","type":"build","level":5,"topic":"present_perfect","prompt":"Make a question.","answer":["How","long","have","you","lived","in","Pune?"],"alts":[],"rule":"<b>How long<\/b> + present perfect asks about time up to now: <b>How long have you lived ...?<\/b>"},{"qid":"c7-07-47","type":"chat","level":5,"topic":"present_perfect","prompt":"Pick the correct reply.","chat":[["Riya","Have you ever travelled on a toy train?"]],"options":["Yes, I have travelled on one in Matheran last May.","Yes, I travel on one in Matheran last May.","Yes, I travelled on one in Matheran last May."],"answer":2,"rule":"A question with <b>ever<\/b> uses the present perfect, but a fixed past time (<b>last May<\/b>) needs the simple past: <b>I travelled<\/b>."},{"qid":"c7-07-48","type":"chat","level":5,"topic":"degrees","prompt":"Pick the correct reply.","chat":[["Aman","What was the most exciting part of your trip?"]],"options":["The tunnel, which was darker than night, was the most exciting part.","The tunnel, which was more darker than night, was the most exciting part.","The tunnel, who was darker than night, was the most exciting part."],"answer":0,"rule":"Use <b>darker than<\/b> (never more darker) and <b>which<\/b> for a thing like a tunnel."},{"qid":"c7-07-49","type":"change","level":5,"topic":"degrees","prompt":"Change into the superlative degree.","source":"Very few sights are as lovely as a rainbow.","options":["A rainbow is one of the loveliest sight.","A rainbow is one of the loveliest sights.","A rainbow is one of the most loveliest sights."],"answer":1,"rule":"<b>Very few ... as lovely as<\/b> becomes <b>one of the loveliest + plural noun<\/b>: <b>one of the loveliest sights<\/b>."},{"qid":"c7-07-50","type":"change","level":5,"topic":"present_perfect","prompt":"Change into a question.","source":"The train has left the station.","options":["Has the train left the station?","Has the train leave the station?","Did the train has left the station?"],"answer":0,"rule":"Move <b>has<\/b> before the subject and keep the past participle: <b>Has the train left ...?<\/b>"}]},{"id":"08","num":"2.2","title":"The Souvenir","unit":"Unit Two","topics":[{"tag":"collective","name":"Collective nouns"},{"tag":"punctuation","name":"Punctuation, exclamations and hyphenated words"},{"tag":"past_perfect","name":"Past perfect tense"},{"tag":"reported","name":"Reported speech (statements)"},{"tag":"modals","name":"Modals: would like, have to, must, should, might"}],"questions":[{"qid":"c7-08-01","type":"spot","level":1,"topic":"collective","prompt":"Pick the sentence with the correct collective noun.","options":["A fleet of bees flew past the window.","A bunch of bees flew past the window.","A swarm of bees flew past the window."],"answer":2,"rule":"We say <b>a swarm of bees<\/b>. A <b>fleet<\/b> is for ships and a <b>bunch<\/b> is for grapes, keys or flowers."},{"qid":"c7-08-02","type":"spot","level":1,"topic":"punctuation","prompt":"Pick the correct exclamation.","options":["What a beautiful view of the earth!","What an beautiful view of the earth!","How a beautiful view of the earth!"],"answer":0,"rule":"An exclamation can start with <b>What a + adjective + noun<\/b>: <b>What a beautiful view!<\/b> It ends with <b>!<\/b>"},{"qid":"c7-08-03","type":"fix","level":1,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Sayali","had","already","pack","her","bag","when","the","bus","came."],"errors":[{"i":3,"options":["packing","packs","packed"],"answer":2}],"rule":"Past perfect = <b>had + past participle<\/b>: <b>had already packed<\/b>."},{"qid":"c7-08-04","type":"fix","level":1,"topic":"modals","prompt":"One word is wrong. Find it and fix it.","words":["You","must","follows","the","rules","inside","the","settlement."],"errors":[{"i":2,"options":["follow","following","followed"],"answer":0}],"rule":"After a modal like <b>must<\/b>, use the base verb: <b>must follow<\/b>."},{"qid":"c7-08-05","type":"fill","level":1,"topic":"collective","prompt":"Choose the correct collective noun.","before":"The farmer has a large","after":"of cattle.","options":["flock","swarm","herd"],"answer":2,"rule":"We say <b>a herd of cattle<\/b>, <b>a flock of sheep<\/b> and <b>a swarm of bees<\/b>."},{"qid":"c7-08-06","type":"fill","level":1,"topic":"modals","prompt":"Fill in the gap.","before":"I","after":"like to visit the moon one day.","options":["will","would","am"],"answer":1,"rule":"<b>would like to<\/b> is the polite way to say what you want: <b>I would like to visit ...<\/b>"},{"qid":"c7-08-07","type":"build","level":1,"topic":"reported","prompt":"Put the tiles in order.","answer":["She","said","that","she","was","tired."],"alts":[],"rule":"Reported speech: <b>said that<\/b> + subject + past verb: <b>She said that she was tired.<\/b>"},{"qid":"c7-08-08","type":"chat","level":1,"topic":"modals","prompt":"Pick the correct reply.","chat":[["Teacher","Can we go outside the dome without space suits?"]],"options":["No, we have to wear space suits outside.","No, we has to wear space suits outside.","No, we have to wearing space suits outside."],"answer":0,"rule":"<b>have to<\/b> + base verb shows a rule: <b>we have to wear<\/b>. Use <b>has to<\/b> only with he/she/it."},{"qid":"c7-08-09","type":"chat","level":1,"topic":"collective","prompt":"Pick the correct reply.","chat":[["Neha","What did you see at the circus?"]],"options":["We saw a team of gymnast doing high jumps.","We saw a teams of gymnasts doing high jumps.","We saw a team of gymnasts doing high jumps."],"answer":2,"rule":"<b>a team of<\/b> + plural noun: <b>a team of gymnasts<\/b>. <b>A<\/b> cannot go with <b>teams<\/b>."},{"qid":"c7-08-10","type":"change","level":1,"topic":"reported","prompt":"Change into indirect speech.","source":"Sayali said, \"I am excited.\"","options":["Sayali said that she was excited.","Sayali said that I was excited.","Sayali said that she were excited."],"answer":0,"rule":"<b>I<\/b> becomes <b>she<\/b>, and <b>am<\/b> moves back to <b>was<\/b>: <b>Sayali said that she was excited.<\/b>"},{"qid":"c7-08-11","type":"spot","level":2,"topic":"past_perfect","prompt":"Pick the sentence with the correct tense.","options":["The shuttle had landed before the sun rose.","The shuttle had land before the sun rose.","The shuttle has landed before the sun rose."],"answer":0,"rule":"The earlier of two past actions takes <b>had + past participle<\/b>: <b>had landed<\/b> before the sun <b>rose<\/b>."},{"qid":"c7-08-12","type":"spot","level":2,"topic":"modals","prompt":"Which sentence is correct?","options":["You should listens to the receptionist.","You should listen to the receptionist.","You should to listen to the receptionist."],"answer":1,"rule":"After <b>should<\/b> use the base verb with no <b>to<\/b>: <b>should listen<\/b>."},{"qid":"c7-08-13","type":"fix","level":2,"topic":"collective","prompt":"One word is wrong. Find it and fix it.","words":["There","were","three","flock","of","sheep","on","the","hill."],"errors":[{"i":3,"options":["flock's","flocks","flocking"],"answer":1}],"rule":"Collective nouns have plurals too: <b>three flocks of sheep<\/b>, just like <b>herds<\/b> and <b>teams<\/b>."},{"qid":"c7-08-14","type":"fix","level":2,"topic":"reported","prompt":"One word is wrong. Find it and fix it.","words":["Ravi","said","that","him","was","very","hungry."],"errors":[{"i":3,"options":["his","himself","he"],"answer":2}],"rule":"The subject of <b>was<\/b> needs the subject pronoun <b>he<\/b>, not <b>him<\/b>: <b>Ravi said that he was very hungry.<\/b>"},{"qid":"c7-08-15","type":"fill","level":2,"topic":"past_perfect","prompt":"Fill in the gap.","before":"When Sayali opened her tiffin box, her little brother","after":"already eaten the laddoos.","options":["has","have","had"],"answer":2,"rule":"The brother ate first, before Sayali opened the box, so use the past perfect: <b>had already eaten<\/b>."},{"qid":"c7-08-16","type":"fill","level":2,"topic":"modals","prompt":"Fill in the gap.","before":"You","after":"not buy anything from unauthorised shops.","options":["should","has","have"],"answer":0,"rule":"<b>should not<\/b> + base verb gives advice: <b>You should not buy ...<\/b> <b>has/have not buy<\/b> is wrong."},{"qid":"c7-08-17","type":"build","level":2,"topic":"modals","prompt":"Put the tiles in order.","answer":["We","have","to","carry","our","oxygen","masks."],"alts":[],"rule":"<b>have to<\/b> + base verb shows something necessary: <b>We have to carry ...<\/b>"},{"qid":"c7-08-18","type":"chat","level":2,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Mummy","Why didn't you call me from the moon?"]],"options":["Sorry, I had forget my phone at the base.","Sorry, I had forgotten my phone at the base.","Sorry, I have forgotten my phone at the base yesterday."],"answer":1,"rule":"Past perfect = <b>had + past participle<\/b>: <b>had forgotten<\/b>. <b>Yesterday<\/b> never goes with <b>have forgotten<\/b>."},{"qid":"c7-08-19","type":"change","level":2,"topic":"reported","prompt":"Change into indirect speech.","source":"The teacher said, \"Sayali is a good student.\"","options":["The teacher said that Sayali is being a good student.","The teacher said that Sayali was a good student.","The teacher told that Sayali was a good student."],"answer":1,"rule":"After <b>said<\/b>, <b>is<\/b> moves back to <b>was<\/b>. <b>Told<\/b> needs a person after it (told us)."},{"qid":"c7-08-20","type":"change","level":2,"topic":"collective","prompt":"Change the subject into the plural.","source":"The team is practising.","options":["The teams are practising.","The teams is practising.","The team are practisings."],"answer":0,"rule":"The plural of <b>team<\/b> is <b>teams<\/b>, and a plural subject takes <b>are<\/b>: <b>The teams are practising.<\/b>"},{"qid":"c7-08-21","type":"spot","level":3,"topic":"punctuation","prompt":"Pick the correct exclamation.","options":["How bright the stars are!","How bright the stars is!","What bright the stars are!"],"answer":0,"rule":"<b>How + adjective + subject + verb!<\/b>: <b>How bright the stars are!<\/b> Plural <b>stars<\/b> takes <b>are<\/b>."},{"qid":"c7-08-22","type":"spot","level":3,"topic":"past_perfect","prompt":"Pick the sentence with the correct tense.","options":["By the time the bell rang, we had finished the test.","By the time the bell rang, we have finished the test.","By the time the bell rang, we had finish the test."],"answer":0,"rule":"<b>By the time<\/b> + past: the earlier action takes <b>had + past participle<\/b>: <b>had finished<\/b>."},{"qid":"c7-08-23","type":"fix","level":3,"topic":"modals","prompt":"One word is wrong. Find it and fix it.","words":["The","children","might","fell","if","they","run","outside."],"errors":[{"i":3,"options":["fallen","falling","fall"],"answer":2}],"rule":"After <b>might<\/b> use the base verb: <b>might fall<\/b>."},{"qid":"c7-08-24","type":"fix","level":3,"topic":"reported","prompt":"One word is wrong. Find it and fix it.","words":["Sayali","told","her","mother","that","she","have","bought","earrings","the","day","before."],"errors":[{"i":6,"options":["had","has","having"],"answer":0}],"rule":"After <b>told<\/b> (past), the earlier action moves to the past perfect: <b>she had bought earrings the day before<\/b>."},{"qid":"c7-08-25","type":"fill","level":3,"topic":"collective","prompt":"Choose the correct collective noun.","before":"A","after":"of grapes lay on the table.","options":["herd","fleet","bunch"],"answer":2,"rule":"We say <b>a bunch of grapes<\/b>, <b>a herd of cattle<\/b> and <b>a fleet of ships<\/b>."},{"qid":"c7-08-26","type":"build","level":3,"topic":"punctuation","prompt":"Make an exclamation.","answer":["Oh","dear,","these","earrings","are","heavy!"],"alts":[],"rule":"An interjection like <b>Oh dear,<\/b> starts the sentence, and the exclamation ends with <b>!<\/b>"},{"qid":"c7-08-27","type":"build","level":3,"topic":"past_perfect","prompt":"Put the tiles in order.","answer":["She","had","never","seen","such","bright","stars."],"alts":[],"rule":"<b>had never + past participle<\/b>: <b>had never seen<\/b>. <b>such<\/b> comes before the adjective + noun."},{"qid":"c7-08-28","type":"chat","level":3,"topic":"reported","prompt":"Pick the correct reply.","chat":[["Riya","What did the receptionist say?"]],"options":["She said that the shops outside was not safe.","She said that the shops outside were not safe.","She said to that the shops outside were not safe."],"answer":1,"rule":"<b>The shops<\/b> is plural, so <b>were<\/b>. Write <b>said that<\/b>, not <b>said to that<\/b>."},{"qid":"c7-08-29","type":"chat","level":3,"topic":"modals","prompt":"Pick the correct reply.","chat":[["Aman","Would you like some juice?"]],"options":["Yes, please. I would loves some.","Yes, please. I would to love some.","Yes, please. I would love some."],"answer":2,"rule":"After <b>would<\/b> use the base verb with no <b>to<\/b>: <b>I would love some.<\/b>"},{"qid":"c7-08-30","type":"change","level":3,"topic":"past_perfect","prompt":"Join the sentences using 'after'.","source":"The shuttle landed. Then the door was opened.","options":["The door was opened after the shuttle has landed.","The door was opened after the shuttle had landed.","The door had opened after the shuttle was landed."],"answer":1,"rule":"The earlier action (landing) takes the past perfect: <b>after the shuttle had landed<\/b>."},{"qid":"c7-08-31","type":"spot","level":4,"topic":"collective","prompt":"Which sentence is correct?","options":["A army of ants marched across the floor.","An army of ant marched across the floor.","An army of ants marched across the floor."],"answer":2,"rule":"<b>army<\/b> starts with a vowel sound, so <b>an army<\/b>; it is followed by the plural <b>ants<\/b>."},{"qid":"c7-08-32","type":"spot","level":4,"topic":"reported","prompt":"Which sentence is correct?","options":["Neha said that her grandmother live in Kolkata.","Neha said that her grandmother lived in Kolkata.","Neha said that she grandmother lived in Kolkata."],"answer":1,"rule":"After <b>said<\/b> the verb moves to the past: <b>lived<\/b>. Before a noun use the possessive <b>her<\/b>."},{"qid":"c7-08-33","type":"fix","level":4,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Neha","was","sad","because","she","have","lost","her","new","pen."],"errors":[{"i":5,"options":["having","had","was"],"answer":1}],"rule":"She lost the pen before she felt sad, so use the past perfect: <b>had lost<\/b>. <b>She have<\/b> is never correct."},{"qid":"c7-08-34","type":"fix","level":4,"topic":"modals","prompt":"One word is wrong. Find it and fix it.","words":["Sayali","had","to","ran","to","catch","up","with","her","friends."],"errors":[{"i":3,"options":["running","runs","run"],"answer":2}],"rule":"<b>had to<\/b> + base verb: <b>had to run<\/b>. The past is shown by <b>had<\/b>, not by the main verb."},{"qid":"c7-08-35","type":"fill","level":4,"topic":"reported","prompt":"Fill in the gap.","before":"Dad said that he","after":"tired after work.","options":["were","be","was"],"answer":2,"rule":"After <b>said<\/b> use the past, and <b>he<\/b> takes <b>was<\/b>: <b>he was tired<\/b>."},{"qid":"c7-08-36","type":"fill","level":4,"topic":"collective","prompt":"Fill in the gap.","before":"Many","after":"of birds visit our lake in winter.","options":["flock","flocks","flock's"],"answer":1,"rule":"<b>Many<\/b> needs a plural noun: <b>many flocks of birds<\/b>."},{"qid":"c7-08-37","type":"build","level":4,"topic":"modals","prompt":"Make a rule.","answer":["Children","must","not","run","on","the","moon."],"alts":[],"rule":"<b>must not<\/b> + base verb tells us something is not allowed: <b>must not run<\/b>."},{"qid":"c7-08-38","type":"chat","level":4,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Riya","Did you watch the circus on Sunday?"]],"options":["No, it had ended before we got there.","No, it has ended before we got there.","No, it had end before we got there."],"answer":0,"rule":"The circus ended first, so use <b>had ended<\/b> before the simple past <b>got there<\/b>."},{"qid":"c7-08-39","type":"change","level":4,"topic":"reported","prompt":"Change into indirect speech.","source":"Sayali said, \"I am buying earrings for my mother.\"","options":["Sayali said that she was buying earrings for her mother.","Sayali said that she was buying earrings for my mother.","Sayali said that she was buy earrings for her mother."],"answer":0,"rule":"<b>I<\/b> and <b>my<\/b> become <b>she<\/b> and <b>her<\/b>; <b>am buying<\/b> becomes <b>was buying<\/b>."},{"qid":"c7-08-40","type":"change","level":4,"topic":"modals","prompt":"Change into a negative sentence.","source":"We have to pay for the tour.","options":["We do not has to pay for the tour.","We does not have to pay for the tour.","We do not have to pay for the tour."],"answer":2,"rule":"<b>have to<\/b> makes its negative with <b>do not<\/b>: <b>We do not have to pay.<\/b>"},{"qid":"c7-08-41","type":"spot","level":5,"topic":"past_perfect","prompt":"Pick the sentence with the correct tenses.","options":["Sayali realise her mistake only after her mother had held the earrings.","Sayali realised her mistake only after her mother had held the earrings.","Sayali realised her mistake only after her mother had hold the earrings."],"answer":1,"rule":"The main action is simple past <b>realised<\/b>; the earlier one is <b>had + past participle<\/b>: <b>had held<\/b>."},{"qid":"c7-08-42","type":"spot","level":5,"topic":"punctuation","prompt":"Which sentence is correct?","options":["They went on a three-day trip to the moon.","They went on a three-days trip to the moon.","They went on an three-day trip to the moon."],"answer":0,"rule":"A hyphenated number + noun before a noun stays singular: <b>a three-day trip<\/b>, not three-days."},{"qid":"c7-08-43","type":"fix","level":5,"topic":"reported","prompt":"One word is wrong. Find it and fix it.","words":["The","guide","told","us","that","Armstrong","has","landed","there","long","ago."],"errors":[{"i":6,"options":["have","having","had"],"answer":2}],"rule":"After <b>told<\/b> (past), an earlier past action takes the past perfect: <b>had landed<\/b>."},{"qid":"c7-08-44","type":"fix","level":5,"topic":"collective","prompt":"One word is wrong. Find it and fix it.","words":["A","pack","of","wolf","was","howling","in","the","dark","forest."],"errors":[{"i":3,"options":["wolfs","wolves","wolf's"],"answer":1}],"rule":"<b>a pack of<\/b> + plural noun. The plural of <b>wolf<\/b> is <b>wolves<\/b> (f changes to ves)."},{"qid":"c7-08-45","type":"fill","level":5,"topic":"modals","prompt":"Fill in the gap.","before":"If you go outside without a space suit, you","after":"get hurt.","options":["might","ought","have"],"answer":0,"rule":"<b>might<\/b> + base verb shows a possibility: <b>you might get hurt<\/b>. <b>ought<\/b> and <b>have<\/b> need <b>to<\/b>."},{"qid":"c7-08-46","type":"build","level":5,"topic":"reported","prompt":"Put the tiles in order.","answer":["Mummy","said","that","the","earrings","were","too","heavy","for","her."],"alts":[],"rule":"Reported speech: <b>said that<\/b> + subject + past verb: <b>the earrings were too heavy<\/b>."},{"qid":"c7-08-47","type":"chat","level":5,"topic":"reported","prompt":"Pick the correct reply.","chat":[["Neha","What did your mother say about the trip?"]],"options":["She said that it was too expensive but I should go.","She said that it were too expensive but I should go.","She said me that it was too expensive but I should go."],"answer":0,"rule":"<b>It<\/b> takes <b>was<\/b>. <b>Said<\/b> is not followed by a person: say <b>said that<\/b> or <b>told me that<\/b>."},{"qid":"c7-08-48","type":"chat","level":5,"topic":"collective","prompt":"Pick the correct reply.","chat":[["Teacher","What did you see in the sky from the moon?"]],"options":["I saw a galaxy of star and a shining earth.","I saw an galaxy of stars and a shining earth.","I saw a galaxy of stars and a shining earth."],"answer":2,"rule":"<b>a galaxy of<\/b> + plural noun: <b>a galaxy of stars<\/b>. <b>galaxy<\/b> starts with a consonant sound, so <b>a<\/b>."},{"qid":"c7-08-49","type":"change","level":5,"topic":"punctuation","prompt":"Change into an exclamatory sentence.","source":"The view is very beautiful.","options":["What a beautiful view it is!","How a beautiful view it is!","What a beautiful view is it!"],"answer":0,"rule":"<b>What a + adjective + noun + subject + verb!<\/b>: <b>What a beautiful view it is!<\/b> (not is it)."},{"qid":"c7-08-50","type":"change","level":5,"topic":"past_perfect","prompt":"Join the sentences using 'before'.","source":"Sayali paid for the earrings. Then she ran to her friends.","options":["Sayali paid for the earrings before she had ran to her friends.","Sayali had paid for the earrings before she ran to her friends.","Sayali had pay for the earrings before she ran to her friends."],"answer":1,"rule":"The first action (paying) takes <b>had paid<\/b>; the later one stays in the simple past: <b>ran<\/b>."}]},{"id":"09","num":"2.3","title":"Abdul Becomes a Courtier","unit":"Unit Two","topics":[{"tag":"abstract","name":"Abstract nouns and noun forms"},{"tag":"plurals","name":"Irregular plurals (children, men, feet, mice, sheep)"},{"tag":"passive","name":"Passive voice (simple present and past)"},{"tag":"requests","name":"Polite requests: May I / Could you / Would you mind"},{"tag":"tags","name":"Question tags"}],"questions":[{"qid":"c7-09-01","type":"spot","level":1,"topic":"plurals","prompt":"Which sentence is correct?","options":["The mouses ran into the library.","The mice runs into the library.","The mice ran into the library."],"answer":2,"rule":"The plural of <b>mouse<\/b> is <b>mice<\/b>. A plural subject does not take -s on the verb."},{"qid":"c7-09-02","type":"spot","level":1,"topic":"abstract","prompt":"Which sentence is correct?","options":["Abdul showed great patient.","Abdul showed great patience.","Abdul showed great patiently."],"answer":1,"rule":"After <b>showed great<\/b> we need a noun. <b>Patience<\/b> is the abstract noun; patient is an adjective."},{"qid":"c7-09-03","type":"fix","level":1,"topic":"plurals","prompt":"One word is wrong. Find it and fix it.","words":["Two","child","were","reading","in","the","library."],"errors":[{"i":1,"options":["children","childs","childes"],"answer":0}],"rule":"<b>Two<\/b> needs a plural. The plural of <b>child<\/b> is <b>children<\/b>."},{"qid":"c7-09-04","type":"fix","level":1,"topic":"abstract","prompt":"One word is wrong. Find it and fix it.","words":["His","honest","won","him","the","Emperor's","trust."],"errors":[{"i":1,"options":["honesty","honestly","honester"],"answer":0}],"rule":"After <b>His<\/b> we need a noun. The abstract noun of <b>honest<\/b> is <b>honesty<\/b>."},{"qid":"c7-09-05","type":"fill","level":1,"topic":"plurals","prompt":"Fill in the gap.","before":"The Emperor had many wise","after":"in his court.","options":["man","mans","men"],"answer":2,"rule":"<b>Many<\/b> needs a plural. The plural of <b>man<\/b> is <b>men<\/b>."},{"qid":"c7-09-06","type":"fill","level":1,"topic":"requests","prompt":"Fill in the gap.","before":"","after":"you please help me carry these books?","options":["Are","Have","Could"],"answer":2,"rule":"<b>Could you please + base verb<\/b> makes a polite request: <b>Could you please help me ...?<\/b>"},{"qid":"c7-09-07","type":"build","level":1,"topic":"requests","prompt":"Ask for permission politely.","answer":["May","I","read","your","books,","sir?"],"alts":[],"rule":"<b>May I + base verb<\/b> asks for permission: <b>May I read your books, sir?<\/b>"},{"qid":"c7-09-08","type":"chat","level":1,"topic":"requests","prompt":"Pick the correct reply.","chat":[["Father","What do you need, Abdul?"]],"options":["Could you please buys me a few books?","Could you please buy me a few books?","Could you please buying me a few books?"],"answer":1,"rule":"<b>Could you please + base verb<\/b> makes a polite request: <b>Could you please buy ...?<\/b>"},{"qid":"c7-09-09","type":"chat","level":1,"topic":"plurals","prompt":"Pick the correct reply.","chat":[["Minister","How many birds are there in the Murgikhana?"]],"options":["There are fifty hens and ten gooses.","There are fifty hens and ten geese.","There is fifty hens and ten geese."],"answer":1,"rule":"The plural of <b>goose<\/b> is <b>geese<\/b>. Plural nouns take <b>There are<\/b>."},{"qid":"c7-09-10","type":"change","level":1,"topic":"passive","prompt":"Change into passive voice.","source":"Abdul fed the hens.","options":["The hens was fed by Abdul.","The hens were fed by Abdul.","The hens were feed by Abdul."],"answer":1,"rule":"Simple past passive = <b>was/were + past participle<\/b>. <b>Hens<\/b> is plural: <b>were fed<\/b>."},{"qid":"c7-09-11","type":"spot","level":2,"topic":"passive","prompt":"Which sentence is correct?","options":["The books were covered with silk.","The books was covered with silk.","The books were cover with silk."],"answer":0,"rule":"Passive = <b>be + past participle<\/b>. Plural <b>books<\/b> takes <b>were<\/b>: <b>were covered<\/b>."},{"qid":"c7-09-12","type":"spot","level":2,"topic":"tags","prompt":"Pick the correct question tag.","options":["Abdul is a scholar, is he?","Abdul is a scholar, doesn't he?","Abdul is a scholar, isn't he?"] xible.","The yoga teacher are very flexible."],"answer":1,"rule":"Replace <b>How<\/b> with <b>very<\/b>, use statement order and a full stop: <b>The yoga teacher is very flexible.<\/b>"}]},{"id":"12","num":"2.6","title":"Chasing the Sea Monster","unit":"Unit Two","topics":[{"tag":"transitive","name":"Transitive and intransitive verbs (raise/rise, lay/lie)"},{"tag":"time_prepositions","name":"Prepositions of time (at, on, in, for, since)"},{"tag":"past_perfect","name":"Past perfect tense"},{"tag":"passive","name":"Passive voice (simple present and past)"},{"tag":"reported","name":"Reported speech (statements)"}],"questions":[{"qid":"c7-12-01","type":"spot","level":1,"topic":"transitive","prompt":"Which sentence is correct?","options":["The sun rose at six o'clock.","The sun raised at six o'clock.","The sun risen at six o'clock."],"answer":0,"rule":"<b>rise - rose<\/b> is intransitive (no object). <b>raise<\/b> is transitive: it needs an object."},{"qid":"c7-12-02","type":"spot","level":1,"topic":"time_prepositions","prompt":"Pick the sentence with the correct preposition.","options":["The light reappeared at midnight.","The light reappeared on midnight.","The light reappeared in midnight."],"answer":0,"rule":"Use <b>at<\/b> with clock times and <b>midnight<\/b>, <b>noon<\/b>, <b>dawn<\/b>."},{"qid":"c7-12-03","type":"fix","level":1,"topic":"transitive","prompt":"One word is wrong. Find it and fix it.","words":["The","old","gunner","rose","the","cannon","into","position."],"errors":[{"i":3,"options":["risen","raised","rise"],"answer":1}],"rule":"The verb has an object (<b>the cannon<\/b>), so use the transitive verb <b>raise - raised<\/b>."},{"qid":"c7-12-04","type":"fix","level":1,"topic":"time_prepositions","prompt":"One word is wrong. Find it and fix it.","words":["The","mist","rolled","away","on","eight","o'clock."],"errors":[{"i":4,"options":["in","since","at"],"answer":2}],"rule":"Use <b>at<\/b> with clock times: <b>at eight o'clock<\/b>."},{"qid":"c7-12-05","ty "answer":2}],"rule":"<b>many years<\/b> is a length of time, so use <b>for<\/b>: <b>for many years<\/b>."},{"qid":"c7-12-34","type":"fix","level":4,"topic":"passive","prompt":"One word is wrong. Find it and fix it.","words":["The","ship's","masts","were","shake","by","the","strong","wind."],"errors":[{"i":4,"options":["shook","shaking","shaken"],"answer":2}],"rule":"Passive: <b>were + past participle<\/b>. The past participle of <b>shake<\/b> is <b>shaken<\/b>."},{"qid":"c7-12-35","type":"fill","level":4,"topic":"past_perfect","prompt":"Fill in the gap.","before":"The animal","after":"away before the cannon was fired.","options":["has swum","had swam","had swum"],"answer":2,"rule":"Past perfect = <b>had + past participle<\/b>. <b>swim - swam - swum<\/b>, so <b>had swum<\/b>."},{"qid":"c7-12-36","type":"build","level":4,"topic":"passive","prompt":"Make a passive sentence.","answer":["The","harpoon","was","thrown","by","Ned","Land."],"alts":[],"rule":"Passive: object + <b>was + past participle<\/b> + <b>by<\/b> + doer: <b>was thrown by Ned Land<\/b>."},{"qid":"c7-12-37","type":"chat","level":4,"topic":"time_prepositions","prompt":"Pick the correct reply.","chat":[["Kavya","How long have you lived in Ratnagiri?"]],"options":["We have lived here since six years.","We have lived here for six years.","We are living here for six years."],"answer":1,"rule":"<b>How long<\/b> asks for the present perfect + <b>for<\/b> a length of time: <b>have lived here for six years<\/b>."},{"qid":"c7-12-38","type":"chat","level":4,"topic":"reported","prompt":"Pick the correct reply.","chat":[["Dad","What did the guide ask you at the aquarium?"]],"options":["He asked whether I had ever seen a whale.","He asked whether had I ever seen a whale.","He asked whether I have ever saw a whale."],"answer":0,"rule":"A reported question uses statement order: <b>whether I had ever seen<\/b>."},{"qid":"c7-12-39","type":"change","level":4,"topic":"reported","prompt":"Change into reported speech.","source":"The Commander said, \"We will wait for daylight.\"","options":["The Commander said that we will wait for daylight.","The Commander said that they will waited for daylight.","The Commander said that they would wait for daylight."],"answer":2,"rule":"<b>We<\/b> becomes <b>they<\/b>, and <b>will<\/b> becomes <b>would<\/b>: <b>they would wait<\/b>."},{"qid":"c7-12-40","type":"change","level":4,"topic":"passive","prompt":"Change into active voice.","source":"The order was given by the Commander.","options":["The Commander given the order.","The Commander gives the order.","The Commander gave the order."],"answer":2,"rule":"<b>was given<\/b> is simple past passive, so the active is simple past: <b>The Commander gave the order.<\/b>"},{"qid":"c7-12-41","type":"spot","level":5,"topic":"reported","prompt":"Which sentence is correct?","options":["Aronnax said me that he had never seen such a fast creature before.","Aronnax said that he had never saw such a fast creature before.","Aronnax said that he had never seen such a fast creature before."],"answer":2,"rule":"<b>said that<\/b> (no object), and past perfect needs the past participle: <b>had never seen<\/b>."},{"qid":"c7-12-42","type":"spot","level":5,"topic":"transitive","prompt":"Which sentence is correct?","options":["Exhausted after the chase, the sailors laid on the deck until dawn.","Exhausted after the chase, the sailors lay on the deck until dawn.","Exhausted after the chase, the sailors lain on the deck until dawn."],"answer":1,"rule":"The sailors rested with no object, so use <b>lie<\/b>. Its past is <b>lay<\/b>. <b>laid<\/b> needs an object."},{"qid":"c7-12-43","type":"fix","level":5,"topic":"time_prepositions","prompt":"One word is wrong. Find it and fix it.","words":["No","one","on","the","frigate","had","slept","since","twenty","hours,","yet","the","crew","kept","going."],"errors":[{"i":7,"options":["from","for","at"],"answer":1}],"rule":"<b>twenty hours<\/b> is a length of time, so use <b>for<\/b>: <b>No one had slept for twenty hours<\/b>."},{"qid":"c7-12-44","type":"fix","level":5,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["By","sunrise,","the","whaling","gear","had","been","fix","along","the","railings","of","the","frigate."],"errors":[{"i":7,"options":["fixing","fixed","fixes"],"answer":1}],"rule":"<b>had been + past participle<\/b> (past perfect passive): <b>had been fixed<\/b>."},{"qid":"c7-12-45","type":"fill","level":5,"topic":"transitive","prompt":"Fill in the gap.","before":"The harpooner","after":"his arm and hurled the harpoon with all his strength.","options":["raised","rose","risen"],"answer":0,"rule":"<b>his arm<\/b> is an object, so use transitive <b>raise - raised<\/b>, matching <b>hurled<\/b>."},{"qid":"c7-12-46","type":"build","level":5,"topic":"past_perfect","prompt":"Put the words in order.","answer":["By","eight","o'clock,","the","mist","had","rolled","away."],"alts":[],"rule":"<b>By + a past time<\/b> often takes the past perfect: <b>had rolled away<\/b>."},{"qid":"c7-12-47","type":"chat","level":5,"topic":"reported","prompt":"Pick the correct reply.","chat":[["Teacher","What did Ned Land tell the Commander?"]],"options":["He told him that there was definitely a whale in their waters.","He told to him that there was definitely a whale in their waters.","He told him that there were definitely a whale in their waters."],"answer":0,"rule":"<b>told him<\/b> (no <b>to<\/b>), and <b>a whale<\/b> is singular: <b>there was<\/b>."},{"qid":"c7-12-48","type":"chat","level":5,"topic":"passive","prompt":"Pick the correct reply.","chat":[["Zoya","Has the old ship been repaired yet?"]],"options":["Yes, it has repaired and painted too.","Yes, it has been repaired and painted too.","Yes, it has been repair and painted too."],"answer":1,"rule":"The ship does not repair itself, so use the passive: <b>has been repaired<\/b>."},{"qid":"c7-12-49","type":"change","level":5,"topic":"reported","prompt":"Change into reported speech.","source":"Ned Land said, \"There is a whale lurking in our waters.\"","options":["Ned Land said that there were a whale lurking in their waters.","Ned Land said that there is a whale lurking in our waters.","Ned Land said that there was a whale lurking in their waters."],"answer":2,"rule":"<b>is<\/b> becomes <b>was<\/b> and <b>our<\/b> becomes <b>their<\/b>: <b>there was a whale ... in their waters<\/b>."},{"qid":"c7-12-50","type":"change","level":5,"topic":"passive","prompt":"Change into passive voice.","source":"The crew greeted the order with three cheers.","options":["The order was greeted by the crew with three cheers.","The order is greeted by the crew with three cheers.","The order was greet by the crew with three cheers."],"answer":0,"rule":"Simple past active becomes <b>was + past participle<\/b>: <b>The order was greeted by the crew<\/b>."}]},{"id":"13","num":"2.7","title":"Great Scientists","unit":"Unit Two","topics":[{"tag":"subject_predicate","name":"Subject and predicate (verb agrees with the real subject)"},{"tag":"past_perfect","name":"Past perfect tense"},{"tag":"relative","name":"Relative pronouns who, which, whose, that"},{"tag":"passive","name":"Passive voice (simple present and past)"}],"questions":[{"qid":"c7-13-01","type":"spot","level":1,"topic":"subject_predicate","prompt":"Which is a complete sentence with a subject and a predicate?","options":["Worked with a bookbinder all day.","Faraday with a bookbinder all day.","Faraday worked with a bookbinder."],"answer":2,"rule":"A sentence needs a <b>subject<\/b> (Faraday) and a <b>predicate<\/b> with a verb (worked with a bookbinder)."},{"qid":"c7-13-02","type":"spot","level":1,"topic":"past_perfect","prompt":"Pick the sentence with the correct tense.","options":["The lecture had started before Faraday arrived.","The lecture had start before Faraday arrived.","The lecture has started before Faraday arrived."],"answer":0,"rule":"The earlier past action takes the past perfect: <b>had + past participle<\/b> = <b>had started<\/b>."},{"qid":"c7-13-03","type":"fix","level":1,"topic":"passive","prompt":"One word is wrong. Find it and fix it.","words":["The","first","electric","motor","was","build","by","Michael","Faraday."],"errors":[{"i":5,"options":["building","built","builds"],"answer":1}],"rule":"Passive = <b>was/were + past participle<\/b>: <b>was built<\/b>."},{"qid":"c7-13-04","type":"fix","level":1,"topic":"relative","prompt":"One word is wrong. Find it and fix it.","words":["Faraday","read","a","book","who","was","about","electricity."],"errors":[{"i":4,"options":["whom","whose","which"],"answer":2}],"rule":"Use <b>which<\/b> for things (a book) and <b>who<\/b> for people."},{"qid":"c7-13-05","type":"fill","level":1,"topic":"subject_predicate","prompt":"Fill in the gap.","before":"The notes of the young man","after":"very detailed.","options":["was","were","is"],"answer":1,"rule":"The subject is <b>the notes<\/b> (plural), not 'the young man', so use <b>were<\/b>."},{"qid":"c7-13-06","type":"fill","level":1,"topic":"past_perfect","prompt":"Fill in the gap.","before":"When Faraday reached the hall, the lecture had already","after":".","options":["began","begin","begun"],"answer":2,"rule":"After <b>had<\/b>, use the past participle: <b>had begun<\/b> (begin - began - begun)."},{"qid":"c7-13-07","type":"build","level":1,"topic":"passive","prompt":"Put the tiles in order.","answer":["The","book","was","sent","for","binding."],"alts":[],"rule":"Passive: subject + <b>was sent<\/b> (was + past participle)."},{"qid":"c7-13-08","type":"chat","level":1,"topic":"past_perfect","prompt":"Pick the correct reply.","chat":[["Riya","Did you see the start of the science show?"]],"options":["No, it had already started when I got there.","No, it had already start when I got there.","No, it has already started when I got there."],"answer":0,"rule":"The show started before you reached, so use the past perfect: <b>had already started<\/b>."},{"qid":"c7-13-09","type":"chat","level":1,"topic":"subject_predicate","prompt":"Pick the correct reply.","chat":[["Aman","How were the drawings at the science fair?"]],"options":["The drawings of the magnets were beautiful.","The drawings of the magnets was beautiful.","The drawings of the magnets is beautiful."],"answer":0,"rule":"The subject is <b>the drawings<\/b> (plural), so the verb is <b>were<\/b>."},{"qid":"c7-13-10","type":"change","level":1,"topic":"passive","prompt":"Change into passive voice.","source":"Faraday bound the notes into a book.","options":["The notes was bound into a book by Faraday.","The notes were bound into a book by Faraday.","The notes were binded into a book by Faraday."],"answer":1,"rule":"Simple past passive: <b>were + past participle<\/b>. Bind - bound - <b>bound<\/b>; 'notes' is plural, so <b>were<\/b>."},{"qid":"c7-13-11","type":"spot","level":2,"topic":"relative","prompt":"Pick the sentence with the correct relative pronoun.","options":["Maxwell was a physicist which knew advanced mathematics.","Maxwell was a physicist who knew advanced mathematics.","Maxwell was a physicist whose knew advanced mathematics."],"answer":1,"rule":"Maxwell is a person, so use <b>who<\/b>. <b>Whose<\/b> must be followed by a noun."},{"qid":"c7-13-12","type":"spot","level":2,"topic":"passive","prompt":"Which sentence is correct?","options":["Bavarian glass was use in telescopes and microscopes.","Bavarian glass were used in telescopes and microscopes.","Bavarian glass was used in telescopes and microscopes."],"answer":2,"rule":"Passive: <b>was + past participle<\/b> (used). 'Glass' is uncountable, so use <b>was<\/b>."},{"qid":"c7-13-13","type":"fix","level":2,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Had","Faraday","wrote","all","those","notes","before","the","lecture","ended?"],"errors":[{"i":2,"options":["written","writing","writes"],"answer":0}],"rule":"Past perfect = <b>had + past participle<\/b>: write - wrote - <b>written<\/b>."},{"qid":"c7-13-14","type":"fix","level":2,"topic":"relative","prompt":"One word is wrong. Find it and fix it.","words":["This","is","the","glass","brick","whom","reminded","Faraday","of","his","failure."],"errors":[{"i":5,"options":["who","whose","which"],"answer":2}],"rule":"A glass brick is a thing and it is the subject of 'reminded', so use <b>which<\/b>. <b>Whom<\/b> is only for people."},{"qid":"c7-13-15","type":"fill","level":2,"topic":"relative","prompt":"Fill in the gap.","before":"Faraday was a boy","after":"speech was not clear.","options":["who","whose","which"],"answer":1,"rule":"<b>Whose<\/b> shows possession: the boy's speech = the boy <b>whose<\/b> speech."},{"qid":"c7-13-16","type":"fill","level":2,"topic":"passive","prompt":"Fill in the gap.","before":"Today, electric motors","after":"used in fans and trains.","options":["is","be","are"],"answer":2,"rule":"Simple present passive: <b>are + past participle<\/b>. 'Motors' is plural, so <b>are used<\/b>."},{"qid":"c7-13-17","type":"build","level":2,"topic":"past_perfect","prompt":"Put the tiles in order.","answer":["By","noon,","Faraday","had","bound","fifty","books."],"alts":[],"rule":"<b>By noon<\/b> + past perfect: the work was finished before that time - <b>had bound<\/b>."},{"qid":"c7-13-18","type":"chat","level":2,"topic":"relative","prompt":"Pick the correct reply.","chat":[["Mrs Joshi","Who was Humphry Davy?"]],"options":["He was a chemist which gave famous lectures.","He was a chemist who gave famous lectures.","He was a chemist whom gave famous lectures."],"answer":1,"rule":"For a person doing the action, use <b>who<\/b>: a chemist <b>who<\/b> gave lectures."},{"qid":"c7-13-19","type":"change","level":2,"topic":"passive","prompt":"Change into passive voice.","source":"Davy hired Faraday as his secretary.","options":["Faraday is hired by Davy as his secretary.","Faraday was hire by Davy as his secretary.","Faraday was hired by Davy as his secretary."],"answer":2,"rule":"'Hired' is simple past, so the passive is <b>was hired<\/b>. Keep the tense the same."},{"qid":"c7-13-20","type":"change","level":2,"topic":"past_perfect","prompt":"Join the sentences using 'after'.","source":"Faraday finished cleaning the lab. Then he tried the experiment.","options":["After Faraday has finished cleaning the lab, he tried the experiment.","After Faraday had finished cleaning the lab, he tried the experiment.","After Faraday had finish cleaning the lab, he tried the experiment."],"answer":1,"rule":"The first action takes the past perfect: <b>After he had finished ..., he tried ...<\/b>"},{"qid":"c7-13-21","type":"spot","level":3,"topic":"subject_predicate","prompt":"Pick the sentence where the verb agrees with its subject.","options":["A box of iron filings were kept near the magnet.","A box of iron filings was kept near the magnet.","A box of iron filings are kept near the magnet."],"answer":1,"rule":"The subject is <b>a box<\/b> (singular). 'Of iron filings' only describes it, so use <b>was<\/b>."},{"qid":"c7-13-22","type":"spot","level":3,"topic":"past_perfect","prompt":"Pick the sentence with the correct tense.","options":["When Davy reached the lab, Faraday had already cleaned it.","When Davy reached the lab, Faraday has already cleaned it.","When Davy reached the lab, Faraday had already clean it."],"answer":0,"rule":"The cleaning happened first, so use <b>had already cleaned<\/b> with the simple past <b>reached<\/b>."},{"qid":"c7-13-23","type":"fix","level":3,"topic":"subject_predicate","prompt":"One word is wrong. Find it and fix it.","words":["Fans,","sewing","machines","and","trains","all","depends","on","the","motor."],"errors":[{"i":6,"options":["depend","depending","dependent"],"answer":0}],"rule":"The subject has three things joined by <b>and<\/b>, so it is plural: they all <b>depend<\/b>."},{"qid":"c7-13-24","type":"fix","level":3,"topic":"passive","prompt":"One word is wrong. Find it and fix it.","words":["Faraday","was","gave","an","impossible","task","by","Davy."],"errors":[{"i":2,"options":["giving","gives","given"],"answer":2}],"rule":"Passive = <b>was + past participle<\/b>: give - gave - <b>given<\/b>."},{"qid":"c7-13-25","type":"fill","level":3,"topic":"relative","prompt":"Fill in the gap.","before":"Davy,","after":"lab had exploded, needed an assistant.","options":["whose","who","which"],"answer":0,"rule":"Davy's lab = Davy, <b>whose<\/b> lab. <b>Whose<\/b> joins a person to what belongs to him."},{"qid":"c7-13-26","type":"build","level":3,"topic":"relative","prompt":"Put the tiles in order.","answer":["He","admired","the","chemist","whose","lectures","were","famous."],"alts":[],"rule":"<b>whose<\/b> + noun: the chemist <b>whose lectures<\/b> were famous."},{"qid":"c7-13-27","type":"build","level":3,"topic":"passive","prompt":"Put the tiles in order.","answer":["The","motor","was","built","within","a","few","days."],"alts":[],"rule":"Simple past passive: <b>was built<\/b>; the time phrase <b>within a few days<\/b> comes after."},{"qid":"c7-13-28","type":"chat","level":3,"topic":"subject_predicate","prompt":"Pick the correct reply.","chat":[["Neha","Is the box of magnets in the lab?"]],"options":["Yes, the box of magnets is on the top shelf.","Yes, the box of magnets are on the top shelf.","Yes, the box of magnets be on the top shelf."],"answer":0,"rule":"The subject is <b>the box<\/b> (singular), so the verb is <b>is<\/b>."},{"qid":"c7-13-29","type":"chat","level":3,"topic":"passive","prompt":"Pick the correct reply.","chat":[["Kabir","When was this old microscope bought?"]],"options":["It was bought by my grandfather in 1990.","It was buyed by my grandfather in 1990.","It is bought by my grandfather in 1990."],"answer":0,"rule":"'In 1990' is past, so use <b>was + past participle<\/b>: buy - bought - <b>bought<\/b>."},{"qid":"c7-13-30","type":"change","level":3,"topic":"relative","prompt":"Join the sentences using 'who'.","source":"Faraday was a bookbinder. He loved reading.","options":["Faraday was a bookbinder who he nce is correct?","options":["The young crow seemed weakly.","The young crow seemed weakness.","The young crow seemed weak."],"answer":2,"rule":"After linking verbs like <b>seem, be, become<\/b>, use an adjective as the subject complement: <b>seemed weak<\/b>."},{"qid":"c7-16-02","type":"spot","level":1,"topic":"past_perfect","prompt":"Pick the sentence with the correct tense.","options":["The crow had fallen from its nest before I found it.","The crow had fall from its nest before I found it.","The crow has fallen from its nest before I found it."],"answer":0,"rule":"The earlier past action takes the past perfect: <b>had + past participle<\/b> = <b>had fallen<\/b>."},{"qid":"c7-16-03","type":"fix","level":1,"topic":"complement","prompt":"One word is wrong. Find it and fix it.","words":["The","crow's","tricks","made","Grandmother","angrily","every","day."],"errors":[{"i":5,"options":["anger","angry","angriest"],"answer":1}],"rule":"An object complement describes the object: made Grandmother <b>angry<\/b> (adjective, not adverb)."},{"qid":"c7-16-04","type":"fix","level":1,"topic":"past_perfect","prompt":"One word is wrong. Find it and fix it.","words":["Caesar","had","already","eat","his","soup","when","Grandfather","came","in."],"errors":[{"i":3,"options":["ate","eating","eaten"],"answer":2}],"rule":"Past perfect = <b>had + past participle<\/b>: <b>had already eaten<\/b>."},{"qid":"c7-16-05","type":"fill","level":1,"topic":"gerund_inf","prompt":"Fill in the gap.","before":"Caesar was very fond of","after":"toothbrushes.","options":["collecting","collect","to collect"],"answer":0,"rule":"After a preposition like <b>of<\/b>, use the -ing form (gerund): <b>fond of collecting<\/b>."},{"qid":"c7-16-06","type":"fill","level":1,"topic":"passive","prompt":"Fill in the gap.","before":"The young crow","after":"Caesar by the family.","options":["named","was named","was name"],"answer":1,"rule":"Passive = <b>was/were + past participle<\/b>: the crow <b>was named<\/b> Caesar."},{ ade Sana the captain."],"answer":2,"rule":"With <b>make<\/b>, the object complement comes straight after the object: made Sana <b>the captain<\/b> (no 'as' or 'to')."},{"qid":"c7-16-13","type":"fix","level":2,"topic":"gerund_inf","prompt":"One word is wrong. Find it and fix it.","words":["Grandmother","was","tired","of","keep","the","noisy","crow","at","home."],"errors":[{"i":4,"options":["keeping","kept","keeps"],"answer":0}],"rule":"After the preposition <b>of<\/b>, use the gerund: <b>tired of keeping<\/b>."},{"qid":"c7-16-14","type":"fix","level":2,"topic":"passive","prompt":"One word is wrong. Find it and fix it.","words":["Toothbrushes","were","steal","from","many","houses","in","the","street."],"errors":[{"i":2,"options":["stolen","stole","steals"],"answer":0}],"rule":"Passive = <b>were + past participle<\/b>: <b>were stolen<\/b>."},{"qid":"c7-16-15","type":"fill","level":2,"topic":"complement","prompt":"Fill in the gap.","before":"The poor crow's leg became","after":"after the fall.","options":["stiff","stiffly","stiffness"],"answer":0,"rule":"<b>Became<\/b> is a linking verb, so the subject complement is an adjective: <b>became stiff<\/b>."},{"qid":"c7-16-16","type":"fill","level":2,"topic":"relative","prompt":"Fill in the gap.","before":"Harold was a hornbill","after":"cage stood in the garden.","options":["who","which","whose"],"answer":2,"rule":"<b>whose<\/b> shows belonging: the hornbill <b>whose cage<\/b> = the hornbill's cage."},{"qid":"c7-16-17","type":"change","level":2,"topic":"relative","prompt":"Join the sentences using 'who'.","source":"Aunt Mabel came to visit. She wore gleaming spectacles.","options":["Aunt Mabel, which wore gleaming spectacles, came to visit.","Aunt Mabel, who wore gleaming spectacles, come to visit.","Aunt Mabel, who wore gleaming spectacles, came to visit."],"answer":2,"rule":"Use <b>who<\/b> for a person and keep the past tense: <b>Aunt Mabel, who wore ..., came<\/b>."},{"qid":"c7-16-18","type":"change","level":2,"topic":"p  fish","after":"in this clear brook.","options":["live","are living","lives"],"answer":2,"rule":"<b>Many a<\/b> + singular noun takes a singular verb: <b>many a fish lives<\/b>."},{"qid":"c7-17-06","type":"fill","level":1,"topic":"prepositions","prompt":"Fill in the gap.","before":"A grayling swims","after":"the stones at the bottom of the brook.","options":["since","among","during"],"answer":1,"rule":"<b>among<\/b> = in the middle of many things. <b>since<\/b> and <b>during<\/b> are about time."},{"qid":"c7-17-07","type":"chat","level":1,"topic":"present_simple","prompt":"Pick the correct reply.","chat":[["Aarav","Where does this stream go?"]],"options":["It joins the big river near our village.","It join the big river near our village.","It joining the big river near our village."],"answer":0,"rule":"<b>It<\/b> (he/she/it) takes the simple present with <b>-s<\/b>: <b>it joins<\/b>."},{"qid":"c7-17-08","type":"chat","level":1,"topic":"prepositions","prompt":"Pick the correct reply.","chat":[["Mom","Where are your shoes, Tara?"]],"options":["They are under the bed.","They are under of the bed.","They is under the bed."],"answer":0,"rule":"<b>under<\/b> needs no 'of', and plural <b>they<\/b> takes <b>are<\/b>."},{"qid":"c7-17-09","type":"build","level":1,"topic":"present_simple","prompt":"Put the words in order.","answer":["The","brook","never","stops","flowing."],"alts":[],"rule":"Frequency words like <b>never<\/b> go before the main verb: <b>never stops<\/b>."},{"qid":"c7-17-10","type":"change","level":1,"topic":"comparison","prompt":"Change into the comparative degree.","source":"The Ganga is the longest river in India.","options":["The Ganga is longer than any other river in India.","The Ganga is long than any other river in India.","The Ganga is longest than any other river in India."],"answer":0,"rule":"Superlative to comparative: <b>longer than any other river<\/b>."},{"qid":"c7-17-11","type":"spot","level":2,"topic":"many_a","prompt":"Which sentence is correc
